:root{--suoro:#ffffff;--fondo:#2a2622;--fondo2:#121110;--carta:#faf7f1;--inchiostro:#191817;--accento:#2b2825;--oro:#d2482f;--rosso:#a3301f;--velo:rgba(43,40,37,.1)}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--inchiostro);
  background: var(--fondo2) linear-gradient(180deg, var(--fondo) 0%, var(--fondo2) 100%) fixed;
  font-family: 'EBG', 'EB Garamond', Garamond, 'Times New Roman', Georgia, serif; font-size: 19px; line-height: 1.6;
}
#app { max-width: 700px; margin: 0 auto; padding: 0 0 48px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; }
a { color: inherit; }
.btn {
  display: block; width: 100%; margin: 9px 0; padding: 11px 16px; border-radius: 6px; cursor: pointer;
  font-size: 18px; line-height: 1.35; text-align: center; text-decoration: none;
  background: transparent; color: var(--inchiostro); border: 1.5px solid var(--accento);
}
.btn:hover, .btn:focus-visible { background: var(--velo); }
.btn:focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; }
.btn.primo { background: var(--accento); color: var(--carta); border-color: var(--accento); font-weight: 600; }
.btn.primo:hover { filter: brightness(1.12); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.scelta { text-align: left; background: #fffdf7; }
.btn.scelta:hover { background: var(--velo); }
.btn.chiusa { opacity: .55; background: transparent; border-style: dashed; }
.btn.chiusa small { display: block; font-size: 15px; font-style: italic; }
.btn.prova { background: var(--oro); border-color: var(--oro); color: var(--suoro); font-weight: 600; }
.btn.mini { display: inline-block; width: auto; margin: 0; padding: 4px 12px; font-size: 16px; }
.btn.chiaro { color: var(--carta); border-color: var(--carta); margin-top: 14px; }
.copertina { text-align: center; padding: 22px 18px 10px; color: var(--carta); }
.cop { display: block; width: 100%; max-width: 420px; margin: 0 auto 14px; border-radius: 3px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.etichetta { margin: 6px 0 0; font-size: 15px; letter-spacing: .22em; text-transform: uppercase; color: var(--oro); font-weight: 600; }
.sotto { max-width: 440px; margin: 8px auto 14px; font-size: 19px; }
.copertina .pulsanti { max-width: 380px; margin: 0 auto; }
.copertina .btn { color: var(--carta); border-color: var(--carta); }
.copertina .btn.primo { background: var(--oro); border-color: var(--oro); color: var(--suoro); }
.firma { margin-top: 18px; font-size: 16px; letter-spacing: .08em; opacity: .9; }
.foglio {
  background: var(--carta); margin: 14px 10px 0; padding: 18px 20px 22px; border-radius: 4px;
  box-shadow: 0 6px 24px rgba(0,0,0,.35);
}
.foglio h2 { margin: 4px 0 10px; text-align: center; font-size: 27px; font-weight: 600; color: var(--accento); }
.foglio h3 { margin: 22px 0 4px; font-size: 21px; font-weight: 600; color: var(--accento); border-top: 1px solid var(--oro); padding-top: 14px; }
.nota { font-size: 16px; font-style: italic; margin: 4px 0 10px; }
.regole p { margin: 0 0 10px; }
.intro p { margin: 0 0 .8em; }
.intro h3 { font-size: 17px; letter-spacing: .12em; text-align: center; border-top: 0; padding-top: 0; margin: 22px 0 8px; }
.intro h3::after { content: ''; display: block; width: 36px; height: 2px; margin: 6px auto 0; background: var(--oro); }
.intro .btn { margin-top: 18px; }
.valori { display: grid; gap: 6px; }
.valore { display: grid; grid-template-columns: 1fr auto 2.2em; align-items: center; gap: 10px; padding: 6px 10px; background: #fffdf7; border-radius: 6px; border: 1px solid var(--velo); }
.vnome { font-weight: 600; }
.vdadi { display: flex; align-items: center; gap: 5px; }
.piu { font-size: 16px; }
.vnum { font-size: 24px; text-align: right; color: var(--accento); }
.doti { display: grid; gap: 6px; }
.dote { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--velo); background: #fffdf7; cursor: pointer; line-height: 1.35; }
.dote input { margin-top: 5px; width: 20px; height: 20px; accent-color: var(--accento); flex: none; }
.dote small { font-size: 15.5px; }
.dote .bonus { font-size: 15.5px; color: var(--accento); }
.dote.scelta { border-color: var(--accento); background: var(--velo); }
.barra-doti { position: sticky; bottom: 0; margin: 12px -20px -22px; padding: 10px 20px 14px; background: var(--carta); border-top: 1px solid var(--oro); display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; align-items: center; }
.barra-doti #conta { grid-column: 1 / -1; text-align: center; font-size: 16px; }
.barra {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 12px; background: var(--fondo2); color: var(--carta); font-size: 17px; border-bottom: 1px solid var(--oro);
}
.barra b { color: var(--oro); font-weight: 600; }
.barra .r.basso { color: #ffb3a6; }
.barra .btn.mini { margin-left: auto; color: var(--carta); border-color: var(--carta); }
.palline { display: inline-flex; gap: 4px; }
.palline i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--oro); }
.palline i.usata { background: var(--oro); }
.num { text-align: center; font-size: 26px; font-weight: 600; color: var(--accento); letter-spacing: .05em; }
.num::after { content: ''; display: block; width: 46px; height: 2px; margin: 6px auto 12px; background: var(--oro); }
.ill { margin: 0 -20px 14px; }
.ill img { display: block; width: 100%; height: auto; }
.testo p { margin: 0 0 .8em; }
.nemico { margin: 0 0 10px; padding: 6px 10px; border-left: 3px solid var(--rosso); background: #fffdf7; font-weight: 600; }
.nemico small { font-weight: 400; }
.note { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.note span { font-size: 16px; padding: 3px 10px; border-radius: 14px; border: 1px solid var(--accento); background: #fffdf7; }
.note .nota-male { border-color: var(--rosso); color: var(--rosso); }
.azioni { margin-top: 14px; border-top: 1px solid var(--oro); padding-top: 8px; }
.riquadro { margin: 10px 0; padding: 12px 14px; border: 1.5px solid var(--accento); border-radius: 8px; background: #fffdf7; }
.titolo-r { margin: 0 0 6px; text-align: center; font-weight: 600; font-size: 20px; color: var(--accento); letter-spacing: .03em; }
.esito { text-align: center; font-weight: 600; font-size: 21px; margin: 6px 0; }
.esito.ok { color: #2f6b3a; }
.esito.ko { color: var(--rosso); }
.dadi-grandi { display: flex; justify-content: center; align-items: center; gap: 8px; min-height: 58px; flex-wrap: wrap; margin: 6px 0; }
.somma { font-size: 24px; font-weight: 600; }
.chi { font-size: 15px; font-style: italic; }
.dadi-grandi.due { gap: 18px; align-items: flex-start; }
.tiro { display: grid; grid-template-columns: auto auto; gap: 4px 6px; justify-items: center; max-width: 46%; }
.tiro .chi { grid-column: 1 / -1; text-align: center; line-height: 1.2; }
.registro { font-size: 16px; border-top: 1px dashed var(--velo); margin-top: 6px; padding-top: 4px; }
.registro p { margin: 2px 0; }
.vita { margin: 6px 0; font-size: 16px; }
.traccia { height: 9px; background: var(--velo); border-radius: 5px; overflow: hidden; }
.riemp { height: 100%; border-radius: 5px; }
.riemp.io { background: var(--accento); }
.riemp.lui { background: var(--rosso); }
.morte { border-color: var(--rosso); text-align: center; }
.morte .titolo-r { color: var(--rosso); letter-spacing: .1em; }
.dado {
  display: inline-grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); width: 46px; height: 46px; padding: 6px;
  background: #fffef9; border: 2px solid var(--inchiostro); border-radius: 9px; box-shadow: 0 2px 0 rgba(0,0,0,.25);
}
.dado i { display: block; margin: auto; width: 8px; height: 8px; border-radius: 50%; }
.dado i.p { background: var(--inchiostro); }
.dado.piccolo { width: 30px; height: 30px; padding: 4px; border-width: 1.5px; border-radius: 6px; }
.dado.piccolo i { width: 5px; height: 5px; }
.dado.gira { transform: rotate(var(--g, 12deg)); }
.dado.gira:nth-child(2n) { --g: -14deg; }
.fine { text-align: center; background: var(--fondo); color: var(--carta); margin: 6px -20px -22px; padding: 22px 20px 24px; border-radius: 0 0 4px 4px; }
.cop-piccola { width: 150px; border-radius: 3px; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
.fine-sopra { margin: 12px 0 0; font-style: italic; }
.fine h2 { color: var(--oro); margin: 6px 0 8px; font-size: 26px; line-height: 1.2; }
.compra { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; max-width: 420px; margin: 10px auto 4px; }
.compra .btn.primo { background: var(--oro); border-color: var(--oro); color: var(--suoro); }
.compra small { display: block; font-size: 14px; font-weight: 400; }
.sito { margin: 10px 0 0; font-size: 18px; }
.sito a { color: var(--oro); }
.scheda { position: fixed; inset: 0; z-index: 20; background: rgba(10,12,16,.55); display: flex; justify-content: flex-end; }
.scheda-dentro { width: min(380px, 92vw); height: 100%; overflow-y: auto; background: var(--carta); padding: 16px 18px 24px; box-shadow: -6px 0 24px rgba(0,0,0,.4); }
.scheda h3 { margin: 0 0 8px; color: var(--accento); font-size: 24px; }
.scheda h4 { margin: 14px 0 4px; color: var(--accento); font-size: 18px; border-bottom: 1px solid var(--oro); }
.scheda ul { margin: 4px 0; padding-left: 20px; }
.scheda li { margin: 3px 0; }
.scheda .pulsanti { margin-top: 18px; display: grid; gap: 8px; }
.scheda .btn.mini { justify-self: center; }
@media (max-width: 420px) {
  body { font-size: 18px; }
  .foglio { margin: 10px 6px 0; padding: 14px 15px 18px; }
  .ill { margin: 0 -15px 12px; }
  .fine { margin: 6px -15px -18px; }
  .barra-doti { margin: 12px -15px -18px; padding: 10px 15px 12px; }
  .barra { gap: 9px; font-size: 16px; }
  .compra { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .dado.gira { transform: none; } }
.w0{width:0%}.w5{width:5%}.w10{width:10%}.w15{width:15%}.w20{width:20%}.w25{width:25%}.w30{width:30%}.w35{width:35%}.w40{width:40%}.w45{width:45%}.w50{width:50%}.w55{width:55%}.w60{width:60%}.w65{width:65%}.w70{width:70%}.w75{width:75%}.w80{width:80%}.w85{width:85%}.w90{width:90%}.w95{width:95%}.w100{width:100%}</style>

 **Strength** is 8 and counts in fights. Your **Vigor** is 20, your energy: if it drops to zero, your story ends.","⚔️ In a fight, each round you and your opponent roll two dice and add your Strength: whoever scores lower loses 2 Vigor. Whoever you beat does not die: they stay down, or run away.","🤸 In Agility Tests and 🎲 Strokes of Luck you need 7 or more on two dice.","🧠 Skills give no bonus to the dice: they open passages. With **Short Blade**, once per fight, the computer rerolls a bad die for you.","🎒 Your bag and 🚩 what the book remembers are kept for you: you will find them on your **Sheet**.","In this demo you have **six choices**. If your story ends sooner, you start again from §1."],"dotiTit":"Choose five skills","fineTesto":"The rest of Hori's story awaits you in the book, in print or as an ebook.","doti":[{"n":"Rooftop Cat","b":"","d":"You climb where others only look up."},{"n":"Leap","b":"","d":"You leap the gap without measuring it."},{"n":"Short Blade","b":"","d":"The blade cuts where it is needed: a rope, a clay seal, a strap. In every fight, once, you reroll one die."},{"n":"Silent Foot","b":"","d":"You pass without anyone turning."},{"n":"Swimmer","b":"","d":"The canal, the lake and the flood do not frighten you."},{"n":"Long Breath","b":"","d":"Thirst and weariness come later, for you."},{"n":"Harbor Tongue","b":"","d":"You haggle in three tongues and make up good lies."},{"n":"Eye of Thoth","b":"","d":"You notice the detail that others trample."},{"n":"Steady Hand","b":"","d":"You copy fast, and the handwriting is the right one."},{"n":"Ear on the Back","b":"","d":"You remember the lists and the names you have heard once."},{"n":"Lector's Voice","b":"","d":"Spells spoken aloud are worth more: you reroll the die."},{"n":"Wax Hand","b":"","d":"You model figurines that hold a name."}],"negozi":[{"f":"scopri","url":"https://intreccidicarta.com/libri/en/librigiochi.html#l-inchiostro-nella-sabbia","dove":"intreccidicarta.com"}],"sito":"https://intreccidicarta.com/libri/en/librigiochi.html#l-inchiostro-nella-sabbia","re":{"ab":"^🧠 If you have (.+)$","itPos":"^🎒 (?:If )?you have (.+)$","itNeg":"^🎒 You (?:don't|do not)","fgPos":"^🚩 If (.+)$","fgNeg":"^🚩 If you (?:did not note|didn't note|have not noted) (.+)$","fgPre":"^you noted ","vinci":"win","non":"not"},"ui":{"demo":"Playable demo","copAlt":"Cover of {t}","copTesto":"The opening pages of the gamebook, to play right here: read, choose your path, roll the dice. You have six choices.","gioca":"Play the demo","nuova":"New game","riprendi":"Resume from §{n}","regoleTit":"How to play","valoriTit":"Your scores","valoriNota":"The computer rolled them, as you would with the dice in the book.","forza":"Strength","resistenza":"Vigor","agilita":"Agility","fAbbr":"S","rAbbr":"V","aAbbr":"A","dotiNota":"Paths marked 🧠 open only to those who have that skill.","dotiConta":"Skills chosen: {n} of 5","caso":"Choose for me","comincia":"Start from §1","scheda":"Sheet","doti":"Skills","zaino":"Bag","vuoto":"empty","ricorda":"The Book Remembers","chiudi":"Close","daCapo":"Restart the demo from the beginning","scelteTit":"Choices made: {n} of {m}","usa":"use (+{n})","usaOgg":"Use {x} (+{n})","usato":"You use {x}: +{n} Vigor.","notaOgg":"🎒 In your bag: {x}","notaFg":"🚩 The Book Remembers: {x}","notaHp":"❤️ {n} Vigor","notaMeta":"❤️ Vigor halved","notaPerso":"🎒 You lose: {x}","notaDote":"🧠 You lose the skill: {x}","notaUsa":"🎒 You use: {x}","serveDote":"you do not have this skill","serveOgg":"you do not have it","serveFg":"it did not happen to you","giaUsata":"already used","vicolo":"No way on from here.","tira":"roll the dice","agiProva":"Agility Test","fortProva":"Stroke of Luck","agiSotto":"Two dice: you make it with {s} or less. A 12 always succeeds, a 2 always fails.","agiSopra":"Two dice: you make it with 7 or more.","fortDett":"Two dice: 7 or more goes your way.","fortBonus":"(+1 for your skill)","corsaBonus":"(with {d}, 6 is enough)","agiOk":"You make it.","agiKo":"You do not make it.","fortOk":"It goes your way.","fortKo":"It goes against you.","vaiA":"Turn to §{n}","tu":"You","attacca":"⚔️ Roll the dice","roundRiga":"You {a}, {n} {b}:","colpisci":"you hit, −2 to the enemy.","colpito":"you are hit, −2 to you.","pari":"a tie, nobody is hurt.","dodici":"double six, a sure hit: −2 to the enemy.","due":"double one, a miss: −2 to you.","lamaRiga":"Short Blade: you reroll the {x} and get {y}.","vinto":"You won the fight.","perso":"You lost the fight.","zeroTit":"❤️ Your Vigor has dropped to zero.","morteTit":"Your story ends here","morteRes":"Your Vigor has dropped to zero.","morteNota":"In the demo you start again from §1, with new scores and the same skills.","ricomincia":"Start again from §1","fineSei":"You have made your six choices.","fineFuori":"This path leads beyond the demo.","fineTit":"Your adventure continues in the book","cartaceo":"Paperback","ebook":"Ebook","scopri":"Discover the book","sito":"All the gamebooks at intreccidicarta.com","rigioca":"Play the demo again","noscript":"The demo needs JavaScript turned on in your browser.","descr":"Playable demo of {t}, a gamebook by Peter Palmer: the opening pages, to play in your browser.","titoloPagina":"{t} · Playable demo · Peter Palmer","introTit":"Introduction","continua":"Continue","vaiUno":"Turn to §1"},"par":{"1":{"t":"Forty sacks of emmer, you write on the potsherd, and the hand is your father's down to the curl of the last sign, including the signature with the long tail that he draws without lifting the reed pen. It is the thing you do best and need least. You put the reed pen back behind your ear. The palette hangs from your shoulder, and the short blade sits in your belt, on the left, where it always sits.\n\nFrom the potter's roof you can see the whole harbor market: the domes of the granaries, the masts of the ships hauled ashore, the green canal under the awnings, and at the far end the White Wall. It smells of pitch and fish. Between the baskets and the quay, tied to the guard's post, the two market baboons sleep in the shade with their hands on their knees, as they do when the sun is at its highest. At dawn you have heard them scream a thousand times, upright, with their hands raised toward the rising sun: all baboons do it. They are two gray males with the teeth of a leopard.\n\nBelow you the traders in men go by with their line. Three men with sticks: the headman with the ledger open on his arm, and you know the cursive hand of the accounts even from up here, even upside down; the overseer, the biggest, with the start of the rope in his fist. The rope runs from one neck to the next. Eleven: you counted them without meaning to, the way you count sacks. Among them a tall man, with reddish hair and a ship tattooed on his arm, is looking up.\n\nAt the end of the line there is a girl you had never looked at. She is barefoot, with a servant's short hair and the traders' coarse linen, and she too has the rope around her neck. She is looking up. Not toward the roofs: toward you. The noon sun beats on her face, and she does not squint. You realize you have stopped breathing only because the reed pen falls from your ear.\n\nShe lifts her hands to the rope, without tugging, and the rope breaks: the two ends stay in the overseer's hand and in hers, and they are black at the tips, as if burned. Eleven, and now ten.\n\nShe climbs onto the potter's bench, among the jars set out to dry, and jumps. From the bench to the baker's awning there are three cubits of empty air above the canal: it is the jump that only you knew how to make, and the awning holds whoever lands on the beam, not whoever lands on the reeds. She lands on the beam. She turns, and laughs toward you.\n\nAmong the baskets the two baboons spring up and scream, upright, with their hands raised, as at dawn. At noon. The running has frightened them. The guard pulls on the leashes and digs in his heels.\n\n“That one belongs to the king!” shouts the overseer, with his piece of rope in his hand.\n\nThe potsherd with the receipt slips from your fingers, strikes the gutter and falls into the canal. Forty sacks of emmer go to the bottom without a sound. On the awning she nods to you with her chin, toward the roofs, toward the south. Then she runs.\n\nThe overseer is already at the potter's ladder. On the edge of the roof, right above the ladder, stands the potter's basket of broken sherds, full to the brim. In front of you, the three cubits of empty air. And if you stay still, from up here you can watch her go wherever she likes: from the roofs you can see where anyone goes.\n\nWhoever climbs where others only look up has no need to jump: down by the gutter, one foot on the bench, and you take the awning with your hands before your feet. Whoever leaps the gap without measuring it does what she did, and does not even glance at the canal.\n\nShe is already on the second roof, standing still, watching to see if you follow. No one has ever waited for you on a roof.","dec":1,"img":0},"2":{"t":"The domes of the harbor granaries are of mud brick, as tall as four men, set in a row like loaves on a bench, and at this hour they scorch the soles of your feet. You climb them with your fingers in the cracks between one brick and the next, and the mud plaster crumbles under your nails. From up here the harbor is a distant noise: the blows of the shipwrights arrive a little after the gesture, and the emmer dust that comes out of the mouths makes even the wind cough. Below, the roofs of the market are squares of matting and reeds, with the green canal in the middle.\n\nShe has stopped at the top of the tallest one, in full sun. You sit a little lower, where the brick makes a step.\n\nDown there is your father's granary. You know it by the door: above the doorpost is the painted cobra, red and black, the one on the door at home, and on the threshold the handful of grain your father leaves there every morning, and so it is with all the granaries of the harbor. He is inside, on the mat, with the ledger and the chalk for the sacks. You know it without seeing him. The porters tell you, going in bent under the sacks and coming out straight, one at a time, without stopping on the threshold: it is the pace they keep when he is counting.\n\nBetween the domes the market guards go by. They strike their staffs on the bricks, one blow per dome, and raise their heads only where the sun is not in their eyes. On this side, at this hour, the sun is in everyone's eyes. When it is your dome's turn, the blow climbs up through the brick and you feel it in your thighs.\n\nShe has her knees drawn up and her chin on top, and she is looking at the river. Then at you, straight, as she did from the line, in no hurry. She is waiting.\n\nYou have a hundred questions, and only one that you ask first of a girl you do not know. Or you can keep quiet, which on the roofs is a thing you do well, and let her begin.","dec":1},"4":{"t":"The spar slips out of your hands and the quay arrives all at once. You land on the sacks, which puff out dust, and roll to within two paces of the post, with the two baboons awake, watching you and baring their teeth. You draw back slowly, without turning your back on them.\n\nThe overseer gets there before anyone else. He is the biggest of the three, with his stick in his fist and his whip coiled at his belt, which he does not use: for someone like you the stick is enough. If he saw your face on the potter's roof or among the baker's reeds, now he does not look at you twice, and shouts at once. He comes at you sidelong and shuts off the way to the ropes with his shoulders. He strikes with the tip, short, at the ribs.\n\nThe short blade comes out of its sheath, and it had never come out before in front of a man. It is as long as a forearm, and his stick reaches farther. You do not need it to wound: you need it to keep him at a distance for as long as it takes to reach the ropes.\n\n*On paper: if you have The Broken Rope, you do not have to fight: you tie it around his ankles without hurting him. Cross off your sheet: The Broken Rope, and turn to §51.*","e":"The Merchants' Overseer","ec":7,"ee":8},"6":{"t":"On the potsherd, in the hand of the traders' headman, the ink is still wet. You wrote it sitting on a sack, in your father's hand and with his signature with the long tail:\n\n“A serving girl of fifteen, found in the south, sold today to the temple of Ptah for the loom: paid, eight sacks of emmer. The scribe of the harbor granaries”\n\nThe headman holds it tilted toward the sun and goes down it one line at a time with his chin. He reaches the bottom, as far as the signature. Then he raises his other hand and counts on his fingers, under his breath, the way merchants count when the account is their own. They are short fingers, with broad knuckles.\n\n“Ten sacks from the king, if I find her, and when the king pays.” One finger, two, three. “Eight from the temple, already paid, at the harbor granary.” He closes his fist.\n\nHe licks his finger and runs it over a line of the ledger lying open on the chest, and the line goes out: black on his finger, gray on the papyrus. For him, one girl fewer in the column. The temple pays better than the king, because the king pays when he likes. The headman has already turned his back on the roofs, and the other two with him. The overseer lowers his stick and leans on it.\n\nYou jumped nothing, and you are on the other side. It is a jump made sitting down, you think, and no one got hurt. From the shipyard the blows of the adzes come back to your ears: you had stopped hearing them when you wet the reed pen. You close the palette over the black well, still glistening.\n\nThe headman, though, stops with the potsherd still in his hand and looks at the signature up close.\n\n*Cross the “learned” box of the spell The False Order.*","it":"📜 The False Order"},"9":{"t":"You stretch your neck over the stack, slowly, until the ledger comes under your eyes, upside down. The emmer gives under your elbow, and from here the smell of onion is strong. The traders' cursive is a quayside cursive: crooked, full of blots, with big numbers and small words. You read it upside down all the same: the big numbers come up first.\n\nLines of names that are not names: a man of the sea, tall; two brothers from the Delta; a woman with a child. Beside each line a price: six sacks, four, seven. Her line must be at the bottom of the column, where the latest arrivals are written. You go down with your eyes, one price after another.\n\nThe old man finishes his onion. He throws away the skin, wipes his fingers on his kilt, and his hand goes toward the ledger to close it. It is a dark hand, with thick veins. The young one laughs, and the old man half turns to laugh with him.\n\nThe line is there, the last one, and the old man's hand is already over the column."},"10":{"t":"You get up, shake the emmer dust from your kilt and go to the post like a harbor boy: empty hands and the look of someone waiting for a load. The guard pays you no mind. He is sweating, and the sweat streaks the dust on his neck. He holds the potsherd against his belly with his fingers over the lines, and from two paces you can read the cursive even upside down, the way you read your father's ledger from the other side of the mat.\n\n“By order of the Great House. Sought: the daughter of Ra, fled from the king's house: fifteen years old, barefoot, without a waterskin. Grain to whoever brings her back: ten sacks.”\n\nIt is a good hand, a palace scribe's, without tails and without blots. You read it once and that is enough.\n\nThe guard saw your lips move. He looks at you, looks at the potsherd, and decides to explain it to you, since he cannot read it himself but the herald has shouted it three times.\n\n“The king is the son of Ra,” he says, and raises his finger, like the teachers. “So she is a princess, and the king wants his daughter back.”\n\nTen sacks is what a shipwright earns in half a year. A princess. Run away from a king who wants her in a cage. That is worth ten sacks. On the other side of the post, the overseer is winding the new rope around his arm.\n\nBetween you and the road south are the line, the three traders and the open quay. Above, though, are the masts of the ships hauled ashore in the shipyard, one beside another, with ropes stretched from mast to mast: a road for anyone not afraid of heights, and she is not. The lowest passes one jump from the roof of the ropemakers' shed. Whoever climbs where others only look up crosses it as if over the gutters at home, and from below no one raises their head.\n\nOr there is a potsherd. The quay is covered with them, and you have your father's hand in your fingers: a receipt from the harbor granary, with his signature, saying that the girl is already sold to the temple of Ptah, and let no one look for her anymore. Whoever copies fast in the right handwriting writes it without hesitating, curl and all, and the headman reads your father in it. Whoever haggles in three tongues and makes up good lies does not just hand it over but sells it to him, with the words a merchant wants to hear.","dec":1},"12":{"t":"“And who is the scribe who signs?”\n\nThe headman asks it without suspicion, the way you ask the name of a baker who makes good bread. A merchant wants to know from whom he will go to collect his eight sacks. He keeps his thumb on the signature and waits.\n\n“Amenemope,” you say. “The scribe of the harbor granaries. The granary with the cobra on the door.”\n\nYour father's name comes out easily, like his signature. Yours stays where it is.\n\nThe headman tucks the potsherd into his belt, takes a reed pen from the chest, sucks it to wet it and writes the name in the margin of the ledger, crooked, holding the pen like a knife, like a man who learned late and counts better than he writes. The pen is frayed at the tip and leaves two lines where one would do. His signs come out big, separate, and the last one runs off the margin. He blows on it, harder than necessary, and a black drop runs to the edge. He repeats the name once, to keep it in mind. Then he gives you a slap on the shoulder that is worth half a blow of the stick and shifts you half a pace, and goes back to his chest.\n\nOn the quay, in front of the line, you can now stay as long as you like. To the traders in men you are someone from the granary. You take the last steps with your hands at your sides. The line is there, and none of the three stops you."},"14":{"t":"The third step is right, the jump is not. You know it while you are still in the air, with the green canal under your belly and the beam not coming close enough. You land a palm short, and the foot that should have taken the beam takes the reeds.\n\nThe reeds open with a sound of torn matting. The twine snaps, your fingers scrape the beam and do not hold it. You go down into the middle of the baker's bread, among the loaves set out to cool and the flour, and slam your back on the oven bench. Your breath leaves you as it does when you jump badly from the cart, all at once, and for a while you look at the hole in the awning and the white sky inside the hole. The flour drifts down on you slowly and settles on your lashes, on your tongue. Under the back of your neck there is a loaf, still warm, crushed. Bits of reed fall on your chest, one at a time.\n\nIn the hole a broad, sweating face appears, leaning over the edge of the potter's roof: the overseer. Across the canal it is three cubits, and from three cubits you can see everything. He takes a good look at you, long enough to count your teeth. He has seen your face, and now he knows who to look for.\n\nThe baker is shouting about his bread. His arms are white to the elbow and he picks the loaves up off the ground one by one, blowing on them. You move your fingers, then your knees: they all bend. From the next roof someone leans out: it is her, come back one roof. She runs her eyes over your arms, your legs, your head, one after another, the way you look over a sack to see if it has split. She asks nothing. Then she is on her feet again, and gone.\n\n*Lose 2 Vigor points.*\n\n*If your Vigor drops to zero, turn to §44.*","h":-2,"z":44},"15":{"t":"The baker's awning smells of bread just out of the oven, and under the reeds you can hear the oven breathing. The smoke has blackened the beam and the wall up to the roof. The baker's rope ladder hangs from the bakehouse roof all the way down into the alley and passes beside the awning: he uses it in the evening, to climb up and sleep in the cool. She is already at the top, and turns to check that you are coming.\n\nYou climb. The rungs are of palm wood, smoothed by floury hands, and the rope is old but it holds: it holds whoever climbs with their hands, not whoever jerks at it. The ladder turns on itself at every grip and brings your shoulder against the warm wall; the flour stays white on your fingers. At the last rung you set your elbows on the edge and pull yourself up on your belly. The bakehouse roof is flat, of beaten mud, with the baker's mat rolled up against the low wall.\n\nOn the other side of the bakehouse roof runs the street of the washermen, and along the street comes the washerman's cart, loaded with white linen, pulled by a donkey in no hurry at all. The wheels creak at every turn, and the heap sways with them. She does not wait for the cart: she takes it. She jumps from the edge, lands on the heap of linen, rolls and sits up as if the cart were hers.\n\nYou jump too. Whoever has the legs for leaping does not even measure the gap; the others measure it, two men's height and a heap of linen, and jump all the same. You push off from the edge one pace ahead of the cart, with both feet, pull your knees to your chest, and the street comes up to meet you. The linen takes you, soft. You sink to your elbows in cloth warm from the sun, and under your back you feel the cart bed jolting over the holes.\n\nThe cart turns toward the domes of the granaries, and the voices of the market stay behind the bend. She stands on the cart bed, one hand on the side rail, and looks ahead."},"20":{"t":"You climb onto the potter's bench. The jars set out to dry come up to your knee, and one rocks when you brush it with your foot: it is still damp, cold under the noon sun. Below, the canal is green and still, and on the bottom you can see the sherds of a hundred jars broken before this one.\n\nThree cubits of empty air. She crossed them without looking down. You measure them all the same, because measuring is what you do: the beam of the baker's awning runs crosswise, as wide as a foot and dark with smoke; around it, the reeds tied with twine, yellow, which hold the bread set to cool and do not hold a boy. The smell of the loaves reaches you here, over the smell of the canal.\n\nBehind you the potter's ladder creaks under a heavy weight. You back up as far as you can. You take your run along the bench, three steps: the first among the jars, the second on the plank that gives and throws you back up, and the third is already on the edge.\n\nIf your foot finds the beam, you are on the other side. If it finds the reeds, you go down with them, and from the potter's roof the overseer has all the time he needs to look at you."},"24":{"t":"The ships hauled ashore rest on their props like cows lying down, and the masts are taller than the roofs. From the roof of the ropemakers' shed to the first rope it is a jump of nothing; then it is rope to rope, above the shipyard quay, hand over hand.\n\nNefret goes first. She does not look down and does not look at her hands: and she does not even make the first rope quiver.\n\nYour turn. The rope is of palm fiber, rough and taut, and it holds: it bites your palms. The spar of the third mast, though, is greased with sheep fat to let the sail run, and on the grease hands alone hold nothing: knees hold, and haste does not. Below, the quay: bricks, sacks, the post, and beside the post the guard's two baboons. Right there stands the overseer, twice as broad as you, slapping a stick as thick as your wrist into his palm, slowly, without stopping.\n\nIf your hands hold, you reach the top of the row of ships, above everyone. If they slip, the quay is waiting for you right there, beside the post."},"25":{"t":"The canal is green, warm on top and cold below, and on the bottom are the sherds of all the jars the potter has broken since you were born. You lower yourself from the bank holding on to a post, with the bricks against your belly. The water rises to your thighs, to your chest. You take a breath and go under.\n\nUnder the bridge the water is dark and tastes of fish. You count the strokes: six to the shadow of the bridge, six inside, four to come out. Whoever learned to swim right here, among the sherds, does not count the strokes: for that swimmer the canal is a road. Your fingers brush the bottom, the slime, the edge of a sherd. Above you pass the feet of the guards: you feel them in the water, dull, and behind every step the blow of a staff.\n\nYou come up on the other side, between two grain boats, and haul yourself onto the quay, dripping. The hulls smell of fresh pitch and leave a black line on your shoulder. Your kilt sticks to your legs.\n\nNefret is already there. She did not go under the bridge, nor over it: she came along the rim of the canal, on the brick ledge a foot wide under the awnings, where you go only at night and slowly. Her feet are dry.\n\nShe bends down, takes water from the canal in the hollow of her hand, drinks, then holds it out to you full again. You drink. You hold out to her your little water pot, the shell-shaped one from the palette. She looks at it, and does not take it.\n\nAfter the shipyards the grain quay begins."},"27":{"t":"The basket of sherds weighs as much as a sack of wet emmer. You throw yourself against it with your feet planted wide on the roof, and the palm fibers creak without moving. Then the bottom scrapes a palm, two. You shove it with your shoulder off the edge of the roof just as the overseer's head comes up at the top of the ladder.\n\nThe noise is that of a hundred jars breaking a second time. The sherds hail down on his shoulders and back, the ladder shakes all the way up, and from the alley rises a pale cloud that gets into your nose, dry. The overseer goes back down faster than he came up and stays sitting on the ground among the sherds, with his piece of rope still in his fist and his whip coiled at his belt. He raises his head. He has a broad face, white with clay dust, and he takes a good look at you: he has seen your face, and you have seen his. He wipes his eyes with the back of his hand and looks at you again.\n\nYou go down the other side, the canal side, down the pole of the potter's shade cloth. The wood is scorching: you grip with your knees, let go, grip, and you are on the ground in the shade of the cloth, where the wet clay keeps the cool. Between the baskets and the quay are the two baboons, on a short leash, and you do not go that way: you never run toward the guard's baboons, every harbor boy who still has both legs knows that. You go wide, along the water, under the awnings.\n\nThe low way is longer and smells of fish. You run bent under the reeds, with the mud of the bank spattering your calves. You step over a fish trap, then a line stretched between two posts. Above you, from roof to roof, goes the girl's coarse linen, quick, toward the baker's rope ladder. You see it in pieces, in the gaps between one awning and the next, and every time it is one awning farther ahead of you. She goes above, you below, and the ladder is the same."},"28":{"t":"You have nothing to give him that you do not need. You walk on with your eyes on the post.\n\nOut of the corner of your eye you see Teresh's hand come down, slowly, to his knee, and stay there. He does not call you. He calls no one. He says his word again in the language no one understands, in a low voice, to himself, facing the river.\n\nYou go back up the line without running, and the bricks scorch your feet. They squat on their heels one behind another, with their hands tied between their knees, and from them comes a smell of old sweat and wet rope. You pass a woman with her head bowed, an old man asleep sitting up, and neither of them asks for anything. Someone lifts a face as you come and lowers it again. In the little pot, against your side, the water sloshes at every step: only you hear it.\n\nAt the post the guard has reached the boy with the figs and has him by the arm; the baboon has opened its fingers and sat down again, with its back straight. The whole quay is looking there. You go around the stack on the wall side, with one hand on the rough canvas.\n\nBehind the stack of sacks, Nefret has seen everything. She moves over to make room for you, and does not look at you.\n\n“You know how to write and you didn't write,” she says.\n\nThere is no anger in her voice. You look at the post, the line, your feet."},"29":{"t":"The headman reads down to the signature. From a pace away you hear his breath, short, at every word. He reads the signature again, with his thumb on the curl. He raises his eyes from the potsherd to your palette, and then back to the potsherd.\n\n“Sold today,” he says. “And by whom? I haven't sold anything, and I'm the one who sells.”\n\nHe does not raise his voice. The stick comes down flat across your shoulders, once, without malice. Your arm shakes as it does after a hundred lines of copying, and you find yourself on your knees on the bricks. A grain of emmer digs into your knee. Above you the headman breaks the potsherd on the edge of the chest, in two and then in four, and throws the pieces into the water. They make four small splashes, one after another. Then he turns his back on you and goes back to the ledger.\n\nYou crawl back behind the sacks on all fours, with the palette dragging on the ground. No one comes after you: on the quay a beaten boy is an everyday thing. Nefret looks at you with her head tilted.\n\n“Did you write it badly?”\n\n“I wrote it perfectly.”\n\nIt is true. It is the finest receipt you have ever written, and now it lies in four pieces at the bottom of the harbor.\n\nYou try your arm: it lifts as far as the shoulder and stops there. Beyond the stack the line is still at the post, and the way south goes past it.\n\n*Lose 2 Vigor points.*\n\n*If your Vigor drops to zero, turn to §44.*","h":-2,"z":44},"30":{"t":"The harbor judge sits under the awning on a low stool, with two old men beside him who serve as witnesses and a jar of water at his feet. The shade of the mats falls in stripes across his shaved head. He judges stolen baskets, wet sacks, boats tied to another man's post: he makes people give back and makes people pay, and the rest no one says.\n\nThe master shipwright of the yard arrives with his adze still in his hand and cedar sawdust on his arms. He looks Teresh over from head to foot, then his hands, the tattoo. He turns one of his palms up and runs his thumb over it, where the oar makes its callus.\n\n“This one knows ships,” he says. “I'll take him at the yard. Free, if the judge writes it. I pay in emmer.”\n\nThe headman names his price, the shipwright his, the judge splits it down the middle and no one is happy: so it is fair.\n\nYou do the writing, with the palette open on your knees and a sheet of papyrus that the judge takes out of a small box and hands you with two fingers. It is new, and the fibers pull the reed pen sideways. You write the way court papers are written, which you copied a hundred times at school without reading them: the day, the judge, the witnesses, and then the line that counts, the one that says that from today this man belongs to the yard, with his emmer and his hands, and to no merchant. In the cursive hand of the accounts it all fits. The two old men follow the reed pen with their eyes, line after line.\n\n“Who vouches for him?” the judge asks. “The one who vouches says his name.”\n\n“Hori, son of Amenemope.”\n\nHe repeats it and has you write it at the bottom, beneath his own words. He knows your father's name: at the harbor everyone knows it. Then he reads the deed aloud, and while he reads the headman unties the rope from Teresh's neck. The knot is hard with sweat, and he needs his fingernails.\n\nTeresh touches his neck where the rope no longer is. “Ships,” he says, in clean Egyptian, and follows the shipwright toward the yard. He walks with his legs wide, like a man used to a deck that moves. You close the palette and go back toward the stack of sacks.\n\n*Write “the harbor judge” on the Who Knows Your Name line.*\n\n*Note on your sheet, in The Book Remembers column: “YOU WROTE THE DEED OF FREEDOM”.*","f":"YOU WROTE THE DEED OF FREEDOM"},"31":{"t":"You find a smooth potsherd right away: the quay is littered with sherds of oil jars, pale on the inside. You sit down on a sack, open the palette, wet the reed pen with a drop from the little pot and write in your father's hand, the one you know better than your own:\n\n“A serving girl of fifteen, found in the south, sold today to the temple of Ptah for the loom: paid, eight sacks of emmer. The scribe of the harbor granaries”\n\nYou sign it with the long tail, without lifting the reed pen, which scratches on the fired clay. You blow on the ink. Then you walk straight up to the headman, the way a scribe's son goes to work, and hold out the potsherd. The other two are watching the rooftops, one on one side and one on the other, and no one notices a boy coming on foot along the quay.\n\nThe headman takes the potsherd and turns it the right way up. His fingertip is black with old ink and his breath smells of beer. He keeps his finger on the line and reads moving his lips. If he believes it, for him the girl is already sold. If he does not, he has a stick in his hand, and you are one pace away."},"32":{"t":"“What's your name?”\n\nThe question comes out hoarse, with your throat still full of the dust of the granaries, and you have to cough into your fist. She thinks about it. Not like someone looking for a lie: like someone weighing a sack before saying what it is worth. Below, a staff knocks on one dome, then on the next.\n\n“My father has it,” she says.\n\nYou wait for the rest. There is not any. Down at the shipyards a shipwright starts hammering again, three blows and a pause. You shift your weight on the hot brick, one hand and then the other. At the harbor people wear their names along with their kilts, and anyone who loses his gets another from the first passerby. The porters shout them from one quay to the next, along with the count of the sacks. Your father wrote yours in the granary ledger the day you were born, between the barley and the emmer, with the long tail. But you are the one who has it.\n\nThen, without your asking: “I'm going south.”\n\nShe says it looking past the domes and the sails, toward the river that comes down from the south, and she does not say why. From up here the river is a broad, pale strip behind the masts of the beached ships. The grain boats sail up it with their sails spread to the north wind, and to look at them they seem to stand still. You do not ask. On the rooftops, anyone who asks why stays on the ground.\n\nBelow you the guards' staffs have stopped beating on the bricks. You hear voices, low, and wood being dragged along the ground. A wooden ladder bangs against the next dome, then another."},"37":{"t":"The guards climb up on the shady side, as always, and that is not the side you two are on. Beyond the dome a staff scrapes the brick, and a man huffs. She slides down the dome on its sunny flank, with her back against the hot bricks, and you after her. The mud brick scrapes your shoulders under the palette strap, and you land at the bottom on your heels, knees bent. At the foot of the granaries stands the washerman's cart, at a halt, with the donkey eating someone else's straw and the baskets of linen in a row on the bed.\n\nShe lifts the lid of the biggest basket and climbs in. She looks at you. You climb in too. You are long: to fit you bend your neck and hug your legs, and the lid settles on your head.\n\nInside it is dark and cramped, and the linen smells of natron and canal water. You sit knees against knees. The palette digs into your ribs. Outside the staffs go by; a voice asks the washerman if he has seen a girl, he answers that all he sees is dirty laundry, and the donkey, tugged, starts off again.\n\nIn the dark she feels for your hand. She finds the left one and lays hers on it, on the back, for the space of a breath. Thank you, it means: you understand it even in the dark. When the cart jolts and the lid lifts a finger's breadth, in the blade of light you see on the back of your left hand a red mark, as if from an ember.\n\nSomeone who has no name cannot be called, not even to tell her to stay down. The first girl's name you ever wrote in your life is the one from the school exercise, the beautiful one, which the boys copy in their first year and no one has ever given to any girl.\n\n“I'll call you Nefret,” you say.\n\nShe laughs into the linen, loud, so loud that the washerman turns to look at the baskets. She nods yes, against the lid. Nefret will do."},"41":{"t":"You hold out the little pot from your palette, the shell-shaped one, which is for wetting the ink cakes and not for giving anyone a drink. Teresh takes it with his wrists bound, and the rope leaves him just enough room to bring it to his mouth. His fingers are thick, covered in old cuts, and he holds it the way you hold an egg. He takes a single sip, a small one, and passes it to his neighbor in the line, who also takes a single sip and passes it on.\n\nAlong the line no one speaks: you hear the rope tighten when one leans toward the next. A woman wets her lips first with her finger; two men with the same face pass it between them without looking at each other. The little pot goes the whole length of the line and comes back empty. Ten sips, one pot: the count comes out right.\n\n“Teresh,” you say, and point to him.\n\nHe studies your finger, then you. He frowns, and his sun-baked skin opens in pale wrinkles around his eyes. Then he laughs, a broad sailor's laugh, which makes one of the merchants turn.\n\n“Teresh,” he says, and thumps his hand on his chest, where the rope crosses it. He is keeping it.\n\nHe gives you back the pot, dry, with both hands. The shell is warm from twenty palms. You put it back in the palette, in its place, between the black well and the red one. Behind the stack of sacks, Nefret has seen everything, and she makes room for you beside her without saying a word.\n\n*Note on your sheet, in The Book Remembers column: “YOU TREATED TERESH AS A PERSON”.*","f":"YOU TREATED TERESH AS A PERSON"},"44":{"t":"You do not see the last blow coming: a staff, or the edge of an awning, or the whitewash of the Wall slipping from your fingers. Afterward there is only the packed earth against your cheek, and a smell of dust. You try to draw up one knee, and the knee stays where it is. The voices move away. Someone picks up your palette, looks it over top and bottom and carries it off.\n\nAt the market post the two baboons sit silent, crouched, with their hands on their knees.\n\nTomorrow morning your father will open the granary, count the sacks alone and mark them in chalk, one in every ten, without a mistake. Then he will stay a little while looking at the mat next to his.\n\n*Your story ends here. Start again from section 1.*"},"45":{"t":"The bridge is behind you now, with the two market guards. The south quay is of fired brick, worn in the middle by dragged sacks, and it smells of pitch and wet rope. The porters come down from the ships in a line, bent over, and the gangplanks bow at every step. The grain ships are moored in pairs; the sailors from Byblos quarrel with the porters in one language, the porters answer in another, and the curses are the same in both.\n\nThe traders in men are back. The line is at the quay post again, tied by the neck: the headman with the ledger open on his arm, the overseer with a new rope, a shorter one. He is the biggest of the three, with the stick and the whip coiled at his belt, and he keeps the end of the rope wound twice around his fist. You have already counted them: ten. The rope sags in a belly between one neck and the next.\n\nBeside the post stands a king's guard, with the staff and the pleated kilt of the palace, and in his hand a potsherd as big as a loaf. The king's herald came along the quay crying an order, and this is the copy he left him. The guard holds it the way you hold a stone, wrong way up, and every so often he peers at it as if the stone were about to speak. From here all you can see is that it is closely written.\n\nNefret crouches behind a stack of emmer sacks and pulls you down beside her. The sackcloth is rough against your shoulder, and from the seams comes a trickle of dust that tickles your nose.\n\n“Those men know me,” she says.\n\nShe is staring at the overseer, not the guard. Between you and the rest of the quay, toward the south, there are the line, the post, the king's potsherd and three men who know her. The potsherd is ten paces away. From here you cannot read it; from two you can.","img":1},"47":{"t":"Her line is the last in the column, gray and smudged but still legible, and you have it: on the potsherd or in your eyes, word for word. You duck back down behind the sacks and go over it from the beginning.\n\nA girl of fifteen, taken on the south road, alone. The day, the place, who took her. And where the other lines have the price, six sacks, four, seven, hers has no number at all. It says only: for the king's house.\n\nYour father taught you to read a ledger before you could even read words, and a ledger says more with what it does not write: a column left blank, a sum without its entries. A line without a price is not a sale: it is a delivery. These men did not find her to sell her to the highest bidder. They took her on someone's behalf, and that someone is written at the end of the line.\n\nNefret pulls you by the arm, hard, with both hands. The old man is turning: the chest creaks under his weight.\n\nThe sun has already passed the masts of the ships. The shadows of the yards are beginning to lengthen on the quay, and the porters come down the gangplanks with empty backs. From the shipyard come the blows of the adzes, one after another. The harbor, in the evening, closes.\n\n*Note on your sheet, in The Book Remembers column: “YOU KNOW THE MERCHANTS ARE THE KING'S”.*","f":"YOU KNOW THE MERCHANTS ARE THE KING'S"},"49":{"t":"Between the stack and the storehouse wall there is a narrow shelter, full of sun, and there is room in it for two, with your backs against the emmer. The wall throws the heat back on your knees, and the sackcloth prickles through your kilt. On the other side, sitting on the ledger chest, two men of the gang, an old one and a young one, the kind who carry water to the line and not the stick, are eating onions and talking, with their backs to you, without lowering their voices: those who work for the masters of the quay do not lower them. The old man splits the onions with his thumb and passes half to the young one.\n\n“She was walking from the south, alone, with no waterskin, and she wasn't thirsty,” says the older one. “We picked her up on the road the way you pick up a thing fallen off a cart.”\n\n“A serving girl,” says the young one, with his mouth full. Then he says the king's name. Not the one that is said in front of the guards: the one that is said at the market, twisted on purpose, which makes whoever hears it laugh and whoever says it look over his shoulder. The old man elbows him and looks around.\n\nBeside you Nefret says softly, to no one: “I wasn't thirsty.”\n\nThe merchants' ledger has been left open on the chest, a pace from your hand, between the old man's elbow and the onion skins. Inside is the line: who, from where, for whom, how much. She is in it too. Reading it with those two sitting on top of it means reading on the run, one line yes and one line no, hoping the old man does not turn around. Whoever copies fast in the right handwriting does not have to hope: you copy her line from the ledger at a glance, while the two are talking, and the reed pen sets it down straight on the potsherd before the old man has finished his onion.\n\n*Note on your sheet, in The Book Remembers column: “YOU HEARD THE TWISTED NAME”.*","f":"YOU HEARD THE TWISTED NAME","dec":1},"51":{"t":"Now you are up high, astride the yard of the last ship in the shipyard, with the ropes humming under your hands and the whole harbor below you. The wood is warm with sun between your knees. A thread of breeze is blowing that does not reach down below, and it carries up the smell of hot pitch and the blows of the shipwrights. Beyond the grain ships the river is flat and gives off a white light. From up here the quay is an open ledger: everything in a row, everything in its place, everything to be counted.\n\nThe line is at the post. From above it is ten bent backs, one behind the other. The headman is talking with the king's guard, with the ledger open on the chest beside him, and he taps his finger on the potsherd of the proclamation the way you tap on a figure that does not add up. The guard holds it in both hands and will not let go. The other two scan the rooftops and the ropes, one on each side, with their eyes narrowed against the sun.\n\nIn the line, the tall man with the reddish hair lifts his head. Even sitting on his heels he is a head taller than those in front of him. He has seen you. He raises his bound hand as far as his shoulder: and you know each other a little. For three days, from the potter's roof, you have been calling him Teresh, because he is one of the people of the sea. He does not know it. He has the ship tattooed on his arm, with its high prow and its oars.\n\nNefret is sitting on the crosstree of the next mast, higher than you, with her legs swinging in the air, turned toward the river.\n\n“It's nice up here,” she says. “A pity to go down.”\n\nBut the ropes end here, and the road south runs along the quay. The way down is by the mast rope, knotted every cubit for those who climb barefoot."},"52":{"t":"The line is in the sun in front of the post, and the prisoners sit on their heels, the way people sit who no longer count the days. The rope runs from one neck to the next, and where it rubs the skin is red. The tall man is the last, now that the last girl is no longer there. Teresh: you have been calling him that from the roof for three days, and the name sits on him as if he had always had it. He has reddish hair, skin baked by the sun of the sea, the ship tattooed on his arm and the rope around his neck. From close up his hair is curly, caked with dust, and his lips have a white crust at the corners.\n\nHe looks at you. He says something in a language no one at the harbor understands, not even the sailors from Byblos, and then, in Egyptian, with a dry mouth: “Water?”\n\nIt is a single word, and he says it right. You have the little pot of your palette slung at your side, half full.\n\nNear the post a boy with a basket of figs tries to slip between a merchant's baskets with one hand too many, and one of the guard's two baboons, without getting up, reaches out an arm and takes him by the ankle. It holds him. It does not bite, it does not pull: it looks at the guard, not the boy, and waits for him to come. The boy stands still, with the basket clutched to his chest, and does not breathe a word.\n\nUnder the awning at the far end of the quay sits the harbor judge, with two old men beside him. The awning is of reed mats, and in front of it people stand waiting their turn with a basket or a sack in hand. It is the court of the quay: whoever has taken gives back, whoever owes pays. Before the judge a well-written deed of freedom makes a bound man a free man, if someone pays for him; and at the shipyard, right next door, the shipwrights have been looking for months for men who know ships.\n\nThe line must move soon: the headman has already counted it twice. Past the post the quay goes on toward the south. Teresh is still looking at you, with his bound hand in midair.","dec":1,"img":2},"53":{"t":"You say nothing. Neither does she. The sun moves a finger's breadth across the dome, a fly tries to settle on your knee and thinks better of it, and from the harbor rises the shout of a porter who has lost a sack. You count the sacks going into the granary below, on the napes of the men, to have something to count: eight, nine, ten, and at ten you know that your father's chalk makes a notch. The dust has settled on your lips and tastes of bran.\n\n“You're the one who jumps,” she says at last.\n\nIt is not a question. She measures your shoulders, then your hands, and does not say what she thinks of them. Your palms are gray with dried mud and, on your middle finger, there is the black stain of the reed pen, the one that will not come off even with ash.\n\n“Three days,” she says. “From the line. I saw you jump from the potter's to the baker's, and then down the dyer's gutter, and then onto the washerman's cart. Every day at the same hour.”\n\nFor three days the line stayed put under the potter's roof, and for three days you counted it from above, the way sacks are counted, without ever looking at who was at the end. She, though, lifted her face. It is your round: the bench, the beam, the gutter, the linen. You do it at noon, when the guards look for shade and no one lifts his head, and you thought you were doing it alone. You feel your face go red, and the sun has nothing to do with it.\n\n“I'm going south,” she says. She says it to the river, more than to you, and she does not say why. To the south, past the last quay, the water bends behind the palms and from here you cannot see where it goes.\n\nBelow you the guards' staffs have stopped beating on the bricks. A wooden ladder bangs against the next dome. Someone settles it with two knocks, and the rungs begin to creak."},"54":{"t":"The cart stops where the canal runs under the awnings, and the washerman starts unloading. You can tell from the thuds on the bank, one per basket, closer and closer. You get out of the basket before he reaches yours, one on one side and one on the other. Outside the light is white, and your legs are stiff from being folded in four. The washerman does not count the baskets: he counts the laundry. He pulls it out by the armful and throws it on the flat stone of the bank, without lifting his head.\n\nNefret looks around just once.\n\n“South is that way,” she says, and points to the bridge, the quay, the river.\n\nIt is that way. You have lived here for sixteen years, and she got here three days ago with a rope around her neck.\n\nFrom here you can see the baker's awning again, and on the beam, where it fell from her when she landed, is her piece of rope, stretched out in the sun like a grass snake, with its ends black, as if burned.\n\nBelow, the green canal runs between the awnings and passes under the brick bridge, and on the bridge there are already two market guards, leaning on their staffs, staring into the face of everyone who passes. The bridge is small, as wide as a cart, and whoever crosses it passes an arm's length from them. The guards stop a serving girl with a jar on her head, walk around her, let her go. Under the reeds the water is cloudy, with fish scales glittering on the surface, and the brick edge is slimy with waterweed.\n\nGoing back onto the baker's roof for a piece of rope means a gutter, an awning and the risk of being seen by the whole harbor. The canal, though, is right there, under your feet, and it leads to the south quay without going over the bridge.","dec":1,"img":3},"55":{"t":"“Wait for me,” you say, and she shrugs: she will wait, if she feels like it.\n\nFrom the cart to the dyer's house it is twenty paces under the awnings, and you take them without running. Up the gutter, one foot on the water barrel, hands on the edge of the awning, and you are above the baker's bread again. The color of the dripped dyes has stayed on your fingers. You walk along the beam in short steps, with your arms out: it is a foot wide, and the smoke has made it smooth. From below rises the heat of the oven, which dries the sweat on your legs. The rope is where you saw it, on the beam: two cubits long, of braided palm fiber.\n\nYou pick it up. The two ends are black and hard, as if passed through embers, and they do not smell of burning. You wind The Broken Rope around your arm and then tuck it into your belt, on the side opposite the blade.\n\nDown below, the bridge is full of people hurrying from one patch of shade to the next. Nefret is in the middle, in the sun, the only one not looking for shade, and she lifts her eyes to you: you are taking too long. The two guards with the staffs look at everyone but her: no one looks for a girl standing still in the middle of the bridge.\n\nYou go back along the beam, to the edge. The gutter is right there, and the guards have not lifted their heads yet.","it":"The Broken Rope"},"56":{"t":"You stay on the potter's roof, with the reed pen still on the ground, and let her go. Your toes are on the edge, above the three cubits of empty air.\n\nShe goes straight south, from awning to awning, and never picks a wrong one: the dyer's, which holds; the brewery, which holds only along the ridge; the ropemaker's arbor, which holds nothing, and she jumps it. They are your roads: you tried them one reed at a time, in years of skinned knees. The dyer's reeds bend under her running and spring back, and the hanging cloths drip into the alley. She passes behind the washerman's hung laundry and is gone. The laundry swells once and falls back. You look for her on the reeds, on the gutters, on the ladders: nothing. Only the smoke of the ovens, straight up in the air, and the white light that flattens the shadows against the walls.\n\nThe overseer does not even make it to the top of the ladder. He stops at the last rungs, with his head barely above the edge of the roof, and pants. He looks at the empty air in front of the bench, not at you, spits into the canal and goes back down to shout with the others.\n\nYou pick up the reed pen and put it back behind your ear. The domes of the granaries are the tallest things in the harbor, after the masts of the ships, and from up there you can see more than from here. You go there by the low roofs, without running. You cross the wall of the brewery yard, a hand wide, one foot in front of the other, in the sour smell of fermenting barley. Then come the storehouse roofs, flat, warm with sun, where the air begins to smell of grain and sacks.\n\nOn the mouth of the tallest granary, the one the grain is poured in through, someone is sitting in the full sun, with legs dangling over the hole. When you are below the dome, whoever it is leans out.\n\n“I thought you were the one who jumps,” she says."}},"links":{"1":[{"l":"Run after her over the roofs","v":20,"t":"l"},{"l":"🧠 If you have Rooftop Cat","v":15,"t":"l"},{"l":"🧠 If you have Leap","v":15,"t":"l"},{"l":"Tip the potter's basket of sherds onto the overseer, then run after her","v":27,"t":"l"},{"l":"Stay still and watch where she goes","v":56,"t":"l"}],"2":[{"l":"Ask her what her name is","v":32,"t":"l"},{"l":"Wait for her to speak","v":53,"t":"l"}],"4":[{"l":"⚔️ If you win","v":51,"t":"l"},{"l":"⚔️ If you lose","v":44,"t":"l"},{"l":"🎒 You have The Broken Rope: you tie it around his ankles without hurting him","v":51,"t":"l","p":"The Broken Rope"}],"6":[{"l":"“And who is the scribe who signs?”","v":12,"t":"l"}],"9":[],"10":[{"l":"Cross up high, over the masts of the ships h Your father is the scribe of the harbor granaries. He is a good and boring man, who counts the sacks of emmer and barley that come in and those that go out, marks them in chalk on the domes and then copies them onto a scroll that no one will ever read. He calls you “tablet boy.” On the door of his granary a cobra is painted, and he walks past it every morning lowering his head."]},{"h":"MEMPHIS","p":["Above the harbor are the roofs, and the roofs are yours. They are flat, of mud and reeds, covered with baskets, with mats, with fish laid out to dry and with old women asleep in the shade. From the potter's roof you can see the whole market: the stalls, the canal that passes under the baker's awnings, the domes of your father's granaries, and the two baboons of the market guard, on their leashes, which seize thieves by the legs.","From up there Memphis is a city you can cross without touching the ground. You have done it a hundred times."]},{"h":"WHAT YOU WANT","p":["You do not want much. You want the potter's roof at noon, when the market dozes and no one is looking for you. You want your father to stop saying that one day you will count the sacks in his place. You want to see the sea once, where the ships with the cedar come from, and the south once, where the river comes from.","You have written thousands of lines, and not one was yours. You have never written a thing that no one had asked you for."]}],"prologo":[{"h":"NOON","p":["You have your palette. You have your blade. You have a reed pen behind your ear and a smooth potsherd on your knees, and no wish at all to come down.","It is noon on the potter's roof, and below is the market."]}],"lama":"Short Blade","corsa":{"par":[9],"dote":"Steady Hand"}};
// Motore delle demo giocabili dei librigiochi di Peter Palmer.

(function () {
  'use strict';
  var B = BOOK, U = B.ui, P = B.par, K = B.links, MAX = B.max;
  var KEY = 'demo_' + B.slug + '_' + B.lang;
  var app = document.getElementById('app');
  var ST = null, NOTE = [], occupato = false;

  // ---------- utilità ----------
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function md(s) {
    return esc(s).replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[\s(«"“])\*([^*\n]+)\*(?=$|[\s).,;:!?»"”])/gm, '$1<i>$2</i>');
  }
  function paras(s) {
    return String(s || '').split(/\n+/).map(function (x) { return x.trim(); }).filter(Boolean)
      .map(function (x) { return '<p>' + md(x) + '</p>'; }).join('');
  }
  function t(k, o) { var s = U[k] || k; if (o) for (var x in o) s = s.split('{' + x + '}').join(o[x]); return s; }
  function d6() {
    try { var a = new Uint8Array(1); do { crypto.getRandomValues(a); } while (a[0] >= 252); return 1 + a[0] % 6; }
    catch (e) { return 1 + Math.floor(Math.random() * 6); }
  }
  function norm(s) { return String(s || '').replace(/✓/g, '').replace(/\s+/g, ' ').trim().toLowerCase(); }
  function re(k) { return new RegExp(B.re[k], 'iu'); }
  var RE = { ab: re('ab'), itPos: re('itPos'), itNeg: re('itNeg'), fgPos: re('fgPos'), fgNeg: re('fgNeg'), fgPre: re('fgPre'), vinci: re('vinci') };
  var lento = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  // ---------- dadi disegnati ----------
  var PUNTI = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
  function dado(v, cls) {
    var h = '<span class="dado' + (cls ? ' ' + cls : '') + '" aria-label="' + v + '">';
    for (var i = 1; i <= 9; i++) h += '<i' + (PUNTI[v].indexOf(i) >= 0 ? ' class="p"' : '') + '></i>';
    return h + '</span>';
  }
  function dadi(arr, cls) { return arr.map(function (v) { return dado(v, cls); }).join(''); }
  // fa rotolare i dadi dentro el, poi chiama fine()
  function rotola(el, n, fine) {
    if (!lento || !el) { fine(); return; }
    var k = 0;
    var iv = setInterval(function () {
      var a = []; for (var i = 0; i < n; i++) a.push(d6());
      el.innerHTML = dadi(a, 'gira');
      if (++k > 7) { clearInterval(iv); fine(); }
    }, 70);
  }

  // ---------- stato ----------
  function tira(v) { var r = { d: [], v: 0 }; if (typeof v === 'number') { r.v = v; return r; } for (var i = 0; i < v[0]; i++) r.d.push(d6()); r.v = v[1] + r.d.reduce(function (a, b) { return a + b; }, 0); return r; }
  function nuovo(ab) {
    var s = { cur: 1, n: 0, ab: ab || [], persi: [], inv: (B.zaino || []).slice(), fg: [], fatti: {}, combat: null, pend: null, fine: 0, anc: 0, tiri: {} };
    var V = B.valori;
    var f = tira(V.fz); s.fz = f.v; s.tiri.fz = f;
    var r = tira(V.hp); s.hp = s.hpMax = r.v; s.tiri.hp = r;
    if (V.agi) { var a = tira(V.agi); s.agi = a.v; s.tiri.agi = a; }
    return s;
  }
  function salva() { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} }
  function carica() { try { var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.cur && P[s.cur] && !s.fine) return s; } catch (e) {} return null; }
  function cancella() { try { localStorage.removeItem(KEY); } catch (e) {} }

  function haDote(n) { n = norm(n); return ST.ab.some(function (a) { return norm(a) === n; }); }
  function persa(n) { n = norm(n); return ST.persi.some(function (a) { return norm(a) === n; }); }
  function ruolo(r) { return !!(B.ruoli && B.ruoli[r] && haDote(B.ruoli[r])); }
  // oggetti: si confrontano senza articolo, e l'etichetta può continuare dopo il nome («Hai La corda spezzata: gliela leghi...»)
  function senzaArt(s) { return norm(s).replace(/^(?:(?:un|una|uno|il|lo|la|i|gli|le|a|an|the) |l['’])/, ''); }
  function haOgg(n) {
    n = senzaArt(n);
    return ST.inv.some(function (x) { x = senzaArt(x); return x === n || x.indexOf(n) === 0 || n.indexOf(x) === 0; });
  }
  function cura(n) { n = norm(n); for (var i = 0; i < B.cure.length; i++) if (n.indexOf(B.cure[i][0]) >= 0) return B.cure[i][1]; return 0; }
  // «il libro ricorda»: come nel giocabile del Tool Creator
  function fNorm(s) { return norm(s).replace(RE.fgPre, ''); }
  var NOTI = null;
  function noti() { if (!NOTI) { NOTI = {}; for (var k in P) if (P[k].f) NOTI[fNorm(P[k].f)] = 1; } return NOTI; }
  function cancello(lab) {
    var m = lab.match(RE.fgNeg);
    if (m) { var pos = fNorm(B.re.non + ' ' + m[1]); if (noti()[pos] && !noti()[fNorm(m[1])]) return { neg: false, f: pos }; return { neg: true, f: fNorm(m[1]) }; }
    m = lab.match(RE.fgPos);
    return m ? { neg: false, f: fNorm(m[1]) } : null;
  }
  function haFg(f) { return ST.fg.some(function (x) { var y = fNorm(x); return y === f || y.indexOf(f) >= 0 || f.indexOf(y) >= 0; }); }

  // ---------- schermate ----------
  function mostra(h, giu) { app.innerHTML = h; if (!giu) window.scrollTo(0, 0); }

  function copertina() {
    var sv = carica();
    var h = '<main class="copertina">' +
      '<h1 class="vh">' + esc(B.title) + '</h1>' +
      '<img class="cop" src="' + B.cover + '" alt="' + esc(t('copAlt', { t: B.title })) + '">' +
      '<p class="etichetta">' + esc(U.demo) + '</p>' +
      '<p class="sotto">' + esc(U.copTesto) + '</p>' +
      '<div class="pulsanti">';
    if (sv) h += '<button class="btn primo" data-az="riprendi">' + esc(t('riprendi', { n: sv.cur })) + '</button>';

      '</div><p class="firma">' + esc(B.author) + ' · Intrecci di Carta</p></main>';

  // pezzi dell'introduzione e prologo del libro, con i loro titoli
  function sezioniHtml(lista) {

  var TIRI_REGOLE = null;

  }
  function contaDoti() {
    var cb = [].slice.call(app.querySelectorAll('.dote input'));
    var n = cb.filter(function (c) { return c.checked; }).length;
    cb.forEach(function (c) { if (!c.checked) c.disabled = n >= 5; c.parentNode.classList.toggle('scelta', c.checked); });
    var e = document.getElementById('conta'); if (e) e.textContent = t('dotiConta', { n: n });
    var v = document.getElementById('via'); if (v) v.disabled = n !== 5;
  }

  function barra() {
    var pall = ''; for (var i = 0; i < MAX; i++) pall += '<i class="' + (i < ST.n ? 'usata' : '') + '"></i>';
    var r = ST.hp <= ST.hpMax / 3 ? ' basso' : '';
