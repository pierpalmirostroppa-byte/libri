:root{--suoro:#1f1a10;--fondo:#45515e;--fondo2:#262d35;--carta:#f3eee2;--inchiostro:#23272d;--accento:#475869;--oro:#c49a4f;--rosso:#97392b;--velo:rgba(71,88,105,.14)}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--inchiostro);
  background: var(--fondo2) linear-gradient(180deg, var(--fondo) 0%, var(--fondo2) 100%) fixed;
  font-family: 'EBG', 'EB Garamond', Garamond, 'Times New Roman', Georgia, serif; font-size: 19px; line-height: 1.6;
}
#app { max-width: 700px; margin: 0 auto; padding: 0 0 48px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; }
a { color: inherit; }
.btn {
  display: block; width: 100%; margin: 9px 0; padding: 11px 16px; border-radius: 6px; cursor: pointer;
  font-size: 18px; line-height: 1.35; text-align: center; text-decoration: none;
  background: transparent; color: var(--inchiostro); border: 1.5px solid var(--accento);
}
.btn:hover, .btn:focus-visible { background: var(--velo); }
.btn:focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; }
.btn.primo { background: var(--accento); color: var(--carta); border-color: var(--accento); font-weight: 600; }
.btn.primo:hover { filter: brightness(1.12); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.scelta { text-align: left; background: #fffdf7; }
.btn.scelta:hover { background: var(--velo); }
.btn.chiusa { opacity: .55; background: transparent; border-style: dashed; }
.btn.chiusa small { display: block; font-size: 15px; font-style: italic; }
.btn.prova { background: var(--oro); border-color: var(--oro); color: var(--suoro); font-weight: 600; }
.btn.mini { display: inline-block; width: auto; margin: 0; padding: 4px 12px; font-size: 16px; }
.btn.chiaro { color: var(--carta); border-color: var(--carta); margin-top: 14px; }
.copertina { text-align: center; padding: 22px 18px 10px; color: var(--carta); }
.cop { display: block; width: 100%; max-width: 420px; margin: 0 auto 14px; border-radius: 3px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.etichetta { margin: 6px 0 0; font-size: 15px; letter-spacing: .22em; text-transform: uppercase; color: var(--oro); font-weight: 600; }
.sotto { max-width: 440px; margin: 8px auto 14px; font-size: 19px; }
.copertina .pulsanti { max-width: 380px; margin: 0 auto; }
.copertina .btn { color: var(--carta); border-color: var(--carta); }
.copertina .btn.primo { background: var(--oro); border-color: var(--oro); color: var(--suoro); }
.firma { margin-top: 18px; font-size: 16px; letter-spacing: .08em; opacity: .9; }
.foglio {
  background: var(--carta); margin: 14px 10px 0; padding: 18px 20px 22px; border-radius: 4px;
  box-shadow: 0 6px 24px rgba(0,0,0,.35);
}
.foglio h2 { margin: 4px 0 10px; text-align: center; font-size: 27px; font-weight: 600; color: var(--accento); }
.foglio h3 { margin: 22px 0 4px; font-size: 21px; font-weight: 600; color: var(--accento); border-top: 1px solid var(--oro); padding-top: 14px; }
.nota { font-size: 16px; font-style: italic; margin: 4px 0 10px; }
.regole p { margin: 0 0 10px; }
.valori { display: grid; gap: 6px; }
.valore { display: grid; grid-template-columns: 1fr auto 2.2em; align-items: center; gap: 10px; padding: 6px 10px; background: #fffdf7; border-radius: 6px; border: 1px solid var(--velo); }
.vnome { font-weight: 600; }
.vdadi { display: flex; align-items: center; gap: 5px; }
.piu { font-size: 16px; }
.vnum { font-size: 24px; text-align: right; color: var(--accento); }
.doti { display: grid; gap: 6px; }
.dote { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--velo); background: #fffdf7; cursor: pointer; line-height: 1.35; }
.dote input { margin-top: 5px; width: 20px; height: 20px; accent-color: var(--accento); flex: none; }
.dote small { font-size: 15.5px; }
.dote .bonus { font-size: 15.5px; color: var(--accento); }
.dote.scelta { border-color: var(--accento); background: var(--velo); }
.barra-doti { position: sticky; bottom: 0; margin: 12px -20px -22px; padding: 10px 20px 14px; background: var(--carta); border-top: 1px solid var(--oro); display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; align-items: center; }
.barra-doti #conta { grid-column: 1 / -1; text-align: center; font-size: 16px; }
.barra {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 12px; background: var(--fondo2); color: var(--carta); font-size: 17px; border-bottom: 1px solid var(--oro);
}
.barra b { color: var(--oro); font-weight: 600; }
.barra .r.basso { color: #ffb3a6; }
.barra .btn.mini { margin-left: auto; color: var(--carta); border-color: var(--carta); }
.palline { display: inline-flex; gap: 4px; }
.palline i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--oro); }
.palline i.usata { background: var(--oro); }
.num { text-align: center; font-size: 26px; font-weight: 600; color: var(--accento); letter-spacing: .05em; }
.num::after { content: ''; display: block; width: 46px; height: 2px; margin: 6px auto 12px; background: var(--oro); }
.ill { margin: 0 -20px 14px; }
.ill img { display: block; width: 100%; height: auto; }
.testo p { margin: 0 0 .8em; }
.nemico { margin: 0 0 10px; padding: 6px 10px; border-left: 3px solid var(--rosso); background: #fffdf7; font-weight: 600; }
.nemico small { font-weight: 400; }
.note { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.note span { font-size: 16px; padding: 3px 10px; border-radius: 14px; border: 1px solid var(--accento); background: #fffdf7; }
.note .nota-male { border-color: var(--rosso); color: var(--rosso); }
.azioni { margin-top: 14px; border-top: 1px solid var(--oro); padding-top: 8px; }
.riquadro { margin: 10px 0; padding: 12px 14px; border: 1.5px solid var(--accento); border-radius: 8px; background: #fffdf7; }
.titolo-r { margin: 0 0 6px; text-align: center; font-weight: 600; font-size: 20px; color: var(--accento); letter-spacing: .03em; }
.esito { text-align: center; font-weight: 600; font-size: 21px; margin: 6px 0; }
.esito.ok { color: #2f6b3a; }
.esito.ko { color: var(--rosso); }
.dadi-grandi { display: flex; justify-content: center; align-items: center; gap: 8px; min-height: 58px; flex-wrap: wrap; margin: 6px 0; }
.somma { font-size: 24px; font-weight: 600; }
.chi { font-size: 15px; font-style: italic; }
.dadi-grandi.due { gap: 18px; align-items: flex-start; }
.tiro { display: grid; grid-template-columns: auto auto; gap: 4px 6px; justify-items: center; max-width: 46%; }
.tiro .chi { grid-column: 1 / -1; text-align: center; line-height: 1.2; }
.registro { font-size: 16px; border-top: 1px dashed var(--velo); margin-top: 6px; padding-top: 4px; }
.registro p { margin: 2px 0; }
.vita { margin: 6px 0; font-size: 16px; }
.traccia { height: 9px; background: var(--velo); border-radius: 5px; overflow: hidden; }
.riemp { height: 100%; border-radius: 5px; }
.riemp.io { background: var(--accento); }
.riemp.lui { background: var(--rosso); }
.morte { border-color: var(--rosso); text-align: center; }
.morte .titolo-r { color: var(--rosso); letter-spacing: .1em; }
.dado {
  display: inline-grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); width: 46px; height: 46px; padding: 6px;
  background: #fffef9; border: 2px solid var(--inchiostro); border-radius: 9px; box-shadow: 0 2px 0 rgba(0,0,0,.25);
}
.dado i { display: block; margin: auto; width: 8px; height: 8px; border-radius: 50%; }
.dado i.p { background: var(--inchiostro); }
.dado.piccolo { width: 30px; height: 30px; padding: 4px; border-width: 1.5px; border-radius: 6px; }
.dado.piccolo i { width: 5px; height: 5px; }
.dado.gira { transform: rotate(var(--g, 12deg)); }
.dado.gira:nth-child(2n) { --g: -14deg; }
.fine { text-align: center; background: var(--fondo); color: var(--carta); margin: 6px -20px -22px; padding: 22px 20px 24px; border-radius: 0 0 4px 4px; }
.cop-piccola { width: 150px; border-radius: 3px; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
.fine-sopra { margin: 12px 0 0; font-style: italic; }
.fine h2 { color: var(--oro); margin: 6px 0 8px; font-size: 26px; line-height: 1.2; }
.compra { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; max-width: 420px; margin: 10px auto 4px; }
.compra .btn.primo { background: var(--oro); border-color: var(--oro); color: var(--suoro); }
.compra small { display: block; font-size: 14px; font-weight: 400; }
.sito { margin: 10px 0 0; font-size: 18px; }
.sito a { color: var(--oro); }
.scheda { position: fixed; inset: 0; z-index: 20; background: rgba(10,12,16,.55); display: flex; justify-content: flex-end; }
.scheda-dentro { width: min(380px, 92vw); height: 100%; overflow-y: auto; background: var(--carta); padding: 16px 18px 24px; box-shadow: -6px 0 24px rgba(0,0,0,.4); }
.scheda h3 { margin: 0 0 8px; color: var(--accento); font-size: 24px; }
.scheda h4 { margin: 14px 0 4px; color: var(--accento); font-size: 18px; border-bottom: 1px solid var(--oro); }
.scheda ul { margin: 4px 0; padding-left: 20px; }
.scheda li { margin: 3px 0; }
.scheda .pulsanti { margin-top: 18px; display: grid; gap: 8px; }
.scheda .btn.mini { justify-self: center; }
@media (max-width: 420px) {
  body { font-size: 18px; }
  .foglio { margin: 10px 6px 0; padding: 14px 15px 18px; }
  .ill { margin: 0 -15px 12px; }
  .fine { margin: 6px -15px -18px; }
  .barra-doti { margin: 12px -15px -18px; padding: 10px 15px 12px; }
  .barra { gap: 9px; font-size: 16px; }
  .compra { grid-template-columns: 1fr; }

gLxNwutWsLZ0pJv97C5waV9Cz9FWWCalsdiDE3tLmXWHCnRjKwS0lsmlijsgvhzFf61Vaoco7a8tw6Qe990j3VtKNJjAnEkp+2vtwGCq+ZcgAAAA=","defeat":"LA TUA STORIA FINISCE QUI","valori":{"fz":[1,6],"hp":[2,12],"agi":[1,6]},"agilita":"sotto","cure":[["reliquia",4],["balsamo",6],["acqua che cura",6]],"zeroA":204,"ruoli":{"forza":"Scandaglio","armatura":"Diario di bordo","agilita":"Silenzio di bordo","fortuna":"Sale"},"regole":["Sei **Anfialo**, marinaio di Itaca. Leggi ogni paragrafo e scegli che cosa fare: ogni scelta ti porta a un altro paragrafo.","I dadi li tira il computer. La **Forza** serve negli scontri, l'**Agilità** per scappare, arrampicarti e passare senza farti prendere. La **Resistenza** è la tua energia: se arriva a zero, la tua storia finisce.","⚔️ Negli scontri, a ogni round tu e il nemico tirate due dadi e aggiungete la Forza: chi fa meno perde 2 punti di Resistenza.","🧠 Certe strade si aprono solo a chi ha la dote giusta. ✦ è la metis di famiglia, il sangue di Odisseo: quella strada è sempre aperta, ma chi te la vede usare capisce di che famiglia sei.","🎒 Lo zaino e 🚩 le cose che il libro ricorda si segnano da sole: le trovi nella **Scheda**.","In questa demo hai **sei scelte**. Se la tua storia finisce prima, ricominci dal §1."],"dotiTit":"Scegli cinque doti di bordo","fineTesto":"Il resto del viaggio di Anfialo ti aspetta nel libro, su carta o in ebook.","doti":[{"n":"Scandaglio","b":"+1 al tuo tiro negli scontri","d":"Cali il piombo e da quello che riporta su sai dove sei. In una rissa di porto, il piombo roteato sulla sagola colpisce più forte di un pugno."},{"n":"Diario di bordo","b":"−1 al tiro del nemico","d":"Segni i giorni, le miglia, il vento. Dove non c'è sole sei l'unico che tiene il conto del tempo. In combattimento conti i colpi dell'avversario."},{"n":"Silenzio di bordo","b":"+1 alla tua Agilità nelle prove","d":"Sai quali parole a bordo non si dicono, e sai muoverti senza svegliare nessuno."},{"n":"Sale","b":"+1 ai colpi di fortuna","d":"Sai salare e conservare, e dal sapore di un cibo capisci quanto è lontano il mare. Un pizzico sulla spalla, prima di partire, non si nega a nessuno."},{"n":"Nodi","b":"","d":"Una cima tiene quello che le mani non tengono. Conosci cinquanta nodi e sai quale tiene e quale scioglie."},{"n":"Stelle","b":"","d":"Leggi il cielo come una carta di bordo. Se un giorno il cielo mancasse, saresti il primo ad accorgertene."},{"n":"Calafataggio","b":"","d":"Trovi una falla dal rumore dell'acqua e la chiudi con stoppa e pece. E sai anche come si apre."},{"n":"Comando","b":"","d":"Sai parlare a un equipaggio: quando alzare la voce, quale ordine gli uomini vogliono sentirsi dare. Tuo padre lo ha fatto una volta sola."},{"n":"Canto di voga","b":"","d":"Conosci la cantilena che dà il tempo ai remi. Sei stonato, ma nessuno ha mai smesso di remare quando l'hai cantata tu."},{"n":"Cucitura della vela","b":"","d":"Ago di bronzo e guardamano di cuoio: sai ricucire una vela, e sai leggere una tela come si legge una lettera."},{"n":"Lingua dei porti","b":"","d":"Parli male sei lingue, riconosci un accento a una gomena di distanza, e sai le notizie di tutti i moli."},{"n":"Commiato di bordo","b":"","d":"A bordo un compagno non si lascia: si lava, si cuce nella vela, si dice il suo nome, si cala. Tu sai farlo, e sai farlo bene."}],"negozi":[{"f":"cartaceo","url":"https://www.amazon.it/dp/B0HRQTTTKN","dove":"Amazon.it"},{"f":"ebook","url":"https://intreccidicarta.com/libri/librigiochi.html#il-remo-sulla-spalla","dove":"intreccidicarta.com"}],"sito":"https://intreccidicarta.com/libri/librigiochi.html#il-remo-sulla-spalla","re":{"ab":"^🧠 Se hai (.+)$","itPos":"^🎒 (?:Se )?hai (.+)$","itNeg":"^🎒 Non ","fgPos":"^🚩 Se (.+)$","fgNeg":"^🚩 Se non (.+)$","fgPre":"^hai annotato ","vinci":"vinci","non":"non"},"ui":{"demo":"Demo giocabile","copAlt":"Copertina di {t}","copTesto":"Le prime pagine del librogioco, da giocare qui: leggi, scegli la strada, tira i dadi. Hai sei scelte.","gioca":"Gioca la demo","nuova":"Nuova partita","riprendi":"Riprendi dal §{n}","regoleTit":"Come si gioca","valoriTit":"I tuoi valori","valoriNota":"Li ha tirati il computer, come faresti tu con i dadi del libro.","forza":"Forza","resistenza":"Resistenza","agilita":"Agilità","fAbbr":"F","rAbbr":"R","aAbbr":"A","dotiNota":"Le strade segnate con 🧠 si aprono solo a chi ha quella dote.","dotiConta":"Doti scelte: {n} di 5","caso":"Scegli per me","comincia":"Comincia dal §1","scheda":"Scheda","doti":"Doti","zaino":"Zaino","vuoto":"vuoto","ricorda":"Il libro ricorda","chiudi":"Chiudi","daCapo":"Ricomincia la demo da capo","scelteTit":"Scelte fatte: {n} di {m}","usa":"usa (+{n})","usaOgg":"Usa {x} (+{n})","usato":"Usi {x}: +{n} Resistenza.","notaOgg":"🎒 Nello zaino: {x}","notaFg":"🚩 Il libro ricorda: {x}","notaHp":"❤️ {n} Resistenza","notaMeta":"❤️ Resistenza a metà","notaPerso":"🎒 Perdi: {x}","notaDote":"🧠 Perdi la dote: {x}","serveDote":"non hai questa dote","serveOgg":"non ce l'hai","serveFg":"non ti è successo","giaUsata":"l'hai già usata","vicolo":"Nessuna strada da qui.","tira":"tira i dadi","agiProva":"Prova di Agilità","fortProva":"Colpo di fortuna","agiSotto":"Due dadi: ce la fai con {s} o meno. Il 12 riesce sempre, il 2 fallisce sempre.","agiSopra":"Due dadi: ce la fai con 7 o più.","fortDett":"Due dadi: con 7 o più ti va bene.","fortBonus":"(+1 per la tua dote)","agiOk":"Ce la fai.","agiKo":"Non ce la fai.","fortOk":"Ti va bene.","fortKo":"Ti va male.","vaiA":"Vai al §{n}","tu":"Tu","attacca":"⚔️ Tira i dadi","roundRiga":"Tu {a}, {n} {b}:","colpisci":"colpisci, −2 al nemico.","colpito":"ti colpisce, −2 a te.","pari":"pari, nessuno si fa male.","dodici":"doppio sei, colpo a segno: −2 al nemico.","due":"doppio uno, colpo a vuoto: −2 a te.","lamaRiga":"Lama corta: ritiri il {x} e ti esce {y}.","corsaBonus":"(con {d} ti basta 6)","fissa":"{d} (di serie)","notaUsa":"🎒 Usi: {x}","vinto":"Hai vinto lo scontro.","perso":"Hai perso lo scontro.","zeroTit":"❤️ La tua Resistenza è arrivata a zero.","morteTit":"La tua storia finisce qui","morteRes":"La tua Resistenza è arrivata a zero.","morteNota":"Nella demo si ricomincia dal §1, con valori nuovi e le stesse doti.","ricomincia":"Ricomincia dal §1","fineSei":"Hai fatto le tue sei scelte.","fineFuori":"Questa strada porta oltre la demo.","fineTit":"La tua avventura continua nel libro","cartaceo":"Cartaceo","ebook":"Ebook","sito":"Tutti i librigiochi su intreccidicarta.com","rigioca":"Rigioca la demo","noscript":"Per giocare la demo serve JavaScript attivo nel browser.","descr":"Demo giocabile di {t}, librogioco di Peter Palmer: le prime pagine, da giocare nel browser.","titoloPagina":"{t} · Demo giocabile · Peter Palmer","scopri":"Scopri il libro"},"par":{"1":{"t":"Apri gli occhi.\n\nSabbia. Una sabbia grigia e fine come cenere, che ti si è infilata dappertutto: sotto le unghie, nelle pieghe del mantello, tra le ciglia. Sei steso a faccia in su, e sopra di te non c'è il cielo che conosci. C'è una volta scura e liscia, come l'interno di una conchiglia enorme, senza sole e senza stelle, e da qualche parte viene una luce di sera che non finisce.\n\nSei fradicio. Hai il sale sulle labbra, nei capelli, nelle pieghe delle mani. La destra stringe ancora il remo, così forte che per aprirla devi pensarci. Tre tacche e un'onda, sul girone: è il tuo. Un marinaio non lascia mai il suo remo, e tu non l'hai lasciato.\n\nTi tiri su e ti guardi intorno. Dell'Alcione non c'è niente: non un'asse, non una cima, non un compagno. Alle tue spalle c'è il mare, ma non fa rumore. Davanti, pioppi neri e salici che non si muovono, anche se sulla pelle senti un filo d'aria. Non riconosci questa costa. Nessuna delle coste che conosci ha una sabbia così.\n\nLungo la riva arriva un cane. Viene verso di te al trotto, sicuro, come se sapesse dove andare. È giovane e forte, alto al garrese, il pelo fulvo e lucido, le orecchie dritte, il passo di chi potrebbe correre fino a sera. È della stessa razza di Argo, il cane di tuo zio: i cani da caccia di Itaca, quelli che i vecchi dicono che non se ne vedono più. Ma Argo tu l'hai conosciuto vecchio, sul letame davanti al palazzo. Questo è nel pieno della sua gioventù.\n\nTi annusa la mano, a lungo. Poi ti si siede accanto, come se ti aspettasse da tanto.\n\nDove c'è un cane, pensi, c'è qualcuno: un pastore, un villaggio, una barca tirata in secca. Qualcuno che saprà dirti dove il mare ti ha buttato.\n\nIl cane si alza, fa qualche passo lungo la riva e si volta a guardarti.\n\nSe sai leggere le stelle, puoi provare a cercarle prima di muoverti, per capire almeno da che parte è il mare di casa.","it":"Il remo","dec":1,"img":0},"10":{"t":"L'Acheronte scorre nero, largo come un braccio di mare, e dall'altra parte non si vede niente: solo una nebbia bassa, e dentro la nebbia il profilo di un'altra riva. Lungo le sponde crescono canne alte più di un uomo, grigie, che non frusciano. L'aria sa di palude, di fango e di foglie lasciate a macerare, e sulla ghiaia l'acqua posa un orlo di schiuma giallastra che non se ne va.\n\nSulla riva di qua aspettano in tanti. Stanno seduti sulla ghiaia, in piedi a gruppi, sdraiati con la testa sulle braccia, e guardano l'acqua dalla stessa parte, da dove verrà la barca. C'è una donna con il velo da sposa ancora appuntato ai capelli, un vecchio che stringe un bastone da pastore, un ragazzo con la corazza allacciata storta. Nessuno parla con il vicino. Elpenore è in disparte, seduto con la mano sotto la mascella.\n\nIn mezzo alla folla c'è uno che parla più forte di tutti. Cammina a scatti tra quelli seduti, che ritirano i piedi quando passa. È l'uomo più brutto che tu abbia mai visto: le gambe storte, un piede zoppo, le spalle curve che gli si chiudono sul petto, la testa a punta con quattro capelli sopra. Tersite, lo chiamano, e lo dicono tutti con il tono che si usa per un mulo che scalcia. Sta indicando un vecchio con il mantello da capitano, seduto sulla ghiaia, che qualcuno chiama il capitano di Pilo. Il mantello è buono, orlato di una porpora che il tempo ha fatto rosa, e in grembo il vecchio tiene un berretto di feltro, che si rigira tra le mani come una barra di timone.\n\n«Guardatelo! Trent'anni senza uscire dal porto per paura del mare, e poi è annegato nel porto, cadendo dal molo!»\n\nIl vecchio apre la bocca per rispondere, ma uno alle spalle di Tersite gli cala una bastonata sulla schiena, con un rumore sordo di sacco battuto, e le risate coprono tutto. Tersite si massaggia la schiena, ride più forte degli altri e intanto si guarda intorno, in cerca di qualcun altro.\n\nTrova te.\n\n«Guardatelo! Il figlio di Euriloco, fradicio come un pulcino, col remo in spalla. Sei annegato, bello mio, come succede a chi sale su una nave con quel cognome!» dice Tersite, e ride finché quelli intorno non si voltano dall'altra parte.\n\nIl cognome. Al porto di Same te l'hanno sempre fatto pesare così, a mezza voce, alle spalle; lui lo grida in faccia, davanti a tutti. E fradicio lo sei davvero: il mare ti ha buttato a riva poco fa.\n\nSul fiume, lontano, compare una barca. Sulla riva la gente si alza tutta insieme, con un fruscio di vesti, e si stringe verso l'acqua. Tersite no. Resta dov'è e ti guarda ancora, con la testa di traverso: aspetta di vedere se avrai il coraggio di andare da lui.","dec":1,"img":1},"31":{"t":"La riva rientra di dieci passi, tra la battigia e le dune, e lì sta la pozza: rotonda e liscia, uno specchio di bronzo, e l'acqua dentro non si increspa nemmeno quando ci passi accanto. È più limpida del mare: sul fondo si vede la sabbia grigia pettinata in righe sottili, e nient'altro, né un pesce né un'alga. La volta di pietra ci si specchia tutta, e la pozza sembra più profonda della spiaggia intera.\n\nSdraiato sul bordo, a pancia in giù, c'è un ragazzo. È il più bello che tu abbia mai visto, e lo sa come si sa il proprio nome, senza vanità. Ha il mento sulle braccia incrociate e guarda il suo viso nell'acqua. Sotto i gomiti la sabbia ha due conche fonde, quelle che lascia una chiglia tirata in secco da anni. Porta la tunica corta dei cacciatori e i calzari allacciati fino al polpaccio; accanto a lui ci sono un arco con la corda allentata e una faretra piena di sabbia, che nessuno tocca da tanto.\n\n«Non fare ombra sull'acqua» dice, e non si volta. Tiene la voce bassa di chi ha vicino uno che dorme.\n\nTi sposti. Lui sorride al ragazzo della pozza, e il ragazzo della pozza gli sorride.\n\n«Lassù non sapevo chi ero» dice. «Mi cercavano in tanti, ninfe e ragazzi, e io non capivo che cosa volessero da me. Poi ho visto lui. Adesso lo so, e non mi serve altro.» Una pausa. «Tu chi sei?»\n\nGli dici il tuo nome, Same, la nave. Lui annuisce senza ascoltare, come alla pioggia.\n\n«Io sono Narciso. Lo dico all'acqua ogni tanto, perché non se lo scordi.» Con due dita, senza guardarti, ti indica il bordo accanto a sé: sono le dita che tirano la corda dell'arco, e il callo c'è ancora. «Affacciati, se vuoi. C'è posto. Basta che non muovi l'acqua.»\n\nDa qualche parte, dietro le dune, una voce di ragazza ripete le sue ultime parole, una alla volta, ogni volta più bassa: «...l'acqua. L'acqua.» Narciso non la sente, o non se ne cura.\n\nIl bordo della pozza, accanto a lui, è libero per quanto è lungo un uomo sdraiato, e la sabbia lì non ha un'impronta. Più in là luccicano le schiene delle foche.","dec":1},"42":{"t":"Lo prendi con la mano libera. Lo stelo è fresco e morbido tra le dita, un giunco appena colto, e il fiore pesa meno di una piuma. Lo porti verso la bocca.\n\nQuando lo stelo ti sfiora il mento, il profumo si fa così forte che copre tutto il resto: l'erba, la palude alle tue spalle, il frassino del remo. Pane caldo, fichi spaccati al sole, la lana di tua madre sul telaio. E sotto, il vicolo che ogni mattina facevi con le reti in spalla, dal mercato del pesce fino al molo: stretto tra le case basse, con il muro della cisterna e tre gradini consumati in fondo. Lo vedi tutto, pietra per pietra. Aveva un nome, e del nome ti resta la forma, corta, con una erre nel mezzo, come sulla sabbia resta l'impronta di una chiglia. Ma il nome non c'è. Ce l'avevi poco fa, pronto da dire, e adesso al suo posto c'è solo il profumo.\n\nIntorno a te i Lotofagi aspettano, contenti. Si sono messi in cerchio, a un passo, e una donna ha già fatto posto nell'erba accanto a sé: ci batte sopra il palmo, due volte, senza rumore. L'uomo che ti ha dato il fiore fa di sì con la testa, senza dire niente, e la ghirlanda nei suoi capelli non si muove.\n\nIl fiore è ancora lì, a un dito. Da così vicino il cuore scuro luccica, e i petali hanno il bianco della mollica. Anche le tre strade sono ancora lì, oltre il prato: il filo di fumo, la piana dei fiori bianchi, il crocicchio dove passa gente con le bestie.\n\n*Perdi 2 punti di Resistenza. Se arrivi a zero, vai al paragrafo della folla grigia.*","h":-2,"dec":1},"52":{"t":"I guerrieri dei carri ti sono addosso. Nello stretto tra i carri possono venirti davanti solo due alla volta, e i loro piedi fanno volare la polvere dei solchi, che crepita sugli scudi. Quando uno dei due arretra, ce n'è già un altro al suo posto. Combattono come combattevano sotto le mura di Ismaro: lance basse, scudi di cuoio a spingere, un passo e un colpo, un passo e un colpo. A ogni passo fanno tutti insieme un verso corto, di gola. Tu hai il remo, lungo quanto due uomini, e lo usi come a bordo si usa per tenere lontana una barca che accosta troppo: la pala contro uno scudo, una spinta di spalle, e indietro, prima che una punta arrivi alle mani.\n\nLe loro botte arrivano. Non lasciano segni: ogni colpo che ti prende si porta via un ricordo piccolo. Il nome del vicolo dietro la casa di tua madre. Il colore della vela della prima barca su cui sei salito.\n\nSono tanti, ma non sono invincibili: sono uomini, e gli uomini si stancano di prenderle. Alle loro spalle la pista continua verso il fiume.","e":"I guerrieri dei carri","ec":7,"ee":10},"55":{"t":"«Te lo porto io» dici. «Un remo per il tuo tumulo. Quando sarò tornato su, lo pianto io, a Eea o dovunque serva.»\n\nLo dici voltato a metà, con un piede ancora sulla ghiaia.\n\nElpenore alza gli occhi senza alzare la testa: la testa gliela regge il palmo. Non dice niente. Sulla riva, la gente che la barca non ha preso si è voltata ad ascoltare, e nessuno parla più: le canne stanno mute, e l'acqua nera passa lungo il fasciame senza un suono. Elpenore toglie la mano da sotto la mascella: per dire la cosa successiva gli serve la testa dritta.\n\n«Di frassino» dice. «Non deve essere bello. Deve stare dritto.» Con le mani misura l'aria davanti a sé, come si ordina un pezzo al carpentiere: lungo così, grosso così. Le dita gli tremano, e non smettono, ma la misura è quella giusta: sono mani che un remo l'hanno tenuto.\n\nAnnuisci. Lui ti fissa, serio: un impegno preso davanti a tutto l'equipaggio non si ritira più. Alle sue spalle la nebbia si apre tra le canne, su un palmo di fango lucido, e si richiude.\n\n«Ci conto» dice. «Ci conto, nipote del re.»\n\nRimette la mano sotto la mascella e torna a sedersi sulla ghiaia, al suo posto, con le spalle un poco più dritte di prima. I sassi scricchiolano sotto di lui. Quelli della riva tornano a guardare la barca.\n\nDietro di te Caronte sbuffa dal naso, come un cavallo, e batte il remo sul bordo una seconda volta. Il colpo corre sull'acqua e non torna indietro. Sul fondo della barca, dietro l'uomo con la corona di foglie, c'è ancora un posto, tra le assi nere di pece.\n\n*Annota sulla scheda: «hai promesso a Elpenore».*","f":"hai promesso a Elpenore"},"58":{"t":"Ti volti verso la fila dei marinai e alzi la voce come si fa a prua, quando il vento copre tutto.\n\n«Serrate! Tutti con me, spalla a spalla!»\n\nLa fila si ferma, e le teste si voltano. Nessuno di quegli uomini ti conosce, ma tutti conoscono quella voce: è quella che a bordo si usa una volta sola, quando non c'è tempo di spiegare. Venti marinai scalzi ti si stringono intorno, e alzano le mani a reggere remi che non hanno. Hanno i polpacci grossi e una spalla più alta dell'altra, quella del loro lato di voga. I piedi nudi battono la polvere tutti insieme, a tempo di voga, e sulla pista arriva l'odore di una nave: corda, pece, legno bagnato.\n\nI Ciconi esitano. Otto lance contro una ciurma sono poche. Le punte, che erano all'altezza del tuo petto, salgono di un palmo, poi di un altro. Il più alto fissa te, poi i marinai, poi di nuovo te, e non trova niente da dire. Nessuno ti chiede di chi sei figlio. Si fanno da parte tra i carri, uno alla volta, finché la pista è libera, e il cuoio dei loro scudi scricchiola quando se li rimettono in spalla. L'ultimo, passando, sputa nella polvere davanti ai tuoi piedi; intorno a te nessuno si muove.\n\nI marinai non se ne vanno. Restano lì, con le mani ancora alzate, in attesa del prossimo ordine, e tu non sai quale dare. Nessuno ti ha mai aspettato così. Uno ha sul palmo il callo lucido del remo, uguale al tuo; un altro ha gli occhi chiari di quelli di Zacinto. Un terzo tiene la testa un po' piegata, dalla parte da cui a bordo arrivano gli ordini. Nessuno dice il suo nome.\n\n«Al fiume» dici. La pista è sgombra, dritta tra i carri fin dove la polvere la chiude. I marinai aspettano che tu vada avanti."},"71":{"t":"Posi il remo sulla sabbia, sfili la cima dalla cintura senza fare rumore e ti inginocchi accanto al vecchio che dorme. È canapa buona, ancora dura di sale, e ti scorre tra le dita come sul molo di casa. Un giro intorno alle caviglie, che sono fredde, con una pelle che sfugge sotto la canapa; un giro intorno ai polsi; e un nodo che più chi è legato tira, più si stringe. Lo sai fare da quando avevi dieci anni, al buio, con le mani bagnate.\n\nIl vecchio si sveglia. Diventa leone, e il nodo tiene la zampa del leone, che raspa e scalcia e non si libera. Diventa serpente, e la cima segue le spire. Si fa pantera, albero, acqua: la cima si allarga e si stringe con lui, giro dopo giro, sale con il tronco, scende con l'acqua, e l'acqua resta dentro i suoi giri, pesce nella rete. La canapa non si lamenta e non cede. Tu resti seduto sulla sabbia con il capo della cima in mano, come chi tiene una barca all'ormeggio in una notte di vento: quando tira dai un palmo, quando molla te lo riprendi. Intorno le foche alzano la testa a ogni forma nuova, e la riabbassano.\n\nAlla fine il vecchio torna vecchio, bagnato e scontento, con le mani legate in grembo. È tutto gomiti e ginocchia, e sta seduto storto, dalla parte dove tira la cima. Dalla barba gli cola acqua di mare, e dove cade la sabbia si fa scura a macchie, larghe quanto i primi goccioloni di un temporale.\n\n«Menelao, almeno, mi teneva con le braccia» brontola. Voce di uno svegliato a metà sonno. Tende verso di te i polsi legati, perché tu veda bene il nodo, e fa una smorfia di mestiere: è un buon nodo, e lo sa. «Voi di Itaca non avete rispetto per niente. Chiedi, allora. Una domanda sola.»\n\nDue domande ti premono sulla lingua, quella della strada e quella della colpa, e il vecchio ne vuole una.","dec":1},"74":{"t":"Non dici niente. Nemmeno no.\n\nTi metti a sedere sulla radice libera, il remo di traverso sulle ginocchia, e tieni gli occhi sulle vecchie, fermo come il mare quando non c'è vento. Loro chiedono. Chiedono con garbo, poi con impazienza, poi con la voce che si usa con i bambini testardi. La più vecchia ripete la domanda uguale, staccando le parole; quella del fuso se lo sfila dalla cintura e se lo rigira tra le dita, vuoto. I mozzi ti fanno le smorfie, e uno ti tira una ghianda, che rimbalza sul remo e si perde tra le radici.\n\nTu taci. Non stringi la bocca, non scuoti la testa; le mani restano sul remo, dove le avevi messe. A bordo ci sono parole che non si dicono, e c'è un modo di tacere che non lascia appigli: non è un rifiuto, perché un rifiuto è già una risposta. È niente, e sul niente non si costruisce nemmeno una storia.\n\nSenza le tue parole, il bosco si riempie di rumori piccoli: gli astragali dei mozzi che riprendono a battere sulla radice, una nutrice che tamburella con le dita sul ginocchio, un tronco che scricchiola, fasciame di nave che si assesta nella notte. Sopra la tua testa le foglie non si muovono, anche quelle secche, e l'odore di corteccia bagnata si fa più forte. La radice sotto di te è fredda, e il muschio cede sotto il palmo e torna su da solo.\n\nDopo un poco la nutrice più vecchia sospira e si rimette le mani in grembo. «Questo non sa niente» dice alle altre. «Oppure sa troppo.» I mozzi tornano ai loro giochi, e nessuno ti guarda più.\n\nTi alzi, con il remo in spalla. Il bosco si apre davanti a te, un tronco dopo l'altro, e in fondo si sente scorrere un fiume. Il ronzio di mosche, lontano, ricomincia, e smette."},"76":{"t":"Gli indichi lo strappo con un cenno. Elpenore esita, poi si sfila il mantello con una mano sola, facendolo passare sopra la testa che l'altra regge, e lo posa a terra, tra voi due. È lana grezza, pesante, grigia di sabbia nelle pieghe, e ha ancora addosso l'odore di un altro posto: fumo di legna, vino versato, il fieno di una stalla. Senza mantello lui ha le spalle strette, e la tunica gli sta larga sul collo.\n\nL'ago ce l'hai alla cintura, dove sta sempre, infilato in un pezzo di cuoio insieme al filo cerato e al guardamano. È bagnato anche quello, ma la cera non teme l'acqua. Ti tiri la lana sulle ginocchia e cerchi i due capi. Lo strappo parte dalla spalla e scende fino al fianco, dove la stoffa ha toccato terra per prima, e lungo l'orlo è rimasta una polvere rossa, di tegole. I lembi sono sfilacciati e non combaciano più: li accosti con le dita, un palmo alla volta. Fai i punti piccoli e fitti, quelli che non si disfano con il vento. L'ago entra nella lana con un fruscio minuto, esce, rientra, e sulla spiaggia muta è l'unico rumore. Intanto lui parla.\n\n«Avevamo bevuto il vino di Circe tutta la notte. Sul tetto c'era fresco, e io salii. La mattina sentii le voci dei compagni che partivano e scesi dalla parte più corta.» Ride, e il riso gli fa ballare la testa sul collo storto. «Non c'è niente da vergognarsi. Sono caduto da solo. È l'unica cosa che ho fatto tutta da solo, in vita mia.»\n\nTagli il filo con i denti, come l'ultima sera tua madre con il tuo mantello. Elpenore passa il pollice sulla cucitura, avanti e indietro, come si controlla una commessura appena calafatata. Si rimette il mantello, sempre con una mano, e d'un tratto sta più dritto nelle spalle, un marinaio a cui hanno rimesso in ordine la vela.\n\n«Adesso ascolta» dice, e ti mostra le strade con il mento, perché con la mano si regge la testa. «Lungo la riva arrivi dove stanno le foche, e un vecchio che non vuole essere disturbato. Nel bosco dei pioppi ci sono le vecchie nutrici, che chiedono storie a chi passa. La pista dei carri è la più dritta, ma ci passa gente che non ama quelli di Itaca. Tutte e tre portano al fiume. Io ci vado per la mia, e ti aspetto là.»\n\nSeguendo il suo mento vedi la riva che corre bassa finché l'occhio la perde, e tra le dune due solchi appaiati che se ne vanno dritti. Dietro le dune i pioppi neri fanno un muro scuro, immobile. Da quella parte, se tendi l'orecchio, ti pare di sentire l'acqua di un fiume, lenta, sotto il silenzio del mare.","dec":1},"93":{"t":"Le due sono qui.\n\nAdesso hanno una forma: due vecchie alte e curve, fatte dello stesso buio che c'è tra i tronchi, con mani lunghe e bocche che si aprono senza fare rumore. Anche curve ti superano di una testa. Dove passano, le foglie dei salici non si muovono. Una viene avanti con un passo pesante, che si sente sul muschio dove il tuo non si sente; l'altra non fa nessun rumore, e ogni volta la ritrovi più vicina di dove l'avevi lasciata. Intorno a loro c'è l'aria di una stanza dove hanno soffiato sulla lucerna. Da qualche parte tra i pioppi i mozzi strillano i loro nomi, tutti e due, come si canta la fine di una filastrocca: «Mormo! Gello!» Sono le due della storia, le due della notte, e sono grandi esattamente quanto la paura che ne hai.\n\nAlzi il remo e colpisci. Il remo passa dentro il buio, e il buio si richiude più alto di prima. Nelle mani non ti torna niente. Ogni colpo le fa crescere, perché colpirle vuol dire averne paura, e la paura è tutto quello di cui sono fatte. Se anche le butti giù, si rialzano intere un passo più in là. Al terzo colpo la più vicina arriva con la testa ai primi rami di un pioppo, e i rami le passano attraverso senza piegarsi. Quando una di quelle mani ti sfiora, sulla pelle non senti niente: ti scivola via dalla testa una cosa piccola, il nome della strada che scende al porto di Same, il colore della porta di casa.\n\nIl cane ringhia contro il buio, basso, senza avvicinarsi.\n\nNon puoi batterle. Puoi solo andartene, e più resti, più ti costa. Dietro di te, in fondo ai tronchi, si sente il fiume.\n\n*Prima che tu riesca a voltarti, una di quelle mani lunghe ti arriva addosso: perdi 2 punti di Resistenza. Se arrivi a zero, vai al paragrafo della folla grigia.*\n\n*Se scappi, perdi 2 punti di Resistenza e vai al §10. Se arrivi a zero, vai al paragrafo della folla grigia.*","h":-2,"dec":1},"99":{"t":"Non lo prendi subito. Sciogli il laccio del sacchetto che porti alla cintura, quello del sale per il pesce e per le partenze, e te ne metti un pizzico sulle labbra. Così faceva il vecchio salatore del porto, quando voleva sapere da dove veniva un pesce senza doverlo aprire: il sale sulla bocca, il naso sulle branchie, e diceva il nome di una cala.\n\nL'uomo aspetta con il fiore teso.\n\nIl sale è il tuo, a grani grossi, e punge: salina e scoglio. Con quel sapore sulla bocca annusi il fiore che l'uomo ti tiene davanti.\n\nEd è strano. Il profumo c'è ancora, ma accanto al sale non sa di niente. Il pane, i fichi, la lana di tua madre: erano tuoi, e il fiore te li ha solo restituiti. Sotto non c'è niente di suo. Ogni fiore che cresce vicino al mare ha un filo di sale tra i petali, anche il cappero sui muri di casa. Questo no. Questo il mare non l'ha mai sentito, nemmeno da lontano.\n\nPrendi il fiore con due dita e lo posi nell'erba, come si posa una cosa che non è tua. L'erba è così fitta che lo stelo non arriva a terra: resta lì sopra, coricato sui fili.\n\nL'uomo non si offende. Sorride come prima, e anche gli altri sorridono, gentili, e tornano a sedersi nell'erba, uno alla volta, dove stavano. «Un'altra volta» dice soltanto. Nessuno ti trattiene.\n\nIl sale ti resta sulle labbra, ruvido, mentre ti volti verso il fondo del prato. Le tre strade sono dove le hai lasciate: il filo di fumo che sale dritto verso quella che forse è una capanna, la piana grigia con i suoi fiori bianchi e le mandrie, e il crocicchio, dove passa ancora gente con le bestie.","dec":1},"119":{"t":"Il verde del prato resta indietro, e sotto i piedi l'erba diventa terra battuta. Il sentiero porta a un crocicchio, un posto dove tre strade si incontrano e nessuna ha voglia di cominciare. La terra è polverosa, segnata da solchi di ruote che non passano più, e sul ciglio c'è un cippo di pietra con tre facce di donna, consumate dal vento, rivolte ognuna verso una strada. Poco prima, accanto al sentiero, c'è un pino nero e storto, con la corteccia che trasuda resina.\n\nSotto il pino siede un vecchio a gambe incrociate. Intreccia una fune di giunchi, lunga, bella, fatta bene, e la fune gli esce dalle mani e cade a terra alle sue spalle. Le dita fanno da sole: tre giunchi, un giro, una stretta, e avanti di un altro palmo, senza che lui abbassi la testa. L'intreccio è pari, niente sporge: al porto di Same un cordaio con quelle mani avrebbe la fila davanti alla bottega. I giunchi freschi, ammucchiati accanto a lui, hanno un odore verde di acqua di fosso.\n\nDietro di lui c'è un'asina grigia, con il muso bianco e gli occhi pazienti. Non è legata. L'asina prende la fune con i denti e se la mangia, masticando, man mano che lui la fa. Tra il vecchio e la bocca dell'asina ci sono dieci braccia di fune, stese nella polvere: non diventano mai undici. Si sente il rumore dei giunchi tra i denti, un crocchiare soddisfatto.\n\nIl vecchio lo sa. Si volta, la guarda, e sorride: un sorriso vero, di quelli che non chiedono niente.\n\n«Ocno» si presenta, senza fermare le dita. «Faccio funi. Lei le mangia. Andiamo avanti così da quando c'era ancora il sole.»\n\nLungo una delle strade, lontano, qualcuno impreca, e un rumore di bronzo sui sassi, clac e clac, si allontana saltellando. Ocno ride forte. «Quella lì, con la gamba storta? Non ti preoccupare. La mia asina la scaccia a ragli.»\n\nUna fune così, se l'asina non se la mangiasse, farebbe comodo a chiunque. Se sai fare i nodi, potresti mostrargli un nodo che non conosce: tra gente del mestiere è un regalo. Se sai calafatare, su quel pino c'è resina quanta ne vuoi, e un giunco impeciato non sa più di niente. Puoi anche provare a distrarre l'asina: sul bordo della strada crescono ciuffi di asfodeli, e lei di giunchi ne mangia da un pezzo. Altrimenti lo saluti, e il crocicchio è lì, a pochi passi.","dec":1,"img":2},"145":{"t":"A metà del pendio l'erba verde del prato finisce di netto: da lì in giù ci sono solo fiori.\n\nLa piana è più grande di qualunque cosa tu abbia mai visto da terra. Gli asfodeli arrivano alle ginocchia, bianchi e fitti, con i fiori a stella in cima a steli dritti, e non finiscono mai. Cerchi un punto su cui prendere la rotta, un albero, un tetto, e non lo trovi. I fiori hanno un odore strano, amaro in fondo e dolciastro in cima, come un mazzo rimasto un giorno di troppo nel vaso. Sotto le corolle l'erba è secca e scricchiola a ogni passo. Sopra, il cielo è di pietra.\n\nIn mezzo pascolano mandrie di vacche nere che non muggiscono. Brucano gli asfodeli fino alla radice, e non ingrassano: sotto il pelo le anche fanno due punte. Di loro si sente solo lo strappo degli steli tra i denti.\n\nLa piana è tagliata da un'acqua scura, larga quanto una strada. Gli asfodeli si fermano a un passo dalla riva, e sulla terra nuda restano i buchi degli zoccoli. Accanto al guado, appoggiato a un bastone da pastore, c'è un bovaro con la faccia di cuoio e un fianco che tiene storto, come chi porta ancora nelle costole una stretta di tanti anni fa, e non ha mai perdonato chi gliel'ha data. Ha un mantello di pelle di vacca con il pelo di fuori, e alla cintura un corno per chiamare le bestie. Le mani, una sopra l'altra in cima al bastone, sono larghe e piene di nodi, e non si muovono quando arrivi.\n\n«Un altro» dice, senza salutare, e sputa nell'acqua. Lo sputo resta a galla. «L'ultimo che è sceso con quell'aria mi ha preso la vacca migliore e mi ha stretto le costole finché la regina non gli ha detto di smettere. Un eroe. Io sono Menete, e le mandrie della piana degli Asfodeli le guardo io, da secoli. Gli eroi li conosco.»\n\nTi squadra il remo, poi di nuovo te, con lo sguardo di chi conta le bestie da lontano. «Chi sei? E che cosa vuoi dalle mie bestie?»\n\nIl cane annusa l'acqua del guado e si tira indietro, con le orecchie basse. L'acqua è ferma e nera, e il fondo non si vede: non un sasso che affiori, non un'increspatura a dire dove si tocca. Nemmeno le vacche ci bevono: stanno sulla riva, con il muso appena sopra la superficie.\n\nMenete aspetta la risposta, e intanto sputa un'altra volta. Potresti dirgli chi sei con tutto il nome di famiglia, che di solito apre le porte. Oppure la verità più semplice: che quell'acqua ti fa paura. E se sai usare lo scandaglio, potresti calare il piombo e misurare il guado prima ancora di rispondere.","dec":1},"146":{"t":"La riva di Oceano corre lunga e bassa, e il mare accanto a te non fa rumore nemmeno dove si rompe: l'onda arriva, si stende, si ritira, e lascia una riga scura che si asciuga prima che tu l'abbia oltrepassata. Cammini sull'orlo, dove la sabbia è soda, e l'unico suono è il tuo passo. Sulla battigia ci sono ciuffi di alghe secche, che si sbriciolano sotto il piede. Dall'altra parte le dune salgono basse, color cenere, e chiudono la vista.\n\nSu uno scoglio basso, orlato di sale secco, siede una giovane donna. Ha i capelli bagnati incollati alla schiena e, sulle spalle, qualche piuma di un azzurro così acceso che è l'unico colore della spiaggia. Tiene le braccia intorno alle ginocchia e lo sguardo su un punto dell'orizzonte, come chi aspetta una vela su una rotta conosciuta. Ha i piedi nudi, e le dita stringono il bordo dello scoglio. Accanto a lei, sulla pietra, c'è una fila di conchiglie vuote, messe in ordine dalla più grande alla più piccola: un conto di giorni.\n\nArrivi sotto di lei.\n\n«Com'era la tua nave?» chiede, senza voltarsi.\n\nGlielo dici: una nave da carico di Same, con il sale di Leucade nella stiva. Si chiamava Alcione.\n\nAllora si volta: la testa sola, di scatto, e le spalle restano verso il mare. Ha gli occhi scuri e rotondi, quasi senza bianco, da uccello di mare. «Alcione sono io. Il mare si prese mio marito, e io mi buttai dietro di lui. Gli dèi ci fecero uccelli, e per me fermano i venti sette giorni ogni inverno. Quella che vola è lassù. Qui c'è la parte di me che annegò.» Quando parla del marito la voce le si abbassa, e le piume sulle spalle si sollevano un poco, senza vento, e tornano giù. Si rigira verso il mare. «Una nave con il mio nome non doveva affondare.»\n\nTi dice che quaggiù il mare ripete nel sonno le cose che ha visto. Con il braccio teso indica lungo la riva. «Sulla riva delle foche c'è ancora il vecchio che Menelao tenne senza mollare mai. Cambia forma per farsi lasciare. Chi lo tiene fino in fondo ha diritto a una domanda. Se ci vai, non mollarlo, qualunque cosa diventi.»\n\nPiù avanti, dove la riva fa una pozza, un ragazzo è sdraiato a pancia in giù e guarda l'acqua. Oltre, luccicano le schiene delle foche.\n\nSe conosci l'usanza del sale, potresti farle il gesto che a Same si fa a chi parte: un pizzico sulla spalla.","dec":1},"158":{"t":"Prima di rispondere sciogli dalla cintura il piombo e la sagola. Spalmi un dito di sego nel cavo: a bordo serve a portare su un assaggio del fondo. Ti accosti all'orlo, con il remo nell'incavo del gomito, e cali il piombo nel guado.\n\nLa sagola scende e ti scorre tra le dita, umida e ruvida. Conti i nodi che passano sotto il pollice: tre braccia, quattro. Troppo, per un guado. L'acqua non fa cerchi intorno al filo: lo inghiotte e basta. Il piombo tocca senza un colpo, su un fondo molle, e la sagola ti si allenta in mano. Tiri su, e sgocciola un'acqua nera che non luccica. Nel sego c'è un fango scuro e fine, che odora di foglie marcite e di ferro vecchio, e in mezzo al fango un granello lucente e duro, grosso come una lenticchia.\n\nMenete ha smesso di sputare. Ti fissa le mani, e la faccia di cuoio gli si allenta di una piega.\n\n«Tu misuri prima di entrare» dice. «Gli eroi entrano e basta, e poi l'acqua è colpa mia.» Stacca il granello dal sego con l'unghia, con il gesto di chi leva un sasso da uno zoccolo, lo prende e lo rigira tra due dita. «Bronzo. Vieni, ti faccio vedere.»\n\nRaccogli la sagola a spire sul palmo, la riappendi alla cintura e gli vai dietro.\n\nSul sentiero, tra le orme delle vacche, ci sono altre gocce uguali, rapprese e dure, in fila, a un passo lungo l'una dall'altra. Metallo colato e lasciato raffreddare. Gli asfodeli intorno sono piegati tutti dalla stessa parte, come se qualcuno di molto pesante ci fosse passato accanto, più di una volta.\n\n«Di qui passa uno tutto di bronzo. Fa il giro della piana grande, di là dal fiume, come lo faceva intorno alla sua isola. E perde. Guarda dove cadono: sempre accanto al calcagno, mai dalla parte delle dita. Una bestia che zoppica perde da una zampa sola.»\n\nTi porta più a valle, lontano dal sentiero grande, dove il fiume si allarga su un letto di ghiaia chiara e l'acqua arriva appena alle caviglie: qui il fondo si vede, sasso per sasso. Le vacche ci passano in fila, una dietro l'altra, senza alzare la testa, e i ciottoli che rotolano sotto gli zoccoli sono il solo rumore del guado. «Questo è il guado basso. Di qui la caccia non passa. Dall'altra parte ci sono le case delle donne di Itaca: tu parli come loro.»\n\nAlza il bastone verso l'altra riva e torna dalle sue vacche.\n\n*Annota sulla scheda: «hai visto le gocce di bronzo».*","f":"hai visto le gocce di bronzo"},"164":{"t":"Il bosco comincia dove finisce la sabbia: pioppi neri alti e dritti, salici con i rami fino a terra, e sotto un buio verde che odora di corteccia bagnata e di acqua ferma. I tronchi stanno a tre braccia l'uno dall'altro, senza un cespuglio in mezzo, e quando ne tocchi uno è freddo e ti lascia sulle dita una riga nera. Le foglie non si muovono e non cadono: anche quelle secche restano attaccate ai rami, accartocciate, e per terra non ce n'è una.\n\nDa lontano, oltre i tronchi, arriva un ronzio, come di mosche azzurre intorno a un avanzo lasciato al sole. Poi smette.\n\nIn una radura, sedute sulle radici, ci sono delle vecchie con le mani in grembo e i capelli raccolti come le nutrici delle case buone. Un salice lascia pendere i rami fin quasi sulle loro spalle, e per loro è il tetto di casa. Hanno vesti di lana scura, rammendate con cura, e una porta ancora un fuso infilato nella cintura, senza filo. Le mani sono larghe, dalle nocche grosse, e le facce sbiadite, del colore della lana lavata troppe volte. Intorno a loro, accovacciati per terra, una decina di ragazzini in tunica da mozzo si danno di gomito. Hanno le ginocchia sporche di terra, e uno tiene per un capo un pezzo di cima sfilacciata, e ogni tanto le dà uno strattone, per vederla strisciare. Due giocano agli astragali, e gli ossicini battono sulla radice con un ticchettio secco, l'unico rumore della radura.\n\n«Uno nuovo!» strilla un mozzo. «Fagliela raccontare!»\n\nLa vecchia più vecchia ti fa segno di avvicinarti, con due dita, senza alzare la mano dal grembo. Ha la faccia piccola, tutta pieghe, e la voce bassa e un po' roca, da ninna nanna cantata mille volte. «La storia delle due» dice. «Quella che si racconta a chi non vuole dormire. Noi l'abbiamo detta tante volte che non fa più paura a nessuno. Raccontala tu, che sei nuovo. Di' tu i loro nomi.» Si sporge dalla radice e abbassa la voce: «Una volta sola, però. Se le chiami due volte, vengono.»\n\nI mozzi tacciono e ti fissano con la bocca aperta; un astragalo resta in un pugno chiuso. Le vecchie aspettano. Davanti a loro c'è una radice libera, larga quanto un banco di voga; alle loro spalle il bosco continua.\n\nSe sai quali parole a bordo non si dicono, sai anche che a certe domande non si risponde nemmeno di no: potresti restare zitto, semplicemente, finché si stancano di chiedere.","dec":1,"img":3},"169":{"t":"«Mormo!» gridi verso il buio. «Gello! Andate via!»\n\nLe vecchie si coprono la bocca con le mani. Il mozzo che te l'aveva consigliato non ride più, e nella radura si spegne anche il ticchettio degli astragali.\n\nLe due vengono. Non corrono: sono già qui, perché chiamate due volte non hanno bisogno di fare la strada. Si chinano su di te, curiose come bambine davanti a un regalo, e prendono il tuo nome al posto del loro. Non fa male. Te lo sfilano adagio, come si sfila un anello da un dito bagnato, e per ultima se ne va la voce di tua madre che lo diceva.\n\nIl cane ti annusa la mano, a lungo. Si volta e se ne va tra i pioppi.\n\nDa quel momento la storia sei tu. Le nutrici di Itaca ti raccontano la sera, a bassa voce, per far stare zitti i bambini che non vogliono dormire, e nessuno sa più che una volta eri qualcuno con un nome.\n\n*Hai dimenticato il tuo nome. Sei un'ombra senza nome, una della folla grigia. La tua storia finisce qui. Anfialo ti aspetta sulla spiaggia, al paragrafo 1.*"},"171":{"t":"Per ora non gli chiedi niente. Avvicini lo sgabello alla fiamma, il remo di traverso sulle ginocchia, e resti a fissare il fuoco.\n\nÈ un bel fuoco, un fuoco da guardia di notte, fatto per durare. La quercia brucia con una fiamma bassa e gialla, e ogni tanto un nodo del legno scoppia e manda su una manciata di scintille che si spengono contro le travi nere. Sopra le braci l'aria trema, e la luce si muove sul frassino del remo, dall'impugnatura alla pala. Eumeo prende un ramo di lentisco grosso un pollice e lo spezza sul ginocchio, al primo colpo: ha le mani grandi. Lo getta dentro, senza fretta. «Lentisco» dice. «Come le siepi di casa vostra.» Le foglie si arricciano una per una, la corteccia sfrigola e schiuma in punta, e la capanna si riempie di un odore resinoso e verde.\n\nDalla porta si vede un pezzo di pendio, bianco di fiori. Di là non viene un passo né una voce: c'è solo il legno che brucia.\n\nSalendo il sentiero avevi una domanda pronta, la prima che volevi fargli. Adesso la cerchi, e non c'è. Sai che riguardava casa: è una parola sulla punta della lingua, che se la insegui si allontana. Restano le altre, la strada e tuo padre. Ma accanto a questa fiamma anche quelle sembrano poter aspettare.\n\nIl cane si alza da dove si era accucciato, ai tuoi piedi, e va a sedersi sulla soglia. Si mette con il muso verso il sentiero, le orecchie dritte, e da lì non si muove.\n\nDall'altra parte del fuoco Eumeo sorride alla fiamma, contento di avere un ospite che non ha fretta. Il frassino ti pesa sulle gambe: per alzarti basta puntarlo a terra.\n\n*Perdi 2 punti di Resistenza. Se arrivi a zero, vai al paragrafo della folla grigia.*","h":-2},"172":{"t":"I tre giri ti si sciolgono dal braccio tutti insieme. Il serpente si accorcia di colpo, si gonfia, mette zampe. Stringi una pantera dal pelo giallo, macchiato di rosette nere, lunga e tesa: un arco incordato. Dal muso alla radice della coda è lunga quanto te. L'hai presa da dietro, sotto le zampe davanti, e la tieni contro il petto; la coda ti frusta i polpacci. Il pelo è corto e liscio sotto le dita, e sotto il pelo i muscoli corrono come topi in un sacco. È meno forte del leone e molto più svelta: si torce a destra, a sinistra, di nuovo a destra, e cerca con gli artigli la sabbia, poi l'orlo del tuo mantello, e le unghie ci grattano sopra a colpi di lima. Sono chiare, ricurve, lunghe mezzo dito. La lana tiene.\n\nSoffia, a denti scoperti, e nell'aria resta un dolce di fichi troppo maturi. Ha gli occhi gialli, e non guarda te ma il mare, dove vuole tornare. In fondo alla riva una foca rimasta indietro ha alzato la testa e vi fissa, immobile: una vecchia affacciata alla porta.\n\nLa pantera punta le zampe di dietro contro le tue cosce, si allunga, guadagna un palmo. La riprendi. Ne strappa un altro dall'altra parte.\n\nTi accorgi che la presa ti scivola lo stesso, poco alla volta, come una cima bagnata. E ogni volta che lui cambia pelle ricominci da capo, con una bestia nuova e le mani di prima. Forse è così che lo si molla: non di colpo, ma una forma alla volta."},"173":{"t":"Il cane ti precede sul bagnasciuga. Dopo un tratto si siede, e vedi perché.\n\nSu un tronco sbiancato dal sale, mezzo sepolto nella sabbia, c'è un ragazzo poco più grande di te. Si regge la testa storta con una mano sotto la mascella e trema appena, senza smettere mai. È scalzo, la cintura slacciata, il mantello strappato dalla spalla al fianco.\n\nTi fa posto sul tronco, come tra gente dello stesso banco, e gli dici chi sei.\n\n«Elpenore» dice lui. «Della nave di tuo zio. Il più giovane.» Guarda il cane. «È della razza dei cani di Laerte. Se segue te, sei di casa.»\n\nA Eea, ti racconta, bevve troppo e salì a dormire sul tetto di Circe; al mattino sentì i compagni partire, scese dalla parte più corta e si ruppe il collo. «Non ho nessuno da incolpare: sono caduto da solo. Sulla propria morte, qui, nessuno sa mentire. Sul resto sì.» Tuo zio tornò a seppellirlo, con il remo piantato sul tumulo. «In fretta, però. Il mio nome, con la formula di bordo, nessuno lo disse. E il remo se l'è preso il mare.»\n\nEea, il tetto, il collo rotto: più di dieci anni fa. Allora questa costa che non riconoscevi è la riva dei morti.\n\n«Che si dice a Itaca?» Gli racconti che Laerte zappa ancora l'orto, e lui ascolta a occhi chiusi. «Qui si paga così, in notizie di sopra. Tu ne hai più di tutti.»\n\nFai per posargli una mano sulla spalla. Lui si scosta, piano, senza offesa.\n\n«Io c'ero, quando tuo zio ci provò con sua madre, tua nonna. Tre volte. Le braccia le passavano attraverso come nel fumo. Le botte no: quelle arrivano.» Lo dice come un pilota indica il fondale di un porto: vale per chiunque ci entri. «Ma non lasciano lividi: ti portano via qualcosa, il nome di una strada, un colore. Il tuo nome tienilo stretto: qui è il nome che dà la forma, e chi lo perde diventa folla. E non prendere da noi niente da mangiare né da bere: chi mangia con i morti resta con i morti.»\n\nAbbassa la voce. «Tuo zio arrivò qui vivo, a interrogare l'indovino, e ripartì di corsa: temeva che la regina gli mandasse contro la testa della Gorgone. Dicono che la tenga sotto un velo.»\n\nIl mare ti ha buttato dove arrivò lo zio, pensi. Lui ci venne con una nave, tu con un remo solo. Ma da qui lui se n'è andato.\n\nSi alza, reggendosi la testa. «All'Acheronte si arriva per tre strade: la riva delle foche, il bosco dei pioppi neri, la pista dei carri. Io vado per la mia. Ci ritroviamo sulla riva.»\n\nSe sai fare il commiato di bordo, potresti dirgli il suo nome con la formula; se sai cucire una vela, chiudergli lo strappo del mantello con l'ago che porti alla cintura.","dec":1,"img":4},"174":{"t":"La scrofa piega le zampe e si accascia su un fianco, senza più soffiare. La riva dello sbarco resta alle tue spalle. Da davanti arriva un rumore di passi rapidissimi, e fai in tempo a scansarti: sono donne dalle vesti rosse, con i denti bianchi scoperti, e corrono verso lo scoglio dove la barca sta scaricando altra gente. Ti passano accanto senza voltarsi, una, tre, sette, con i piedi che toccano appena la sabbia, e spariscono verso il fiume.\n\nOltre la riva comincia un prato. La rena nera finisce di colpo, e dopo c'è l'unica cosa verde che hai visto quaggiù: un'erba tenera e bassa, così fitta che i tuoi passi non fanno rumore. Ci passa sopra un'aria dolce, che sa di fieno tagliato di fresco. Nell'erba siedono uomini e donne che sorridono. Hanno vesti leggere, da festa d'estate, ghirlande intrecciate nei capelli, e nessuno ha niente in mano: né un attrezzo, né un bastone, né una borsa. Si alzano quando ti vedono, tutti insieme, e ti vengono incontro con il passo lento di chi non ha nessun posto dove andare. Poco più in là qualcuno ha lasciato una nassa da pesca mezza disfatta, e dentro ci sono cresciuti i fiori.\n\n«Le Chere» dice uno di loro, e indica con il mento la strada da cui sono venute le donne rosse. «Corrono sempre. Qui nessuno corre.» Ride a mezza bocca. «Noi siamo i Lotofagi. Mangiamo il loto, e non ci manca niente.»\n\nSono le persone più gentili che tu abbia mai incontrato. L'uomo che ha parlato ti porge un fiore. Ha i palmi bianchi e molli: da molto tempo non stringono una cima né una zappa. Il fiore è bianco e giallo, con il cuore scuro, e profuma di casa: di pane appena sfornato, di fichi al sole, della lana di tua madre, di quello che vuoi tu. Il profumo ti arriva prima del fiore, e si stende sopra l'odore di palude del fiume come un telo pulito messo ad asciugare.\n\nNon hai fame. Ma il fiore è così bello.\n\n«Resta» dice l'uomo. «Non ti farà male. Non dovrai più partire.»\n\nHai ancora nelle orecchie la voce di Elpenore sul tronco, con la mano sotto la mascella: chi mangia con i morti resta con i morti. Ma questa gente sorride come si sorride a casa, e il fiore è lì, a un palmo dalla tua bocca.\n\nSe sai salare, potresti capire da dove viene questo fiore senza nemmeno assaggiarlo: un pizzico del tuo sale sulle labbra, e il profumo ti direbbe quanto è lontano il mare.\n\nDal prato si vedono tre strade. Una sale verso un filo di fumo, dove forse c'è una capanna. Una scende in una piana coperta di fiori bianchi fino all'orizzonte, dove pascolano mandrie. La terza va verso un crocicchio, dove passa gente con le bestie.","dec":1,"img":5},"201":{"t":"«Tua madre?» Eumeo ride, e la fiamma si alza con lui. «Tua madre era un flagello.»\n\nTi racconta del fico dietro la casa di Laerte, quello con il ramo storto che passa sopra il muro, e con l'avambraccio te lo disegna sopra il fuoco. Ctimene ci saliva quando i fichi erano ancora verdi e duri, se ne riempiva il grembiule e li mangiava acerbi, con le dita bianche di latte che poi le restavano appiccicose per tutto il giorno. D'estate, sotto quel fico, l'aria sapeva di foglie calde e di resina dolce, e le vespe ronzavano sui frutti spaccati. Il vecchio Laerte trovava i rami spogli e se la prendeva con il ragazzo dei porci, perché un ragazzo dei porci è sempre il primo sospettato.\n\n«E lei usciva da dietro il muro, piccola così, con le mani ancora appiccicose e le ginocchia sbucciate, e diceva: sono stata io. Ogni volta. Si faceva sgridare al posto mio.» La mano piatta gli è rimasta a mezz'aria, all'altezza della tavola. La abbassa, scuote la testa, e un filo di cenere gli scivola dalla spalla. «Una figlia di re, che si prendeva le sgridate di un porcaro.»\n\nNella capanna il fumo sale dritto e si perde tra le frasche del tetto. Dal recinto vuoto non arriva un grugnito. Si sente solo la quercia che lavora nella brace.\n\nEumeo si alza, fruga in una cesta appesa alla trave e torna con un fagotto avvolto in una foglia di fico: una focaccia piatta e dura, con un buco in mezzo, che sa di farina d'orzo e di cenere.\n\n«Questa è la focaccia per il cane della porta. Quella che si mette in mano a chi fa un viaggio lungo, per il cane grosso che sta di guardia. Non si sa mai.» Te la porge, e aspetta che tu la leghi alla cintura. La prendi: attraverso la foglia senti sotto le dita il buco in mezzo e i grani d'orzo della crosta. La leghi, e lui annuisce. «La padrona vecchia sta più giù, con le donne di Itaca. Tua nonna. Tesse ancora. Va' a trovarla.»\n\n*Annota sulla scheda: «conosci Ctimene bambina».*","it":"Focaccia per il cane della porta","f":"conosci Ctimene bambina"},"202":{"t":"La barca arriva senza rumore di remi, anche se i remi ci sono. Taglia la corrente di traverso e non scarroccia di un palmo. È lunga e bassa, nera di pece che si stacca a scaglie, e a poppa, in piedi, c'è un vecchio con la barba sporca e gli occhi di brace. Ha un mantello rattoppato annodato su una spalla e braccia magre, con i tendini in rilievo dal polso al gomito.\n\n«Caronte, il barcaiolo» ti dice Elpenore a mezza voce, mentre la barca accosta. «Il vecchio ha traghettato anche dei vivi. Eracle, Teseo, Orfeo. Tutta gente di famiglia importante.»\n\nCaronte pianta la pertica nel fango, e il tonfo è l'unico rumore, sordo. La prua tocca la ghiaia. Quelli che aspettano si fanno avanti tutti insieme, e Caronte li ferma con il remo di traverso, da pastore. Nessuno spinge e nessuno alza la voce: si fermano contro il legno, con l'acqua alle caviglie. Il primo della fila è un uomo con il mantello pulito dei funerali e l'aria spaesata, e in testa ha ancora la corona di foglie che gli hanno messo i suoi. Apre la bocca: sotto la lingua ha una moneta. Caronte la prende con due dita, la guarda contro la luce, se la infila nella cintura e lo spinge a bordo. L'uomo si siede a prua, rigido, con le mani sulle ginocchia, e non si volta più.\n\nPoi Caronte guarda te. Guarda il remo, i tuoi capelli bagnati, e il cane, che è già saltato a bordo e si è accucciato sul fondo, tra le assi che sanno di pece. Si sposta di mezzo passo e ti fa posto, senza chiederti niente. Da vicino il fasciame sa di bruciato vecchio, e sul fondo ristagna un dito d'acqua scura che nessuno sgotta.\n\nElpenore non si muove. Caronte non lo guarda nemmeno, e lui non prova a salire.\n\n«Io aspetto il mio remo» dice. «Finché sul mio tumulo non ce n'è di nuovo uno, quello non mi porta.»\n\nHai un piede sulla barca e uno sulla ghiaia. Sotto il piede di dentro le assi cedono appena, come il ponte di una nave all'ancora. Elpenore ti vede salire, con la testa piegata sulla mano, i piedi nudi piantati tra i sassi a due passi dall'acqua.\n\n«Il nipote del re passa» dice. «Io no.»\n\nLo dice senza rancore, come si dice da che parte tira il vento. Gente di famiglia importante, ha detto. Pensi a tuo zio, e a quanto pesa anche quaggiù il suo nome.\n\nAlle tue spalle Caronte batte il remo sul bordo, una volta: non aspetterà. Elpenore aspetta qualcosa da te, e non te lo chiede.","dec":1,"img":6},"204":{"t":"Ti accorgi di non ricordare più di che colore era la porta di casa.\n\nCi pensi, e non viene. Era azzurra? Era di legno nudo? Vedi il chiavistello, e una mano che lo tira, e intorno alla mano la porta non ha più colore. Mentre ci pensi, se ne va il nome della via. Dietro a quello va il nome di tua madre: sai che ce l'avevi, lo senti come la lingua sente il posto di un dente che manca. Poi il tuo.\n\nProvi a dirlo. Ti esce solo la prima sillaba, e anche quella non ti sembra tua.\n\nIntorno a te c'è una folla grigia, fitta, che non guarda niente. Non ha odore e non ha voce: solo un fruscio di piedi che non vanno da nessuna parte. La folla degli Asfodeli si apre per farti posto. Da qualche parte, fuori, un cane fulvo resta seduto con il muso alzato, ad aspettare qualcuno che non esce.\n\nLa folla si richiude.\n\n*Hai dimenticato il tuo nome. Sei un'ombra senza nome, una della folla grigia. La tua storia finisce qui. Anfialo ti aspetta sulla spiaggia, al paragrafo 1.*"},"209":{"t":"Le foche sono decine, stese sulla sabbia grigia come sacchi scaricati da una nave. Qui la riva si allarga in una lingua piatta, con una fila di scogli bassi verso il largo, e ce ne sono anche lì sopra. Puzzano di pesce e di alga, l'unico odore forte della riva, e non si spostano quando passi: le più grosse sono lunghe quanto un uomo e larghe due, e ti seguono con un occhio solo, senza alzare il muso. Ogni tanto una sbuffa dal naso, o si gratta la pancia con una pinna, e la pelle sulla sabbia fa un fruscio di stoffa. Tra le bestie è pieno di lische e di gusci rotti, e di piume grigie di uccelli che qui non volano. Il cane gira al largo, con le orecchie basse.\n\nDopo un poco, dall'acqua esce un vecchio. È magro, con le braccia lunghe e le scapole che gli sporgono dalla schiena. Ha la barba bianca di schiuma e la pelle lucida, la stessa delle sue bestie. Cammina tra le foche e le conta, toccandole una a una sulla testa: un pastore che conta le pecore la sera. Una gli sbarra il passo, grossa il doppio di lui: la scosta con il fianco, senza fermarsi. Muove le labbra, sbaglia il conto, ricomincia. Alla fine si sdraia in mezzo a loro, si tira un lembo d'alga sulla faccia per coperta e si addormenta.\n\nA pochi passi, sotto quattro pelli di foca, sono stese altrettante sagome d'uomo, ferme, sfumate ai bordi come figure dipinte su un vaso e lasciate a metà. Una ha già la mano alzata; un'altra ha la bocca aperta su un grido che non esce. È l'agguato di Menelao e dei suoi compagni, ripetuto dal mare e fermato appena prima del salto: una storia di cui si è perso il seguito.\n\nIl vecchio dorme a tre passi da te, su un fianco, con le ginocchia tirate su, e russa: una risacca che il mare, qui, non fa. Alcione ha detto che chi lo tiene fino in fondo ha diritto a una domanda, e che non bisogna mollarlo, qualunque cosa diventi.\n\nSe sai fare i nodi, la cima che porti arrotolata alla cintura lo terrebbe meglio delle mani: un nodo non si stanca e non ha paura. Altrimenti ci sono le tue braccia: due, dove Menelao ne portò otto. E il vecchio si può anche lasciarlo dormire, e risalire verso il fiume, oltre le dune.","dec":1},"212":{"t":"Alle tue spalle l'asina mastica, e Ocno ride di una cosa che gli ha detto lei, o che crede gli abbia detto. Sotto il pino la fune continua a nascere e a sparire.\n\nIl crocicchio è pochi passi più avanti, dove la terra si divide. Nella polvere si incrociano solchi di ruote, vecchi e induriti, fondi un palmo: la terra ha preso la forma dei cerchioni e l'ha tenuta. In un solco giace il mozzo di una ruota spaccata, screpolato dal tempo. Il cippo sta sul ciglio, alto fino al tuo petto; da vicino le tre facce non hanno più naso né bocca, e ognuna guarda dalla sua parte. L'aria sa di cuoio vecchio e di giunchi pestati.\n\nUna strada sale stretta tra i sassi: ci sono impronte di zoccoli e di scarponi, e più in su, lontano, un mulattiere che impreca contro la sua bestia. È la più corta, lo capisci dalla direzione; ma su quella strada non c'è nessun altro, e quelli che passano al crocicchio voltano la testa dall'altra parte.\n\nL'altra scende piano. Ci cammina sopra una fila di gente in silenzio, uno dietro l'altro, senza fretta, e i loro piedi sollevano una polvere bassa che non si posa mai del tutto. Ti avvicini. Un uomo dice due parole a quello che ha davanti, a mezza voce, e l'accento lo conosci: sono di Itaca, e vanno giù verso le case dove stanno le loro donne. Uno porta una rete arrotolata sulla spalla, con i piombi che si urtano a ogni passo; un'altra ha un fuso infilato nella cintura, e la mano ci torna sopra ogni tanto, a sentire se c'è. Una vecchia si volta, riconosce la faccia di famiglia e ti fa posto nella fila senza dire niente: rallenta di mezzo passo, e tra lei e l'uomo della rete resta un vuoto che cammina con gli altri.\n\nDalla salita, il mulattiere impreca un'altra volta."},"217":{"t":"Ti siedi accanto a lui e gli chiedi un capo di fune. Ocno te lo passa, curioso. I giunchi sono ancora umidi di fosso, lisci e freschi sotto le dita, e intrecciati così stretti che non ci passerebbe un ago. Da vicino il vecchio ha le unghie verdi di linfa, e sui polpastrelli le righe che ci lascia il filo dei giunchi.\n\nFai una gassa: il cappio che a bordo si fa al buio, con una mano sola, e che tiene un uomo appeso sopra il mare senza stringersi di un dito. Un occhio nella fune, il capo che ci passa da sotto, gira dietro e torna giù per dove è venuto. Il giunco scricchiola mentre lo tiri. Tiene. Dai un colpo di pollice: si scioglie.\n\nOcno ti osserva le mani con gli occhi stretti di chi ha riconosciuto un pari. Te la fa rifare due volte, poi la rifà lui, con le dita nodose che vanno adagio, sbaglia, ride, la rifà giusta. La rifà una terza volta, per il gusto di vederla sciogliersi.\n\n«Questa non la sapevo» dice. «Dopo tutto questo tempo.» Taglia la fune con il coltello, prima che l'asina ci arrivi, e la avvolge in una matassa tra il gomito e il pollice, a giri uguali. È la fune di giunchi: dieci braccia di giunco intrecciato stretto, che odora di acqua dolce e di terra. «Tieni. Tra pari, una fune si regala.»\n\nLa prendi e te la leghi alla cintura. Pesa poco, e ti batte umida contro il fianco. L'asina fissa la matassa e sospira, con un soffio lungo che le gonfia le froge.\n\nPochi passi più avanti, al crocicchio, partono due strade. Una è stretta e sale tra i sassi, con impronte di zoccoli e di scarponi nella polvere. Da lassù arriva un colpo di bronzo sulla pietra, uno solo. «Quella è la strada del mulattiere» dice Ocno. «Taglia corto, ma è sola.» L'altra scende dolce, e ci cammina sopra una fila di gente in silenzio, tutti dello stesso passo. «Quelli sono di Itaca: vanno giù dalle loro donne. Ci mettono di più, ma arrivano.»","it":"Fune di giunchi"},"222":{"t":"Non serve toccarlo. A bordo, quando il mare non restituisce un compagno, il commiato si fa lo stesso, sul posto vuoto: le mani sanno che cosa fare anche a un palmo di distanza.\n\nStendi il remo accanto a te e ti inginocchi davanti a lui, sulla sabbia umida che conserva la forma delle ginocchia. Prendi l'acqua del mare nel cavo della mano (è ferma e fredda, e non fa rumore nemmeno quando la versi) e la lasci cadere sulla sabbia davanti ai suoi piedi, tre volte; la sabbia se la prende senza lasciare il segno. Poi con due dita cuci l'aria intorno a lui, dalle caviglie al collo, un punto dopo l'altro, come si cuce un compagno nella vela. Elpenore ti guarda le mani senza dire niente. Sulla spiaggia non si muove niente, nemmeno le conchiglie vuote, che il mare non rigira più.\n\n«Elpenore» dici. «Della nave di Odisseo. Remo di Itaca. Hai tirato il tuo tratto.»\n\nIl resto della formula si dice a chi è finito in mare, e lui è caduto da un tetto. A lui basta il nome.\n\nPer un momento il tremito si ferma. Elpenore toglie la mano da sotto la mascella, e la testa gli resta dritta da sola, il tempo di contare fino a tre. In quel tempo ha la faccia che doveva avere il primo giorno al banco: un ragazzo di Itaca con le lentiggini del sole e la voglia di vedere il mondo. Le dita gli sono rimaste a mezz'aria, sotto il mento. La testa torna a piegarsi, un poco alla volta, il palmo la raccoglie, e il tremito ricomincia, più leggero di prima.\n\n«A Eea non c'era tempo» dice. «Tuo zio aveva fretta. Ha sempre avuto fretta, quando c'era da tornare.» Fa un sorriso storto come il suo collo. «Vieni. C'è una strada tra le dune che non passa da nessuna parte: la conosco solo io, e al fiume ci porta prima.»\n\nTi rialzi con la sabbia attaccata alle ginocchia e riprendi il remo. Lo segui su per la prima duna, che frana a ogni passo e va presa di sbieco; lui sale davanti a te scalzo, con il gomito alto, e non rallenta. Dall'altra parte la sabbia si fa più scura e più soda, ci cresce un'erba rada e dura che ti sfrega le caviglie, e l'aria comincia a sapere di acqua dolce stagna e di canne."},"236":{"t":"Fai il giro del vecchio e vai al pino. La corteccia è ruvida e squamosa, e dove la incidi con la punta del coltello ne cola un filo lucido. Più in basso, dove il tronco si è spaccato da solo, la resina vecchia ha fatto grumi grossi quanto una noce. Ne raccogli uno, nero e appiccicoso, che sa di bosco bruciato. Lo lavori tra le dita finché si fa morbido, come la pece che a bordo si spalma sulle commessure, e ti pare di essere sullo scalo di Same, con il calderone che fuma e i gabbiani sul colmo dei tetti.\n\nPrendi il capo della fune che esce dalle mani di Ocno e lo impeci, un palmo alla volta, strofinando bene tra i giunchi, finché il verde diventa bruno e lucido. Il pollice ti si fa nero fino alla nocca, e la resina tira fili tra un dito e l'altro.\n\nL'asina allunga il muso. Annusa. Arriccia il labbro sui denti lunghi e gialli, sbuffa, e si gira dall'altra parte con la dignità offesa di una regina.\n\nOcno smette di intrecciare. Osserva la fune, poi l'asina, poi te. Riprende, più svelto, e tu impeci dietro di lui, palmo dopo palmo. Il mucchio dei giunchi cala. La fune, che nessuno mangia più, si allunga nella polvere in una riga bruna, finché dopo tutti quei secoli arriva alla fine: l'ultimo giunco entra nell'intreccio, e il vecchio resta con le mani vuote sopra le ginocchia. Ocno ride così forte che il pino perde due aghi.\n\n«Finita» dice, e alza il capo della fune perché lo veda anche l'asina. «Finita!» Taglia il primo pezzo, dieci braccia, e lo avvolge in una matassa. È la fune di giunchi, la prima che abbia mai finito. «Il primo pezzo è tuo. Senza di te sarebbe già nella pancia di quella lì.» La prendi, e te la leghi alla cintura. Sulle dita ti resta l'odore della resina, dolce e bruciato insieme.\n\nPochi passi più avanti, al crocicchio, partono due strade. Una sale stretta tra i sassi, con impronte di zoccoli e di scarponi: la strada del mulattiere. Tra quelle ce n'è una che non è né zoccolo né suola, e non ha il paio: sta stampata nella terra dura più fonda di tutte. «Taglia corto, ma è sola» dice Ocno. L'altra va in discesa, e ci cammina sopra una fila di gente di Itaca, in silenzio, verso le case delle loro donne. «Ci mettono di più, ma arrivano.»","it":"Fune di giunchi"},"240":{"t":"Tra gli asfodeli il sentiero sale verso un filo di fumo che non si piega. L'erba secca scricchiola a ogni passo. In cima c'è una capanna di pietre a secco e frasche, con accanto un recinto vuoto, la staccionata di lentisco ancora legata con i vimini, e un odore che conosci da sempre: ghiande e fumo di legna verde. Davanti alla porta, per terra, ci sono gusci spaccati e un truogolo di pietra asciutto.\n\nSulla porta c'è un vecchio con le spalle larghe e le mani nere di terra, appoggiato a un bastone. Le rughe della faccia gli vanno tutte verso gli occhi. Eumeo. Lo stesso che ogni mattina passava da voi a Itaca, con quell'odore addosso, e beveva al vostro pozzo come se fosse casa sua.\n\nTi fermi sulla soglia, con il remo in mano, e non entri.\n\nEumeo non guarda te. Guarda il cane. Si inginocchia davanti a lui, un ginocchio per volta, tenendosi al bastone, e il cane gli annusa la mano, dal polso alle nocche. A Eumeo si riempiono gli occhi. «Della razza dei cani di Laerte» dice, con la voce che gli si incrina. «Credevo che non se ne vedessero più.» Il cane gli fiuta l'orlo della tunica, i sandali, la manica, e lui lo lascia fare. «Sente il sangue di Laerte. L'hai accompagnato fin qui, eh?»\n\nSi rialza e ti indica lo sgabello accanto al fuoco. Dentro è buio e basso, e le travi sono nere di fuliggine. Il focolare è a un passo dalla soglia: tre pietre annerite sulla terra battuta. Ti siedi e stendi le mani verso la fiamma. La legna scoppietta, il fumo sa di quercia e di ghiande tostate, e la luce ti balla sulle dita. Il mantello non fuma, l'acqua resta nelle pieghe. Eumeo osserva il mantello, poi le tue mani, e per un poco non dice niente. Poi: «Il fuoco, quaggiù, non scalda nessuno.» E si mette a parlare d'altro: delle ghiande, di un verro nero che scappava sempre fino al porto.\n\nSulla tavola, su un tagliere d'ulivo, ci sono pane e formaggio. Il pane ha la crosta spaccata; il formaggio è di pecora, stagionato, con la buccia scura. Eumeo te li spinge davanti; poi, a metà del gesto, li tira indietro. «No. Tu no. Chi deve ripartire non mangia qui.»\n\nSi siede dall'altra parte del fuoco e lo attizza con il bastone. Le braci si ravvivano, e dalla porta aperta entra un filo d'aria che sa di asfodeli. «Qui si sta bene» dice. «Chi si ferma, di solito non riparte.»\n\nHai tante cose da chiedergli: di tua madre quando era bambina, di tuo padre, della strada. Puoi anche non chiedere niente, e lasciare che la sua voce e la fiamma facciano il resto.","dec":1,"img":7},"242":{"t":"Lo mangi. I petali hanno l'amaro fresco delle mandorle verdi, e si sciolgono sulla lingua prima che tu li abbia masticati. Lasciano in bocca una dolcezza lunga, da uva passa.\n\nIntorno a te i Lotofagi sorridono tutti insieme, contenti per un amico. Ti fanno sedere nell'erba: un pagliericcio nuovo. Ti chiedono da dove vieni, e tu cominci a dirlo; poi ti fermi a metà. Il nome dell'isola ti è venuto in bocca strano, e non ti va di finirlo. Nessuno te lo richiede: sorridono lo stesso. Il tuo nome ti sembra la parola di un'isola dove non hai più voglia di tornare. Lo lasci lì, a metà, come si lascia una cima che non serve più.\n\nIl remo ti resta sulle ginocchia. Dopo un po' non ricordi a che cosa serva.\n\nIl cane è rimasto al margine del prato, seduto dove finisce la sabbia nera, e nell'erba non entra. Quando uno dei Lotofagi gli porge un fiore, arriccia il labbro sui denti. Si alza e se ne va da solo, verso il fumo.\n\n*Hai dimenticato il tuo nome. Sei un'ombra senza nome, una della folla grigia. La tua storia finisce qui. Anfialo ti aspetta sulla spiaggia, al paragrafo 1.*"},"246":{"t":"«Chi ha colpa, mio zio o mio padre?»\n\nIl vecchio del mare ci pensa. Si gratta la barba, dove la schiuma si è seccata in croste bianche, che gli cadono sulle ginocchia. Guarda il cielo che non c'è, guarda le foche, guarda il tuo remo, steso sulla sabbia. Piega un dito, e un altro, arriva al mignolo e torna indietro. Muove le labbra su un conto lungo, che non gli torna.\n\n«Sì» dice.\n\nAspetti il resto. Non c'è un resto. Il vecchio si scrolla di dosso quello che lo tratteneva ancora e si tuffa, e le foche gli vanno dietro, finché la riva è sgombra. Restano le loro tracce, e un ciuffo d'alga grigia che nessuno raccoglie. Dove sedeva c'è una conca bagnata, con il segno di due talloni. Sull'acqua, tornata ferma, galleggia ancora un poco di schiuma della sua barba; poi si disfa.\n\n«Sì» ripeti ad alta voce, per sentire se detto da te pesa di più.\n\nNon pesa niente di più. La parola ti resta addosso come una conchiglia vuota raccolta sulla battigia: la giri e la rigiri, dentro non c'è niente, eppure ha la sua forma, e buttarla via non ti riesce.\n\nVerso l'intern
