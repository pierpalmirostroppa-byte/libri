:root{--suoro:#1f1a10;--fondo:#45515e;--fondo2:#262d35;--carta:#f3eee2;--inchiostro:#23272d;--accento:#475869;--oro:#c49a4f;--rosso:#97392b;--velo:rgba(71,88,105,.14)}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--inchiostro);
  background: var(--fondo2) linear-gradient(180deg, var(--fondo) 0%, var(--fondo2) 100%) fixed;
  font-family: 'EBG', 'EB Garamond', Garamond, 'Times New Roman', Georgia, serif; font-size: 19px; line-height: 1.6;
}
#app { max-width: 700px; margin: 0 auto; padding: 0 0 48px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; }
a { color: inherit; }
.btn {
  display: block; width: 100%; margin: 9px 0; padding: 11px 16px; border-radius: 6px; cursor: pointer;
  font-size: 18px; line-height: 1.35; text-align: center; text-decoration: none;
  background: transparent; color: var(--inchiostro); border: 1.5px solid var(--accento);
}
.btn:hover, .btn:focus-visible { background: var(--velo); }
.btn:focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; }
.btn.primo { background: var(--accento); color: var(--carta); border-color: var(--accento); font-weight: 600; }
.btn.primo:hover { filter: brightness(1.12); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.scelta { text-align: left; background: #fffdf7; }
.btn.scelta:hover { background: var(--velo); }
.btn.chiusa { opacity: .55; background: transparent; border-style: dashed; }
.btn.chiusa small { display: block; font-size: 15px; font-style: italic; }
.btn.prova { background: var(--oro); border-color: var(--oro); color: var(--suoro); font-weight: 600; }
.btn.mini { display: inline-block; width: auto; margin: 0; padding: 4px 12px; font-size: 16px; }
.btn.chiaro { color: var(--carta); border-color: var(--carta); margin-top: 14px; }
.copertina { text-align: center; padding: 22px 18px 10px; color: var(--carta); }
.cop { display: block; width: 100%; max-width: 420px; margin: 0 auto 14px; border-radius: 3px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.etichetta { margin: 6px 0 0; font-size: 15px; letter-spacing: .22em; text-transform: uppercase; color: var(--oro); font-weight: 600; }
.sotto { max-width: 440px; margin: 8px auto 14px; font-size: 19px; }
.copertina .pulsanti { max-width: 380px; margin: 0 auto; }
.copertina .btn { color: var(--carta); border-color: var(--carta); }
.copertina .btn.primo { background: var(--oro); border-color: var(--oro); color: var(--suoro); }
.firma { margin-top: 18px; font-size: 16px; letter-spacing: .08em; opacity: .9; }
.foglio {
  background: var(--carta); margin: 14px 10px 0; padding: 18px 20px 22px; border-radius: 4px;
  box-shadow: 0 6px 24px rgba(0,0,0,.35);
}
.foglio h2 { margin: 4px 0 10px; text-align: center; font-size: 27px; font-weight: 600; color: var(--accento); }
.foglio h3 { margin: 22px 0 4px; font-size: 21px; font-weight: 600; color: var(--accento); border-top: 1px solid var(--oro); padding-top: 14px; }
.nota { font-size: 16px; font-style: italic; margin: 4px 0 10px; }
.regole p { margin: 0 0 10px; }
.intro p { margin: 0 0 .8em; }
.intro h3 { font-size: 17px; letter-spacing: .12em; text-align: center; border-top: 0; padding-top: 0; margin: 22px 0 8px; }
.intro h3::after { content: ''; display: block; width: 36px; height: 2px; margin: 6px auto 0; background: var(--oro); }
.intro .btn { margin-top: 18px; }
.valori { display: grid; gap: 6px; }
.valore { display: grid; grid-template-columns: 1fr auto 2.2em; align-items: center; gap: 10px; padding: 6px 10px; background: #fffdf7; border-radius: 6px; border: 1px solid var(--velo); }
.vnome { font-weight: 600; }
.vdadi { display: flex; align-items: center; gap: 5px; }
.piu { font-size: 16px; }
.vnum { font-size: 24px; text-align: right; color: var(--accento); }
.doti { display: grid; gap: 6px; }
.dote { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--velo); background: #fffdf7; cursor: pointer; line-height: 1.35; }
.dote input { margin-top: 5px; width: 20px; height: 20px; accent-color: var(--accento); flex: none; }
.dote small { font-size: 15.5px; }
.dote .bonus { font-size: 15.5px; color: var(--accento); }
.dote.scelta { border-color: var(--accento); background: var(--velo); }
.barra-doti { position: sticky; bottom: 0; margin: 12px -20px -22px; padding: 10px 20px 14px; background: var(--carta); border-top: 1px solid var(--oro); display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; align-items: center; }
.barra-doti #conta { grid-column: 1 / -1; text-align: center; font-size: 16px; }
.barra {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 12px; background: var(--fondo2); color: var(--carta); font-size: 17px; border-bottom: 1px solid var(--oro);
}
.barra b { color: var(--oro); font-weight: 600; }
.barra .r.basso { color: #ffb3a6; }
.barra .btn.mini { margin-left: auto; color: var(--carta); border-color: var(--carta); }
.palline { display: inline-flex; gap: 4px; }
.palline i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--oro); }
.palline i.usata { background: var(--oro); }
.num { text-align: center; font-size: 26px; font-weight: 600; color: var(--accento); letter-spacing: .05em; }
.num::after { content: ''; display: block; width: 46px; height: 2px; margin: 6px auto 12px; background: var(--oro); }
.ill { margin: 0 -20px 14px; }
.ill img { display: block; width: 100%; height: auto; }
.testo p { margin: 0 0 .8em; }
.nemico { margin: 0 0 10px; padding: 6px 10px; border-left: 3px solid var(--rosso); background: #fffdf7; font-weight: 600; }
.nemico small { font-weight: 400; }
.note { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.note span { font-size: 16px; padding: 3px 10px; border-radius: 14px; border: 1px solid var(--accento); background: #fffdf7; }
.note .nota-male { border-color: var(--rosso); color: var(--rosso); }
.azioni { margin-top: 14px; border-top: 1px solid var(--oro); padding-top: 8px; }
.riquadro { margin: 10px 0; padding: 12px 14px; border: 1.5px solid var(--accento); border-radius: 8px; background: #fffdf7; }
.titolo-r { margin: 0 0 6px; text-align: center; font-weight: 600; font-size: 20px; color: var(--accento); letter-spacing: .03em; }
.esito { text-align: center; font-weight: 600; font-size: 21px; margin: 6px 0; }
.esito.ok { color: #2f6b3a; }
.esito.ko { color: var(--rosso); }
.dadi-grandi { display: flex; justify-content: center; align-items: center; gap: 8px; min-height: 58px; flex-wrap: wrap; margin: 6px 0; }
.somma { font-size: 24px; font-weight: 600; }
.chi { font-size: 15px; font-style: italic; }
.dadi-grandi.due { gap: 18px; align-items: flex-start; }
.tiro { display: grid; grid-template-columns: auto auto; gap: 4px 6px; justify-items: center; max-width: 46%; }
.tiro .chi { grid-column: 1 / -1; text-align: center; line-height: 1.2; }
.registro { font-size: 16px; border-top: 1px dashed var(--velo); margin-top: 6px; padding-top: 4px; }
.registro p { margin: 2px 0; }
.vita { margin: 6px 0; font-size: 16px; }
.traccia { height: 9px; background: var(--velo); border-radius: 5px; overflow: hidden; }
.riemp { height: 100%; border-radius: 5px; }
.riemp.io { background: var(--accento); }
.riemp.lui { background: var(--rosso); }
.morte { border-color: var(--rosso); text-align: center; }
.morte .titolo-r { color: var(--rosso); letter-spacing: .1em; }
.dado {
  display: inline-grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); width: 46px; height: 46px; padding: 6px;
  background: #fffef9; border: 2px solid var(--inchiostro); border-radius: 9px; box-shadow: 0 2px 0 rgba(0,0,0,.25);
}
.dado i { display: block; margin: auto; width: 8px; height: 8px; border-radius: 50%; }
.dado i.p { background: var(--inchiostro); }
.dado.piccolo { width: 30px; height: 30px; padding: 4px; border-width: 1.5px; border-radius: 6px; }
.dado.piccolo i { width: 5px; height: 5px; }
.dado.gira { transform: rotate(var(--g, 12deg)); }
.dado.gira:nth-child(2n) { --g: -14deg; }
.fine { text-align: center; background: var(--fondo); color: var(--carta); margin: 6px -20px -22px; padding: 22px 20px 24px; border-radius: 0 0 4px 4px; }
.cop-piccola { width: 150px; border-radius: 3px; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
.fine-sopra { margin: 12px 0 0; font-style: italic; }
.fine h2 { color: var(--oro); margin: 6px 0 8px; font-size: 26px; line-height: 1.2; }
.compra { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; max-width: 420px; margin: 10px auto 4px; }
.compra .btn.primo { background: var(--oro); border-color: var(--oro); color: var(--suoro); }
.compra small { display: block; font-size: 14px; font-weight: 400; }
.sito { margin: 10px 0 0; font-size: 18px; }
.sito a { color: var(--oro); }
.scheda { position: fixed; inset: 0; z-index: 20; background: rgba(10,12,16,.55); display: flex; justify-content: flex-end; }
.scheda-dentro { width: min(380px, 92vw); height: 100%; overflow-y: auto; background: var(--carta); padding: 16px 18px 24px; box-shadow: -6px 0 24px rgba(0,0,0,.4); }
.scheda h3 { margin: 0 0 8px; color: var(--accento); font-size: 24px; }
.scheda h4 { margin: 14px 0 4px; color: var(--accento); font-size: 18px; border-bottom: 1px solid var(--oro); }
.scheda ul { margin: 4px 0; padding-left: 20px; }
.scheda li { margin: 3px 0; }
.scheda .pulsanti { margin-top: 18px; display: grid; gap: 8px; }
.scheda .btn.mini { justify-self: center; }
@media (max-width: 420px) {
  body { font-size: 18px; }
  .foglio { margin: 10px 6px 0; padding: 14px 15px 18px; }
  .ill { margin: 0 -15px 12px; }
  .fine { margin: 6px -15px -18px; }
  .barra-doti { margin: 12px -15px -18px; padding: 10px 15px 12px; }
  .barra { gap: 9px; font-size: 16px; }
  .compra { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .dado.gira { transform: none; } }
.w0{width:0%}.w5{width:5%}.w10{width:10%}.w15{width:15%}.w20{width:20%}.w25{width:25%}.w30{width:30%}.w35{width:35%}.w40{width:40%}.w45{width:45%}.w50{width:50%}.w55{width:55%}.w60{width:60%}.w65{width:65%}.w70{width:70%}.w75{width:75%}.w80{width:80%}.w85{width:85%}.w90{width:90%}.w95{width:95%}.w100{width:100%}</style>

at":"YOUR STORY ENDS HERE","valori":{"fz":[1,6],"hp":[2,12],"agi":[1,6]},"agilita":"sotto","cure":[["relic",4],["balm",6],["healing water",6],["water that heals",6]],"zeroA":204,"ruoli":{"forza":"Sounding Line","armatura":"Ship's Log","agilita":"Shipboard Silence","fortuna":"Salt"},"regole":["You are **Amphialus**, a sailor from Ithaca. Read each section and choose what to do: every choice takes you to another section.","The computer rolls the dice. **Strength** counts in fights, **Agility** for running away, climbing and slipping past unseen. **Vigor** is your energy: if it drops to zero, your story ends.","⚔️ In a fight, each round you and the enemy roll two dice and add your Strength: whoever scores lower loses 2 Vigor.","🧠 Some paths open only to those who have the right skill. ✦ is the family metis, the blood of Odysseus: that path is always open, but whoever sees you use it knows what family you come from.","🎒 Your pack and 🚩 what the book remembers are kept for you: you will find them on your **Sheet**.","In this demo you have **six choices**. If your story ends sooner, you start again from §1."],"dotiTit":"Choose five shipboard skills","fineTesto":"The rest of Amphialus's journey awaits you in the book, in print or as an ebook.","doti":[{"n":"Sounding Line","b":"+1 to your roll in fights","d":"You lower the lead, and from what it brings up you know where you are. In a harbor brawl, the lead whirled on its line hits harder than a fist."},{"n":"Ship's Log","b":"−1 to the enemy's roll","d":"You mark down the days, the miles, the wind. Where there is no sun, you are the only one who keeps count of time. In a fight you count your opponent's blows."},{"n":"Shipboard Silence","b":"+1 to your Agility in tests","d":"You know which words are not spoken on board, and you know how to move without waking anyone."},{"n":"Salt","b":"+1 to Strokes of Luck","d":"You know how to salt and preserve, and from the taste of a food you can tell how far away the sea is. A pinch over the shoulder, before setting out, is denied to no one."},{"n":"Knots","b":"","d":"A line holds what hands cannot hold. You know fifty knots, and you know which one holds and which one lets go."},{"n":"Stars","b":"","d":"You read the sky like a ship's chart. If one day the sky were missing, you would be the first to notice."},{"n":"Caulking","b":"","d":"You find a leak by the sound of the water and close it with oakum and pitch. And you also know how one is opened."},{"n":"Command","b":"","d":"You know how to speak to a crew: when to raise your voice, which order the men want to be given. Your father did it only once."},{"n":"Rowing Chant","b":"","d":"You know the chant that gives the oars their time. You sing out of tune, but no one has ever stopped rowing when you were the one singing it."},{"n":"Sail Mending","b":"","d":"Bronze needle and leather palm: you know how to mend a sail, and you know how to read a canvas the way a letter is read."},{"n":"Tongue of the Ports","b":"","d":"You speak six languages badly, you can tell an accent a cable's length away, and you know the news from every pier."},{"n":"Shipboard Farewell","b":"","d":"On board, a shipmate is not left behind: he is washed, he is sewn into the sail, his name is spoken, he is lowered. You know how to do it, and you know how to do it well."}],"negozi":[{"f":"scopri","url":"https://intreccidicarta.com/libri/en/librigiochi.html#il-remo-sulla-spalla","dove":"intreccidicarta.com"}],"sito":"https://intreccidicarta.com/libri/en/librigiochi.html#il-remo-sulla-spalla","re":{"ab":"^🧠 If you have (.+)$","itPos":"^🎒 (?:If )?you have (.+)$","itNeg":"^🎒 You (?:don't|do not)","fgPos":"^🚩 If (.+)$","fgNeg":"^🚩 If you (?:did not note|didn't note|have not noted) (.+)$","fgPre":"^you noted ","vinci":"win","non":"not"},"ui":{"demo":"Playable demo","copAlt":"Cover of {t}","copTesto":"The opening pages of the gamebook, to play right here: read, choose your path, roll the dice. You have six choices.","gioca":"Play the demo" d to zero.","morteTit":"Your story ends here","morteRes":"Your Vigor has dropped to zero.","morteNota":"In the demo you start again from §1, with new scores and the same skills.","ricomincia":"Start again from §1","fineSei":"You have made your six choices.","fineFuori":"This path leads beyond the demo.","fineTit":"Your adventure continues in the book","cartaceo":"Paperback","ebook":"Ebook","scopri":"Discover the book","sito":"All the gamebooks at intreccidicarta.com","rigioca":"Play the demo again","noscript":"The demo needs JavaScript turned on in your browser.","descr":"Playable demo of {t}, a gamebook by Peter Palmer: the opening pages, to play in your browser.","titoloPagina":"{t} · Playable demo · Peter Palmer","introTit":"Introduction","continua":"Continue","vaiUno":"Turn to §1","inBorsa":"In your bag","restaUno":"❤️ Vigor at zero: you stay at 1"},"par":{"1":{"t":"Open your eyes.\n\nSand. A gray sand as fine as ash, and it has worked its way in everywhere: under your nails, into the folds of your cloak, between your eyelashes. You are lying face up, and above you is not the sky you know. There is a dark, smooth vault, like the inside of an enormous shell, with no sun and no stars, and from somewhere comes an evening light that does not end.\n\nYou are soaked. There is salt on your lips, in your hair, in the creases of your hands. Your right hand still grips the oar, so hard that you have to think about it to open it. Three notches and a wave, on the loom: it's yours. A sailor never lets go of his oar, and you didn't let go of it.\n\nYou pull yourself up and look around. Of the Alcyone there is nothing: not a plank, not a line, not a shipmate. Behind you is the sea, but it makes no sound. Ahead, black poplars and willows that do not move, even though you feel a thread of air on your skin. You don't recognize this coast. None of the coasts you know has sand like this.\n\nAlong the shore comes a dog. He comes toward you at a trot, sure of himself, as if he knew where to go. He is young and strong, tall at the withers, his coat tawny and glossy, his ears pricked, with the stride of one who could run until evening. He is the same breed as Argos, your uncle's dog: the hunting dogs of Ithaca, the kind the old men say you don't see anymore. But you knew Argos old, on the dung heap in front of the palace. This one is in the full strength of his youth.\n\nHe sniffs your hand, for a long time. Then he sits down beside you, as if he had been waiting for you a long while.\n\nWhere there is a dog, you think, there is somebody: a shepherd, a village, a boat hauled up on the beach. Somebody who can tell you where the sea has thrown you.\n\nThe dog gets up, takes a few steps along the shore and turns to look at you.\n\nIf you can read the stars, you can try looking for them before you move, to work out at least which way the home sea lies.","it":"The Oar","dec":1,"img":0},"10":{"t":"The Acheron runs black, as wide as an arm of the sea, and on the far side nothing can be seen: only a low fog, and inside the fog the outline of another bank. Along the banks grow reeds taller than a man, gray, that do not rustle. The air smells of marsh, of mud and of leaves left to rot, and on the gravel the water lays a hem of yellowish foam that does not go away.\n\nOn the near bank many are waiting. They sit on the gravel, stand in groups, lie with their heads on their arms, and they look at the water in the same direction, the one the boat will come from. There is a woman with her bridal veil still pinned to her hair, an old man gripping a shepherd's staff, a boy with his breastplate laced on crooked. No one speaks to their neighbor. Elpenor is off to one side, sitting with his hand under his jaw.\n\nIn the middle of the crowd there is one who talks louder than all the rest. He walks in jerks among the seated ones, who draw in their feet when he passes. He is the ugliest man you have ever seen: bandy legs, one lame foot, hunched shoulders that close over his chest, a pointed head with four hairs on top. Thersites, they call him, and they all say it in the tone you use for a mule that kicks. He is pointing at an old man in a captain's cloak, sitting on the gravel, whom someone calls the captain of Pylos. The cloak is a good one, hemmed with a purple that time has turned pink, and in his lap the old man holds a felt cap, which he turns over and over in his hands like a tiller.\n\n“Look at him! Thirty years without leaving the harbor for fear of the sea, and then he drowned in the harbor, falling off the pier!”\n\nThe old man opens his mouth to answer, but someone behind Thersites brings a stick down across his back, with the dull thump of a beaten sack, and the laughter covers everything. Thersites rubs his back, laughs louder than the others and meanwhile looks around, in search of someone else.\n\nHe finds you.\n\n“Look at him! The son of Eurylochus, soaked like a wet chick, with his oar on his shoulder. You drowned, my pretty one, as happens to anyone who boards a ship with that family name!” says Thersites, and he laughs until the people around him turn the other way.\n\nThe family name. At the harbor of Samé they always made you feel its weight like this, in a low voice, behind your back; he shouts it in your face, in front of everyone. And soaked you truly are: the sea threw you ashore a little while ago.\n\nOn the river, far off, a boat appears. On the bank the people all rise together, with a rustle of clothes, and press toward the water. Not Thersites. He stays where he is and goes on looking at you, with his head cocked: he is waiting to see whether you will have the courage to go over to him.","dec":1,"img":1},"31":{"t":"The shore draws back ten paces, between the waterline and the dunes, and there lies the pool: round and smooth, a bronze mirror, and the water in it does not ripple even when you walk past. It is clearer than the sea: on the bottom you can see the gray sand combed into thin lines, and nothing else, not a fish, not a strand of weed. The whole stone vault is mirrored in it, and the pool looks deeper than the entire beach.\n\nLying on the edge, on his stomach, is a boy. He is the most beautiful you have ever seen, and he knows it the way you know your own name, without vanity. He has his chin on his crossed arms and is looking at his face in the water. Under his elbows the sand has two deep hollows, the kind left by a keel hauled ashore years ago. He wears the short tunic of the hunters and boots laced up to the calf; beside him are a bow with its string slack and a quiver full of sand, which no one has touched for a long time.\n\n“Don't cast a shadow on the water,” he says, and does not turn around. He keeps his voice low, like someone with a sleeper close by.\n\nYou move. He smiles at the boy in the pool, and the boy in the pool smiles at him.\n\n“Up there I didn't know who I was,” he says. “So many came looking for me, nymphs and boys, and I didn't understand what they wanted from me. Then I saw him. Now I know, and I need nothing else.” A pause. “Who are you?”\n\nYou tell him your name, Samé, the ship. He nods without listening, as you nod at the rain.\n\n“I am Narcissus. I tell the water every so often, so it won't forget.” With two fingers, without looking at you, he points to the edge beside him: they are the fingers that draw the bowstring, and the callus is still there. “Lean over, if you like. There's room. Just don't stir the water.”\n\nSomewhere, behind the dunes, a girl's voice repeats his last words, one at a time, each time lower: “…the water. The water.” Narcissus does not hear her, or does not care.\n\nThe edge of the pool, beside him, is free for the length of a man lying down, and the sand there has not one footprint. Farther on, the backs of the seals glisten.","dec":1},"42":{"t":"You take it with your free hand. The stem is cool and soft between your fingers, a rush just picked, and the flower weighs less than a feather. You bring it toward your mouth.\n\nWhen the stem brushes your chin, the scent grows so strong that it covers everything else: the grass, the marsh behind you, the ash of the oar. Warm bread, figs split open in the sun, your mother's wool on the loom. And underneath, the alley you walked every morning with the nets on your shoulder, from the fish market to the pier: narrow between the low houses, with the cistern wall and three worn steps at the end. You see all of it, stone by stone. It had a name, and of the name the shape is left to you, short, with an r in the middle, the way the print of a keel is left on the sand. But the name is not there. You had it a moment ago, ready to say, and now in its place there is only the scent.\n\nAround you the Lotus-Eaters wait, content. They have gathered in a ring, a pace away, and a woman has already made room in the grass beside her: she pats it with her palm, twice, without a sound. The man who gave you the flower nods, saying nothing, and the garland in his hair does not move.\n\nThe flower is still there, a finger's breadth away. From this close the dark heart glistens, and the petals have the white of soft bread. The three roads are still there too, beyond the meadow: the thread of smoke, the plain of white flowers, the crossroads where people pass with their animals.\n\n*Lose 2 Vigor points. If you drop to zero, turn to the section of the gray crowd.*","h":-2,"dec":1},"52":{"t":"The chariot warriors are upon you. In the narrow space between the chariots only two at a time can come at you, and their feet send the dust of the ruts flying, and it crackles on the shields. When one of the two falls back, there is already another in his place. They fight as they fought beneath the walls of Ismarus: spears low, leather shields pushing, a step and a blow, a step and a blow. At every step they all make a short sound together, from the throat. You have the oar, as long as two men, and you use it the way on board it is used to fend off a boat that comes in too close: the blade against a shield, a shove from the shoulders, and back, before a point reaches your hands.\n\nTheir blows land. They leave no marks: every blow that catches you carries off a small memory. The name of the alley behind your mother's house. The color of the sail of the first boat you ever boarded.\n\nThey are many, but they are not invincible: they are men, and men get tired of taking a beating. Behind them the track goes on toward the river.","e":"The Chariot Warriors","ec":7,"ee":10},"55":{"t":"“I'll bring it to you,” you say. “An oar for your mound. When I'm back up there, I'll plant it myself, on Aeaea or wherever it's needed.”\n\nYou say it half turned away, with one foot still on the gravel.\n\nElpenor raises his eyes without raising his head: his palm is holding his head up. He says nothing. On the bank, the people the boat did not take have turned to listen, and no one is talking anymore: the reeds stand mute, and the black water slides along the planking without a sound. Elpenor takes his hand from under his jaw: to say the next thing he needs his head straight.\n\n“Ash,” he says. “It doesn't have to be handsome. It has to stand straight.” With his hands he measures the air in front of him, the way you order a piece from the carpenter: this long, this thick. His fingers tremble, and do not stop, but the measure is the right one: these are hands that have held an oar.\n\nYou nod. He stares at you, serious: a pledge made in front of the whole crew cannot be taken back. Behind him the fog opens among the reeds, on a hand's breadth of shining mud, and closes again.\n\n“I'm counting on it,” he says. “I'm counting on it, nephew of the king.”\n\nHe puts his hand back under his jaw and sits down again on the gravel, in his place, with his shoulders a little straighter than before. The pebbles crunch under him. Those on the bank go back to watching the boat.\n\nBehind you Charon snorts through his nose, like a horse, and knocks his oar on the gunwale a second time. The knock runs over the water and does not come back. In the bottom of the boat, behind the man with the crown of leaves, there is still one place, between the boards black with pitch.\n\n*Note on your sheet: “you made a promise to Elpenor”.*","f":"you made a promise to Elpenor"},"58":{"t":"You turn toward the line of sailors and raise your voice the way it is done at the bow, when the wind drowns everything.\n\n“Close up! Everyone with me, shoulder to shoulder!”\n\nThe line stops, and the heads turn. None of these men knows you, but they all know that voice: it is the one used on board only once, when there is no time to explain. Twenty barefoot sailors press in around you, and raise their hands to hold oars they do not have. They have thick calves and one shoulder higher than the other, the one on their rowing side. Their bare feet beat the dust all together, in rowing time, and onto the track comes the smell of a ship: rope, pitch, wet wood.\n\nThe Cicones hesitate. Eight spears against a ship's company are few. The points, which were at the height of your chest, rise by a palm, then by another. The tallest stares at you, then at the sailors, then at you again, and finds nothing to say. No one asks whose son you are. They step aside among the chariots, one at a time, until the track is clear, and the leather of their shields creaks as they sling them back on their shoulders. The last one, passing, spits in the dust in front of your feet; around you no one moves.\n\nThe sailors do not leave. They stay there, with their hands still raised, waiting for the next order, and you do not know which one to give. No one has ever waited for you like this. One has the shiny callus of the oar on his palm, the same as yours; another has the pale eyes of the men of Zacynthus. A third holds his head a little tilted, toward the side the orders come from on board. No one says his name.\n\n“To the river,” you say. The track is clear, straight between the chariots as far as the dust closes it. The sailors wait for you to go ahead."},"71":{"t":"You lay the oar on the sand, slip the line from your belt without a sound and kneel beside the sleeping old man. It is good hemp, still stiff with salt, and it runs through your fingers as it did on the pier at home. A turn around the ankles, which are cold, with a skin that slips away under the hemp; a turn around the wrists; and a knot that tightens the more the bound one pulls. You have known how to tie it since you were ten, in the dark, with wet hands.\n\nThe old man wakes. He becomes a lion, and the knot holds the lion's paw, which scrapes and kicks and does not get free. He becomes a serpent, and the line follows the coils. He turns into a panther, a tree, water: the line widens and tightens with him, turn after turn, it rises with the trunk, falls with the water, and the water stays inside its turns, a fish in the net. The hemp does not complain and does not give. You stay sitting on the sand with the end of the line in your hand, like someone holding a boat at its mooring on a windy night: when it pulls you give a palm, when it slackens you take it back. All around, the seals lift their heads at each new shape, and lower them again.\n\nIn the end the old man turns back into an old man, wet and sullen, with his bound hands in his lap. He is all elbows and knees, and he sits crooked, toward the side where the line pulls. Seawater drips from his beard, and where it falls the sand turns dark in patches, as wide as the first big drops of a storm.\n\n“Menelaus, at least, held me with his arms,” he grumbles. The voice of someone woken halfway through his sleep. He holds out his bound wrists toward you, so that you can get a good look at the knot, and makes a craftsman's grimace: it is a good knot, and he knows it. “You people of Ithaca have no respect for anything. Ask, then. One question only.”\n\nTwo questions press on your tongue, the one about the road and the one about the blame, and the old man wants one.","dec":1},"74":{"t":"You say nothing. Not even no.\n\nYou sit down on the free root, the oar across your knees, and you keep your eyes on the old women, still as the sea when there is no wind. They ask. They ask politely, then impatiently, then in the voice that is used with stubborn children. The oldest repeats the same question, spacing out the words; the one with the spindle pulls it from her belt and turns it over in her fingers, empty. The ship's boys make faces at you, and one throws an acorn at you, which bounces off the oar and is lost among the roots.\n\nYou keep silent. You do not tighten your mouth, you do not shake your head; your hands stay on the oar, where you had put them. On board there are words that are not said, and there is a way of keeping silent that leaves no handhold: it is not a refusal, because a refusal is already an answer. It is nothing, and on nothing not even a story can be built.\n\nWithout your words, the wood fills with small noises: the ship's boys' knucklebones starting to click on the root again, a nurse drumming her fingers on her knee, a trunk creaking, a ship's planking settling in the night. Above your head the leaves do not move, not even the dry ones, and the smell of wet bark grows stronger. The root under you is cold, and the moss gives under your palm and springs back by itself.\n\nAfter a while the oldest nurse sighs and puts her hands back in her lap. “This one knows nothing,” she says to the others. “Or else he knows too much.” The ship's boys go back to their games, and no one looks at you anymore.\n\nYou get up, with the oar on your shoulder. The wood opens before you, one trunk after another, and at the far end you can hear a river running. The buzzing of flies, far off, starts again, and stops."},"76":{"t":"You point out the tear to him with a nod. Elpenor hesitates, then slips off his cloak with one hand, passing it over the head that the other is holding up, and lays it on the ground, between the two of you. It is coarse wool, heavy, gray with sand in the folds, and it still carries the smell of another place: wood smoke, spilled wine, the hay of a stable. Without the cloak he has narrow shoulders, and the tunic hangs loose at his neck.\n\nThe needle you have at your belt, where it always is, stuck in a piece of leather together with the waxed thread and the sailmaker's palm. That is wet too, but wax does not fear water. You pull the wool onto your knees and look for the two ends. The tear starts at the shoulder and runs down to the hip, where the cloth touched the ground first, and along the hem a red dust has stayed, the dust of roof tiles. The edges are frayed and no longer meet: you bring them together with your fingers, a palm at a time. You make the stitches small and close, the kind the wind does not undo. The needle goes into the wool with a tiny rustle, comes out, goes in again, and on the silent beach it is the only sound. Meanwhile he talks.\n\n“We had been drinking Circe's wine all night. On the roof it was cool, and I went up. In the morning I heard the voices of my companions leaving and I came down by the shortest way.” He laughs, and the laugh makes his head wobble on his crooked neck. “There's nothing to be ashamed of. I fell all by myself. It's the only thing I ever did all by myself, in my whole life.”\n\nYou cut the thread with your teeth, as your mother did on the last evening with your cloak. Elpenor runs his thumb over the seam, back and forth, the way you check a freshly caulked seam. He puts the cloak back on, still with one hand, and all at once he stands straighter in the shoulders, a sailor whose sail has been put back in order.\n\n“Now listen,” he says, and he shows you the roads with his chin, because with his hand he is holding up his head. “Along the shore you come to where the seals are, and an old man who does not want to be disturbed. In the wood of poplars there are the old nurses, who ask whoever passes for stories. The chariot track is the straightest, but people go by there who have no love for the men of Ithaca. All three lead to the river. I'm going there by my own way, and I'll wait for you there.”\n\nFollowing his chin you see the shore running low until the eye loses it, and among the dunes two paired ruts that go off straight. Behind the dunes the black poplars make a dark wall, motionless. From that side, if you strain your ears, you seem to hear the water of a river, slow, under the silence of the sea.","dec":1},"93":{"t":"The two are here.\n\nNow they have a shape: two old women, tall and bent, made of the same dark that lies between the trunks, with long hands and mouths that open without a sound. Even bent they stand a head taller than you. Where they pass, the leaves of the willows do not move. One comes forward with a heavy tread, which can be heard on the moss where yours cannot; the other makes no sound at all, and every time you find her closer than where you left her. Around them is the air of a room where someone has blown out the lamp. Somewhere among the poplars the ship's boys shriek their names, both of them, the way you sing the end of a nursery rhyme: “Mormo! Gello!” They are the two from the story, the two of the night, and they are exactly as big as your fear of them.\n\nYou raise the oar and strike. The oar passes into the dark, and the dark closes again taller than before. Nothing comes back into your hands. Every blow makes them grow, because to strike them means to fear them, and fear is all they are made of. Even if you knock them down, they rise again whole a pace farther on. At the third blow the nearer one reaches with her head to the first branches of a poplar, and the branches pass through her without bending. When one of those hands brushes you, you feel nothing on your skin: a small thing slips out of your head, the name of the street that goes down to the harbor of Samé, the color of the door of your house.\n\nThe dog growls at the dark, low, without going near.\n\nYou cannot beat them. You can only leave, and the longer you stay, the more it costs you. Behind you, beyond the trunks, you can hear the river.\n\n*Before you manage to turn around, one of those long hands reaches you: lose 2 Vigor points. If you drop to zero, turn to the section of the gray crowd.*\n\n*If you run away, lose 2 Vigor points and turn to §10. If you drop to zero, turn to the section of the gray crowd.*","h":-2,"dec":1},"99":{"t":"You do not take it at once. You untie the string of the little bag you carry at your belt, the one with the salt for fish and for departures, and put a pinch of it on your lips. That is what the old fish salter at the harbor used to do, when he wanted to know where a fish came from without having to open it: salt on his mouth, nose to the gills, and he would say the name of a cove.\n\nThe man waits with the flower held out.\n\nThe salt is yours, coarse-grained, and it stings: salt pan and reef. With that taste on your mouth you smell the flower the man holds before you.\n\nAnd it is strange. The scent is still there, but next to the salt it smells of nothing. The bread, the figs, your mother's wool: they were yours, and the flower only gave them back to you. Underneath there is nothing of its own. Every flower that grows near the sea has a thread of salt among its petals, even the caper on the walls of home. Not this one. This one has never known the sea, not even from far away.\n\nYou take the flower with two fingers and lay it in the grass, the way you set down a thing that is not yours. The grass is so thick that the stem does not reach the ground: it stays up there, lying on the blades.\n\nThe man is not offended. He smiles as before, and the others smile too, kindly, and go back to sitting in the grass, one at a time, where they were. “Another time,” is all he says. No one holds you back.\n\nThe salt stays on your lips, rough, as you turn toward the far end of the meadow. The three roads are where you left them: the thread of smoke rising straight toward what may be a hut, the gray plain with its white flowers and its herds, and the crossroads, where people are still passing with their animals.","dec":1},"119":{"t":"The green of the meadow falls behind, and under your feet the grass becomes beaten earth. The path leads to a crossroads, a place where three roads meet and none feels like beginning. The earth is dusty, marked by the ruts of wheels that no longer pass, and at the roadside stands a stone marker with three women's faces, worn by the wind, each turned toward a road. A little before it, beside the path, there is a black, crooked pine, its bark oozing resin.\n\nUnder the pine an old man sits cross-legged. He is plaiting a rope of rushes, long, handsome, well made, and the rope comes out of his hands and falls to the ground behind him. His fingers work by themselves: three rushes, a turn, a tug, and on by another palm, without his lowering his head. The plait is even, nothing sticks out: at the harbor of Samé a ropemaker with those hands would have a line in front of his shop. The fresh rushes, heaped beside him, have a green smell of ditch water.\n\nBehind him there is a gray donkey, with a white muzzle and patient eyes. She is not tied. The donkey takes the rope in her teeth and eats it, chewing, as fast as he makes it. Between the old man and the donkey's mouth there are ten fathoms of rope, stretched out in the dust: they never become eleven. You can hear the sound of the rushes between her teeth, a contented crunching.\n\nThe old man knows. He turns, looks at her, and smiles: a real smile, the kind that asks for nothing.\n\n“Ocnus,” he introduces himself, without stopping his fingers. “I make ropes. She eats them. We have been going on like this since there was still a sun.”\n\nAlong one of the roads, far off, someone curses, and a sound of bronze on stones, clack and clack, moves away hopping. Ocnus laughs out loud. “That one, with the crooked leg? Don't worry. My donkey chases her off with her braying.”\n\nA rope like that, if the donkey didn't eat it, would come in handy for anyone. If you know your knots, you could show him a knot he doesn't know: among people of the trade it is a gift. If you know caulking, there is all the resin you want on that pine, and a pitched rush no longer tastes of anything. You can also try to distract the donkey: tufts of asphodel grow at the edge of the road, and she has been eating rushes for a long while. Otherwise you say goodbye to him, and the crossroads is right there, a few paces away.","dec":1,"img":2},"145":{"t":"Halfway down the slope the green grass of the meadow ends sharply: from there on down there are only flowers.\n\nThe plain is bigger than anything you have ever seen from land. The asphodels come up to your knees, white and thick, with star-shaped flowers on top of straight stalks, and they never end. You look for a point to set your course by, a tree, a roof, and you do not find one. The flowers have a strange smell, bitter at the bottom and sickly sweet at the top, like a bunch left one day too long in the vase. Under the blooms the grass is dry and crackles at every step. Above, the sky is of stone.\n\nIn the middle graze herds of black cows that do not low. They crop the asphodels down to the root, and they do not fatten: under the hide their hips make two points. Of them you hear only the tearing of the stalks between their teeth.\n\nThe plain is cut by a dark water, as wide as a road. The asphodels stop a pace from the bank, and on the bare earth the holes of the hooves remain. Beside the ford, leaning on a shepherd's staff, is a herdsman with a face of leather and one side that he holds crooked, like a man who still carries in his ribs a squeeze from many years ago, and has never forgiven the one who gave it to him. He has a cloak of cowhide with the hair on the outside, and at his belt a horn for calling the beasts. His hands, one on top of the other on the head of the staff, are broad and full of knots, and they do not move when you arrive.\n\n“Another one,” he says, without a greeting, and spits in the water. The spit stays afloat. “The last one who came down with that look took my best cow and squeezed my ribs until the queen told him to stop. A hero. I am Menoetes, and the herds of the Asphodel Plain are in my keeping, and have been for centuries. I know heroes.”\n\nHe sizes up your oar, then you again, with the look of a man counting beasts from far off. “Who are you? And what do you want with my beasts?”\n\nThe dog sniffs the water of the ford and draws back, with his ears low. The water is still and black, and the bottom cannot be seen: not a stone breaking the surface, not a ripple to say where you can touch. Not even the cows drink from it: they stand on the bank, with their muzzles just above the surface.\n\nMenoetes waits for your answer, and meanwhile spits once more. You could tell him who you are with the whole family name, which usually opens doors. Or the simplest truth: that this water frightens you. And if you know how to use the sounding line, you could lower the lead and measure the ford before you even answer.","dec":1},"146":{"t":"The shore of Ocean runs long and low, and the sea beside you makes no sound even where it breaks: the wave comes in, spreads, draws back, and leaves a dark line that dries before you have passed it. You walk on the edge, where the sand is firm, and the only sound is your step. On the waterline there are tufts of dry seaweed, which crumble underfoot. On the other side the dunes rise low, the color of ash, and close off the view.\n\nOn a low rock, edged with dried salt, sits a young woman. Her wet hair is stuck to her back and, on her shoulders, she has a few feathers of a blue so bright that it is the only color on the beach. She holds her arms around her knees and her gaze on a point of the horizon, like someone waiting for a sail on a course she knows. Her feet are bare, and her toes grip the edge of the rock. Beside her, on the stone, there is a row of empty shells, set in order from the largest to the smallest: a count of days.\n\nYou come up below her.\n\n“What was your ship like?” she asks, without turning.\n\nYou tell her: a cargo ship from Samé, with the salt of Leucas in her hold. She was called the Alcyone.\n\nThen she turns: her head alone, with a jerk, and her shoulders stay toward the sea. Her eyes are dark and round, almost without white, a seabird's eyes. “I am Alcyone. The sea took my husband, and I threw myself in after him. The gods made us birds, and for me they hold the winds seven days every winter. The one who flies is up there. Here is the part of me that drowned.” When she speaks of her husband her voice drops, and the feathers on her shoulders lift a little, without wind, and come back down. She turns back toward the sea. “A ship with my name should not have gone down.”\n\nShe tells you that down here the sea repeats in its sleep the things it has seen. With her arm stretched out she points along the shore. “On the shore of the seals there is still the old man that Menelaus held and never once let go. He changes shape to make you release him. Whoever holds him to the end has a right to one question. If you go there, don't let go of him, whatever he becomes.”\n\nFarther on, where the shore makes a pool, a boy is lying on his stomach and looking at the water. Beyond, the backs of the seals glisten.\n\nIf you know the custom of salt, you could make her the gesture that in Samé is made to those who are leaving: a pinch on the shoulder.","dec":1},"158":{"t":"Before answering you untie the lead and the line from your belt. You smear a finger of tallow in the hollow: on board it serves to bring up a taste of the bottom. You go up to the brink, with the oar in the crook of your elbow, and lower the lead into the ford.\n\nThe line goes down and runs between your fingers, damp and rough. You count the knots that pass under your thumb: three fathoms, four. Too much, for a ford. The water makes no rings around the cord: it simply swallows it. The lead touches without a knock, on a soft bottom, and the line goes slack in your hand. You haul up, and it drips a black water that does not glisten. In the tallow there is a dark, fine mud, which smells of rotted leaves and old iron, and in the middle of the mud a bright, hard grain, the size of a lentil.\n\nMenoetes has stopped spitting. He stares at your hands, and his face of leather slackens by one crease.\n\n“You measure before you go in,” he says. “Heroes just go in, and then the water is my fault.” He picks the grain out of the tallow with his nail, with the gesture of a man prying a stone from a hoof, takes it and turns it between two fingers. “Bronze. Come, I'll show you.”\n\nYou gather the line in coils on your palm, hang it back on your belt and go after him.\n\nOn the path, among the tracks of the cows, there are other drops like it, set and hard, in a row, one long stride from each other. Metal poured and left to cool. The asphodels around are all bent the same way, as if someone very heavy had passed beside them, more than once.\n\n“One who is all of bronze passes this way. He makes his round of the great plain, beyond the river, as he used to around his island. And he leaks. Look where they fall: always beside the heel, never on the side of the toes. A beast that limps leaks from one leg only.”\n\nHe takes you farther downstream, far from the main path, where the river widens over a bed of pale gravel and the water barely reaches the ankles: here you can see the bottom, stone by stone. The cows cross it in a line, one behind the other, without raising their heads, and the pebbles rolling under their hooves are the only sound of the ford. “This is the shallow ford. The hunt does not pass this way. On the other side are the houses of the women of Ithaca: you talk like them.”\n\nHe raises his staff toward the other bank and goes back to his cows.\n\n*Note on your sheet: “you saw the drops of bronze”.*","f":"you saw the drops of bronze"},"164":{"t":"The wood begins where the sand ends: black poplars tall and straight, willows with their branches down to the ground, and underneath a green dark that smells of wet bark and standing water. The trunks stand three arm's lengths from one another, without a bush between them, and when you touch one it is cold and leaves a black line on your fingers. The leaves do not move and do not fall: even the dry ones stay on the branches, curled up, and on the ground there is not one.\n\nFrom far off, beyond the trunks, comes a buzzing, like blue flies around scraps left in the sun. Then it stops.\n\nIn a clearing, sitting on the roots, are some old women with their hands in their laps and their hair gathered up like the nurses of good houses. A willow lets its branches hang almost onto their shoulders, and for them it is the roof of home. They wear dresses of dark wool, carefully mended, and one still carries a spindle stuck in her belt, without thread. Their hands are broad, with big knuckles, and their faces faded, the color of wool washed too many times. Around them, crouched on the ground, a dozen boys in ship's boys' tunics nudge one another. Their knees are dirty with earth, and one holds a piece of frayed line by one end, and now and then gives it a tug, to watch it crawl. Two are playing knucklebones, and the little bones strike the root with a dry ticking, the only sound in the clearing.\n\n“A new one!” shrieks a ship's boy. “Make him tell it!”\n\nThe oldest of the old women beckons you closer, with two fingers, without lifting her hand from her lap. She has a small face, all folds, and a low voice, a little hoarse, from a lullaby sung a thousand times. “The story of the two,” she says. “The one you tell to those who will not sleep. We have told it so many times that it no longer frightens anyone. You tell it, since you are new. You say their names.” She leans out from the root and lowers her voice: “Only once, though. If you call them twice, they come.”\n\nThe ship's boys fall silent and stare at you with their mouths open; a knucklebone stays in a closed fist. The old women wait. In front of them there is a free root, as wide as a rowing bench; behind them the wood goes on.\n\nIf you know which words are not said on board, you also know that to certain questions you do not answer even no: you could stay silent, simply, until they tire of asking.","dec":1,"img":3},"169":{"t":"“Mormo!” you shout toward the dark. “Gello! Go away!”\n\nThe old women cover their mouths with their hands. The ship's boy who had advised you to do it is no longer laughing, and in the clearing even the ticking of the knucklebones dies away.\n\nThe two come. They do not run: they are already here, because called twice they have no need to make the journey. They bend over you, curious as little girls before a present, and take your name in place of theirs. It does not hurt. They slip it off you gently, the way a ring is slipped from a wet finger, and the last thing to go is your mother's voice saying it.\n\nThe dog sniffs your hand, for a long time. He turns and goes off among the poplars.\n\nFrom that moment the story is you. The nurses of Ithaca tell you in the evening, in a low voice, to quiet the children who will not sleep, and no one knows anymore that once you were someone with a name.\n\n*You have forgotten your name. You are a nameless shade, one of the gray crowd. Your story ends here. Amphialus is waiting for you on the beach, at section 1.*"},"171":{"t":"For now you ask him nothing. You draw the stool up to the flame, the oar across your knees, and sit staring at the fire.\n\nIt is a fine fire, a night-watch fire, built to last. The oak burns with a low yellow flame, and now and then a knot in the wood bursts and sends up a handful of sparks that die against the black beams. Above the embers the air trembles, and the light moves over the ash wood of the oar, from the grip to the blade. Eumaeus takes a branch of mastic as thick as a thumb and breaks it over his knee, at the first try: he has big hands. He throws it in, without hurry. “Mastic,” he says. “Like the hedges at your home.” The leaves curl one by one, the bark sizzles and foams at the tip, and the hut fills with a resinous, green smell.\n\nThrough the door you can see a piece of hillside, white with flowers. From out there comes not a step nor a voice: there is only the wood burning.\n\nClimbing the path you had a question ready, the first you wanted to ask him. Now you look for it, and it is not there. You know it was about home: it is a word on the tip of your tongue, which moves away if you chase it. The others are left, the road and your father. But beside this flame even those seem able to wait.\n\nThe dog gets up from where he had curled, at your feet, and goes to sit on the threshold. He settles with his muzzle toward the path, his ears pricked, and from there he does not move.\n\nOn the other side of the fire Eumaeus smiles at the flame, glad to have a guest who is in no hurry. The ash wood weighs on your legs: to get up, you need only plant it on the ground.\n\n*Lose 2 Vigor points. If you drop to zero, turn to the section of the gray crowd.*","h":-2},"172":{"t":"The three coils come loose from your arm all at once. The serpent shortens suddenly, swells, grows legs. You are gripping a panther with a yellow coat, spotted with black rosettes, long and taut: a strung bow. From its muzzle to the root of its tail it is as long as you are. You have caught it from behind, under the forelegs, and you hold it against your chest; the tail whips your calves. The fur is short and smooth under your fingers, and under the fur the muscles run like mice in a sack. It is less strong than the lion and much quicker: it twists to the right, to the left, to the right again, and its claws feel for the sand, then for the hem of your cloak, and the nails scrape over it like the strokes of a file. They are pale, curved, half a finger long. The wool holds.\n\nIt hisses, with bared teeth, and a sweetness of overripe figs hangs in the air. It has yellow eyes, and it is not looking at you but at the sea, where it wants to return. At the far end of the shore a seal that has stayed behind has raised its head and stares at the two of you, motionless: an old woman at her door.\n\nThe panther braces its hind legs against your thighs, stretches, gains a palm. You take it back. It tears another from you on the other side.\n\nYou realize that your hold is slipping all the same, little by little, like a wet line. And every time he changes skin you start over from the beginning, with a new beast and the same hands as before. Perhaps this is how one lets him go: not all at once, but one shape at a time."},"173":{"t":"The dog goes ahead of you along the waterline. After a stretch he sits down, and you see why.\n\nOn a trunk bleached by salt, half buried in the sand, there is a boy a little older than you. He holds up his crooked head with one hand under his jaw and trembles slightly, without ever stopping. He is barefoot, his belt undone, his cloak torn from shoulder to hip.\n\nHe makes room for you on the trunk, as among men of the same bench, and you tell him who you are.\n\n“Elpenor,” he says. “Of your uncle's ship. The youngest.” He looks at the dog. “He is of the breed of Laertes's dogs. If he follows you, you are family.”\n\nOn Aeaea, he tells you, he drank too much and climbed up to sleep on Circe's roof; in the morning he heard his shipmates leaving, came down the shortest way and broke his neck. “I have no one to blame: I fell by myself. About his own death, here, no one can lie. About the rest, yes.” Your uncle came back to bury him, with the oar planted on the mound. “In a hurry, though. My name, with the shipboard rite, no one said it. And the sea took the oar.”\n\nAeaea, the roof, the broken neck: more than ten years ago. Then this coast you did not recognize is the shore of the dead.\n\n“What do they say in Ithaca?” You tell him that Laertes still hoes the garden, and he listens with his eyes closed. “That is how you pay here, in news from up above. You have more than anyone.”\n\nYou make to lay a hand on his shoulder. He draws aside, gently, without offense.\n\n“I was there, when your uncle tried it with his mother, your grandmother. Three times. His arms passed through her as through smoke. Blows, no: those land.” He says it the way a pilot points out the depth of a harbor: it holds for whoever enters. “But they leave no bruises: they take something from you, the name of a street, a color. Hold on tight to your name: here it is the name that gives the shape, and whoever loses it becomes crowd. And take nothing from us to eat or to drink: whoever eats with the dead stays with the dead.”\n\nHe lowers his voice. “Your uncle arrived here alive, to question the seer, and left at a run: he was afraid the queen would send the Gorgon's head against him. They say she keeps it under a veil.”\n\nThe sea threw you where your uncle arrived, you think. He came with a ship, you with a single oar. But from here he got away.\n\nHe gets up, holding his head. “You reach the Acheron by three roads: the shore of the seals, the wood of black poplars, the chariot track. I am going by my own. We will meet again on the bank.”\n\nIf you know the shipboard farewell, you could say his name for him with the rite; if you know how to mend a sail, you could close the tear in his cloak with the needle you carry at your belt.","dec":1,"img":4},"174":{"t":"The sow folds her legs and sinks onto her side, no longer snorting. The landing shore is left behind you. From ahead comes a sound of very rapid footsteps, and you just have time to step aside: they are women in red robes, with bared white teeth, and they are running toward the rock where the boat is unloading more people. They pass you without turning, one, three, seven, with their feet barely touching the sand, and vanish toward the river.\n\nBeyond the shore a meadow begins. The black sand ends sharply, and after it there is the only green thing you have seen down here: a tender, low grass, so thick that your steps make no sound. A soft air passes over it, smelling of freshly cut hay. In the grass sit men and women who smile. They wear light clothes, for a summer feast, garlands woven in their hair, and no one has anything in their hands: not a tool, not a staff, not a bag. They get up when they see you, all together, and come to meet you with the slow step of people who have nowhere to go. A little farther on someone has left a fish trap half undone, and flowers have grown inside it.\n\n“The Keres,” says one of them, and with his chin he points to the road the red women came by. “They are always running. Here no one runs.” He gives a half laugh. “We are the Lotus-Eaters. We eat the lotus, and we lack nothing.”\n\nThey are the kindest people you have ever met. The man who spoke holds out a flower to you. His palms are white and soft: for a long time they have gripped neither a line nor a hoe. The flower is white and yellow, with a dark heart, and it smells of home: of bread just out of the oven, of figs in the sun, of your mother's wool, of whatever you want. The scent reaches you before the flower, and spreads over the marsh smell of the river like a clean cloth hung out to dry.\n\nYou are not hungry. But the flower is so beautiful.\n\n“Stay,” says the man. “It will not hurt you. You will never have to leave again.”\n\nYou still have in your ears the voice of Elpenor on the trunk, with his hand under his jaw: whoever eats with the dead stays with the dead. But these people smile the way people smile at home, and the flower is there, a palm from your mouth.\n\nIf you know how to salt, you could tell where this flower comes from without even tasting it: a pinch of your salt on your lips, and the scent would tell you how far away the sea is.\n\nFrom the meadow three roads can be seen. One climbs toward a thread of smoke, where perhaps there is a hut. One goes down into a plain covered with white flowers as far as the horizon, where herds graze. The third goes toward a crossroads, where people pass with their animals.","dec":1,"img":5},"201":{"t":"“Your mother?” Eumaeus laughs, and the flame rises with him. “Your mother was a scourge.”\n\nHe tells you about the fig tree behind the house of Laertes, the one with the crooked branch that goes over the wall, and with his forearm he draws it for you above the fire. Ctimene used to climb it when the figs were still green and hard, fill her apron with them and eat them unripe, with her fingers white with milk, which then stayed sticky all day long. In summer, under that fig tree, the air smelled of warm leaves and sweet resin, and the wasps buzzed over the split fruit. Old Laertes would find the branches bare and take it out on the swineherd boy, because a swineherd boy is always the first suspect.\n\n“And she would come out from behind the wall, no bigger than this, with her hands still sticky and her knees skinned, and say: it was me. Every time. She got herself scolded in my place.” His flat hand has stayed in midair, at the height of the table. He lowers it, shakes his head, and a thread of ash slides off his shoulder. “A king's daughter, taking a swineherd's scoldings.”\n\nIn the hut the smoke rises straight and is lost among the boughs of the roof. From the empty pen not a grunt comes. All you can hear is the oak working in the embers.\n\nEumaeus gets up, rummages in a basket hanging from the beam and comes back with a bundle wrapped in a fig leaf: a flat, hard cake, with a hole in the middle, that smells of barley flour and ash.\n\n“This is the cake for the dog at the gate. The one you put in the hand of someone going on a long journey, for the big dog that stands guard. You never know.” He holds it out to you, and waits for you to tie it to your belt. You take it: through the leaf you feel under your fingers the hole in the middle and the barley grains of the crust. You tie it on, and he nods. “The old mistress is farther down, with the women of Ithaca. Your grandmother. She still weaves. Go and see her.”\n\n*Note on your sheet: “you know Ctimene as a child”.*","it":"Cake for the Dog at the Gate","f":"you know Ctimene as a child"},"202":{"t":"The boat arrives without a sound of oars, though the oars are there. It cuts across the current and does not drift a palm. It is long and low, black with pitch that is flaking off, and at the stern, standing, is an old man with a dirty beard and eyes like embers. He has a patched cloak knotted on one shoulder and thin arms, with the tendons standing out from wrist to elbow.\n\n“Charon, the ferryman,” Elpenor tells you under his breath, as the boat comes alongside. “The old man has ferried living people too. Heracles, Theseus, Orpheus. All people from important families.”\n\nCharon plants the pole in the mud, and the thud is the only sound, dull. The bow touches the gravel. Those who are waiting come forward all together, and Charon stops them with the oar held crosswise, like a shepherd. No one pushes and no one raises his voice: they stop against the wood, with the water at their ankles. The first in line is a man with the clean cloak of funerals and a lost look, and on his head he still has the wreath of leaves his family put on him. He opens his mouth: under his tongue he has a coin. Charon takes it with two fingers, looks at it against the light, tucks it into his belt and pushes him aboard. The man sits down in the bow, stiff, with his hands on his knees, and does not turn around again.\n\nThen Charon looks at you. He looks at the oar, your wet hair, and the dog, who has already jumped aboard and curled up on the bottom, among the boards that smell of pitch. He shifts half a step and makes room for you, without asking you anything. From close up the planking smells of old burning, and on the bottom stands a finger of dark water that no one bails.\n\nElpenor does not move. Charon does not even look at him, and he does not try to get in.\n\n“I'm waiting for my oar,” he says. “Until there is one on my mound again, that one won't take me.”\n\nYou have one foot in the boat and one on the gravel. Under the foot inside, the boards give a little, like the deck of a ship at anchor. Elpenor watches you get in, with his head tilted on his hand, his bare feet planted among the stones two paces from the water.\n\n“The king's nephew crosses,” he says. “I don't.”\n\nHe says it without bitterness, the way you say which way the wind is blowing. People from important families, he said. You think of your uncle, and of how much his name weighs even down here.\n\nBehind you Charon knocks the oar on the gunwale, once: he will not wait. Elpenor is waiting for something from you, and does not ask for it.","dec":1,"img":6},"204":{"t":"You realize you no longer remember what color the door of your house was.\n\nYou think about it, and it does not come. Was it blue? Was it bare wood? You see the bolt, and a hand drawing it, and around the hand the door has no color anymore. While you are thinking about it, the name of the street goes. After that goes your mother's name: you know you had it, you feel it the way the tongue feels the place of a missing tooth. Then your own.\n\nYou try to say it. Only the first syllable comes out, and even that does not seem yours.\n\nAround you there is a gray crowd, dense, looking at nothing. It has no smell and no voice: only a rustle of feet going nowhere. The crowd of the Asphodel Plain opens to make room for you. Somewhere, outside, a tawny dog stays sitting with his muzzle raised, waiting for someone who does not come out.\n\nThe crowd closes again.\n\n*You have forgotten your name. You are a nameless shade, one of the gray crowd. Your story ends here. Amphialus is waiting for you on the beach, at section 1.*"},"209":{"t":"The seals are there by the dozen, stretched on the gray sand like sacks unloaded from a ship. Here the shore widens into a flat tongue, with a row of low rocks toward the open sea, and there are some on those too. They stink of fish and seaweed, the only strong smell on the shore, and they do not move when you pass: the biggest are as long as a man and as wide as two, and they follow you with one eye only, without raising their muzzles. Now and then one snorts through its nose, or scratches its belly with a flipper, and the skin on the sand makes a rustle of cloth. Among the beasts the ground is full of fishbones and broken shells, and gray feathers of birds that do not fly here. The dog keeps well clear, with his ears low.\n\nAfter a while, an old man comes out of the water. He is thin, with long arms and shoulder blades that stick out of his back. He has a beard white with foam and glistening skin, the same as his beasts'. He walks among the seals and counts them, touching them one by one on the head: a shepherd counting his sheep in the evening. One blocks his way, twice his size: he moves it aside with his hip, without stopping. He moves his lips, loses count, starts again. At last he lies down in the middle of them, pulls a strip of seaweed over his face for a blanket and falls asleep.\n\nA few paces away, under four sealskins, lie as many shapes of men, still, blurred at the edges like figures painted on a vase and left half done. One already has his hand raised; another has his mouth open on a shout that does not come out. It is the ambush of Menelaus and his companions, repeated by the sea and stopped just before the leap: a story whose sequel has been lost.\n\nThe old man sleeps three paces from you, on his side, with his knees drawn up, and snores: a backwash that the sea, here, does not make. Alcyone said that whoever holds him to the end has a right to one question, and that you must not let go of him, whatever he becomes.\n\nIf you know how to tie knots, the line you carry coiled at your belt would hold him better than hands: a knot does not tire and is not afraid. Otherwise there are your arms: two, where Menelaus brought eight. And the old man can also be left to sleep, while you climb back toward the river, beyond the dunes.","dec":1},"212":{"t":"Behind you the donkey chews, and Ocnus laughs at something she has said to him, or that he thinks she has said. Under the pine the rope goes on being born and disappearing.\n\nThe crossroads is a few paces ahead, where the earth divides. In the dust the ruts of wheels cross, old and hardened, a palm deep: the earth has taken the shape of the rims and kept it. In one rut lies the nave of a split wheel, cracked by time. The stone marker stands at the roadside, as high as your chest; from close by the three faces no longer have nose or mouth, and each looks its own way. The air smells of old leather and trampled rushes.\n\nOne road climbs narrow among the stones: there are prints of hooves and of boots, and higher up, far off, a mule driver cursing his beast. It is the shortest, you can tell by the direction; but on that road there is no one else, and those who pass the crossroads turn their heads the other way.\n\nThe other goes down gently. A line of people walks along it in silence, one behind the other, unhurried, and their feet raise a low dust that never quite settles. You go closer. A man says two words to the one in front of him, under his breath, and you know the accent: they are from Ithaca, and they are going down toward the houses where their women are. One carries a rolled net on his shoulder, with the lead weights knocking together at every step; another, a woman, has a spindle stuck in her belt, and her hand goes back to it now and then, to feel if it is there. An old woman turns, recognizes the family face and makes room for you in the line without saying anything: she slows by half a step, and between her and the man with the net a gap is left that walks with the others.\n\nFrom the climb, the mule driver curses once more."},"217":{"t":"You sit down beside him and ask him for an end of the rope. Ocnus passes it to you, curious. The rushes are still damp from the ditch, smooth and cool under your fingers, and plaited so tight that a needle would not pass through. From close by the old man has nails green with sap, and on his fingertips the lines that the edge of the rushes leaves there.\n\nYou make a bowline: the loop that on board is made in the dark, with one hand, and that holds a man hanging above the sea without tightening by a finger. An eye in the rope, the end that passes up through it, goes around behind and comes back down the way it came. The rush creaks as you pull it. It holds. You give it a push with your thumb: it comes undone.\n\nOcnus watches your hands with the narrowed eyes of one who has recognized an equal. He makes you do it again twice, then he does it himself, with his knotty fingers going slowly, gets it wrong, laughs, does it right. He does it a third time, for the pleasure of seeing it come undone.\n\n“I didn't know this one,” he says. “After all this time.” He cuts the rope with his knife, before the donkey gets to it, and winds it into a coil between his elbow and his thumb, in even turns. It is the rope of rushes: ten fathoms of rush plaited tight, smelling of fresh water and of earth. “Here. Between equals, a rope is a gift.”\n\nYou take it and tie it to your belt. It weighs little, and it knocks damp against your side. The donkey stares at the coil and sighs, with a long breath that swells her nostrils.\n\nA few paces ahead, at the crossroads, two roads start. One is narrow and climbs among the stones, with prints of hooves and of boots in the dust. From up there comes a knock of bronze on stone, just one. “That is the mule driver's road,” says Ocnus. “It cuts short, but it is lonely.” The other goes down gently, and a line of people walks along it in silence, all at the same pace. “Those are from Ithaca: they are going down to their women. They take longer, but they get there.”","it":"Rope of Rushes"},"222":{"t":"There is no need to touch him. On board, when the sea does not give back a shipmate, the farewell is made all the same, over the empty place: the hands know what to do even a hand's breadth away.\n\nYou lay the oar beside you and kneel in front of him, on the damp sand that keeps the shape of your knees. You take seawater in the hollow of your hand (it is still and cold, and makes no sound even when you pour it) and let it fall on the sand before his feet, three times; the sand takes it without leaving a mark. Then with two fingers you sew the air around him, from his ankles to his neck, one stitch after another, the way a shipmate is sewn into the sail. Elpenor watches your hands without saying anything. On the beach nothing moves, not even the empty shells, which the sea no longer turns over.\n\n“Elpenor,” you say. “Of the ship of Odysseus. Oar of Ithaca. You have pulled your stretch.”\n\nThe rest of the rite is said to those who ended in the sea, and he fell from a roof. For him the name is enough.\n\nFor a moment the trembling stops. Elpenor takes his hand from under his jaw, and his head stays straight by itself, for the time it takes to count to three. In that time he has the face he must have had on his first day at the bench: a boy from Ithaca with freckles from the sun and the wish to see the world. His fingers have stayed in midair, under his chin. The head begins to bend again, a little at a time, the palm gathers it up, and the trembling starts again, lighter than before.\n\n“On Aeaea there was no time,” he says. “Your uncle was in a hurry. He was always in a hurry, when it came to going home.” He gives a smile as crooked as his neck. “Come. There is a road among the dunes that goes by way of nowhere: I am the only one who knows it, and it gets to the river sooner.”\n\nYou get up with the sand stuck to your knees and take up the oar again. You follow him up the first dune, which slides at every step and has to be taken at a slant; he climbs ahead of you barefoot, with his elbow high, and does not slow down. On the other side the sand turns darker and firmer, a thin, hard grass grows on it that rubs your ankles, and the air begins to smell of stagnant fresh water and of reeds."},"236":{"t":"You walk around the old man and go to the pine. The bark is rough and scaly, and where you cut it with the point of your knife a shining thread runs out. Lower down, where the trunk has split by itself, the old resin has made lumps as big as a walnut. You gather one, black and sticky, that smells of burned forest. You work it between your fingers until it turns soft, like the pitch that on board is spread on the seams, and you seem to be on the slipway at Samé, with the cauldron smoking and the seagulls on the ridges of the roofs.\n\nYou take the end of the rope that comes out of Ocnus's hands and pitch it, a palm at a time, rubbing well between the rushes, until the green turns brown and shiny. Your thumb goes black to the knuckle, and the resin pulls threads between one finger and the next.\n\nThe donkey stretches out her muzzle. She sniffs. She curls her lip over her long yellow teeth, snorts, and turns the other way with the offended dignity of a queen.\n\nOcnus stops plaiting. He studies the rope, then the donkey, then you. He starts again, faster, and you pitch behind him, palm after palm. The heap of rushes goes down. The rope, which no one eats anymore, lengthens in the dust in a brown line, until after all those centuries it comes to the end: the last rush goes into the plait, and the old man is left with his hands empty above his knees. Ocnus laughs so hard that the pine loses two needles.\n\n“Finished,” he says, and lifts the end of the rope so that the donkey can see it too. “Finished!” He cuts the first piece, ten fathoms, and winds it into a coil. It is the rope of rushes, the first he has ever finished. “The first piece is yours. Without you it would already be in that one's belly.” You take it, and tie it to your belt. On your fingers the smell of the resin stays, sweet and burned together.\n\nA few paces ahead, at the crossroads, two roads start. One climbs narrow among the stones, with prints of hooves and of boots: the mule driver's road. Among them there is one that is neither hoof nor sole, and has no mate: it is stamped in the hard earth deeper than all the rest. “It cuts short, but it is lonely,” says Ocnus. The other goes downhill, and a line of people from Ithaca walks along it, in silence, toward the houses of their women. “They take longer, but they get there.”","it":"Rope of Rushes"},"240":{"t":"Among the asphodels the path climbs toward a thread of smoke that does not bend. The dry grass crackles at every step. At the top there is a hut of dry stone and branches, and beside it an empty pen, its fence of mastic wood still tied with withies, and a smell you have always known: acorns and the smoke of green wood. In front of the door, on the ground, there are split shells and a dry stone trough.\n\nIn the doorway stands an old man with broad shoulders and hands black with earth, leaning on a staff. The wrinkles of his face all run toward his eyes. Eumaeus. The same man who came by your house on Ithaca every morning, with that smell on him, and drank at your well as if it were his own home.\n\nYou stop on the threshold, with the oar in your hand, and do not go in.\n\nEumaeus does not look at you. He looks at the dog. He kneels in front of him, one knee at a time, holding on to the staff, and the dog sniffs his hand, from the wrist to the knuckles. Eumaeus's eyes fill. “Of the breed of Laertes's dogs,” he says, his voice cracking. “I thought there were none left to be seen.” The dog sniffs at the hem of his tunic, his sandals, his sleeve, and he lets him. “He
