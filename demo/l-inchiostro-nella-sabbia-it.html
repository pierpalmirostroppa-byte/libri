:root{--suoro:#ffffff;--fondo:#2a2622;--fondo2:#121110;--carta:#faf7f1;--inchiostro:#191817;--accento:#2b2825;--oro:#d2482f;--rosso:#a3301f;--velo:rgba(43,40,37,.1)}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--inchiostro);
  background: var(--fondo2) linear-gradient(180deg, var(--fondo) 0%, var(--fondo2) 100%) fixed;
  font-family: 'EBG', 'EB Garamond', Garamond, 'Times New Roman', Georgia, serif; font-size: 19px; line-height: 1.6;
}
#app { max-width: 700px; margin: 0 auto; padding: 0 0 48px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; }
a { color: inherit; }
.btn {
  display: block; width: 100%; margin: 9px 0; padding: 11px 16px; border-radius: 6px; cursor: pointer;
  font-size: 18px; line-height: 1.35; text-align: center; text-decoration: none;
  background: transparent; color: var(--inchiostro); border: 1.5px solid var(--accento);
}
.btn:hover, .btn:focus-visible { background: var(--velo); }
.btn:focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; }
.btn.primo { background: var(--accento); color: var(--carta); border-color: var(--accento); font-weight: 600; }
.btn.primo:hover { filter: brightness(1.12); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.scelta { text-align: left; background: #fffdf7; }
.btn.scelta:hover { background: var(--velo); }
.btn.chiusa { opacity: .55; background: transparent; border-style: dashed; }
.btn.chiusa small { display: block; font-size: 15px; font-style: italic; }
.btn.prova { background: var(--oro); border-color: var(--oro); color: var(--suoro); font-weight: 600; }
.btn.mini { display: inline-block; width: auto; margin: 0; padding: 4px 12px; font-size: 16px; }
.btn.chiaro { color: var(--carta); border-color: var(--carta); margin-top: 14px; }
.copertina { text-align: center; padding: 22px 18px 10px; color: var(--carta); }
.cop { display: block; width: 100%; max-width: 420px; margin: 0 auto 14px; border-radius: 3px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.etichetta { margin: 6px 0 0; font-size: 15px; letter-spacing: .22em; text-transform: uppercase; color: var(--oro); font-weight: 600; }
.sotto { max-width: 440px; margin: 8px auto 14px; font-size: 19px; }
.copertina .pulsanti { max-width: 380px; margin: 0 auto; }
.copertina .btn { color: var(--carta); border-color: var(--carta); }
.copertina .btn.primo { background: var(--oro); border-color: var(--oro); color: var(--suoro); }
.firma { margin-top: 18px; font-size: 16px; letter-spacing: .08em; opacity: .9; }
.foglio {
  background: var(--carta); margin: 14px 10px 0; padding: 18px 20px 22px; border-radius: 4px;
  box-shadow: 0 6px 24px rgba(0,0,0,.35);
}
.foglio h2 { margin: 4px 0 10px; text-align: center; font-size: 27px; font-weight: 600; color: var(--accento); }
.foglio h3 { margin: 22px 0 4px; font-size: 21px; font-weight: 600; color: var(--accento); border-top: 1px solid var(--oro); padding-top: 14px; }
.nota { font-size: 16px; font-style: italic; margin: 4px 0 10px; }
.regole p { margin: 0 0 10px; }
.valori { display: grid; gap: 6px; }
.valore { display: grid; grid-template-columns: 1fr auto 2.2em; align-items: center; gap: 10px; padding: 6px 10px; background: #fffdf7; border-radius: 6px; border: 1px solid var(--velo); }
.vnome { font-weight: 600; }
.vdadi { display: flex; align-items: center; gap: 5px; }
.piu { font-size: 16px; }
.vnum { font-size: 24px; text-align: right; color: var(--accento); }
.doti { display: grid; gap: 6px; }
.dote { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--velo); background: #fffdf7; cursor: pointer; line-height: 1.35; }
.dote input { margin-top: 5px; width: 20px; height: 20px; accent-color: var(--accento); flex: none; }
.dote small { font-size: 15.5px; }
.dote .bonus { font-size: 15.5px; color: var(--accento); }
.dote.scelta { border-color: var(--accento); background: var(--velo); }
.barra-doti { position: sticky; bottom: 0; margin: 12px -20px -22px; padding: 10px 20px 14px; background: var(--carta); border-top: 1px solid var(--oro); display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; align-items: center; }
.barra-doti #conta { grid-column: 1 / -1; text-align: center; font-size: 16px; }
.barra {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 12px; background: var(--fondo2); color: var(--carta); font-size: 17px; border-bottom: 1px solid var(--oro);
}
.barra b { color: var(--oro); font-weight: 600; }
.barra .r.basso { color: #ffb3a6; }
.barra .btn.mini { margin-left: auto; color: var(--carta); border-color: var(--carta); }
.palline { display: inline-flex; gap: 4px; }
.palline i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--oro); }
.palline i.usata { background: var(--oro); }
.num { text-align: center; font-size: 26px; font-weight: 600; color: var(--accento); letter-spacing: .05em; }
.num::after { content: ''; display: block; width: 46px; height: 2px; margin: 6px auto 12px; background: var(--oro); }
.ill { margin: 0 -20px 14px; }
.ill img { display: block; width: 100%; height: auto; }
.testo p { margin: 0 0 .8em; }
.nemico { margin: 0 0 10px; padding: 6px 10px; border-left: 3px solid var(--rosso); background: #fffdf7; font-weight: 600; }
.nemico small { font-weight: 400; }
.note { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.note span { font-size: 16px; padding: 3px 10px; border-radius: 14px; border: 1px solid var(--accento); background: #fffdf7; }
.note .nota-male { border-color: var(--rosso); color: var(--rosso); }
.azioni { margin-top: 14px; border-top: 1px solid var(--oro); padding-top: 8px; }
.riquadro { margin: 10px 0; padding: 12px 14px; border: 1.5px solid var(--accento); border-radius: 8px; background: #fffdf7; }
.titolo-r { margin: 0 0 6px; text-align: center; font-weight: 600; font-size: 20px; color: var(--accento); letter-spacing: .03em; }
.esito { text-align: center; font-weight: 600; font-size: 21px; margin: 6px 0; }
.esito.ok { color: #2f6b3a; }
.esito.ko { color: var(--rosso); }
.dadi-grandi { display: flex; justify-content: center; align-items: center; gap: 8px; min-height: 58px; flex-wrap: wrap; margin: 6px 0; }
.somma { font-size: 24px; font-weight: 600; }
.chi { font-size: 15px; font-style: italic; }
.dadi-grandi.due { gap: 18px; align-items: flex-start; }
.tiro { display: grid; grid-template-columns: auto auto; gap: 4px 6px; justify-items: center; max-width: 46%; }
.tiro .chi { grid-column: 1 / -1; text-align: center; line-height: 1.2; }
.registro { font-size: 16px; border-top: 1px dashed var(--velo); margin-top: 6px; padding-top: 4px; }
.registro p { margin: 2px 0; }
.vita { margin: 6px 0; font-size: 16px; }
.traccia { height: 9px; background: var(--velo); border-radius: 5px; overflow: hidden; }
.riemp { height: 100%; border-radius: 5px; }
.riemp.io { background: var(--accento); }
.riemp.lui { background: var(--rosso); }
.morte { border-color: var(--rosso); text-align: center; }
.morte .titolo-r { color: var(--rosso); letter-spacing: .1em; }
.dado {
  display: inline-grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); width: 46px; height: 46px; padding: 6px;
  background: #fffef9; border: 2px solid var(--inchiostro); border-radius: 9px; box-shadow: 0 2px 0 rgba(0,0,0,.25);
}
.dado i { display: block; margin: auto; width: 8px; height: 8px; border-radius: 50%; }
.dado i.p { background: var(--inchiostro); }
.dado.piccolo { width: 30px; height: 30px; padding: 4px; border-width: 1.5px; border-radius: 6px; }
.dado.piccolo i { width: 5px; height: 5px; }
.dado.gira { transform: rotate(var(--g, 12deg)); }
.dado.gira:nth-child(2n) { --g: -14deg; }
.fine { text-align: center; background: var(--fondo); color: var(--carta); margin: 6px -20px -22px; padding: 22px 20px 24px; border-radius: 0 0 4px 4px; }
.cop-piccola { width: 150px; border-radius: 3px; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
.fine-sopra { margin: 12px 0 0; font-style: italic; }
.fine h2 { color: var(--oro); margin: 6px 0 8px; font-size: 26px; line-height: 1.2; }
.compra { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; max-width: 420px; margin: 10px auto 4px; }
.compra .btn.primo { background: var(--oro); border-color: var(--oro); color: var(--suoro); }
.compra small { display: block; font-size: 14px; font-weight: 400; }
.sito { margin: 10px 0 0; font-size: 18px; }
.sito a { color: var(--oro); }
.scheda { position: fixed; inset: 0; z-index: 20; background: rgba(10,12,16,.55); display: flex; justify-content: flex-end; }
.scheda-dentro { width: min(380px, 92vw); height: 100%; overflow-y: auto; background: var(--carta); padding: 16px 18px 24px; box-shadow: -6px 0 24px rgba(0,0,0,.4); }
.scheda h3 { margin: 0 0 8px; color: var(--accento); font-size: 24px; }
.scheda h4 { margin: 14px 0 4px; color: var(--accento); font-size: 18px; border-bottom: 1px solid var(--oro); }
.scheda ul { margin: 4px 0; padding-left: 20px; }
.scheda li { margin: 3px 0; }
.scheda .pulsanti { margin-top: 18px; display: grid; gap: 8px; }
.scheda .btn.mini { justify-self: center; }
@media (max-width: 420px) {
  body { font-size: 18px; }
  .foglio { margin: 10px 6px 0; padding: 14px 15px 18px; }
  .ill { margin: 0 -15px 12px; }
  .fine { margin: 6px -15px -18px; }
  .barra-doti { margin: 12px -15px -18px; padding: 10px 15px 12px; }
  .barra { gap: 9px; font-size: 16px; }
  .compra { grid-template-columns: 1fr; }

e dadi e aggiungete la Forza: chi fa meno perde 2 punti di Resistenza. Chi batti non muore: resta a terra, o scappa.","🤸 Nelle prove di agilità e nei 🎲 colpi di fortuna ti serve 7 o più con due dadi.","🧠 Le doti non danno punti ai dadi: aprono passaggi. Con **Lama corta**, una volta per scontro, il computer ritira per te un dado andato male.","🎒 La sacca e 🚩 le cose che il libro ricorda si segnano da sole: le trovi nella **Scheda**.","In questa demo hai **sei scelte**. Se la tua storia finisce prima, ricominci dal §1."],"dotiTit":"Scegli cinque doti","fineTesto":"Il resto della storia di Hori ti aspetta nel libro, su carta o in ebook.","doti":[{"n":"Gatto dei tetti","b":"","d":"Ti arrampichi dove gli altri guardano in su."},{"n":"Salto","b":"","d":"Salti il vuoto senza misurarlo."},{"n":"Lama corta","b":"","d":"La lama taglia dove serve: una corda, un sigillo d'argilla, una cinghia. In ogni scontro, una volta, ritiri un dado."},{"n":"Piede silenzioso","b":"","d":"Passi senza che nessuno si volti."},{"n":"Nuotatore","b":"","d":"Il canale, il lago e la piena non ti fanno paura."},{"n":"Fiato lungo","b":"","d":"La sete e la fatica arrivano dopo, per te."},{"n":"Lingua del porto","b":"","d":"Mercanteggi in tre lingue e inventi bugie buone."},{"n":"Occhio di Thot","b":"","d":"Noti il particolare che gli altri calpestano."},{"n":"Mano ferma","b":"","d":"Copi in fretta e la grafia è quella giusta."},{"n":"Orecchio sulla schiena","b":"","d":"Ricordi le liste e i nomi che hai sentito una volta."},{"n":"Voce di lettore","b":"","d":"Le formule dette ad alta voce valgono di più: ritiri il dado."},{"n":"Mano di cera","b":"","d":"Modelli figurine che reggono un nome."}],"negozi":[{"f":"cartaceo","url":"https://www.amazon.it/dp/B0HRRZG7LR","dove":"Amazon.it"},{"f":"ebook","url":"https://www.amazon.it/dp/B0HRS91RYM","dove":"Kindle · Amazon.it"}],"sito":"https://intreccidicarta.com/libri/librigiochi.html#l-inchiostro-nella-sabbia","re":{"ab":"^🧠 Se hai (.+)$","itPos":"^🎒 (?:Se )?hai (.+)$","itNeg":"^🎒 Non ","fgPos":"^🚩 Se (.+)$","fgNeg":"^🚩 Se non (.+)$","fgPre":"^hai annotato ","vinci":"vinci","non":"non"},"ui":{"demo":"Demo giocabile","copAlt":"Copertina di {t}","copTesto":"Le prime pagine del librogioco, da giocare qui: leggi, scegli la strada, tira i dadi. Hai sei scelte.","gioca":"Gioca la demo","nuova":"Nuova partita","riprendi":"Riprendi dal §{n}","regoleTit":"Come si gioca","valoriTit":"I tuoi valori","valoriNota":"Li ha tirati il computer, come faresti tu con i dadi del libro.","forza":"Forza","resistenza":"Resistenza","agilita":"Agilità","fAbbr":"F","rAbbr":"R","aAbbr":"A","dotiNota":"Le strade segnate con 🧠 si aprono solo a chi ha quella dote.","dotiConta":"Doti scelte: {n} di 5","caso":"Scegli per me","comincia":"Comincia dal §1","scheda":"Scheda","doti":"Doti","zaino":"Sacca","vuoto":"vuoto","ricorda":"Il libro ricorda","chiudi":"Chiudi","daCapo":"Ricomincia la demo da capo","scelteTit":"Scelte fatte: {n} di {m}","usa":"usa (+{n})","usaOgg":"Usa {x} (+{n})","usato":"Usi {x}: +{n} Resistenza.","notaOgg":"🎒 Nella sacca: {x}","notaFg":"🚩 Il libro ricorda: {x}","notaHp":"❤️ {n} Resistenza","notaMeta":"❤️ Resistenza a metà","notaPerso":"🎒 Perdi: {x}","notaDote":"🧠 Perdi la dote: {x}","serveDote":"non hai questa dote","serveOgg":"non ce l'hai","serveFg":"non ti è successo","giaUsata":"l'hai già usata","vicolo":"Nessuna strada da qui.","tira":"tira i dadi","agiProva":"Prova di Agilità","fortProva":"Colpo di fortuna","agiSotto":"Due dadi: ce la fai con {s} o meno. Il 12 riesce sempre, il 2 fallisce sempre.","agiSopra":"Due dadi: ce la fai con 7 o più.","fortDett":"Due dadi: con 7 o più ti va bene.","fortBonus":"(+1 per la tua dote)","agiOk":"Ce la fai.","agiKo":"Non ce la fai.","fortOk":"Ti va bene.","fortKo":"Ti va male.","vaiA":"Vai al §{n}","tu":"Tu","attacca":"⚔️ Tira i dadi","roundRiga":"Tu {a}, {n} {b}:","colpisci":"colpisci, −2 al nemico.","colpito":"ti colpisce, −2 a te.","pari":"pari, nessuno si fa male.","dodici":"doppio sei, colpo a segno: −2 al nemico.","due":"doppio uno, colpo a vuoto: −2 a te.","lamaRiga":"Lama corta: ritiri il {x} e ti esce {y}.","corsaBonus":"(con {d} ti basta 6)","fissa":"{d} (di serie)","notaUsa":"🎒 Usi: {x}","vinto":"Hai vinto lo scontro.","perso":"Hai perso lo scontro.","zeroTit":"❤️ La tua Resistenza è arrivata a zero.","morteTit":"La tua storia finisce qui","morteRes":"La tua Resistenza è arrivata a zero.","morteNota":"Nella demo si ricomincia dal §1, con valori nuovi e le stesse doti.","ricomincia":"Ricomincia dal §1","fineSei":"Hai fatto le tue sei scelte.","fineFuori":"Questa strada porta oltre la demo.","fineTit":"La tua avventura continua nel libro","cartaceo":"Cartaceo","ebook":"Ebook","sito":"Tutti i librigiochi su intreccidicarta.com","rigioca":"Rigioca la demo","noscript":"Per giocare la demo serve JavaScript attivo nel browser.","descr":"Demo giocabile di {t}, librogioco di Peter Palmer: le prime pagine, da giocare nel browser.","titoloPagina":"{t} · Demo giocabile · Peter Palmer","scopri":"Scopri il libro"},"par":{"1":{"t":"Quaranta sacchi di farro, scrivi sul coccio, e la mano è quella di tuo padre fino al ricciolo dell'ultimo segno, compresa la firma con la coda lunga che lui tira senza alzare il giunco. È la cosa che sai fare meglio e che ti serve meno. Rimetti il giunco dietro l'orecchio. La tavolozza ti pende a tracolla, e la lama corta sta nella cintura, a sinistra, dove sta sempre.\n\nDal tetto del vasaio il mercato del porto si vede tutto: le cupole dei granai, gli alberi delle navi in secca, il canale verde sotto le tettoie, e in fondo il Muro Bianco. Sa di pece e di pesce. Tra le ceste e la banchina, legati al palo della guardia, i due babbuini del mercato dormono all'ombra con le mani sulle ginocchia, come fanno quando il sole è in cima. All'alba li hai sentiti urlare mille volte, ritti, con le mani alzate verso il sole che nasce: lo fanno tutti i babbuini. Sono due maschi grigi con i denti di un leopardo.\n\nSotto di te passano i mercanti di uomini con la loro fila. Tre uomini con il bastone: il capo con il registro aperto sul braccio, e il corsivo dei conti lo riconosci anche da quassù, anche al contrario; il sorvegliante, il più grosso, con l'inizio della corda in pugno. La corda passa da un collo all'altro. Undici: li hai contati senza volerlo, come conti i sacchi. Tra loro un uomo alto, con i capelli rossicci e una nave tatuata sul braccio, guarda in su.\n\nIn fondo alla fila c'è una ragazza che non avevi mai guardato. È scalza, ha i capelli corti da serva e il lino grezzo dei mercanti, e anche lei ha la corda al collo. Guarda in su. Non verso i tetti: verso di te. Il sole di mezzogiorno le batte in faccia, e lei non strizza gli occhi. Ti accorgi che hai smesso di respirare solo perché il giunco ti cade dall'orecchio.\n\nLei alza le mani alla corda, senza strattonare, e la corda si spezza: i due capi restano in mano al sorvegliante e a lei, e sono neri alle punte, come bruciati. Undici, e adesso dieci.\n\nSale sul banco del vasaio, tra le giare messe ad asciugare, e salta. Dal banco alla tettoia del fornaio ci sono tre braccia di vuoto sopra il canale: è il salto che solo tu sapevi fare, e la tettoia regge chi atterra sulla trave, non chi atterra sulle canne. Lei atterra sulla trave. Si volta, e ride verso di te.\n\nTra le ceste i due babbuini si alzano di scatto e urlano, ritti, con le mani alzate, come all'alba. A mezzogiorno. Li ha spaventati la corsa. La guardia tira i guinzagli e punta i piedi.\n\n«Quella è del re!» grida il sorvegliante, con il suo pezzo di corda in mano.\n\nIl coccio della ricevuta ti scivola dalle dita, batte sulla grondaia e cade nel canale. Quaranta sacchi di farro vanno a fondo senza un rumore. Sulla tettoia lei ti fa un cenno con il mento, verso i tetti, verso sud. Poi corre.\n\nIl sorvegliante è già alla scala del vasaio. Sul bordo del tetto, proprio sopra la scala, c'è la cesta dei cocci rotti del vasaio, piena fino all'orlo. Davanti a te, le tre braccia di vuoto. E se resti fermo, da quassù la vedi andare dove vuole: dai tetti si vede dove va chiunque.\n\nChi si arrampica dove gli altri guardano in su non ha bisogno di saltare: giù per la grondaia, un piede sul banco, e la tettoia la prendi con le mani prima che con i piedi. Chi salta il vuoto senza misurarlo fa quello che ha fatto lei, e il canale non lo guarda nemmeno.\n\nLei è già sul secondo tetto, ferma, a guardare se la segui. Nessuno ti ha mai aspettato su un tetto.","dec":1,"img":0},"2":{"t":"Le cupole dei granai del porto sono di mattoni crudi, alte quanto quattro uomini, messe in fila come pani sul banco, e a quest'ora scottano sotto i piedi. Ci si arrampica con le dita nelle fessure tra un mattone e l'altro, e l'intonaco di fango si sbriciola sotto le unghie. Da quassù il porto è un rumore lontano: i colpi dei mastri d'ascia arrivano un poco dopo il gesto, e la polvere di farro che esce dalle bocche fa tossire anche il vento. Sotto, i tetti del mercato sono riquadri di stuoie e di canne, con il canale verde nel mezzo.\n\nLei si è fermata in cima alla più alta, al sole pieno. Tu ti siedi un poco sotto, dove il mattone fa un gradino.\n\nGiù, c'è il granaio di tuo padre. Lo riconosci dalla porta: sopra lo stipite c'è il cobra dipinto, rosso e nero, quello sulla porta di casa, e sulla soglia il pugno di grano che tuo padre ci lascia ogni mattina, e così tutti i granai del porto. Lui è dentro, sulla stuoia, con il registro e il gesso dei sacchi. Lo sai senza vederlo. Lo dicono i portatori, che entrano curvi sotto i sacchi ed escono dritti, uno alla volta, senza fermarsi sulla soglia: è il passo di quando conta lui.\n\nTra le cupole passano le guardie del mercato. Battono il bastone sui mattoni, un colpo per cupola, e alzano la testa solo dove il sole non gli dà negli occhi. Da questa parte, a quest'ora, il sole dà negli occhi a tutti. Quando tocca alla vostra, il colpo sale lungo il mattone e lo senti nelle cosce.\n\nLei ha le ginocchia tirate su e il mento sopra, e guarda il fiume. Poi te, dritto, come dalla fila, senza fretta. Aspetta.\n\nHai cento domande, e una sola che si fa per prima a una che non conosci. Oppure puoi stare zitto, che sui tetti è una cosa che sai fare bene, e lasciare che cominci lei.","dec":1},"4":{"t":"Il pennone ti scappa dalle mani e la banchina arriva tutta insieme. Atterri sui sacchi, che sbuffano polvere, e rotoli fino a due passi dal palo, con i due babbuini svegli che ti guardano e scoprono i denti. Ti tiri indietro adagio, senza voltargli le spalle.\n\nIl sorvegliante arriva prima di chiunque. È il più grosso dei tre, con il bastone in pugno e la frusta arrotolata alla cintura, che non usa: per uno come te basta il bastone. Se sul tetto del vasaio o tra le canne del fornaio ti ha visto in faccia, adesso non ti guarda due volte, e grida subito. Viene avanti di traverso e ti chiude la strada delle funi con le spalle. Colpisce di punta, corto, alle costole.\n\nLa lama corta esce dal fodero, e non ne era mai uscita davanti a un uomo. È lunga un avambraccio, e il suo bastone arriva più lontano. Non ti serve a ferire: ti serve a tenerlo a distanza il tempo di raggiungere le funi.\n\n*Sulla carta: se hai La corda spezzata, puoi non combattere: gliela leghi alle caviglie senza fargli male. Cancella dalla scheda: La corda spezzata, e vai al §51.*","e":"Il sorvegliante dei mercanti","ec":7,"ee":8},"6":{"t":"Sul coccio, in mano al capo dei mercanti, l'inchiostro è ancora umido. L'hai scritto seduto su un sacco, con la mano di tuo padre e la sua firma con la coda lunga:\n\n«Una serva di quindici anni, trovata a sud, venduta oggi al tempio di Ptah per il telaio: pagati otto sacchi di farro. Lo scriba dei granai del porto»\n\nIl capo lo tiene inclinato verso il sole e scende una riga alla volta con il mento. Arriva in fondo, fino alla firma. Poi alza l'altra mano e conta sulle dita, a mezza voce, come contano i mercanti quando il conto è il loro. Le ha corte, con le nocche larghe.\n\n«Dieci sacchi del re, se la trovo, e quando il re paga.» Un dito, due, tre. «Otto del tempio, già pagati, al granaio del porto.» Chiude il pugno.\n\nSi lecca il dito e lo passa su una riga del registro aperto sulla cassa, e la riga si spegne: nera sul dito, grigia sul papiro. Per lui, una ragazza in meno nella colonna. Il tempio paga meglio del re, perché il re paga quando vuole. Il capo ha già voltato le spalle ai tetti, e gli altri due con lui. Il sorvegliante abbassa il bastone e ci si appoggia sopra.\n\nNon hai saltato niente, e sei dall'altra parte. È un salto fatto seduto, pensi, e nessuno si è fatto male. Dal cantiere ti tornano nelle orecchie i colpi delle asce: non li sentivi più da quando hai bagnato il giunco. Chiudi la tavolozza sulla coppetta nera ancora lucida.\n\nIl capo, però, si ferma con il coccio ancora in mano e guarda la firma da vicino.\n\n*Barra la casella «imparata» della formula Il falso ordine.*","it":"📜 Il falso ordine"},"9":{"t":"Allunghi il collo sopra la catasta, piano, finché il registro ti arriva sotto gli occhi, capovolto. Il farro cede sotto il tuo gomito, e da qui l'odore di cipolla è forte. Il corsivo dei mercanti è corsivo da banchina: storto, pieno di macchie, con i numeri grandi e le parole piccole. Al contrario lo leggi lo stesso: i numeri grandi vengono su per primi.\n\nRighe di nomi che non sono nomi: un uomo del mare, alto; due fratelli del Delta; una donna con un bambino. Accanto a ogni riga un prezzo: sei sacchi, quattro, sette. La riga di lei deve stare in fondo alla colonna, dove si scrivono gli ultimi arrivati. Scendi con gli occhi, un prezzo dopo l'altro.\n\nIl vecchio finisce la cipolla. Getta la buccia, si pulisce le dita sul gonnellino, e la sua mano va verso il registro per chiuderlo. È una mano scura, con le vene grosse. Il giovane ride, e il vecchio si gira a metà per ridere con lui.\n\nLa riga è lì, l'ultima, e la mano del vecchio è già sopra la colonna."},"10":{"t":"Ti alzi, ti scuoti la polvere di farro dal gonnellino e vai al palo da ragazzo del porto: le mani vuote e l'aria di chi aspetta un carico. La guardia non ti bada. Suda, e il sudore gli riga la polvere sul collo. Tiene il coccio contro la pancia con le dita sopra le righe, e da due passi il corsivo lo leggi anche capovolto, come leggi il registro di tuo padre dall'altra parte della stuoia.\n\n«Per ordine della Grande Casa. Si cerca la figlia di Ra, fuggita dalla casa del re: quindici anni, scalza, senza otre. Grano a chi la riporta: dieci sacchi.»\n\nÈ una mano buona, da scriba di palazzo, senza code e senza macchie. La leggi una volta e basta.\n\nLa guardia ti ha visto muovere le labbra. Guarda te, guarda il coccio, e decide di spiegartelo, visto che lui non lo sa leggere ma l'araldo l'ha gridato tre volte.\n\n«Il re è figlio di Ra» dice, e alza il dito, come i maestri. «Dunque è una principessa, e il re rivuole la figlia.»\n\nDieci sacchi sono quello che un mastro d'ascia guadagna in mezzo anno. Una principessa. Scappata da un re che la vuole in gabbia. Ci stanno dieci sacchi. Dall'altra parte del palo, il sorvegliante si arrotola sul braccio la corda nuova.\n\nTra voi e la strada del sud ci sono la fila, i tre mercanti e la banchina scoperta. Sopra, invece, ci sono gli alberi delle navi tirate in secca nel cantiere, uno accanto all'altro, con le funi tese da un albero all'altro: una strada per chi non ha paura di stare in alto, e lei non ne ha. La più bassa passa a un salto dal tetto della baracca dei cordai. Chi si arrampica dove gli altri guardano in su ci passa come sulle grondaie di casa, e da sotto nessuno alza la testa.\n\nOppure c'è un coccio. La banchina ne è piena, e la mano di tuo padre ce l'hai nelle dita: una ricevuta del granaio del porto, con la sua firma, che dica che la ragazza è già venduta al tempio di Ptah, e nessuno la cerchi più. Chi copia in fretta con la grafia giusta la scrive senza esitare, ricciolo compreso, e il capo ci legge tuo padre. Chi mercanteggia in tre lingue e inventa bugie buone non la porge soltanto: gliela vende, con le parole che un mercante vuole sentire.","dec":1},"12":{"t":"«E chi è lo scriba che firma?»\n\nIl capo lo chiede senza sospetto, come si chiede il nome di un fornaio che fa il pane buono. Un mercante vuole sapere da chi andrà a prendere i suoi otto sacchi. Tiene il pollice sulla firma e aspetta.\n\n«Amenemope» dici. «Lo scriba dei granai del porto. Il granaio con il cobra sulla porta.»\n\nIl nome di tuo padre ti esce facile, come la sua firma. Il tuo resta dov'è.\n\nIl capo si infila il coccio nella cintura, prende un giunco dalla cassa, lo succhia per bagnarlo e scrive il nome sul margine del registro, storto, tenendo il giunco come un coltello, da uomo che ha imparato tardi e conta meglio di quanto scriva. Il giunco è sfibrato in punta e lascia due righe dove ne basta una. I segni gli vengono grossi, staccati, e l'ultimo esce dal margine. Ci soffia sopra, più forte del necessario, e una goccia nera corre fino al bordo. Ripete il nome una volta, per tenerlo a mente. Poi ti dà una manata sulla spalla che vale mezzo bastone e ti sposta di mezzo passo, e torna alla sua cassa.\n\nSulla banchina, davanti alla fila, adesso puoi stare quanto vuoi. Per i mercanti di uomini sei uno del granaio. Fai gli ultimi passi con le mani lungo i fianchi. La fila è lì, e nessuno dei tre ti ferma."},"14":{"t":"Il terzo passo è giusto, il salto no. Lo sai mentre sei ancora in aria, con il canale verde sotto la pancia e la trave che non si avvicina abbastanza. Arrivi corto di un palmo, e il piede che doveva prendere la trave prende le canne.\n\nLe canne si aprono con un rumore di stuoia strappata. Lo spago salta, le dita graffiano la trave e non la tengono. Vai giù in mezzo al pane del fornaio, tra le pagnotte messe a raffreddare e la farina, e sbatti la schiena sul banco del forno. Il fiato ti lascia come quando salti male dal carro, tutto insieme, e per un po' guardi il buco nella tettoia e il cielo bianco dentro il buco. La farina ti scende addosso piano e ti si posa sulle ciglia, sulla lingua. Sotto la nuca hai una pagnotta ancora calda, schiacciata. Pezzi di canna ti cadono sul petto, uno alla volta.\n\nNel buco compare una faccia larga e sudata, affacciata al bordo del tetto del vasaio: il sorvegliante. Di là dal canale sono tre braccia, e da tre braccia si vede tutto. Ti guarda bene, il tempo di contarti i denti. Ti ha visto in faccia, e adesso sa chi cercare.\n\nIl fornaio grida per il pane. Ha le braccia bianche fino al gomito e raccoglie le pagnotte da terra una a una, soffiandoci sopra. Tu muovi le dita, poi le ginocchia: si piegano tutte. Dal tetto accanto qualcuno si sporge: è lei, tornata indietro di un tetto. Ti passa con gli occhi le braccia, le gambe, la testa, una dopo l'altra, come si guarda un sacco per vedere se si è rotto. Non chiede niente. Poi è di nuovo in piedi, e va.\n\n*Perdi 2 punti di Resistenza.*\n\n*Se la tua Resistenza arriva a zero, vai al §44.*","h":-2,"z":44},"15":{"t":"La tettoia del fornaio sa di pane appena uscito, e sotto le canne si sente il forno respirare. Il fumo ha annerito la trave e il muro fino al tetto. La scala di corda del fornaio pende dal tetto del forno fin giù nel vicolo e passa accanto alla tettoia: la usa lui la sera, per salire a dormire al fresco. Lei è già in cima, e si volta a controllare che tu venga.\n\nSali. I pioli sono di legno di palma, lisci di mani infarinate, e la corda è vecchia ma tiene: tiene chi sale con le mani, non chi tira strattoni. La scala gira su sé stessa a ogni presa e ti porta la spalla contro il muro caldo; la farina ti resta bianca sulle dita. All'ultimo piolo posi i gomiti sul bordo e ti tiri su di pancia. Il tetto del forno è piatto, di fango battuto, con la stuoia del fornaio arrotolata contro il muretto.\n\nDall'altra parte del tetto del forno corre la strada dei lavandai, e nella strada passa il carro del lavandaio, carico di lino bianco, tirato da un asino che non ha nessuna fretta. Le ruote cigolano a ogni giro, e il mucchio dondola con loro. Lei il carro non lo aspetta: lo prende. Salta dal bordo, atterra sul mucchio di lino, rotola e si tira su a sedere come se il carro fosse suo.\n\nSalti anche tu. Chi ha le gambe del salto il vuoto non lo misura nemmeno; gli altri lo misurano, due uomini d'altezza e un mucchio di lino, e saltano lo stesso. Ti stacchi dal bordo un passo avanti al carro, con tutti e due i piedi, tiri le ginocchia al petto, e la strada ti viene incontro. Il lino ti prende, morbido. Affondi fino ai gomiti nella stoffa tiepida di sole, e sotto la schiena senti il pianale che sobbalza sulle buche.\n\nIl carro gira verso le cupole dei granai, e le voci del mercato restano dietro la svolta. Lei sta in piedi sul pianale, una mano sulla sponda, e guarda avanti."},"20":{"t":"Sali sul banco del vasaio. Le giare messe ad asciugare ti arrivano al ginocchio, e una dondola quando la sfiori con il piede: è ancora umida, fredda sotto il sole di mezzogiorno. Sotto, il canale è verde e fermo, e sul fondo si vedono i cocci di cento giare rotte prima di questa.\n\nTre braccia di vuoto. Lei le ha fatte senza guardare giù. Tu le misuri lo stesso, perché misurare è quello che fai: la trave della tettoia del fornaio corre di traverso, larga come un piede e scura di fumo; intorno, le canne legate con lo spago, gialle, che reggono il pane a raffreddare e non reggono un ragazzo. L'odore delle pagnotte arriva fin qui, sopra quello del canale.\n\nAlle tue spalle la scala del vasaio scricchiola sotto un peso grosso. Arretri fino in fondo. Prendi la rincorsa sul banco, tre passi: il primo tra le giare, il secondo sull'asse che cede e ti rimanda su, e il terzo è già sul bordo.\n\nSe il piede trova la trave, sei dall'altra parte. Se trova le canne, vai giù con loro, e dal tetto del vasaio il sorvegliante ha tutto il tempo di guardarti."},"24":{"t":"Le navi tirate in secca stanno sui puntelli come vacche coricate, e gli alberi sono più alti dei tetti. Dal tetto della baracca dei cordai alla prima fune c'è un salto da niente; poi è di fune in fune, sopra la banchina del cantiere, a forza di mani.\n\nNefret passa prima. Non guarda giù e non si guarda le mani: e la prima fune non la fa nemmeno vibrare.\n\nTocca a te. La fune è di fibra di palma, ruvida e tesa, e tiene: ti morde i palmi. Il pennone del terzo albero, invece, è unto di grasso di pecora per far scorrere la vela, e sull'unto le mani non tengono niente da sole: tengono le ginocchia, e la fretta no. Sotto, la banchina: mattoni, sacchi, il palo, e accanto al palo i due babbuini della guardia. Lì davanti sta il sorvegliante, largo due volte te, e si batte nel palmo un bastone grosso quanto il tuo polso, adagio, senza smettere.\n\nSe le mani tengono, arrivi in cima alla fila delle navi, sopra tutti. Se scivolano, la banchina ti aspetta proprio lì, accanto al palo."},"25":{"t":"Il canale è verde, tiepido in cima e freddo sotto, e sul fondo ci sono i cocci di tutte le giare che il vasaio ha rotto da quando sei nato. Ti cali dalla riva tenendoti a un palo, con i mattoni contro la pancia. L'acqua ti sale alle cosce, al petto. Prendi fiato e vai sotto.\n\nSotto il ponte l'acqua è scura e sa di pesce. Conti le bracciate: sei fino all'ombra del ponte, sei dentro, quattro per uscire. Chi ha imparato a nuotare proprio qui, tra i cocci, le bracciate non le conta: per lui il canale è una strada. Le dita sfiorano il fondo, la melma, lo spigolo di un coccio. Sopra di te passano i piedi delle guardie: li senti nell'acqua, sordi, e dietro ogni passo il colpo di un bastone.\n\nRiemergi dall'altra parte, tra due barche del grano, e ti tiri su sulla banchina gocciolando. Gli scafi sanno di pece fresca e ti lasciano una riga nera sulla spalla. Il gonnellino ti si incolla alle gambe.\n\nNefret è già lì. Non è passata sotto il ponte e nemmeno sopra: è venuta lungo l'orlo del canale, sul cordolo di mattoni largo un piede sotto le tettoie, dove si va solo di notte e piano. Ha i piedi asciutti.\n\nSi china, prende l'acqua dal canale con il cavo della mano, beve, poi te la porge di nuovo piena. Bevi. Tu le porgi il tuo vasetto d'acqua, quello a forma di conchiglia della tavolozza. Lei lo guarda, e non lo prende.\n\nDopo i cantieri comincia la banchina del grano."},"27":{"t":"La cesta dei cocci pesa come un sacco di farro bagnato. Ti ci butti contro con i piedi larghi sul tetto, e le fibre di palma scricchiolano senza muoversi. Poi il fondo striscia di un palmo, di due. La spingi con la spalla giù dal bordo del tetto proprio quando la testa del sorvegliante spunta in cima alla scala.\n\nIl rumore è quello di cento giare che si rompono una seconda volta. I cocci gli grandinano sulle spalle e sulla schiena, la scala trema fino in cima, e dal vicolo sale una nuvola chiara che ti entra nel naso, secca. Il sorvegliante torna giù più in fretta di quanto è salito e resta seduto a terra tra i cocci, con il suo pezzo di corda ancora in pugno e la frusta arrotolata alla cintura. Alza la testa. Ha una faccia larga, bianca di polvere d'argilla, e ti guarda bene: ti ha visto in faccia, e tu hai visto lui. Si pulisce gli occhi con il dorso della mano e torna a guardarti.\n\nScendi dall'altra parte, dal lato del canale, giù per il palo della tenda del vasaio. Il legno scotta: stringi con le ginocchia, molli, stringi, e sei a terra nell'ombra della tenda, dove l'argilla bagnata tiene il fresco. Tra le ceste e la banchina ci sono i due babbuini, al guinzaglio corto, e da quella parte non vai: verso i babbuini della guardia non si corre mai, lo sa ogni ragazzo del porto che abbia ancora tutte e due le gambe. Giri largo, lungo l'acqua, sotto le tettoie.\n\nLa via bassa è più lunga e sa di pesce. Corri piegato sotto le canne, con il fango della riva che ti schizza i polpacci. Scavalchi una nassa, poi una cima tesa tra due pali. Sopra di te, di tetto in tetto, passa il lino grezzo della ragazza, svelto, verso la scala di corda del fornaio. Lo vedi a pezzi, negli spazi tra una tettoia e l'altra, e ogni volta è una tettoia più avanti di te. Lei va di sopra, tu di sotto, e la scala è la stessa."},"28":{"t":"Non hai niente da dargli che non ti serva. Passi oltre con gli occhi sul palo.\n\nCon la coda dell'occhio vedi la mano di Teresh che scende, adagio, fino al ginocchio, e resta lì. Non ti chiama. Non chiama nessuno. Dice di nuovo la sua parola nella lingua che nessuno capisce, a voce bassa, per sé, rivolto al fiume.\n\nRisali la fila senza correre, e i mattoni scottano sotto i piedi. Stanno sui talloni uno dietro l'altro, con le mani legate tra le ginocchia, e da loro viene un odore di sudore vecchio e di corda bagnata. Passi davanti a una donna con la testa china, a un vecchio che dorme seduto, e nessuno dei due chiede niente. Qualcuno alza la faccia quando arrivi e la riabbassa. Nel vasetto, contro il fianco, l'acqua sciacqua a ogni passo: la senti tu solo.\n\nAl palo la guardia è arrivata dal ragazzo dei fichi e lo tiene per il braccio; il babbuino ha aperto le dita e si è rimesso seduto, con la schiena dritta. Tutta la banchina guarda lì. Tu giri attorno alla catasta dalla parte del muro, con una mano sulla tela ruvida.\n\nDietro la catasta di sacchi, Nefret ha visto tutto. Si sposta per farti posto, e non ti guarda.\n\n«Tu sai scrivere e non hai scritto» dice.\n\nNon c'è rabbia nella voce. Guardi il palo, la fila, i tuoi piedi."},"29":{"t":"Il capo legge fino alla firma. Da un passo gli senti il fiato, corto, a ogni parola. Rilegge la firma, con il pollice sul ricciolo. Alza gli occhi dal coccio alla tua tavolozza, e poi di nuovo al coccio.\n\n«Venduta oggi» dice. «E da chi? Io non ho venduto niente, e sono io che vendo.»\n\nNon alza la voce. Il bastone arriva di piatto sulle spalle, una volta, senza cattiveria. Il braccio ti trema come dopo cento righe di copia, e ti ritrovi in ginocchio sui mattoni. Un chicco di farro ti si pianta nel ginocchio. Sopra di te il capo spezza il coccio sul bordo della cassa, in due e poi in quattro, e butta i pezzi nell'acqua. Fanno quattro tonfi piccoli, uno dopo l'altro. Poi ti volta le spalle e torna al registro.\n\nTorni carponi dietro i sacchi, con la tavolozza che striscia per terra. Nessuno ti viene dietro: sulla banchina un ragazzo bastonato è cosa di tutti i giorni. Nefret ti guarda con la testa piegata.\n\n«Hai scritto male?»\n\n«Ho scritto benissimo.»\n\nÈ vero. È la ricevuta più bella che tu abbia mai scritto, e adesso sta in quattro pezzi sul fondo del porto.\n\nProvi il braccio: si alza fino alla spalla e lì si ferma. Di là dalla catasta la fila è ancora al palo, e per andare a sud si passa di lì.\n\n*Perdi 2 punti di Resistenza.*\n\n*Se la tua Resistenza arriva a zero, vai al §44.*","h":-2,"z":44},"30":{"t":"Il giudice del porto siede sotto la tettoia su uno sgabello basso, con due vecchi accanto che fanno da testimoni e una giara d'acqua ai piedi. L'ombra delle stuoie gli cade a righe sulla testa rasata. Giudica ceste rubate, sacchi bagnati, barche legate al palo di un altro: fa restituire e fa pagare, e il resto non lo dice nessuno.\n\nIl mastro d'ascia del cantiere arriva con l'ascia ancora in mano e la segatura di cedro sulle braccia. Guarda Teresh dalla testa ai piedi, poi le mani, il tatuaggio. Gli gira un palmo verso l'alto e ci passa il pollice, dove il remo fa il callo.\n\n«Questo sa di navi» dice. «Lo prendo al cantiere. Libero, se il giudice scrive. Pago in farro.»\n\nIl capo dei mercanti fa il suo prezzo, il mastro il suo, il giudice divide a metà e nessuno è contento: allora è giusto.\n\nScrivi tu, con la tavolozza aperta sulle ginocchia e un foglio di papiro che il giudice tira fuori da una cassetta e ti dà con due dita. È nuovo, e le fibre tirano il giunco di traverso. Scrivi come si scrivono le carte del tribunale, che hai copiato cento volte a scuola senza leggerle: il giorno, il giudice, i testimoni, e poi la riga che conta, quella che dice che da oggi quest'uomo è del cantiere, con il suo farro e le sue mani, e di nessun mercante. Nel corsivo dei conti ci sta tutto. I due vecchi seguono il giunco con gli occhi, riga dopo riga.\n\n«Chi garantisce?» chiede il giudice. «Il garante dice il suo nome.»\n\n«Hori, figlio di Amenemope.»\n\nLui lo ripete e te lo fa scrivere in fondo, sotto le sue parole. Il nome di tuo padre lo conosce: al porto lo conoscono tutti. Poi legge la carta ad alta voce, e mentre legge il capo dei mercanti scioglie la corda dal collo di Teresh. Il nodo è duro di sudore, e gli ci vogliono le unghie.\n\nTeresh si tocca il collo dove la corda non c'è più. «Navi» dice, in un egizio pulito, e va dietro al mastro d'ascia verso il cantiere. Cammina con le gambe larghe, da uomo abituato a un ponte che si muove. Tu chiudi la tavolozza e torni verso la catasta dei sacchi.\n\n*Scrivi «il giudice del porto» nella riga Chi sa il tuo nome.*\n\n*Annota sulla scheda, nella colonna Il libro ricorda: «HAI SCRITTO L'ATTO DI LIBERAZIONE».*","f":"HAI SCRITTO L'ATTO DI LIBERAZIONE"},"31":{"t":"Un coccio liscio lo trovi subito: la banchina è piena di cocci di giare dell'olio, chiari dentro. Ti siedi su un sacco, apri la tavolozza, inumidisci il giunco con una goccia del vasetto e scrivi con la mano di tuo padre, quella che conosci meglio della tua:\n\n«Una serva di quindici anni, trovata a sud, venduta oggi al tempio di Ptah per il telaio: pagati otto sacchi di farro. Lo scriba dei granai del porto»\n\nLa firma con la coda lunga, senza alzare il giunco, che gratta sulla terracotta. Soffi sull'inchiostro. Poi vai dritto dal capo dei mercanti, come va al lavoro il figlio di uno scriba, e gli porgi il coccio. Gli altri due guardano i tetti, uno da una parte e uno dall'altra, e un ragazzo che arriva a piedi dalla banchina non lo nota nessuno.\n\nIl capo prende il coccio e lo gira dalla parte giusta. Ha il polpastrello nero d'inchiostro vecchio e l'alito di birra. Tiene il dito sulla riga e legge muovendo le labbra. Se ci crede, per lui la ragazza è già venduta. Se non ci crede, ha un bastone in mano, e tu sei a un passo."},"32":{"t":"«Come ti chiami?»\n\nLa domanda ti esce roca, con la gola ancora piena della polvere dei granai, e ti tocca tossire nel pugno. Lei ci pensa. Non come chi cerca una bugia: come chi pesa un sacco prima di dire quanto vale. Sotto, un bastone batte su una cupola, poi su quella dopo.\n\n«Ce l'ha mio padre» dice.\n\nAspetti il resto. Non c'è. Giù ai cantieri un mastro d'ascia riprende a battere, tre colpi e una pausa. Cambi appoggio sul mattone caldo, una mano e poi l'altra. Al porto i nomi la gente li porta addosso insieme al gonnellino, e chi lo perde se ne fa dare un altro dal primo che passa. I portatori se li gridano da una banchina all'altra, insieme al conto dei sacchi. Tuo padre il tuo l'ha scritto sul registro del granaio il giorno che sei nato, tra l'orzo e il farro, con la coda lunga. Ma ce l'hai tu.\n\nPoi, senza che tu lo chieda: «Vado a sud.»\n\nLo dice guardando oltre le cupole e le vele, verso il fiume che viene giù dal sud, e non dice perché. Da quassù il fiume è una striscia larga e chiara dietro gli alberi delle navi in secca. Le barche del grano lo risalgono con la vela aperta al vento del nord, e a guardarle sembrano ferme. Tu non lo chiedi. Sui tetti, chi chiede perché resta a terra.\n\nSotto di voi i bastoni delle guardie hanno smesso di battere sui mattoni. Si sentono le voci, basse, e del legno trascinato per terra. Contro la cupola accanto sbatte una scala di legno, poi un'altra."},"37":{"t":"Le guardie salgono dalla parte dell'ombra, come sempre, e da quella parte non ci siete voi. Di là dalla cupola un bastone raschia il mattone, e un uomo sbuffa. Lei scivola giù dalla cupola sul fianco al sole, con la schiena sui mattoni caldi, e tu dietro. Il mattone crudo ti gratta le spalle sotto la cinghia della tavolozza, e arrivi in fondo sui talloni, con le ginocchia piegate. Ai piedi dei granai c'è il carro del lavandaio, fermo, con l'asino che mangia la paglia di un altro e le ceste di lino in fila sul pianale.\n\nLei solleva il coperchio della cesta più grande ed entra. Ti guarda. Entri anche tu. Sei lungo: per starci pieghi il collo e ti abbracci le gambe, e il coperchio ti si posa sulla testa.\n\nDentro è buio e stretto, e il lino sa di natron e di acqua del canale. State ginocchia contro ginocchia. La tavolozza ti punta contro le costole. Fuori passano i bastoni; una voce chiede al lavandaio se ha visto una ragazza, lui risponde che vede solo panni sporchi, e l'asino, tirato, riparte.\n\nAl buio lei ti cerca la mano. Trova la sinistra e ci posa sopra la sua, sul dorso, il tempo di un respiro. Grazie, vuol dire: lo capisci anche al buio. Quando il carro sobbalza e il coperchio si alza di un dito, nella lama di luce vedi sul dorso della tua mano sinistra un segno rosso, come di brace.\n\nUna che non ha nome non si può chiamare nemmeno per dirle di stare giù. Il primo nome di ragazza che hai scritto in vita tua è quello dell'esercizio di scuola, la bella, che i ragazzi copiano il primo anno e nessuno ha mai dato a nessuna.\n\n«Ti chiamo Nefret» dici tu.\n\nLei ride nel lino, forte, tanto che il lavandaio si volta a guardare le ceste. Dice di sì con la testa, contro il coperchio. Nefret va bene."},"41":{"t":"Gli porgi il vasetto della tavolozza, quello a forma di conchiglia, che serve a bagnare le pastiglie e non a dare da bere a nessuno. Teresh lo prende a polsi legati, e la corda gli lascia appena lo spazio per portarlo alla bocca. Ha le dita spesse, piene di tagli vecchi, e lo tiene come si tiene un uovo. Beve un sorso solo, piccolo, e lo passa al vicino della fila, che beve un sorso solo anche lui e lo passa avanti.\n\nLungo la fila non parla nessuno: si sente la corda tendersi quando uno si sporge verso il vicino. Una donna si bagna prima le labbra con il dito; due uomini con la stessa faccia se lo passano senza guardarsi. Il vasetto fa tutta la fila e torna indietro vuoto. Dieci sorsi, un vasetto: il conto torna.\n\n«Teresh» dici, e lo indichi.\n\nLui osserva il tuo dito, poi te. Aggrotta la fronte, e la pelle cotta gli si apre in rughe chiare attorno agli occhi. Poi ride, una risata larga da marinaio, che fa voltare uno dei mercanti.\n\n«Teresh» dice, e si batte la mano sul petto, dove passa la corda. Se lo tiene.\n\nTi rende il vasetto asciutto, a due mani. La conchiglia è tiepida di venti palmi. Lo rimetti nella tavolozza, al suo posto, tra la coppetta nera e quella rossa. Dietro la catasta di sacchi, Nefret ha visto tutto, e ti fa spazio accanto a sé senza dire niente.\n\n*Annota sulla scheda, nella colonna Il libro ricorda: «HAI TRATTATO TERESH DA PERSONA».*","f":"HAI TRATTATO TERESH DA PERSONA"},"44":{"t":"L'ultimo colpo non lo vedi arrivare: un bastone, o il bordo di una tettoia, o la calce del Muro che ti scappa dalle dita. Dopo c'è soltanto la terra battuta contro la guancia, e un odore di polvere. Provi a tirare su un ginocchio, e il ginocchio resta dov'è. Le voci si allontanano. Qualcuno raccoglie la tua tavolozza, la guarda sopra e sotto e se la porta via.\n\nAl palo del mercato i due babbuini stanno zitti, accucciati, con le mani sulle ginocchia.\n\nDomattina tuo padre aprirà il granaio, conterà i sacchi da solo e li segnerà a gesso, uno ogni dieci, senza sbagliare. Poi resterà un poco a guardare la stuoia accanto alla sua.\n\n*La tua storia finisce qui. Ricomincia dal paragrafo 1.*"},"45":{"t":"Il ponte è rimasto indietro, con le due guardie del mercato. La banchina sud è di mattoni cotti, consumati nel mezzo dai sacchi trascinati, e sa di pece e di corde bagnate. I portatori scendono dalle navi in fila, piegati, e le passerelle si curvano a ogni passo. Le navi del grano sono legate a coppie; i marinai di Biblo litigano con i portatori in una lingua, i portatori rispondono in un'altra, e le parolacce sono uguali in tutte e due.\n\nI mercanti di uomini sono tornati. La fila è di nuovo al palo della banchina, legata per il collo: il capo con il registro aperto sul braccio, il sorvegliante con una corda nuova, più corta. È il più grosso dei tre, con il bastone e la frusta arrotolata alla cintura, e tiene il capo della corda girato due volte attorno al pugno. Li hai già contati: dieci. La corda fa una pancia tra un collo e l'altro.\n\nAccanto al palo c'è una guardia del re, con il bastone e il gonnellino a pieghe del palazzo, e in mano un coccio grande come una pagnotta. L'araldo del re è passato sulla banchina a gridare un ordine, e questa è la copia che gli ha lasciato. La guardia la tiene come si tiene un sasso, dalla parte sbagliata, e ogni tanto la scruta come se il sasso dovesse parlare. Da qui si vede solo che è scritto fitto.\n\nNefret si accuccia dietro una catasta di sacchi di farro e ti tira giù accanto a sé. La tela è ruvida contro la spalla, e dalle cuciture esce un filo di polvere che ti pizzica il naso.\n\n«Quelli mi conoscono» dice.\n\nFissa il sorvegliante, non la guardia. Tra voi e il resto della banchina, verso sud, ci sono la fila, il palo, il coccio del re e tre uomini che la conoscono. Il coccio è a dieci passi. Da qui non lo leggi; da due sì.","img":1},"47":{"t":"La riga di lei è l'ultima della colonna, grigia e sbavata ma ancora leggibile, e ce l'hai: sul coccio o negli occhi, parola per parola. Ti riabbassi dietro i sacchi e la ripassi dall'inizio.\n\nUna ragazza di quindici anni, presa sulla strada del sud, da sola. Il giorno, il posto, chi l'ha presa. E dove le altre righe hanno il prezzo, sei sacchi, quattro, sette, la sua non ha nessun numero. Dice soltanto: per la casa del re.\n\nTuo padre ti ha insegnato a leggere un registro prima ancora delle parole, e un registro dice più cose con quello che non scrive: una colonna lasciata bianca, una somma senza le sue voci. Una riga senza prezzo non è una vendita: è una consegna. Questi non l'hanno trovata per venderla al migliore offerente. L'hanno presa per conto di qualcuno, e quel qualcuno sta scritto in fondo alla riga.\n\nNefret ti tira per il braccio, forte, a due mani. Il vecchio si sta voltando: la cassa scricchiola sotto il suo peso.\n\nIl sole ha già passato gli alberi delle navi. Le ombre dei pennoni cominciano ad allungarsi sulla banchina, e i portatori scendono dalle passerelle a schiena vuota. Dal cantiere arrivano i colpi delle asce, uno dopo l'altro. Il porto, la sera, chiude.\n\n*Annota sulla scheda, nella colonna Il libro ricorda: «SAI CHE I MERCANTI SONO DEL RE».*","f":"SAI CHE I MERCANTI SONO DEL RE"},"49":{"t":"Tra la catasta e il muro del magazzino resta un riparo stretto, pieno di sole, e ci si sta in due, con la schiena contro il farro. Il muro rimanda il caldo sulle ginocchia, e la tela dei sacchi punge attraverso il gonnellino. Dall'altra parte, seduti sulla cassa del registro, due uomini della banda, un vecchio e un giovane, di quelli che portano l'acqua alla fila e non il bastone, mangiano cipolle e parlano, di spalle, senza abbassare la voce: chi lavora per i padroni della banchina non l'abbassa. Il vecchio spacca le cipolle con il pollice e ne passa metà al giovane.\n\n«Camminava da sud, da sola, senza otre, e non aveva sete» dice il più vecchio. «L'abbiamo presa sulla strada come si raccoglie una cosa caduta da un carro.»\n\n«Una serva» dice il giovane, con la bocca piena. Poi dice il nome del re. Non quello che si dice davanti alle guardie: quello che si dice al mercato, storpiato apposta, che fa ridere chi lo sente e fa voltare chi lo dice. Il vecchio gli dà una gomitata e si guarda intorno.\n\nAccanto a te Nefret dice piano, a nessuno: «Non avevo sete.»\n\nIl registro dei mercanti è rimasto aperto sulla cassa, a un passo dalla tua mano, tra il gomito del vecchio e le bucce delle cipolle. Dentro c'è la fila: chi, da dove, per chi, quanto. C'è anche lei. Leggerlo con quei due seduti sopra vuol dire leggere di corsa, una riga sì e una no, sperando che il vecchio non si volti. Chi copia in fretta con la grafia giusta non deve sperare: copi la riga di lei dal registro in un colpo d'occhio, mentre i due parlano, e il giunco te la rimette dritta sul coccio prima che il vecchio abbia finito la cipolla.\n\n*Annota sulla scheda, nella colonna Il libro ricorda: «HAI SENTITO IL NOME STORPIATO».*","f":"HAI SENTITO IL NOME STORPIATO","dec":1},"51":{"t":"Adesso sei in alto, a cavalcioni del pennone dell'ultima nave del cantiere, con le funi che vibrano sotto le mani e il porto tutto sotto di te. Il legno è caldo di sole tra le ginocchia. Tira un filo d'aria che sotto non arriva, e porta su l'odore della pece calda e i colpi dei mastri d'ascia. Oltre le navi del grano il fiume è piatto e manda una luce bianca. Da quassù la banchina è un registro aperto: ogni cosa in fila, ogni cosa al suo posto, ogni cosa da contare.\n\nLa fila è al palo. Dall'alto sono dieci schiene curve, una dietro l'altra. Il capo dei mercanti parla con la guardia del re, con il registro aperto sulla cassa accanto, e batte il dito sul coccio del bando come si batte su una cifra che non torna. La guardia lo tiene con due mani e non lo molla. Gli altri due scrutano i tetti e le funi, uno per parte, con gli occhi stretti contro il sole.\n\nNella fila, l'uomo alto con i capelli rossicci alza la testa. Anche seduto sui talloni supera di una testa quelli che ha davanti. Ti ha visto. Alza la mano legata fino alla spalla: e un poco vi conoscete. Da tre giorni, dal tetto del vasaio, lo chiami Teresh, perché è della gente del mare. Lui non lo sa. Ha la nave tatuata sul braccio, con la prua alta e i remi.\n\nNefret è seduta sulla crocetta dell'albero accanto, più in alto di te, con le gambe che dondolano nel vuoto, voltata verso il fiume.\n\n«Da quassù si sta bene» dice. «Peccato scendere.»\n\nMa le funi finiscono qui, e la strada del sud passa dalla banchina. Giù si va per la corda dell'albero, annodata a ogni braccio per chi sale a piedi nudi."},"52":{"t":"La fila è al sole davanti al palo, e i prigionieri stanno seduti sui talloni, come sta chi non conta più i giorni. La corda passa da un collo all'altro, e dove sfrega la pelle è rossa. L'uomo alto è l'ultimo, adesso che l'ultima non c'è più. Teresh: dal tetto lo chiami così da tre giorni, e il nome gli sta addosso come se l'avesse sempre avuto. Ha i capelli rossicci, la pelle cotta dal sole del mare, la nave tatuata sul braccio e la corda al collo. Da vicino i capelli sono ricci, impastati di polvere, e le labbra hanno una crosta bianca agli angoli.\n\nTi guarda. Dice una cosa in una lingua che al porto non capisce nessuno, nemmeno i marinai di Biblo, e poi, in egizio, con la bocca secca: «Acqua?»\n\nÈ una parola sola, e la dice giusta. Il vasetto della tavolozza ce l'hai a tracolla, pieno a metà.\n\nVicino al palo un ragazzo con una cesta di fichi prova a passare tra le ceste di un mercante con una mano di troppo, e uno dei due babbuini della guardia, senza alzarsi, allunga il braccio e lo prende per la caviglia. Lo tiene. Non morde, non tira: guarda la guardia, non il ragazzo, e aspetta che arrivi. Il ragazzo resta fermo, con la cesta stretta al petto, e non fiata.\n\nSotto la tettoia in fondo alla banchina siede il giudice del porto, con due vecchi accanto. La tettoia è di stuoie di canna, e davanti c'è gente in piedi che aspetta il suo turno con una cesta o un sacco in mano. È il tribunale della banchina: chi ha preso restituisce, chi deve paga. Davanti al giudice una carta di liberazione scritta bene fa di un uomo legato un uomo libero, se qualcuno paga per lui; e al cantiere, lì accanto, i mastri d'ascia cercano da mesi uomini che sappiano di navi.\n\nLa fila deve muoversi presto: il capo dei mercanti l'ha già contata due volte. Oltre il palo la banchina va avanti verso sud. Teresh ti guarda ancora, con la mano legata a mezz'aria.","dec":1,"img":2},"53":{"t":"Non dici niente. Lei nemmeno. Il sole cammina di un dito sulla cupola, una mosca prova a posarsi sul tuo ginocchio e ci ripensa, e dal porto sale il grido di un portatore che ha perso un sacco. Conti i sacchi che entrano nel granaio di sotto, sulla nuca degli uomini, per avere una cosa da contare: otto, nove, dieci, e a dieci sai che il gesso di tuo padre fa una tacca. La polvere ti si è posata sulle labbra e sa di crusca.\n\n«Tu sei quello che salta» dice lei alla fine.\n\nNon è una domanda. Ti misura le spalle, poi le mani, e non dice che cosa ne pensa. Hai i palmi grigi di fango secco e, sul dito medio, la macchia nera del giunco, quella che non va via nemmeno con la cenere.\n\n«Tre giorni» dice. «Dalla fila. Ti ho visto saltare dal vasaio al fornaio, e poi giù per la grondaia del tintore, e poi sul carro del lavandaio. Tutti i giorni alla stessa ora.»\n\nTre giorni la fila è rimasta ferma sotto il tetto del vasaio, e tu l'hai contata tre giorni dall'alto, come si contano i sacchi, senza mai guardare chi c'era in fondo. Lei invece ha alzato la faccia. È il tuo giro: il banco, la trave, la grondaia, il lino. Lo fai a mezzogiorno, quando le guardie cercano l'ombra e nessuno alza la testa, e credevi di farlo da solo. Ti senti la faccia rossa, e il sole non c'entra.\n\n«Vado a sud» dice. Lo dice al fiume, più che a te, e non dice perché. A sud, oltre l'ultima banchina, l'acqua piega dietro le palme e da qui non si vede dove va.\n\nSotto di voi i bastoni delle guardie hanno smesso di battere sui mattoni. Contro la cupola accanto sbatte una scala di legno. Qualcuno la assesta con due colpi, e i pioli cominciano a scricchiolare."},"54":{"t":"Il carro si ferma dove il canale passa sotto le tettoie, e il lavandaio comincia a scaricare. Lo senti dai tonfi sulla riva, uno per cesta, sempre più vicini. Uscite dalla cesta prima che arrivi alla vostra, uno da una parte e uno dall'altra. Fuori la luce è bianca, e hai le gambe dure di chi è stato piegato in quattro. Il lavandaio non conta le ceste: conta i panni. Li tira fuori a bracciate e li butta sulla pietra piatta della riva, senza alzare la testa.\n\nNefret si guarda intorno una volta sola.\n\n«Sud è di là» dice, e indica il ponte, la banchina, il fiume.\n\nÈ di là. Tu ci vivi da sedici anni, e lei ci è arrivata tre giorni fa con la corda al collo.\n\nDa qui si vede di nuovo la tettoia del fornaio, e sulla trave, dove le è caduto quando è atterrata, c'è il suo pezzo di corda, steso al sole come una biscia, con i capi neri, come bruciati.\n\nSotto, il canale verde corre tra le tettoie e passa sotto il ponte di mattoni, e sul ponte ci sono già due guardie del mercato, appoggiate ai bastoni, che fissano in faccia chi passa. Il ponte è piccolo, largo quanto un carro, e chi lo attraversa passa a un braccio da loro. Le guardie fermano una serva con una giara sulla testa, le girano intorno, la lasciano andare. Sotto le canne l'acqua è opaca, con le squame di pesce che luccicano in superficie, e il bordo di mattoni è viscido di alghe.\n\nTornare sul tetto del fornaio per un pezzo di corda vuol dire una grondaia, una tettoia e il rischio di farsi vedere da tutto il porto. Il canale invece è lì, sotto i piedi, e porta alla banchina sud senza passare dal ponte.","dec":1,"img":3},"55":{"t":"«Aspettami» dici, e lei alza le spalle: aspetta, se ne ha voglia.\n\nDal carro alla casa del tintore sono venti passi sotto le tettoie, e li fai senza correre. Su per la grondaia, un piede sulla botte dell'acqua, le mani sul bordo della tettoia, e sei di nuovo sopra il pane del fornaio. Sulle dita ti è rimasto il colore delle tinte colate. Cammini sulla trave a passi corti, con le braccia aperte: è larga un piede, e il fumo l'ha resa liscia. Da sotto sale il caldo del forno, che ti asciuga il sudore sulle gambe. La corda è dove l'hai vista, sulla trave: lunga due braccia, di fibra di palma intrecciata.\n\nLa raccogli. I due capi sono neri e duri, come passati nella brace, e non puzzano di bruciato. La corda spezzata te la arrotoli intorno al braccio e poi la infili nella cintura, dalla parte opposta della lama.\n\nGiù, il ponte è pieno di gente che passa svelta da un'ombra all'altra. Nefret è in mezzo, al sole, l'unica che non cerca l'ombra, e alza gli occhi verso di te: ci stai mettendo troppo. Le due guardie con i bastoni guardano tutti tranne lei: nessuno cerca una ragazza che sta ferma in mezzo al ponte.\n\nTorni indietro lungo la trave, fino al bordo. La grondaia è lì, e le guardie non hanno ancora alzato la testa.","it":"La corda spezzata"},"56":{"t":"Resti sul tetto del vasaio, con il giunco ancora per terra, e la lasci andare. Hai le dita dei piedi sul bordo, sopra le tre braccia di vuoto.\n\nLei va dritta verso sud, di tettoia in tettoia, e non ne sceglie mai una sbagliata: quella del tintore, che regge; la birreria, che regge solo sul colmo; il pergolato del cordaio, che non regge niente e lei lo salta. Sono le tue strade: le hai provate una canna alla volta, in anni di ginocchia sbucciate. Le canne del tintore si piegano sotto la corsa e tornano su, e le pezze appese gocciolano nel vicolo. Lei passa dietro i panni stesi del lavandaio e non c'è più. I panni si gonfiano una volta e ricadono. La cerchi sulle canne, sulle grondaie, sulle scale a pioli: niente. Solo il fumo dei forni, dritto nell'aria, e la luce bianca che schiaccia le ombre contro i muri.\n\nIl sorvegliante non arriva nemmeno in cima alla scala. Si ferma agli ultimi pioli, con la testa appena sopra il bordo del tetto, e ansima. Guarda il vuoto davanti al banco, non te, sputa nel canale e torna giù a gridare con gli altri.\n\nRaccogli il giunco e te lo rimetti dietro l'orecchio. Le cupole dei granai sono le cose più alte del porto, dopo gli alberi delle navi, e da lassù si vede più che da qui. Ci vai per i tetti bassi, senza correre. Passi sul muro del cortile della birreria, largo una mano, un piede davanti all'altro, nell'odore acido dell'orzo che fermenta. Poi vengono i tetti dei magazzini, piatti, caldi di sole, dove l'aria comincia a sapere di grano e di sacchi.\n\nSulla bocca del granaio più alto, quella da cui si versa il grano, c'è qualcuno seduto al sole pieno, con le gambe penzoloni sopra il buco. Quando sei sotto la cupola, si sporge.\n\n«Pensavo fossi quello che salta» dice."}},"links":{"1":[{"l":"Le corri dietro sui tetti","v":20,"t":"l"},{"l":"🧠 Se hai Gatto dei tetti","v":15,"t":"l"},{"l":"🧠 Se hai Salto","v":15,"t":"l"},{"l":"Fai cadere la cesta dei cocci del vasaio sul sorvegliante e poi le corri dietro","v":27,"t":"l"},{"l":"Resti fermo a guardare dove va","v":56,"t":"l"}],"2":[{"l":"Le chiedi come si chiama","v":32,"t":"l"},{"l":"Aspetti che parli lei","v":53,"t":"l"}],"4":[{"l":"⚔️ Se vinci","v":51,"t":"l"},{"l":"⚔️ Se perdi","v":44,"t":"l"},{"l":"🎒 Hai La corda spezzata: gliela leghi alle caviglie senza fargli male","v":51,"t":"l","p":"La corda spezzata"}],"6":[{"l":"«E chi è lo scriba che firma?»","v":12,"t":"l"}],"9":[],"10":[{"l":"Passi dall'alto, sugli alberi delle navi in secca, oltre i mercanti","v":24,"t":"l"},{"l":"🧠 Se hai Gatto dei tetti","v":51,"t":"l"},{"l":"Scrivi sul coccio una ricevuta con la grafia di tuo padre: già venduta al tempio di Ptah","v":31,"t":"l"},{"l":"🧠 Se hai Mano ferma","v":6,"t":"l"},{"l":"🧠 Se hai Lingua del porto","v":6,"t":"l"}],"12":[{"l":"Sulla banchina, davanti alla fila","v":52,"t":"l"}],"14":[{"l":"Ti rialzi e la segui","v":2,"t":"l"}],"15":[{"l":"Sulle cupole dei granai","v":2,"t":"l"}],"20":[{"l":"🤸 0–4","v":14,"t":"l"},{"l":"🤸 5–9","v":15,"t":"l"}],"24":[{"l":"🤸 0–4","v":4,"t":"l"},{"l":"🤸 5–9","v":51,"t":"l"}],"25":[{"l":"Alla banchina sud","v":45,"t":"l"}],"27":[{"l":"Le corri dietro per la via bassa","v":15,"t":"l"}],"28":[{"l":"Dietro i sacchi","v":49,"t":"l"}],"29":[{"l":"Ti rialzi sulla banchina","v":52,"t":"l"}],"30":[{"l":"Dietro i sacchi","v":49,"t":"l"}],"31":[{"l":"🎲 0–4","v":29,"t":"l"},{"l":"🎲 5–9","v":6,"t":"l"}],"32":[{"l":"Le guardie salgono sulle cupole","v":37,"t":"l"}],"37":[{"l":"Giù dal carro, verso il canale","v":54,"t":"l"}],"41":[{"l":"Dietro i sacchi","v":49,"t":"l"}],"44":[{"l":"💀 Fine","v":0,"t":"m"}],"45":[{"l":"Ti avvicini al palo","v":10,"t":"l"}],"47":[],"49":[{"l":"Leggi il registro mentre loro parlano","v":9,"t":"l"},{"l":"🧠 Se hai Mano ferma","v":47,"t":"l"}],"51":[{"l":"Scendi sulla banchina","v":52,"t":"l
