 smells the blood of Laertes. You've brought him all the way here, eh?”\n\nHe gets up and points you to the stool beside the fire. Inside it is dark and low, and the beams are black with soot. The hearth is one pace from the threshold: three blackened stones on the beaten earth. You sit down and stretch your hands toward the flame. The wood crackles, the smoke smells of oak and roasted acorns, and the light dances on your fingers. Your cloak does not steam, the water stays in its folds. Eumaeus studies the cloak, then your hands, and for a while says nothing. Then: “The fire, down here, warms no one.” And he starts talking of other things: of the acorns, of a black hog that always ran off as far as the harbor.\n\nOn the table, on an olive-wood board, there are bread and cheese. The bread has a split crust; the cheese is sheep's cheese, aged, with a dark rind. Eumaeus pushes them toward you; then, halfway through the gesture, he pulls them back. “No. Not you. Those who must set off again do not eat here.”\n\nHe sits down on the other side of the fire and pokes it with his staff. The embers brighten, and through the open door comes a thread of air that smells of asphodels. “It is good here,” he says. “Those who stop, as a rule, do not set off again.”\n\nYou have so many things to ask him: about your mother when she was a child, about your father, about the road. You can also ask nothing, and let his voice and the flame do the rest.","dec":1,"img":7},"242":{"t":"You eat it. The petals have the fresh bitterness of green almonds, and they melt on your tongue before you have chewed them. They leave a long sweetness in your mouth, like raisins.\n\nAround you the Lotus-Eaters all smile together, glad for a friend. They sit you down in the grass: a new pallet. They ask you where you come from, and you begin to say it; then you stop halfway. The name of the island has come strange to your mouth, and you don't feel like finishing it. No one asks you again: they smile all the same. Your name seems to you the word of an island you no longer want to go back to. You leave it there, half said, the way you leave a line that is no longer needed.\n\nThe oar stays on your knees. After a while you do not remember what it is for.\n\nThe dog has stayed at the edge of the meadow, sitting where the black sand ends, and he does not come into the grass. When one of the Lotus-Eaters holds out a flower to him, he curls his lip over his teeth. He gets up and goes off alone, toward the smoke.\n\n*You have forgotten your name. You are a nameless shade, one of the gray crowd. Your story ends here. Amphialus is waiting for you on the beach, at section 1.*"},"246":{"t":"“Who is to blame, my uncle or my father?”\n\nThe Old Man of the Sea thinks about it. He scratches his beard, where the foam has dried in white crusts, which fall onto his knees. He looks at the sky that is not there, looks at the seals, looks at your oar, lying on the sand. He bends one finger, and another, gets to the little finger and goes back. He moves his lips over a long count that will not come out right.\n\n“Yes,” he says.\n\nYou wait for the rest. There is no rest. The old man shakes off what was still holding him and dives, and the seals go after him, until the shore is clear. Their tracks remain, and a tuft of gray seaweed that no one picks up. Where he sat there is a wet hollow, with the print of two heels. On the water, still again, a little foam from his beard is still floating; then it comes apart.\n\n“Yes,” you repeat aloud, to hear whether it weighs more when you say it.\n\nIt weighs no more at all. The word stays on you like an empty shell picked up on the waterline: you turn it over and over, there is nothing inside, and yet it has its shape, and you cannot bring yourself to throw it away.\n\nInland, beyond the dunes, you can see the black line of a river. You bend to take the oar and put it on your shoulder. You have had your question, and in your hand you are left with an answer that opens no door."},"251":{"t":"You stretch out beside him a piece at a time, first your knees and then your elbows, careful not to touch the water. You keep the oar along your side, one hand on it, with the blade toward the dunes. The sand of the edge is firm under your elbows and has no smell, neither of salt nor of seaweed. Between your shoulder and Narcissus's there is a palm's width; he does not move away and does not press closer. Your chin comes within a span of the water. You look down.\n\nThe face in the pool does not seem yours. It is pale, with a pallor you have never had even in winter, and it has salt between its lashes. Its hair sways around the forehead, slowly, like seaweed in a current, moved by a water that is not there in the pool.\n\nYou close your eyes. You open them again. You look harder.\n\nIt is your face. Your wet hair, plastered to your forehead, still. The thin beard of three days at sea. Your mother's mouth, as everyone says at Samé. A night of storm, you think, leaves a face like that.\n\nBeside you Narcissus smiles at his boy and barely moves his lips, perhaps to tell him his name. He has never raised his eyes. On his forearm there are grains of sand, one beside another, and he does not shake them off. On the pool, between his face and yours, there is not a ripple.\n\nBehind you the dog barks just once, sharp. The bark runs along the shore; down there, among the glistening backs, a seal lifts its muzzle and puts it down again.","img":8},"268":{"t":"Charon pushes the boat out into the river, and the near bank draws away with those who are waiting. The water is black and slow, and the oars go into it without foam and come out without a drop. Around the boat the mist lies low, at the height of the gunwale, and those sitting in the bottom vanish into it up to their shoulders. From the reeds comes a smell of marsh, and now and then a splash, as of a stone dropped in water; no one turns to look.\n\nHalfway across the old man speaks, to everyone and to no one, in the voice of one who has been repeating the same thing for a thousand years: “Farther down this water mingles with the Styx. Whoever swears by it is bound, the gods included.” Then he spits into the river.\n\nThe boat bumps against a flat rock. On the rock there is a dog with three heads, each as big as a calf's, with rough black fur and a collar of green bronze for every neck. The heads come down over the passengers as they get out, one at a time, and sniff. From close by they smell of bone and ash.\n\n“Cerberus,” grumbles Charon. “The dog makes a fuss over those who come in. It is on the way out that he bites.”\n\nThe middle head comes down over the tawny dog, nose to nose. Then it sniffs you. The tail, as thick as a cable, thumps twice on the stone.\n\nBeyond the rock begins a shore of black sand, and on the sand a beast is waiting for you: an old gray sow, enormous, with the bristles standing up on her back and yellow tusks, rooting and snorting.\n\n“The sow of Crommyon,” says Charon, and spits again. “Theseus killed her on the road of the Isthmus. She came down whole, and ever since she has had it in for anyone who lands.”\n\nThe sow lowers her head and charges.\n\nHer blows land like anyone's, and as Elpenor told you they leave no bruises: every blow that catches you carries off a small thing, the name of a street in Samé, the color of a sail. She is old and slow, and a sailor with an oar in his hand can stand up to her.","e":"The Old Sow","ec":5,"ee":6,"img":9},"270":{"t":"You lift your head and look for the stars: it is the first thing a sailor does when he wakes in a place he does not know.\n\nThere are none. Not the Bear, the only one that never bathes in the sea, not the Pleiades, not the evening star. You turn where you stand, a quarter at a time, and the sand gives way under your heels. The vault is smooth and dark from one horizon to the other, without a crack: the bottom of an upturned bowl.\n\nThen you do the second thing a sailor does: you wet a finger and hold it up. The thread of air is there, thin, but it comes neither from the land nor from the sea; it goes around you and does not choose a side, and the leaves of the poplars, on the dune, do not notice it. It carries no smell: not of earth, not of seaweed, not of the smoke of villages that a sailor catches from offshore even before he sees the coast. It does not carry a sound either: not a goat, not an axe.\n\nYou look for the light. It is low, reddish, the light of when the sun has just gone down. But there is no point of the sky where it is stronger: it comes from every side in the same way, as if the sun had set everywhere, and long ago. On the water it lights no trail.\n\nThe sun sets in the west, and even a ship's boy knows that. If everything has set here, you are farther west than every sunset. On the rim of the world, where all the courses end and the stream of Ocean begins, the one that in the old men's stories goes around the earth. Toward the open sea the water is gray and flat, without a sail, without a gull, and it does not end against a line: it fades, like something said and left half finished.\n\nYou lower your eyes. The dog is a few paces ahead on the shore, still, with his head turned toward you. He does not move until you move."},"291":{"t":"“The way?” Eumaeus looks at you. “To where?”\n\n“Home.”\n\nEumaeus stares at the fire. For a while he says nothing. A log crumbles and sends up a few sparks, which go out before they touch the branches of the roof. At last he gets up, rummages in a basket hanging from the beam and comes back with a bundle wrapped in a fig leaf: a flat, hard cake, with a hole in the middle, that smells of barley and ash.\n\n“Meanwhile take this. It's the cake for the dog at the gate. The one you put in the hand of someone going on a long journey, for the big dog that stands guard. You never know.”\n\nHe waits for you to tie it to your belt. When you have tied it, he goes out with you: a step, a knock of the staff on the beaten earth, another step. Outside the air is still and smells of asphodels, that smell at once bitter and sweetish that covers everything down here. From the threshold of the hut the whole plain can be seen: the white flowers as far as the horizon, a distant river that does not glitter, the black herds, ink stains on canvas, and farther down, in a hollow, a cluster of low stone houses. You look for the landing place, and there it is: in all that white, the only place with roofs.\n\n“For now, the way is that one,” he says, and points his staff. The tip is black with embers. “Down there are the women of Ithaca, and with them is the old mistress, your grandmother. Keep the smoke at your back and go straight down. When you hear a loom, you have arrived.”\n\nYou put the oar on your shoulder and go down. The stalks rustle against your legs. Eumaeus stays in the doorway, leaning on his staff, until you are at the bottom of the path. When you turn for the last time, all that can be seen of him is the thread of smoke, straight above the hut.","it":"Cake for the Dog at the Gate"},"293":{"t":"The chariot track is the straightest road to the river, and the most traveled. The earth is marked with deep ruts, hard, a palm wide: you walk on the ridge between one and the next. At every step a fine gray dust rises that does not settle again: it hangs at knee height, and you can no longer see your feet. On either side stand war chariots without horses, by the dozens, with their wheels askew and their shafts on the ground: a battle no one has cleared away. The boxes of plaited rush are staved in, the reins have hardened and snap at a touch, and everything gives off a smell of old leather and empty stable.\n\nDead men pass, in groups, all in the same direction. A line of barefoot sailors walks in silence, without a leader, with empty hands, half closed on the measure of an oar that is not there. They wear the short rowing tunics and walk in step: their bare feet make a single rustle in the dust.\n\nFarther on the track is closed. Standing between two chariots are eight men with spears and leather shields, round ones, and under their helmets, leather too, their long hair tied at the nape in the manner of the Thracians. They are broader than they are tall, and they stand close, each shield covering the flank of the next man, and no one has ordered it. Their arms are marked with blue tattoos, lines and dots, and their shields are covered with blows. One wears at his ear a bronze pendant in the shape of a bunch of grapes; another holds his spear the way you hold a hoe. The oldest, white beard and short spear, stands in the last place of the line.\n\n“Where do you come from?” one asks, in a heavy Greek.\n\n“From Samé,” you answer. “Raised in Ithaca.”\n\n“Ithaca,” he repeats, and the others lower their spears toward you: points of dark bronze, all at the height of your chest. “We are the Cicones of Ismarus. The men of Ithaca burned our houses at their first landing. We have been waiting ever since.”\n\nThe dog puts himself in front of you, low on his legs. You already have the oar leveled, the blade toward them.\n\nThe spears are eight and the oar is one; but between the two chariots no more than two men can pass at a time, and the oar reaches farther than a spear. Among the overturned chariots there are narrow passages, where one man alone can slip through. The line of sailors passes right beside you without turning: if you know how to command a ship's company, an order given in the right voice would put them around you. And there is a name these men fear more than any other; in your family, no one has ever lacked the cunning to use it.","dec":1,"img":10},"298":{"t":"“How do I get back?”\n\nThe old man is silent, like a pilot sounding the bottom before dropping anchor. He closes his eyes, and under the lids, thin ones, they go on moving, this way and that, quick. Around the two of you the seals all stop snorting at once, and from the old man's beard falls one drop at a time, slow, in time, as from a lifted oar: you hear them touch the sand, one by one. When he opens his eyes again they have the green of the water under the keel, and he speaks fast, in the voice of someone reciting a thing learned long ago:\n\n“At the cold spring, to whoever asks you who you are, say who your mother and your father are: Earth and starry Heaven.”\n\n“I asked you how to get back home.”\n\n“And I answered you.”\n\nHe shakes off what was holding him and dives. The water takes him without a splash. The seals go after him, and the shore is left empty, scored by their bellies, groove beside groove. The fish bones and the broken shells remain.\n\nYour mother's name is Ctimene. Your father's, Eurylochus. And yet you have heard those words before: they are almost those of the singsong your mother made you repeat on the last evening, while she mended your cloak by the light of the lamp. You seem to hear again the snap of the thread cut with her teeth. You do not understand what a spring has to do with the way home. Alcyone said that whoever holds the old man to the end has a right to one question; she did not say that the answer can be understood.\n\nYou pick up the oar from the sand and put it back on your shoulder. Inland, beyond the dunes, you can see the black line of a river.\n\n*Note on your sheet: “you know which is the cold spring”.*","f":"you know which is the cold spring"},"302":{"t":"You do not let go of the mane, and it is the mane that goes: it draws back from your fingers, and the warmth with it. The lion lengthens, thins, loses its legs. Now you are holding a serpent as thick as a mooring cable, cold and dry, that winds around your arm in three coils and begins to squeeze. It is a good four fathoms long, and the tail beats on the ground somewhere behind you. The scales are small and hard, bronze studs under your fingertips, and they rustle on the sand. The head rises before your eyes: it is flat, as wide as your hand, and has two eyes without lids. The black tongue goes in and out, and a breath of cellar reaches your face, of shut-in earth and wine gone bad.\n\nYou hold it where you can: one hand under the head, the other halfway along the body, and all the rest no one is holding. The three rings on your arm tighten slowly, a finger at a time.\n\nYou do not know if it has venom. You know that in Ithaca the old men say never to hold a snake you do not know. From the water, the seals moan low: cows in a stable.\n\nThe coils run over you like a line unwinding from the windlass, and at every turn you understand a little less what you are holding, and from which end. On the sand, around the two of you, remain the tracks of your turns, wide, with rounded edges: the wake of a boat hauled ashore.\n\nThe hand under its head is still closed. They are your fingers: they open when you want.","dec":1},"309":{"t":"You go to him, among the last ones getting up from the gravel and moving aside just as much as is needed. Thersites stops laughing, surprised.\n\n“Why do you say it?” you ask him.\n\nHe looks at you from below, with his head cocked. From close up his skin is marked with old scars, white and thin, and his tunic smells of camp: smoke, leather, mud from a ditch. He has a quick look that does not stay on your face: it runs to your hands, to the oar, to whoever is behind you. He laughs again, but tight-lipped, only for you.\n\n“Because it's funny. And no one listens to me anyway.” He scratches his pointed head. “You do, though. Well, look at that. The king's nephew listening to Thersites.”\n\nWithout your asking, he tells you of the time before Troy when he stood up in the assembly, in front of everyone, and told the king that the war was paid for by him and the other poor men at the back of the line, while the kings kept the plunder. Your uncle gave him a blow with the scepter, in front of the army, and everyone laughed. He tells it in gestures, playing everyone's part: the king on his seat, your uncle rising, the blow coming down, and he himself tiny, with his arms over his head. He has knotty fingers, and he does not keep them still a moment. Between one part and the next he touches his back at an exact spot, between the shoulder blades, without searching for it: the hand goes there by itself.\n\n“Those at the back of the line laughed too,” he says. “They more than anyone.” He shrugs his crooked shoulders. “It's always the one at the back of the line who pays. And whoever says so gets the beating.”\n\nOn the river the mist has come down, and the reeds stand in it up to their middles, like people fording. In front of the water the crowd has drawn together, and has its back to the two of you. Thersites watches the boat coming closer. “Go, go, the old man waits for no one. I'll take the next one: there's still someone here to make fun of.”\n\n*Note on your sheet: “you heeded Thersites”.*","f":"you heeded Thersites"},"317":{"t":"You lay the oar on the sand and take the last three steps on tiptoe, between the spread skins and a seal that does not raise its head.\n\nYou jump on him as he sleeps and lock your arms around his chest, the way Menelaus did. The skin is smooth and cold, the skin of a fish just hauled up, and it smells of seaweed. Underneath are narrow ribs, an old man's: you seize one wrist with your other hand and squeeze.\n\nHe does not have time to wake fully. Under your hands the skin turns to coarse fur; the chest swells and forces your arms apart until your wrist slips from you, and you sink your fingers, fists clenched, into a mane; and what you are holding is a lion. It rises on its four paws and pulls you up with it: you plant your feet in the sand, and its back comes up to your chest. The fish cold is gone: the neck, under your fists, is burning. The mane fills your eyes and smells of hot dust. The roar booms in your chest like thunder in the hold. The beast digs its paws into the sand, which sprays away in two gray fans, twists and turns its head toward you: the red throat, the yellow teeth, in front of your face, and from its mouth a breath of old meat. The front paws are as wide as the blade of your oar, and where they scrape they leave furrows a finger deep. At every jerk your heels plow the sand, a little closer to the sea.\n\nThe seals throw themselves into the water all together, and the sea takes them without a splash; the last ones stop on the low rocks, with their necks turned, to watch. The four shapes under the skins do not move.\n\nA lion is a lion. No one, in Samé, would blame you if you opened your arms now.","dec":1,"img":11},"332":{"t":"You throw yourself sideways, between two overturned chariots, and run.\n\nThe graveyard of the chariots is a maze: wheels as tall as a man, crossed shafts, smashed boxes, poles pointing upward like the masts of ships. In here the air is still and stinks of rotten rush and wheel grease. You squeeze in where only one can pass, climb over, crawl under a floor with the oar clutched to your chest. The oar is twice as long as you are: it jams between the spokes, knocks against a nave, and each time you have to take a step back to free it. Behind you, the Cicones shout in their language and call to one another from one chariot to the next.\n\nThey do not come after you in a line: they split up. Between the spokes of a wheel you see two round shields go by, and a bronze point slides above a side rail, three chariots away. Their spears are shorter than your oar, and in here they do not jam.\n\nIf you find the right gap, you lose them in the maze and come out on the other side, toward the river. If you get it wrong, you find yourself shut in among the wheels, with the spears in front and behind."},"341":{"t":"At your belt you have the little leather bag that every sailor of Samé carries with him, for the fish and for departures. The lace has swollen with water and you untie it with your teeth: the leather leaves on your tongue a bitterness of tanning. Inside, the salt has turned to gray, damp lumps, and it smells of salt pans, of wet stone; but it is salt all the same. You crumble a pinch between your fingers and let it fall on her shoulder, among the feathers, as the mothers do on the pier when the ship is about to cast off.\n\nAlcyone stays motionless. The grains stay on her feathers, white on the blue, and do not melt. She raises her fingers to her shoulder, where the salt fell, and rests them there without pressing, careful not to make even one fall.\n\n“No one did it for me anymore,” she says. “Since the sea took me, no one.”\n\nFor a while you stay like that, she on the rock and you standing on the sand, and before you the sea stretches out, a cloth pulled tight.\n\nShe plucks a feather from her shoulder and holds it out to you, holding it by the tip, between two fingers. It is blue, as long as your palm, and dry: the only dry thing you have seen since you opened your eyes. When you take it, it has no weight: you know you have it in your hand because you see it. And between your fingers there comes a smell that does not exist down here: open air, clean wind over a calm sea.\n\n“Alcyone's Feather. Inside is a little of my calm, the one that did not come for your ship. Keep it for when you have to get out of a closed place in a hurry, and the sea will not want to let you go. It is on loan.”\n\nYou slip the feather under your belt, beside the little bag, where you will not lose it.\n\nAlcyone has already found her point on the horizon again. Farther on the boy by the pool has not raised his head. Beyond, on the shore of the seals, the glistening backs do not move.","it":"Alcyone's Feather","dec":1},"348":{"t":"Eumaeus stops poking the fire. The tip of the stick stays among the embers, and the wood begins to smoke.\n\n“Eurylochus.” He says it the way you say the name of a wind. The flame catches him from below and cuts two furrows at the sides of his mouth. “He used to come to the farm to ask for your mother, before the war, and he would stand at the door with his cap in his hand. He wouldn't come in until Laertes had told him twice. He had two hands this wide, with big knuckles and nails black with pitch, and he kept them behind his back as if he were ashamed of them. He was a man who counted: the sheep, the olives, the days at sea. If he said the wind was turning, the wind turned.”\n\nTo show the size he has opened his free hand in front of the fire, with the fingers spread. He closes it again, and is silent a while. Outside, among the asphodels, nothing moves. “He was almost always right. Only once he wasn't.”\n\nYou do not ask him which time. In Samé even the children know which.\n\n“At the harbor they say our family will pay forever,” you say.\n\nEumaeus shrugs. He takes the stick out of the fire and blows on the smoking tip: the ember at the end turns red, and goes black again. “I paid for a serving girl who was running off with the Phoenicians and took me with her. I was a king's son, and your grandfather bought me to mind his pigs. I don't care about it anymore.”\n\nHe gets up, rummages in a basket hanging from the beam and comes back with a bundle wrapped in a dry fig leaf, which rustles between his fingers: a flat, hard cake, with a hole in the middle and the crust scorched at the edges.\n\n“Take it. It's the cake for the dog at the gate. The one you put in the hand of someone going on a long journey, for the big dog that stands guard. You never know.” He puts it in your hand. Where the bundle opens, the black comes off on your fingertips. He waits for you to tie it to your belt. You tie it on. “Your grandmother is farther down, with the women of Ithaca. Stop by and see her.”","it":"Cake for the Dog at the Gate"},"357":{"t":"“No,” you say. “This story I won't tell.”\n\nYou turn your back on the clearing and set off again. But the old women get up and come after you among the trunks, quicker than you expected, with their wool dresses scraping against the bark, while the ship's boys jump among the roots around you.\n\n“Come on. Just once.”\n\n“Only the names.”\n\n“If you don't say them, we will, and then it's your lookout.”\n\nThe wood grows thick. The roots come out of the earth, the ribs of a boat, and to climb over them you hold the oar by the middle, crosswise, to balance yourself. The willow branches catch in your cloak and leave on it a smell of rotten leaves. A ship's boy ducks under your arm and runs backward in front of you, to watch your mouth. Somewhere far ahead you can hear a river running.\n\nYou have to shake them off before they lose patience. If they are still at your heels when they stop asking, they will say the names themselves. And the two of that story, you have known since you were a child, no one has ever driven off with a stick."},"358":{"t":"You take your place on the free root, with the oar upright against your shoulder, and you tell it. It is the story Eurycleia used to tell you when you would not sleep, and you find that you still know all of it, word for word, with its pauses and with the voice she lowered at the right places: the two old women of the night, the one who makes a sound of footsteps and the one who makes no sound at all. The smell she carried with her from the palace comes back to you, of bread and of wax. The ship's boys press together knee against knee, and the one with the line winds it twice around his wrist. The nurses move their lips along with you, without a voice, half a word ahead. When you come to the place where the names are said, you say them.\n\n“Mormo. Gello.”\n\nThe ship's boys shriek with delight. The nurses nod, as when a thing has been done well, and one claps her hands on her knees, twice. Two ship's boys start playing the old women, bent over, with their fingers hooked, and the others run off laughing among the roots.\n\nThe wood goes silent all at once. The two who were playing the old women straighten up without finishing the game. Among the poplars, twenty paces away, the dark grows thicker in two places. They are not shapes, not yet: they are two patches where the light does not reach, as tall as a bent woman, and from that side the air smells of a wick just put out. The glow that comes down through the branches falls into the patches and does not touch the ground. They stand there. They wait. The dog has the hair standing up on his back and does not bark.\n\n“That's enough now,” says the oldest nurse, and she is no longer smiling. She has taken her hands from her lap and is holding on to the root. “Now hush.”\n\nA ship's boy whispers in your ear, excited: “Call them one more time and tell them to go away! That's how it was done on my ship!”\n\nThe two patches do not move. The oar you have in your hand, but over there nothing can be seen that an oar could touch. And legs, for running, you have.","dec":1},"367":{"t":"You open your hands.\n\nWhat you were holding, whatever shape it had, slips away from you, and you find yourself sitting on the sand. You see him again as he was at the start: an old man with a beard of foam, standing at the water's edge, looking at you without rancor and without interest. To him you are one of the many who have tried. He tidies his beard with two fingers and dives, headfirst, into water that would not cover an ankle. The water closes over him smooth, and not even a ring is left. Where you held him a little salt puddle remains, which the sand drinks a sip at a time, until it is gone.\n\nThe last seals go after him in a line, swaying down to the water. The four shapes under the skins are gone too. Where they lay the hollows remain in the sand, smooth: beds left in a hurry.\n\nThe shore is empty. With the snorting of the beasts over, the beach is silent, and the sea adds nothing of its own. You notice that your arms are still closed in a circle around nothing, and you let them fall. Not a hair is left on your palms. You have lost nothing, and you have gained nothing. There remains the smell of the beasts, which frays and is lost, and their tracks, wide and soft, which all go toward the sea and none comes back.\n\nYou get up and shake the sand from your cloak. The oar is where you laid it, half covered by the sand the two of you churned up. Inland, beyond the dunes, you can see the black line of a river, among the reeds. You put the oar on your shoulder."},"371":{"t":"“Run while you still can!” you shout, and you turn toward the track behind you, pretending to see someone coming along it. “Odysseus is behind me with his men. The one from Ismarus. He's coming now!”\n\nThe name passes among the Cicones, wind over a field of wheat. Some look at the track, some at you; then they all run off among the chariots, and the dust they raise hangs in the air behind them.\n\nAll except one. The oldest has stopped halfway and turned around: a warrior who studies you, the way a money changer studies a coin that rings false. On the shaft of his spear the wood is black where he holds it.\n\n“He talks like him,” he says under his breath. “I've heard this one before, under the walls of Ismarus.” He comes back and bars the track to you, alone. He sets his feet in two ruts, raises his shield up under his chin and holds his spear low, against his side.\n\nThe old warrior is slow, but he will not move aside. His blows land all the same, and each one carries a small thing away: a word of a song, the face of a friend.\n\n*Note on your sheet: “the blood of Odysseus was recognized”.*","e":"The Old Warrior","ec":6,"ee":6,"f":"the blood of Odysseus was recognized"},"374":{"t":"You tear a tuft of asphodels from the edge of the road and wave it in front of the donkey's muzzle, on the other side of the pine. The broken stems leave a sticky juice on your fingers. The white flowers give off their bitter smell, and the donkey pricks up her ears and widens her nostrils. The crunching of the rushes breaks off. Ocnus, who has noticed nothing, goes on plaiting, and the rope goes on falling behind him.\n\nNow only one moment is needed: for the donkey to look at the flowers long enough, and for you to have time to reach out your hand and pull the rope away before she goes back to chewing. Between your hand and the rope there is an arm's length. Between the rope and her teeth there is nothing: she has it in her mouth, wet, and she is holding it.\n\nThe donkey looks at the flowers. She looks at the rope. The flowers again. If she chooses the rope, she will eat it before your eyes down to the last rush, and you will be left with a tuft of flowers in your hand."},"383":{"t":"You say nothing more. You grip the oar and run.\n\nBehind you the old women shout, then fall silent. The ship's boys' footsteps stop. Another tread, heavier, goes on: it falls once for every three of yours, and does not drop behind. You do not turn around. Among the black poplars everything looks alike: a trunk, another, a willow, another trunk, and on the ground only moss, which makes no noise and holds no footprints. A root catches your foot; you right yourself with a hand on wet bark and go on.\n\nThe two patches of dark come after you, from tree to tree, always twenty paces behind. You know it without looking: the air of a snuffed wick stays on the back of your neck, neither stronger nor weaker, however much you lengthen your stride. With no one to call them again, perhaps they will tire and dissolve into the wood like smoke. Or perhaps they will be on you before you find the river."},"385":{"t":"“I'm afraid,” you say. “Of that water, and of all the rest.”\n\nMenoetes stops spitting. He tilts his head to one side and studies you, with the face of a herdsman who has seen a calf born crooked get up by itself. “Afraid.” He nods, twice. “Good. Heroes aren't, and that is why they do damage. Come. Put your feet where I put mine.”\n\nHe takes you along the bank, among the black cows, which move aside without lowing. He walks with his side hitched up, and before every step he tests the earth with the tip of his staff; you put your feet in his footprints. The cows have dull, dusty coats, and each one wears at its neck a wooden bell that does not ring: as you pass you see the clapper swinging inside, to no purpose. Here the asphodels are trampled, and from the broken stalks rises a stronger smell, almost of honey gone bad. No bird, no insect: only the rustle of your steps and his among the stalks.\n\nWhere the water widens, Menoetes points his staff at the path.\n\nOn the beaten earth, among the cloven hoofprints, there are shining drops, set and hard, as big as lentils. You touch one with the tip of your finger: it is smooth, and does not come away. Bronze. It looks like lead poured and left to cool. In line with the drops are footprints, pressed deeper than those of the cows.\n\n“One who is all of bronze passes this way,” says Menoetes. “He makes his round of the great plain, beyond the river, as he used to around his island. And he leaks. Look where the drops fall: always beside the heel, never on the side of the toes.” He spits. “A beast that limps leaks from one leg only. The trade taught me that.”\n\nHe goes into the ford first, up to his knees, leaning on his staff. The water opens around him without a gurgle, black, and closes again behind him. He turns to wait for you. On the bank the cows have raised their muzzles all together, toward the same part of the plain. “I'll take you across. Then you manage on your own: farther on the hunt passes, and my beasts can hear it.”\n\n*Note on your sheet: “you saw the drops of bronze”.*","f":"you saw the drops of bronze"},"390":{"t":"“I am Amphialus, son of Eurylochus,” you say. “My uncle is Odysseus, the king of Ithaca.”\n\nYou say it in a full voice, with the oar upright beside you: that is how you announce yourself on entering a foreign port.\n\nMenoetes says nothing. He lifts his staff from the ground and puts it on his shoulder, like a man who has finished listening. A cow, behind him, raises her head from the asphodels and stays like that, with a white tuft hanging from her mouth. Menoetes smiles, and it is not a nice smile: only one corner of his mouth goes up, and his eyes stay where they were.\n\n“The king's nephew. But of course.” He takes the staff off his shoulder and points it toward a broad, beaten path, which leads away from the ford among the trampled asphodels. “That way, king's nephew. It is the road for people like you: broad, easy. All the heroes go that way.”\n\nHe goes back to his cows without waiting for you to thank him, and drives them toward the water with little taps of his staff on their rumps. The wood sounds sharp on the bones, and none of them lows.\n\nIt really is broad, the path: two wagons could pass on it side by side. The asphodels on either side are broken and crushed, as if a whole herd had gone over them, at a run, more than once, and the air above the path smells of sap and dust. The earth is hard underfoot, and here nothing crackles anymore. Prints of every shape are left on it, hooves, claws, and among them the prints of bare feet, twice as long as yours and sunk a finger's breadth deeper than the others. From far off comes a sound that comes and goes: a horn, perhaps, or a baying.\n\nA little farther on, at the edge of the path, there is a wagon without oxen, with its shafts resting on the ground. Beside it two boys are asleep, one with his head on the other's shoulder and their hands lying loose in their laps. They have the same face, at two ages close together: brothers. They are so peaceful that, as you pass, you slow your step so as not to wake them."},"392":{"t":"“I promise you nothing,” you say. “I don't promise what I don't know I can do.”\n\nYou say it to his face, without getting out of the boat and without getting all the way in.\n\nElpenor is silent. Those the boat has not taken look at the water, there where the yellowish foam hems the gravel. He nods just once, as far as the hand under his jaw lets him: the nod that on board is given to a maneuver well done.\n\n“Honest,” he says. “Like your father.”\n\nYou do not know what to answer. In all your life no one has ever told you that you are like your father to say a good thing. In Samé, when they said it, they lowered their voices.\n\nElpenor bends his knees and picks up from the gravel a flat stone, the kind the boys on Ithaca skip across the water. It is black with mud on one side and washed on the other. He turns it over in his fingers without throwing it; the trembling makes it dance on his palm, and it does not fall. This water is too black to play on.\n\n“Eurylochus never promised anything,” he says, and he speaks to the stone, not to you. “He said things as they were, even to your uncle, even in front of everyone, even when it was better to keep quiet. On the ship, some hated him for it. I didn't.” He lays the stone back where he took it from, carefully, in its print, with the mud underneath. He puts his hand back under his jaw and lifts his face. “Go. The old man doesn't wait.”\n\nBehind you Charon knocks the oar on the gunwale a second time. The knock bounces over the black water and is lost among the reeds. Under the foot you have aboard the boards move: the old man has already pulled the pole out of the mud."}},"links":{"1":[{"l":"Follow the dog","v":173,"t":"l"},{"l":"🧠 If you have Stars","v":270,"t":"l"}],"10":[{"l":"Walk straight on toward the boat","v":202,"t":"l"},{"l":"Stop and listen to him","v":309,"t":"l"}],"31":[{"l":"Lean over beside him","v":251,"t":"l"},{"l":"Go on toward the shore of the seals","v":209,"t":"l"}],"42":[{"l":"Eat it","v":242,"t":"l"},{"l":"Drop it and take the path of the smoke","v":240,"t":"l"},{"l":"Drop it and go down into the plain","v":145,"t":"l"},{"l":"Drop it and head for the crossroads","v":119,"t":"l"}],"52":[{"l":"⚔️ If you win","v":10,"t":"l"},{"l":"⚔️ If you lose","v":204,"t":"l"}],"55":[{"l":"Get into the boat","v":268,"t":"l"}],"58":[{"l":"Go on tow o had been sailing for forty years, got seasick.","Now, when you come aboard, the sailors of Samé do not laugh anymore. Some of them touch iron for luck.","At the harbor they say that your family has a debt to the sea. No one knows what it is."]},{"h":"WHAT YOU WANT","p":["You do not touch iron. You want the open sea that your uncle had, and the courage that your father had, the courage to tell the captain he is wrong. You want another story about your family to be told in the harbors one day, one that ends well.","If the sea has an open account with the house of Laertes, you think, someone will have to settle it. And if no one knows what the debt is, you will find out yourself, going to sea until the sea has told you what it wants. You will set things right. That is why you keep looking for a berth on every ship that sails."]}],"prologo":null,"lama":"","corsa":null};
// Motore delle demo giocabili dei librigiochi di Peter Palmer.
// fai_demo.js lo copia dentro ogni pagina, dopo «var BOOK = {...};». Niente onclick nel codice HTML: la politica di
// sicurezza della pagina lascia girare solo questo script, quindi i pulsanti hanno data-az e un solo ascoltatore.
(function () {
  'use strict';
  var B = BOOK, U = B.ui, P = B.par, K = B.links, MAX = B.max;
  var KEY = 'demo_' + B.slug + '_' + B.lang;
  var app = document.getElementById('app');
  var ST = null, NOTE = [], occupato = false;

  // ---------- utilità ----------
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function md(s) {
    return esc(s).replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[\s(«"“])\*([^*\n]+)\*(?=$|[\s).,;:!?»"”])/gm, '$1<i>$2</i>');
  }
  function paras(s) {
    return String(s || '').split(/\n+/).map(function (x) { return x.trim(); }).filter(Boolean)
      .map(function (x) { return '<p>' + md(x) + '</p>'; }).join('');
  }
  function t(k, o) { var s = U[k] || k; if (o) for (var x in o) s = s.split('{' + x + '}').join(o[x]); return s; }
  function d6() {
    try { var a = new Uint8Array(1); do { crypto.getRandomValues(a); } while (a[0] >= 252); return 1 + a[0] % 6; }
    catch (e) { return 1 + Math.floor(Math.random() * 6); }
  }
  function norm(s) { return String(s || '').replace(/✓/g, '').replace(/\s+/g, ' ').trim().toLowerCase(); }
  function re(k) { return new RegExp(B.re[k], 'iu'); }
  var RE = { ab: re('ab'), itPos: re('itPos'), itNeg: re('itNeg'), fgPos: re('fgPos'), fgNeg: re('fgNeg'), fgPre: re('fgPre'), vinci: re('vinci') };
  var lento = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  // ---------- dadi disegnati ----------
  var PUNTI = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
  function dado(v, cls) {
    var h = '<span class="dado' + (cls ? ' ' + cls : '') + '" aria-label="' + v + '">';
    for (var i = 1; i <= 9; i++) h += '<i' + (PUNTI[v].indexOf(i) >= 0 ? ' class="p"' : '') + '></i>';
    return h + '</span>';
  }
  function dadi(arr, cls) { return arr.map(function (v) { return dado(v, cls); }).join(''); }
  // fa rotolare i dadi dentro el, poi chiama fine()
  function rotola(el, n, fine) {
    if (!lento || !el) { fine(); return; }
    var k = 0;
    var iv = setInterval(function () {
      var a = []; for (var i = 0; i < n; i++) a.push(d6());
      el.innerHTML = dadi(a, 'gira');
      if (++k > 7) { clearInterval(iv); fine(); }
    }, 70);
  }

  // ---------- stato ----------
  function tira(v) { var r = { d: [], v: 0 }; if (typeof v === 'number') { r.v = v; return r; } for (var i = 0; i < v[0]; i++) r.d.push(d6()); r.v = v[1] + r.d.reduce(function (a, b) { return a + b; }, 0); return r; }
  function nuovo(ab) {
    var s = { cur: 1, n: 0, ab: ab || [], persi: [], inv: (B.zaino || []).slice(), fg: [], fatti: {}, combat: null, pend: null, fine: 0, anc: 0, tiri: {} };
    var V = B.valori;
    var f = tira(V.fz); s.fz = f.v; s.tiri.fz = f;
    var r = tira(V.hp); s.hp = s.hpMax = r.v; s.tiri.hp = r;
    if (V.agi) { var a = tira(V.agi); s.agi = a.v; s.tiri.agi = a; }
    return s;
  }
  function salva() { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} }
  function carica() { try { var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.cur && P[s.cur] && !s.fine) return s; } catch (e) {} return null; }
  function cancella() { try { localStorage.removeItem(KEY); } catch (e) {} }

  function haDote(n) { n = norm(n); return ST.ab.some(function (a) { return norm(a) === n; }); }
  function persa(n) { n = norm(n); return ST.persi.some(function (a) { return norm(a) === n; }); }
  function ruolo(r) { return !!(B.ruoli && B.ruoli[r] && haDote(B.ruoli[r])); }
  // oggetti: si confrontano senza articolo, e l'etichetta può continuare dopo il nome («Hai La corda spezzata: gliela leghi...»)
  function senzaArt(s) { return norm(s).replace(/^(?:(?:un|una|uno|il|lo|la|i|gli|le|a|an|the) |l['’])/, ''); }
  function haOgg(n) {
    n = senzaArt(n);
    return ST.inv.some(function (x) { x = senzaArt(x); return x === n || x.indexOf(n) === 0 || n.indexOf(x) === 0; });
  }
  function cura(n) { n = norm(n); for (var i = 0; i < B.cure.length; i++) if (n.indexOf(B.cure[i][0]) >= 0) return B.cure[i][1]; return 0; }
  // «il libro ricorda»: come nel giocabile del Tool Creator
  function fNorm(s) { return norm(s).replace(RE.fgPre, ''); }
  var NOTI = null;
  function noti() { if (!NOTI) { NOTI = {}; for (var k in P) if (P[k].f) NOTI[fNorm(P[k].f)] = 1; } return NOTI; }
  function cancello(lab) {
    var m = lab.match(RE.fgNeg);
    if (m) { var pos = fNorm(B.re.non + ' ' + m[1]); if (noti()[pos] && !noti()[fNorm(m[1])]) return { neg: false, f: pos }; return { neg: true, f: fNorm(m[1]) }; }
    m = lab.match(RE.fgPos);
    return m ? { neg: false, f: fNorm(m[1]) } : null;
  }
  function haFg(f) { return ST.fg.some(function (x) { var y = fNorm(x); return y === f || y.indexOf(f) >= 0 || f.indexOf(y) >= 0; }); }

  // ---------- schermate ----------
  function mostra(h, giu) { app.innerHTML = h; if (!giu) window.scrollTo(0, 0); }

  function copertina() {

    var h = '<main class="copertina">' +
      '<h1 class="vh">' + esc(B.title) + '</h1>' +
      '<img class="cop" src="' + B.cover + '" alt="' + esc(t('copAlt', { t: B.title })) + '">' +
      '<p class="etichetta">' + esc(U.demo) + '</p>' +
      '<p class="sotto">' + esc(U.copTesto) + '</p>' +
      '<div class="pulsanti">';
    if (sv) h += '<button class="btn primo" data-az="riprendi">' + esc(t('riprendi', { n: sv.cur })) + '</button>';
    h += '<button class="btn' + (sv ? '' : ' primo') + '" data-az="' + (B.intro && B.intro.length ? 'intro' : 'regole') + '">' + esc(sv ? U.nuova : U.gioca) + '</button>' +

    mostra(h);

  // pezzi dell'introduzione e prologo del libro, con i loro titoli
  function sezioniHtml(lista) {

  function introduzione() {

  function prologo() {
    mostra('<main class="foglio intro">' + sezioniHtml(B.prologo) +
      '<button class="btn primo" data-az="uno">' + esc(U.vaiUno) + '</button></main>');
  }

  var TIRI_REGOLE = null;
  function regole() {
    if (!TIRI_REGOLE) TIRI_REGOLE = nuovo([]);
    var s = TIRI_REGOLE, V = B.valori;
    var h = '<main class="foglio regole"><h2>' + esc(U.regoleTit) + '</h2>' + B.regole.map(function (r) { return '<p>' + md(r) + '</p>'; }).join('');
    h += '<h3>' + esc(U.valoriTit) + '</h3><p class="nota">' + esc(U.valoriNota) + '</p><div class="valori">';
    var riga = function (nome, x, piu) {
      return '<div class="valore"><span class="vnome">' + esc(nome) + '</span><span class="vdadi">' +
        (x.d.length ? dadi(x.d, 'piccolo') + ' <span class="piu">+ ' + piu + ' =</span>' : '') + '</span><b class="vnum">' + x.v + '</b></div>';
    };
    h += riga(U.forza, s.tiri.fz, typeof V.fz === 'number' ? 0 : V.fz[1]);
    h += riga(U.resistenza, s.tiri.hp, typeof V.hp === 'number' ? 0 : V.hp[1]);
    if (V.agi) h += riga(U.agilita, s.tiri.agi, V.agi[1]);
    h += '</div>';
    h += '<h3>' + esc(B.dotiTit) + '</h3><p class="nota">' + esc(U.dotiNota) + '</p><div class="doti">';
    B.doti.forEach(function (d, i) {
      h += '<label class="dote"><input type="checkbox" value="' + i + '"><span><b>' + esc(d.n) + '</b>' +
        (d.b ? ' <span class="bonus">(' + esc(d.b) + ')</span>' : '') + (d.d ? '<br><small>' + esc(d.d) + '</small>' : '') + '</span></label>';
    });
    h += '</div><div class="barra-doti"><span id="conta">' + esc(t('dotiConta', { n: 0 })) + '</span>' +
      '<button class="btn" data-az="caso">' + esc(U.caso) + '</button>' +
      '<button class="btn primo" id="via" data-az="comincia" disabled>' + esc(U.comincia) + '</button></div></main>';
    mostra(h);
  }
  function contaDoti() {
    var cb = [].slice.call(app.querySelectorAll('.dote input'));
    var n = cb.filter(function (c) { return c.checked; }).length;
    cb.forEach(function (c) { if (!c.checked) c.disabled = n >= 5; c.parentNode.classList.toggle('scelta', c.checked); });
    var e = document.getElementById('conta'); if (e) e.textContent = t('dotiConta', { n: n });
    var v = document.getElementById('via'); if (v) v.disabled = n !== 5;
  }

  function barra() {
    var pall = ''; for (var i = 0; i < MAX; i++) pall += '<i class="' + (i < ST.n ? 'usata' : '') + '"></i>';
    var r = ST.hp <= ST.hpMax / 3 ? ' basso' : '';
    return '<header class="barra" role="status"><span title="' + esc(U.forza) + '"><b>' + esc(U.fAbbr) + '</b> ' + ST.fz + '</span>' +
      '<span class="r' + r + '" title="' + esc(U.resistenza) + '"><b>' + esc(U.rAbbr) + '</b> ' + Math.max(0, ST.hp) + '/' + ST.hpMax + '</span>' +
      (ST.agi ? '<span title="' + esc(U.agilita) + '"><b>' + esc(U.aAbbr) + '</b> ' + ST.agi + '</span>' : '') +
      '<span class="palline" title="' + esc(t('scelteTit', { n: ST.n, m: MAX })) + '">' + pall + '</span>' +
      '<button class="btn mini" data-az="scheda">' + esc(U.scheda) + (ST.inv.length ? ' · ' + ST.inv.length : '') + '</button></header>';
  }

  // arrivo in un paragrafo: zaino, annotazioni, Resistenza (una volta per partita)
  function entra(id, pre) {
    ST.cur = id; ST.pend = null; ST.combat = null; NOTE = pre || [];
    var o = P[id] || {};
    if (ST.fatti[id]) return;
    ST.fatti[id] = 1;
    if (o.it && !haOgg(o.it)) { ST.inv.push(o.it); NOTE.push(['ogg', t('notaOgg', { x: o.it })]); }
    if (o.f && ST.fg.indexOf(o.f) < 0) { ST.fg.push(o.f); NOTE.push(['fg', t('notaFg', { x: o.f })]); }
    if (o.hh) { ST.hp = Math.ceil(ST.hpMax / 2); NOTE.push(['hp', t('notaMeta')]); }
    if (o.h) { var pr = ST.hp; ST.hp = Math.min(ST.hpMax, ST.hp + o.h); var dlt = ST.hp - pr; if (dlt || o.h < 0) NOTE.push([o.h < 0 ? 'male' : 'hp', t('notaHp', { n: (o.h < 0 ? '−' + (-o.h) : '+' + dlt) })]); }
    if (o.il) { for (var i = 0; i < ST.inv.length; i++) if (norm(ST.inv[i]) === norm(o.il)) { ST.inv.splice(i, 1); NOTE.push(['male', t('notaPerso', { x: o.il })]); break; } }
    if (o.al && !/^scegli$/i.test(o.al)) {
      for (var j = 0; j < ST.ab.length; j++) if (norm(ST.ab[j]) === norm(o.al)) { ST.persi.push(ST.ab[j]); ST.ab.splice(j, 1); NOTE.push(['male', t('notaDote', { x: o.al })]); break; }
    }
  }
  function vai(id, pre) { entra(id, pre); salva(); paragrafo(); }

  function collegamenti(id) { return (K[id] || []).filter(function (l) { return l.t === 'l'; }); }
  function eMorte(id) { return (K[id] || []).some(function (l) { return l.t === 'm'; }); }

  function paragrafo() {
    var id = ST.cur, o = P[id] || {};
    var h = barra() + '<main class="foglio par"><div class="num">§ ' + id + '</div>';
    if (typeof o.img === 'number') h += '<figure class="ill"><img src="' + B.img[o.img] + '" alt=""></figure>';
    if (o.e && o.ec && o.ee) h += '<p class="nemico">⚔️ ' + esc(o.e) + ' <small>(' + esc(U.forza) + ' ' + o.ec + ' · ' + esc(U.resistenza) + ' ' + o.ee + ')</small></p>';
    h += '<div class="testo">' + paras(o.t) + '</div>';
    if (NOTE.length) h += '<div class="note">' + NOTE.map(function (n) { return '<span class="nota-' + n[0] + '">' + esc(n[1]) + '</span>'; }).join('') + '</div>';
    h += '<div class="azioni">' + azioni(id, o) + '</div></main>';
    mostra(h, ST._giu); ST._giu = false;
  }

  function azioni(id, o) {
    var ls = collegamenti(id);
    if (eMorte(id)) { ST.fine = 2; cancella(); return morte(false); }
    if (ST.hp <= 0 && !ST.combat) {
      if (o.z && P[o.z]) return '<div class="riquadro"><p class="titolo-r">' + esc(U.zeroTit) + '</p><button class="btn primo" data-az="zero" data-v="' + o.z + '">' + esc(t('vaiA', { n: o.z })) + '</button></div>';
      if (B.zeroA && P[B.zeroA] && id !== B.zeroA) return '<div class="riquadro"><p class="titolo-r">' + esc(U.zeroTit) + '</p><button class="btn primo" data-az="zero" data-v="' + B.zeroA + '">' + esc(t('vaiA', { n: B.zeroA })) + '</button></div>';
      if (B.zeroUno) { ST.hp = 1; salva(); return '<p class="nota">' + esc(U.restaUno) + '</p>' + azioni(id, o); }
      ST.fine = 2; cancella(); return morte(true);
    }
    if (ST.n >= MAX) { ST.fine = 1; cancella(); return pannello(false); }
    var vinci = ls.filter(function (l) { return /^⚔/.test(l.l) && l.v; })[0];
    if (o.e && o.ec > 0 && o.ee > 0 && vinci) return scontro(id, o, ls);
    if (ST.pend) return esito();
    var agi = ls.filter(function (l) { return /^🤸/.test(l.l); });
    var fort = ls.filter(function (l) { return /^🎲/.test(l.l); });
    var h = '';
    if (agi.length >= 2) h += '<button class="btn prova" data-az="prova" data-v="agi">🤸 ' + esc(U.agiProva) + ' · ' + esc(U.tira) + '</button>';
    else if (fort.length >= 2) h += '<button class="btn prova" data-az="prova" data-v="fort">🎲 ' + esc(U.fortProva) + ' · ' + esc(U.tira) + '</button>';
    var resto = ls.filter(function (l) { return !(agi.length >= 2 && /^🤸/.test(l.l)) && !(fort.length >= 2 && /^🎲/.test(l.l)); });
    // oggetti: «🎒 Hai X» e «🎒 Non ce l'hai»
    var serve = resto.map(function (l) { var m = l.l.match(RE.itPos); return m ? m[1] : null; }).filter(Boolean);
    var haAlmenoUno = serve.some(haOgg);
    var gemelliNeg = {}; resto.forEach(function (l) { var g = cancello(l.l); if (g && g.neg) gemelliNeg[g.f] = 1; });
    resto.forEach(function (l) {
      var lab = l.l, i = (K[id] || []).indexOf(l), m;
      if ((m = lab.match(RE.ab))) {
        if (persa(m[1])) return;
        if (!haDote(m[1])) { h += chiusa(lab, U.serveDote); return; }
      }
      if ((m = lab.match(RE.itPos))) { if (!haOgg(m[1])) { if (serve.length && resto.some(function (x) { return RE.itNeg.test(x.l); })) return; h += chiusa(lab, U.serveOgg); return; } }
      else if (RE.itNeg.test(lab)) { if (haAlmenoUno) return; }
      var g = cancello(lab);
      if (g && g.neg && haFg(g.f)) return;
      if (g && !g.neg && !haFg(g.f)) { if (gemelliNeg[g.f]) return; h += chiusa(lab, U.serveFg); return; }
      if (/^⚓/.test(lab) && ST.anc) { h += chiusa(lab, U.giaUsata); return; }
      h += '<button class="btn scelta" data-az="vai" data-v="' + i + '">' + esc(lab) + '</button>';
    });
    if (!h) h = '<p class="nota">' + esc(U.vicolo) + '</p>';
    return h;
  }
  function chiusa(lab, perche) { return '<button class="btn scelta chiusa" disabled>🔒 ' + esc(lab) + ' <small>' + esc(perche) + '</small></button>'; }

  // ---------- prove di agilità e colpi di fortuna ----------
  function rami(id, ico) {
    var ls = collegamenti(id).filter(function (l) { return l.l.indexOf(ico) === 0; });
    return ls.map(function (l) { return { v: l.v, lo: parseInt((l.l.match(/(\d+)/) || [0, '0'])[1], 10) || 0 }; })
      .sort(function (a, b) { return a.lo - b.lo; });
  }
  function prova(tipo) {
    var id = ST.cur, ico = tipo === 'agi' ? '🤸' : '🎲', br = rami(id, ico);
    var a = [d6(), d6()], s = a[0] + a[1], ok, dett;
    if (tipo === 'agi') {
      if (B.agilita === 'sotto') {
        var soglia = ST.agi + (ruolo('agilita') ? 1 : 0);
        ok = s === 12 ? true : s === 2 ? false : s <= soglia;
        dett = t('agiSotto', { s: soglia });
      } else { ok = s >= 7; dett = t('agiSopra'); }
    } else {
      var bon = ruolo('fortuna') ? 1 : 0;
      var corsa = !!(B.corsa && B.corsa.par.indexOf(id) >= 0 && haDote(B.corsa.dote));
      ok = s + bon >= (corsa ? 6 : 7); dett = t('fortDett') + (bon ? ' ' + t('fortBonus') : '') + (corsa ? ' ' + t('corsaBonus', { d: B.corsa.dote }) : '');
    }
    ST.pend = { tipo: tipo, d: a, s: s, ok: ok, dett: dett, v: ok ? br[br.length - 1].v : br[0].v };
    salva();
    var box = app.querySelector('.azioni'), io = ST;
    if (box) {
      box.innerHTML = '<div class="riquadro"><div class="dadi-grandi" id="rot"></div></div>';
      rotola(document.getElementById('rot'), 2, function () { if (ST === io && ST.pend && ST.cur === id && box.isConnected) box.innerHTML = esito(); });
    } else paragrafo();
  }
  function esito() {
    var p = ST.pend, agi = p.tipo === 'agi';
    var tit = agi ? '🤸 ' + U.agiProva : '🎲 ' + U.fortProva;
    var esiti = agi ? [U.agiOk, U.agiKo] : [U.fortOk, U.fortKo];
    return '<div class="riquadro"><p class="titolo-r">' + esc(tit) + '</p><p class="nota">' + esc(p.dett) + '</p>' +
      '<div class="dadi-grandi">' + dadi(p.d) + '<span class="somma">= ' + p.s + '</span></div>' +
      '<p class="esito ' + (p.ok ? 'ok' : 'ko') + '">' + esc(p.ok ? esiti[0] : esiti[1]) + '</p>' +
      '<button class="btn primo" data-az="esito">' + esc(t('vaiA', { n: p.v })) + '</button></div>';
  }

  // ---------- scontri ----------
  function scontro(id, o, ls) {
    if (!ST.combat || ST.combat.id !== id) ST.combat = { id: id, hp: o.ee, max: o.ee, log: [], fine: 0, ritiro: 0 };
    var c = ST.combat;
    var pf = ST.fz + (ruolo('forza') ? 1 : 0);
    var h = '<div class="riquadro scontro"><p class="titolo-r">⚔️ ' + esc(o.e) + '</p>' +
      barraVita(U.tu + ' · ' + U.fAbbr + ' ' + pf, ST.hp, ST.hpMax, 'io') +
      barraVita(o.e + ' · ' + U.fAbbr + ' ' + o.ec, c.hp, c.max, 'lui') +
      '<div class="dadi-grandi due" id="rot">' + (c.ultimo ? '<div class="tiro"><span class="chi">' + esc(U.tu) + '</span>' + dadi(c.ultimo[0]) + '</div><div class="tiro"><span class="chi">' + esc(o.e) + '</span>' + dadi(c.ultimo[1]) + '</div>' : '') + '</div>';
    if (c.log.length) h += '<div class="registro">' + c.log.slice(-4).map(function (l) { return '<p>' + esc(l) + '</p>'; }).join('') + '</div>';
    if (!c.fine) {
      if (!c.log.length) ls.forEach(function (l) { var m = l.l.match(RE.itPos); if (m && haOgg(m[1]) && l.v) h += '<button class="btn scelta" data-az="vai" data-v="' + (K[id] || []).indexOf(l) + '">' + esc(l.l) + '</button>'; });
      h += '<button class="btn primo" data-az="round">' + esc(U.attacca) + '</button>';
      ST.inv.forEach(function (x, i) { var v = cura(x); if (v && ST.hp < ST.hpMax) h += '<button class="btn" data-az="usa" data-v="' + i + '">' + esc(t('usaOgg', { x: x, n: v })) + '</button>'; });
    } else {
      var w = ls.filter(function (l) { return /^⚔/.test(l.l); });
      var vin = w.filter(function (l) { return RE.vinci.test(l.l); })[0] || w[0];
      var per = w.filter(function (l) { return l !== vin; })[0];
      if (c.fine === 1) h += '<p class="esito ok">' + esc(U.vinto) + '</p><button class="btn primo" data-az="esitoScontro" data-v="' + (vin ? vin.v : 0) + '">' + esc(t('vaiA', { n: vin ? vin.v : '' })) + '</button>';
      else if (per && per !== vin && per.v && P[per.v]) h += '<p class="esito ko">' + esc(U.perso) + '</p><button class="btn primo" data-az="esitoScontro" data-v="' + per.v + '">' + esc(t('vaiA', { n: per.v })) + '</button>';
      else { ST.fine = 2; cancella(); return h + '</div>' + morte(true); }
    }
    return h + '</div>';
  }
  function barraVita(nome, v, m, cls) {
    var pc = Math.max(0, Math.round(v / m * 100));
    return '<div class="vita"><span>' + esc(nome) + ' · ' + esc(U.rAbbr) + ' ' + Math.max(0, v) + '/' + m + '</span><div class="traccia"><div class="riemp ' + cls + ' w' + Math.round(pc / 5) * 5 + '"></div></div></div>';
  }
  function round() {
    var c = ST.combat; if (!c || c.fine || occupato) return;
    occupato = true;
    var o = P[c.id];
    var a = [d6(), d6()], b = [d6(), d6()], pr = a[0] + a[1], er = b[0] + b[1];
    if (B.lama && haDote(B.lama) && !c.lama && pr !== 12) {
      var lo = a[0] <= a[1] ? 0 : 1;
      if (a[lo] <= 2) { var vec = a[lo]; a[lo] = d6(); c.lama = 1; pr = a[0] + a[1]; c.log.push(t('lamaRiga', { x: vec, y: a[lo] })); }
    }
    var pa = pr + ST.fz + (ruolo('forza') ? 1 : 0), ea = er + o.ec - (ruolo('armatura') ? 1 : 0);
    var res = pr === 12 ? 'p' : pr === 2 ? 'e' : pa > ea ? 'p' : ea > pa ? 'e' : 't';
    if (res === 'p') c.hp -= 2; else if (res === 'e') ST.hp -= 2;
    var dopo = res === 'p' ? (pr === 12 ? U.dodici : U.colpisci) : res === 'e' ? (pr === 2 ? U.due : U.colpito) : U.pari;
    c.log.push(t('roundRiga', { a: pa, b: ea, n: o.e }) + ' ' + dopo); c.ultimo = [a, b];
    if (c.hp <= 0) c.fine = 1; else if (ST.hp <= 0) c.fine = 2;
    salva();
    var box = document.getElementById('rot'), io = ST;
    var dopo = function () { occupato = false; if (ST !== io || ST.combat !== c) return; var az = app.querySelector('.azioni'); if (az) az.innerHTML = azioni(ST.cur, P[ST.cur]); aggiornaBarra(); };
    if (box) rotola(box, 4, dopo); else dopo();
  }
  function aggiornaBarra() { var b = app.querySelector('.barra'); if (b) b.outerHTML = barra(); }

  // ---------- morte e fine della demo ----------
  function morte(perResistenza) {
    var tit = B.defeat || U.morteTit;
    return '<div class="riquadro morte"><p class="titolo-r">' + esc(tit) + '</p>' +
      (perResistenza ? '<p>' + esc(U.morteRes) + '</p>' : '') +
      '<p class="nota">' + esc(U.morteNota) + '</p>' +
      '<button class="btn primo" data-az="ricomincia">' + esc(U.ricomincia) + '</button></div>';
  }
  function pannello(fuori) {
    var h = '<div class="fine"><img class="cop-piccola" src="' + B.cover + '" alt="">' +
      '<p class="fine-sopra">' + esc(fuori ? U.fineFuori : U.fineSei) + '</p>' +
      '<h2>' + esc(U.fineTit) + '</h2><p>' + esc(B.fineTesto) + '</p><div class="compra">';
    B.negozi.forEach(function (n) {
      h += '<a class="btn primo" href="' + esc(n.url) + '" target="_top" rel="noopener">' + esc(n.f === 'ebook' ? U.ebook : n.f === 'scopri' ? U.scopri : U.cartaceo) +
        (n.dove ? ' <small>' + esc(n.dove) + '</small>' : '') + '</a>';
    });
    h += '</div><p class="sito"><a href="' + esc(B.sito) + '" target="_top">' + esc(U.sito) + '</a></p>' +
      '<button class="btn mini chiaro" data-az="rigioca">' + esc(U.rigioca) + '</button></div>';
    return h;
  }
  function fuori() {
    ST.fine = 1; cancella();
    mostra(barra() + '<main class="foglio par">' + pannello(true) + '</main>');
  }

  // ---------- scheda ----------
  function scheda() {
    var vecchia = document.getElementById('scheda'); if (vecchia) { vecchia.remove(); return; }
    var h = '<div class="scheda-dentro"><h3>' + esc(U.scheda) + '</h3>' +
      '<p><b>' + esc(U.forza) + '</b> ' + ST.fz + ' · <b>' + esc(U.resistenza) + '</b> ' + Math.max(0, ST.hp) + '/' + ST.hpMax +
      (ST.agi ? ' · <b>' + esc(U.agilita) + '</b> ' + ST.agi : '') + '</p>' +
      '<p class="nota">' + esc(t('scelteTit', { n: ST.n, m: MAX })) + '</p>' +
      '<h4>' + esc(U.doti) + '</h4><ul>' + ST.ab.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul>' +
      (B.fissi && B.fissi.length ? '<h4>' + esc(U.inBorsa) + '</h4><p class="nota">' + esc(B.fissi.join(' · ')) + '</p>' : '') +
      '<h4>' + esc(U.zaino) + '</h4>';
    h += ST.inv.length ? '<ul>' + ST.inv.map(function (x, i) {
      var v = cura(x);
      return '<li>' + esc(x) + (v && ST.hp < ST.hpMax ? ' <button class="btn mini" data-az="usa" data-v="' + i + '">' + esc(t('usa', { n: v })) + '</button>' : '') + '</li>';
    }).join('') + '</ul>' : '<p class="nota">' + esc(U.vuoto) + '</p>';
    if (ST.fg.length) h += '<h4>' + esc(U.ricorda) + '</h4><ul>' + ST.fg.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>';
    h += '<div class="pulsanti"><button class="btn primo" data-az="scheda">' + esc(U.chiudi) + '</button>' +
      '<button class="btn mini" data-az="rigioca">' + esc(U.daCapo) + '</button></div></div>';
    var d = document.createElement('aside'); d.id = 'scheda'; d.className = 'scheda'; d.setAttribute('role', 'dialog'); d.innerHTML = h;
    app.appendChild(d);
  }
  function usa(i) {
    var x = ST.inv[i], v = cura(x); if (!v) return;
    var pr = ST.hp; ST.hp = Math.min(ST.hpMax, ST.hp + v); ST.inv.splice(i, 1);
    if (ST.combat) ST.combat.log.push(t('usato', { x: x, n: ST.hp - pr }));
    salva();
    var s = document.getElementById('scheda'); if (s) s.remove();
    ST._giu = true; paragrafo();
  }

  // ---------- comandi ----------
  app.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-az]') : null;
    if (!b || b.disabled) return;
    var az = b.getAttribute('data-az'), v = b.getAttribute('data-v');
    if (az === 'intro') introduzione();
    else if (az === 'regole') { TIRI_REGOLE = null; regole(); }
    else if (az === 'uno') { if (ST) vai(1); }
    else if (az === 'riprendi') { ST = carica(); NOTE = []; if (ST) paragrafo(); else copertina(); }
    else if (az === 'caso') {
      var cb = [].slice.call(app.querySelectorAll('.dote input'));
      cb.forEach(function (c) { c.checked = false; c.disabled = false; });
      var idx = cb.map(function (c, i) { return i; });
      for (var i = idx.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = idx[i]; idx[i] = idx[j]; idx[j] = x; }
      idx.slice(0, 5).forEach(function (k) { cb[k].checked = true; });
      contaDoti();
    }
    else if (az === 'comincia') {
      var sc = [].slice.call(app.querySelectorAll('.dote input:checked')).map(function (c) { return B.doti[+c.value].n; });
      if (sc.length !== 5) return;

    }
    else if (az === 'vai') {
      var l = (K[ST.cur] || [])[+v]; if (!l) return;
      if (P[ST.cur].dec) ST.n++;
      if (/^⚓/.test(l.l)) ST.anc = 1;
      var pre = [];
      if (l.p) { for (var q = 0; q < ST.inv.length; q++) if (norm(ST.inv[q]) === norm(l.p)) { ST.inv.splice(q, 1); pre.push(['ogg', t('notaUsa', { x: l.p })]); break; } }
      if (!l.v || !P[l.v]) { fuori(); return; }
      vai(l.v, pre);
    }
    else if (az === 'prova') prova(v);
    else if (az === 'esito') { var p = ST.pend; if (!p) return; if (!p.v || !P[p.v]) { fuori(); return; } vai(p.v); }
    else if (az === 'zero') { var z = +v; ST.hp = Math.max(ST.hp, 0); if (P[z]) vai(z); else fuori(); }
    else if (az === 'round') round();
    else if (az === 'esitoScontro') { var d = +v; if (!d || !P[d]) { fuori(); return; } vai(d); }
    else if (az === 'usa') usa(+v);
    else if (az === 'scheda') scheda();
    else if (az === 'ricomincia') { var ab = ST ? ST.ab.concat(ST.persi) : []; ST = nuovo(ab); vai(1); }
    else if (az === 'rigioca') { cancella(); ST = null; var s2 = document.getElementById('scheda'); if (s2) s2.remove(); copertina(); }
  });
  app.addEventListener('change', function (e) { if (e.target.matches && e.target.matches('.dote input')) contaDoti(); });

  copertina();
})();
