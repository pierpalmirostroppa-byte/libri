n the door shakes the beam, and the nail that never stays down slides out by a finger's breadth.\n\nGunna stills her legs, which were swinging from the block. Kisa, in the shawl, lifts her head. On the small anvil the third ice cleat is still red, and at the edges it is starting to darken.\n\nThe nail first. Arnbjorn never opens the door with a nail out of place above his head, and you have learned from him. You climb on the stool with the small hammer and drive it back the way he taught you: “Three blows: one to find it, one to bend it, one to send it home.” At the third the nail goes back into the wood, and the beam stops shaking.\n\nThen you open.\n\nThe cold comes in first, with a handful of snow that melts on the warm stones of the floor. On the threshold, with snow up to his ankles, stands an old man with a wide-brimmed hat pulled down over his forehead and a dark blue cloak heavy with snow. He has only one eye; where the other was there is a closed fold, as old as his beard. The beard is gray, down to his chest, and the snowflakes stay caught in it without melting.\n\nBehind him, tied to the ring in the wall, a gray horse snorts, taller than any horse in the valley, his breath steaming in the dark. You count the legs. Then you count them again, from muzzle to tail, slowly, the way you count the nails left at the bottom of a sack. There are eight.\n\n“He has a shoe working loose,” says the old man. “In front, on the left. The third leg.”\n\nHe says it without hurry, and without apologizing for the hour.\n\nGunna, on the block, squeezes Kisa and stops breathing.\n\nArnbjorn is asleep in the next room, beyond the log wall, and you can hear him snoring even now. He left the fire to you. But his saying you know by heart, because he repeats it every time a farmer drags an animal in: “When a horse comes in, the bellows keep quiet.” A frightened horse, in a smithy, is worse than a fire. And this is the biggest you have ever seen on your threshold.\n\nThe cleat on the anvil is cooling. If you leave it there, you will have to put it back in the fire, and Gunna has been waiting since dark fell. The old man has not said he is in a hurry. He has not said he can wait, either.\n\nAnyone who has shod every horse in the valley knows how to approach a beast like this: slowly, hands low, talking to it before touching it, until it is the one that decides to trust.","dec":1,"img":0},"4":{"t":"At table, in the morning, there is what there is. One strip of dried fish each. It is as hard as a strap, and has to be held in the mouth until it gives. Ragna's bread, dark, with ground pine bark in it that crunches under your teeth. No milk: the cows have given none since before the snows, and you can hear them lowing from the barn, out of habit. The table stands against the log wall, where the warmth of the forge comes through; on the door side the cold rises from the floor into your boots.\n\nRagna takes your hand to put your share of fish in it, and stops at the white mark on your palm, the one that has always been there. “You grabbed that iron in your hand when you were two winters old. Not so much as a whimper.” Then she closes your fingers over the fish and moves on to Gunna, who arrived at dawn with snow up to her knees to show everyone Kisa with her four new cleats, finished before you went to sleep.\n\nThe cat jumps on the table and walks among the bowls, tick tick tick, like a goat on cobblestones. She lifts each paw higher than she needs to, and shakes it before setting it down. Gunna laughs so hard that her mouthful goes down the wrong way. Ragna lifts Kisa by the scruff and sets her on the floor, without stopping serving.\n\nArnbjorn found the silver coin on the workshop bench and has bitten it twice. “It's good,” he says, pleased. He reaches toward the wooden bowl in the middle of the table. “The salt?”\n\n“Gone,” says Ragna. “Three days ago.”\n\nArnbjorn looks at the empty bowl, then at the coin, and puts it back in his pocket, grumbling that silver can't be eaten.\n\nOutside the beams crack with the frost, and the smoke from the roofs rises straight: there is not a breath of wind. Against the wall the snow has reached the windowsill. Through the window the light comes in gray, and seems already tired. In the bucket by the door the water has iced over during the night, and Ragna breaks it with the handle of the ladle, two blows.\n\nWhen you get up, Ragna puts something flat and hard in your hand, wrapped in a piece of cloth. It is her barley flatbread, the one for long days, with the barley counted out in handfuls. Through the cloth you feel the hard-baked rim, and in the middle the print of her knuckles.\n\n“For later,” she says. “Not for now.”\n\nArnbjorn is already at the door, with his leather apron over his shoulder. He sees the cloth in your hand and knows it from a distance. “Ragna's Barley Flatbread,” he says. “And nothing for me?”\n\nRagna does not even turn around. He laughs, and whistles twice to call you, as he does every morning.","it":"Ragna's Barley Flatbread, relic"},"5":{"t":"You take the axe and bring it down edge-on on the head, hard, as on a log. You put your shoulders and your knees into the blow.\n\nThe blade does not go in. It slides over the wet fur without biting, and comes back into your hands with a jolt that reaches your shoulders. Under the edge nothing has given, neither the fur nor what the fur covers. The seal's head does not make a sound. It rises.\n\nIt rises a span, pushing the boards from below, until the neck comes out too, thick and smooth, with the skin folding like a waterskin full of water. Two floor nails pop out and roll to your boots. It stays there, at its new height, and goes on looking at the fire. Not at you. At the fire.\n\nYou look at the blade. On the edge there is a new nick, bright, the kind made by a stone hidden inside a log. Where you struck it, the head does not have so much as a mark: the fur is smooth, wet, untouched. All the blow has given it is one more span out of the floor.\n\nAlong the wall the people of the house press closer still. A lamp trembles, and the seal's shadow trembles with it on the wall, up to the beams. One of the men has stopped praying and holds his high above his head, with an arm that will not keep still. From the crack rises a damp cold that wets your ankles through your breeches, and a smell of fjord at low tide. Under the boards the surf beats harder.\n\nYou still have the axe in your hand, and the handle is good: seasoned ash, without a crack. You could strike again, harder, where the neck joins the head. There the neck is twice as wide as the blade, and the folds move with every breath it takes. The pack is still there, at your feet, with the hammer inside, wrapped in its leather."},"6":{"t":"You take her hand between yours, and remember at once that it is no use: they are cold, they always are, even in front of the forge. Hers weighs more than a hand, hard and smooth, and the fingers stay where you put them. So you do what is done in the workshop with burns. You have someone give you a bowl of water from the cooking pot and you hold it against your chest, under the wool, until it is lukewarm, no more: from that fire there is nothing to be expected. You test it with your elbow, because you do not trust your fingers. You put Aud's hand in it, and you hold it there. The water comes up over her wrist, where the white ends.\n\nAt first she feels nothing. When it starts to hurt, she clenches her teeth; it is a good sign, and you tell her so. One of the women of the house sets a roll of wool down beside you and goes back to her bench. When the skin turns pink again at the edges, you dry it without rubbing, grease it with a thin film of fat and wrap it in a strip of clean wool, finger by finger. The fat is the seal fat from the lamps, and it stinks; Aud pays it no mind. You make the turns as tight as they need to be and no tighter: a bandage too tight does more harm than the burn, Arnbjorn taught you that your first winter in the workshop.\n\nAud looks at her bandaged hand and, without your asking her anything, begins to talk.\n\n“The master of this house was called Hallgrim,” she says. “My husband. He never left a net in the sea at night, except that once.” She stops, and starts again. “The older oarsman was Kolbein. The other was Sturla. He was seventeen winters old, and he sang while he rowed. Now you know it too.”\n\nShe puts the hand back in her lap and covers it with the other, the way you shelter a thing you do not want to lose.\n\nThe light has gone from the smoke hole, and at the far end of the room the hide curtain of the kitchen is a patch darker than the wall.\n\n*Write in the NAMES column: Hallgrim, Kolbein, Sturla.*"},"9":{"t":"In the workshop the fire has already taken color. Arnbjorn is hammering the blade of a broken hoe, and you are at the bellows: two short and one long, two short and one long, until the embers go from red to orange, and from orange to yellow. At each blow of the hammer the flakes of slag fly off the anvil and go out on the floor. The heat reaches halfway down the long room; toward the two doors the frost still keeps the hinges white.\n\nAt the third long stroke the goatskin gives. It opens along an old seam, from one patch to the next, with the sound of a breath escaping, and the fire sinks. From the tear comes a puff of hot ash that hits you in the face, and the smell of old hide heated, part goat and part scorched leather.\n\nYou make to stop. Arnbjorn does not. He already has the awl and two needles in his hand, and the leather thong between his teeth. He takes it out of his mouth only to tell you the rule:\n\n“You don't stop the fire. Sew the leather back up while the bellows work, with the saddler's stitch.”\n\nYou keep the bellows going in short strokes, with the open leather blowing half its air out the side, and he sews. Two needles in the same hole, one from each side, and the thong pulled tight at every stitch. He follows your rhythm without looking at it, bending when the bellows go down and rising when they come up. With every stitch the leather holds a little more, and the fire comes back up. When he ties the knot, the embers are yellow again.\n\n“The fire doesn't wait for the saddler,” says Arnbjorn, pleased, and laughs until he coughs.\n\nAt midday a man arrives from a farm at the head of the valley, so far off that he has not come down to the village in two winters. He has ice in his beard and his breeches bound with rags up to the knee, and from the threshold he looks at the fire before coming in. On his sled he has a piece of iron as long as an arm, gray and lumpy, and he wants a plowshare out of it.\n\nArnbjorn does not put it in the fire. He turns it on the anvil, weighs it in his hand, then takes the file and runs it along the edge, just once, slowly. The file screeches, a harsh sound that sets your teeth on edge. Arnbjorn watches the filings fall, pinches them between his fingers, sniffs them.\n\n“What is this, really?” he says, to no one.\n\nThe filings are dark, and they crumble. “Bog iron,” he says then to the man. “Full of slag. If you hammer it cold it opens like a loaf. I'll heat it slowly, and it takes twice as long.”\n\nThe man mutters. Then he pays double, and stays.\n\nArnbjorn slides the bog iron into the fire, on the side where the embers are lowest, and you go back to the bellows. At the door the light has already begun to fade."},"10":{"t":"You get up and go to the table. You take the chain by one end and lift it, link after link, until you are holding the whole of it hanging before the hall, and you turn it in the firelight. It is cold, greasy with old fat, and it leaves a black on your fingers that will not come off. Underneath there is a smell of barn, straw and animal. People lean forward from the benches, and those standing along the walls crane their necks over the heads.\n\nThe links are wide and smooth inside, all worn on the same side: a heavy animal pulled on it for many winters, always the same way. The joints were welded hot by a smith who knew his trade, but it is old work, and the iron has taken the dark color of things no one uses anymore. On the first link there is still the mark of the pin of a manger.\n\n“This is the chain of your grandfather's bull, Thorvald,” you say. “The black one, that broke through the fences. Look how worn they are.”\n\nThorvald turns red above his beard, and does not answer. Along the wall an old man opens his hands to the width of two horns, and his neighbor spreads them another span.\n\nYou turn to Bersi and hold a link out to him. He is not afraid: he puts his hand through it, then his wrist, and draws it out the other side without even touching the iron, serious, like someone trying on a sleeve.\n\n“A child goes right through it,” you say. “With this you couldn't even hold a small goat.”\n\nIn the hall someone laughs, then stops. The women of the looms look at one another. Thorvald takes the last link between his fingers and turns it over, and takes a while to put it down. You let the rest down onto the table, one coil at a time, without letting it knock.\n\nArnbjorn, from his place, puffs out his chest and says nothing, which for him is a great deal.\n\n*Note on your sheet, in the DEEDS column: “YOU DEFENDED THE CHILD”.*","f":"YOU DEFENDED THE CHILD"},"14":{"t":"Thorvald repeats his words, louder, so that those at the door can hear them too: “Something that is ours, and that costs us.”\n\n“Then give them the salt,” you say. You say it sitting down, before Thorvald has closed his mouth again.\n\nIn the hall, heads turn.\n\n“It's ours,” you say. “It cost us dear. And for three days nobody has been able to find it: at least the gods will find it.”\n\nThe first to laugh is a boy near the door. Then one of the old women, with her hand over her mouth. The whole hall laughs, in waves: the women of the looms, the men with their arms crossed, even those who never saw any salt even before the hunger. The laughter passes from one bench to the next like heat in an iron held by one end, without anyone pushing it. The bench under you shakes with your neighbors' laughter; someone pounds a fist on a knee, and a lamp, on the windowsill, sways so much that the flame nearly goes out. Arnbjorn laughs until he coughs and has to sit down. Thorvald hides his mouth in his beard, but his shoulders are bouncing. A few laughs come late, from the back, and die away by themselves; the flame of the lamp straightens again.\n\nIn Holt they say that those who laugh do not vote, and it is true: when the laughter ends, no one feels like starting on the names again. The old woman who had brought up the weaver's son looks around, wipes the corners of her mouth with her shawl, and does not come back to it.\n\nBersi did not laugh. He looks at you over the weaver's shoulder, serious, with the face of someone who has watched a game he does not know.\n\nThorvald smooths his beard with two fingers and takes the chain from the table. The links slip through his hands with a long noise, and no one pays it any mind now.\n\n*Note on your sheet, in the DEEDS column: “YOU DEFENDED THE CHILD”.*","f":"YOU DEFENDED THE CHILD"},"15":{"t":"“If one is needed,” you say, “I'll go.”\n\nYou say it before thinking, and once you have said it you cannot take it back. The hall stops. A bench stops creaking halfway. Near the door someone drops a woolen glove, and no one bends to pick it up. Bersi takes his eyes off the chain and looks at you.\n\nArnbjorn gets up with a roar that makes the ash jump in the hearth.\n\n“Nobody offers up my apprentice, not even him.”\n\nHis face is the color of an iron ready for the hammer, and his singed beard is trembling. He plants his fist on the table, next to the chain, which jumps, and the links ring in your teeth.\n\n“Who shoes your horses, afterward? Who puts your hoes back on their feet, the axles of your carts, the chains of your buckets? Me, with these arms?” He beats his chest. “Three winters of counting the barley by the handful, and you want to give away the hands we have left.”\n\nOn the benches the men look at their boots: more than one has a hoe waiting at the workshop.\n\nThorvald raises his open hands, like someone saying that no one has decided anything yet. Arnbjorn does not sit back down. He stays standing beside you, his chest going up and down and his breath steaming in his beard, and he grips your shoulder with his heavy hand, without looking at you. He smells of charcoal and of the leather of his apron. His palm is warm through your shirt, and the calluses scratch you with every breath he takes.\n\nBersi, behind, is still beside the weaver. No one talks about him anymore. She has pulled his hood down over his forehead, to his eyes, and he pushes it back up with one finger to see.\n\n*Note on your sheet, in the DEEDS column: “YOU DEFENDED THE CHILD”.*","f":"YOU DEFENDED THE CHILD"},"23":{"t":"Vigdis waits for the children to settle down, then tells another one, the last of the evening, the one about the fishermen.\n\nThere was a fisherman from the outer coast whom the fog carried far away, where he had never been. He found a low island, covered with heather, and hauled his boat up on it to spend the night. It was a strange island. The birds circled above it and never landed: they made a wide turn and went back to the sea. And the sea around it rose and fell too slowly, not like the tide he knew.\n\n“He had no fire that night: his fire steel was wet. He slept in the cold. In the morning the island was gone, and he was in his boat.”\n\nVigdis lets a breath go by, because the children have their mouths open. “And his wife never believed him,” she says.\n\nEveryone laughs, and the hall begins to empty. The mothers wrap the little ones in their cloaks, the old people get up holding their backs, and Gunna leaves with Kisa tucked under her shawl up to the ears.\n\nOutside the snow is so hard that boots leave no print in it. The sky is full of stars, and your breath frosts on your collar before you reach the smithy.\n\nIn the workshop the day's iron is still ticking, cooling in the dark. Arnbjorn does what he does every evening before sleeping. He takes the fire shovel, gathers the embers into a heap in the middle of the forge and covers them with ash until not a thread of red can be seen.\n\n“You cover the embers, you don't light them,” he says, and hangs the shovel on its hook.\n\nRagna has already put out the lamp. You lie down on your straw pallet beside the forge, where the floor stays warm all night, and pull the blanket up to your chin. It smells of birch charcoal. From the barn a cow lows once, and then is quiet. Sleep comes at once.\n\nIn the dead of night the sheep wake you.\n\nThey are bleating all together, from Thorvald's sheepfold, at the far end of the village: a thick, frightened bleating, that rises and does not stop. Then, above the bleating, a long howl. And another, closer, answering it. A third comes from the direction of the wood, low, and breaks off halfway; when it starts again it is already closer to the sheepfold.\n\nUnder the bleating there is a dull thud that keeps coming back, wood against stone: the stakes of the pen, tested one after another. In Holt the wolves come down as far as the houses only in winters when the wood has nothing left to give, and then they come in a pack, lean, and a man's voice is not enough to drive them off.\n\nOn the other side of the wall, Arnbjorn snores. You still have the blanket up to your chin, and along your back the warmth of the floor. The hammer is where you left it, leaning against the anvil: in the dark you can make out its handle, three paces from the pallet.","dec":1},"25":{"t":"Your legs no longer hold. You notice late, when the trampled snow of the sheepfold comes up against your cheek, and the hammer slips from your fingers.\n\nYou try to take it back. The handle is there, a span away, dark on the snow, and your hand does not reach it.\n\nYou hear the sheep against the wall, their tight bleating, all together. You hear the breath of the wolves, close, warm in the freezing air, and the paws circling you, slowly, as they circled the pen. Above the stakes that are giving way the sky is gray, the color of the light before dawn.\n\nThen the bleating grows distant, and distant the breath too. Then nothing more.\n\n*Your story ends here. Start again from section 1.*"},"26":{"t":"“Help me!” you shout to the people of the house. “Grab something! An oar, a pitchfork, whatever there is!”\n\nThey grab the door. The first to peel away from the wall is the one nearest the curtain. They go out of the kitchen one behind the other, with the lamps swinging and scattering shadows everywhere, they bump the hide curtain, cross the house, and you hear them throw open the outer door and run through the snow, shouting, toward the barn. One of the women has set her lamp down on the boards, and left it there.\n\nThe seal's head watches them go. It is the only time it takes its eyes off the fire. While they flee, it rises a span and then another, until the neck and the beginning of the shoulders come out of the floor. The boards open around it with a groan of pulled nails. The neck comes out without effort, with water draining down the fur.\n\nIt brings its eyes back to the fire.\n\nThrough the door left open comes the wind off the fjord, and it carries in the snow and the voices, farther and farther away. Then it carries no more voices. The smoke of the hearth lies down and comes into your face. There remains the hide curtain, still swinging from their passing, less and less, until it stops.\n\nIn the kitchen only one lamp is left, set on the floor, with its flame bending. There is you, and there is the seal, and the surf beating under the boards. The animal's fur glistens a wet black; the whiskers drip, and the drops, falling on the wood, make the same small knock as the bowl earlier. From close up you hear it breathe: a slow breath, that reaches your knees cold.\n\nNo more noise comes from the barn. The axe is beside the woodpile, its blade glinting in the lamplight. It is a wood axe, with a blade one span wide: the neck in front of you is three. The hammer is in the pack, at your feet, and the leather that wraps it is still knotted."},"27":{"t":"You take the hearth pole, long and blackened at the tip, and you strike the seal's head with all the weight of your shoulders, the way wool is beaten on the stone.\n\nThe pole bounces. The blow comes back into your wrists, and the head rises.\n\nIt rises two spans, all at once, with a sound of bending wood. The neck and the shoulders come out of the floor, glossy and black, as broad as a man's, and the boards around them hump up, unnailed, with the nails sticking out crooked. Under the fur the shoulders work, one and then the other, against the edge of the boards. Up through the cracks comes the smell of the sea bottom, of rotten seaweed and wet stones, and a cold that takes you by the ankles through the leather of your boots. The water comes up too, black, level with the boards: it runs along the seams, slow, without a sound, and reaches the threshold, under the hide curtain, where it stops and glistens in the light of the lamps. Where you set your foot, the board gives and squeezes out more. The surf has risen with it: now it beats under your soles.\n\nThe seal does not turn toward you. It keeps its eyes on the fire, and the blow has not even made it blink. On the fur, where the pole caught it, there is not a mark; on the wood, though, there is a wet streak that stinks of seaweed. In the hearth a log splits and falls forward, and the seal follows the sparks with its eyes, and that is all.\n\nOne of the women of the house runs for the curtain, puts a foot in the water and pulls it back, then returns to the wall. A man takes her by the wrist and does not let go again. The lamps tremble all together, and the shadows on the beams with them. Your hands are black with soot up to the wrists.\n\nThe pole has cracked in your hand, along the grain, from the grip almost to the tip: one more blow like that and it will split in two. In the crack, under your thumb, your nail fits. But for now it holds. The hammer is in your pack, at your feet, wrapped in leather, with the handle you know by heart.\n\nVigdis, on certain winter evenings, tells of a seal that came up through the floor of a kitchen, on a farm of drowned men. Anyone who has listened to that tale to the end knows how it turns out, and would put the pole down at once."},"30":{"t":"The bleating guides you at a run to the far end of the village, over the hard snow of the road, with the hammer in your fist.\n\nThorvald's sheepfold is a pen of dry stone with a turf roof on one side, and on the side of the wood the posts are giving way. Inside, the sheep are heaped against the wall, one on top of another, their breath steaming.\n\nOutside, on the trampled snow, are the wolves at the sheepfold. Three of them, so thin you could count their ribs, gray as the light before dawn. They have stopped howling. One stops to look at you; the other two circle the pen, looking for the post that is giving way. They carry their heads lower than their shoulders, and their claws scrape the frozen crust. One of the two leans its flank against a post, and the post groans in its hole. The first one does not growl: it looks at the hammer, and right afterward at your legs.\n\nA forge hammer is made to fall from above, on an iron that waits. When they come, they come together: one low, at the legs, and one at the sleeve, and never where you are looking. You grip the handle and plant your feet in the snow.","e":"The Wolves at the Sheepfold","ec":6,"ee":6,"img":1},"31":{"t":"You stand up, and your voice comes out before the words.\n\n“Bersi doesn't belong to the trolls,” you say. It is all you have ready. The other words come afterward, one at a time, crooked, like nails pulled out of a sack in the dark. “He's a child. He looks at things. It's no fault, looking. And he has five winters: at five winters you don't choose anything, not even who you get swapped by.”\n\nYou speak to the chain, because the faces are too many: you see them sidelong, pale in the little fire, all turned your way. Your voice knocks against the beams and comes back at you bigger. Along the walls they have stopped stamping their boots to keep warm. Nobody laughs. Somebody, at the back, lowers his eyes to the floor. The old woman who named the weaver's son pulls her shawl tight across her chest and looks elsewhere; her knotted fingers do not find the hem of the wool at the first try.\n\nYou are not used to speaking in front of so many people. With iron, yes: iron lets you finish, and if you got it wrong it tells you with its sound, right away, without taking offense. Here, when you stop, what is left is the silent hall, with the little fire snapping and everyone's breath steaming under the roof, and you do not know whether you have said too much or too little. Under your shirt your back has gone wet, and the cold from the door finds it at once. You sit back down with your hands between your knees. The bench is still warm from the place you left.\n\nBersi looks at you. He does not smile and does not do anything; he has the same eyes he had for the chain, without fear. The weaver squeezes his shoulder. The hood, too big for him, slips down crooked on that side, and he lets it be.\n\nThorvald smooths his beard and says neither yes nor no. With his other hand he holds the chain still on the table, by the end link.\n\n*Note on your sheet, in the DEEDS column: “YOU DEFENDED THE CHILD”.*","f":"YOU DEFENDED THE CHILD"},"35":{"t":"At dawn, with the sky still the color of ash, a sled stops in front of the smithy. It is drawn by a shaggy little horse, white with frost up to the eyes. Its flanks are steaming, and it holds its head low, like an animal that has been pulling since it was night. Its shoes are worn thin, but well set: you know them by the heads of the nails, Arnbjorn put them on. On the sled, wrapped in three cloaks, is Aud. The cloaks are stiff with ice down to the hem, and when she moves they crackle.\n\nYou have not seen her since this autumn. She is gray with cold, thin, and she gets down from the sled the way you get down from a boat that is rocking, holding on with one hand only. The other she keeps hidden under her cloak. Her lips are cracked by the wind off the fjord, and she speaks with effort, in the voice of someone who has been silent for days.\n\n“I'm looking for the smith,” she says. “The one with the strong arms.”\n\nArnbjorn comes out to the door with his beard still full of sleep, looks at her, looks at you. Through the open door, behind him, the warm breath of the workshop comes out and is lost at once.\n\n“What do you need?”\n\n“In my house the fire doesn't warm anymore,” says Aud. “And in the kitchen there's a thing coming up through the floor. It needs arms.”\n\nShe explains nothing more, and nobody asks her. In Holt it is known that Aud, this autumn, had the sea in her house.\n\nArnbjorn scratches his beard, then takes you by the arm and pushes you toward the sled. His hand is warm even at this hour, and he lets go only when you have the runner against your boot.\n\n“You go,” he says. “I have a pledge to keep.”\n\nRagna comes out with a bundle still warm from the oven and motions to you to put it under the seat. The warmth comes through the cloth and stays in your fingers a short while. The little horse snorts, and its breath freezes on the hairs of its muzzle. Aud has already taken up the reins again. Behind the sled, the runners have left in the snow of the road two lines, shiny and straight, that lead back toward the fjord.","img":2},"37":{"t":"Thorvald winds the chain around his arm, one turn after another, and lays it on the bench beside him, where everyone can see it. The links settle one on another with a last click of iron.\n\n“Three nights,” he says. “In three nights we meet here again, and it gets decided. Whoever has a better idea, let him bring it.”\n\nPeople begin to move toward the door. The benches empty one row after another, boots scuff on the stones of the floor, and through the open door comes a draft that bends the flames of the lamps. Arnbjorn, though, stays on his feet, and raises a hand. He holds it open, wide. Those who were already on the threshold turn around.\n\n“For my troll, I stand surety,” he says. “If in three nights my troll is missing, you have me. I'm not moving from Holt.”\n\nHe speaks without laughing, in the voice he uses to name the price of a plowshare. Thorvald nods, once. Between the two of them a thing said like that is not said twice.\n\nOutside it is already dark. The snow has stopped, and the sky is so clear that the cold hurts your teeth; under your boots the snow creaks, and in the houses the lamps go out early, to save the fat. The people of the council scatter among the turf roofs in twos, in threes, without a goodbye, and the voices end one after another behind the doors. Arnbjorn walks beside you as far as the smithy, whistling out of tune, and does not speak of the council. Halfway there he bumps you with his shoulder, for no reason, as you do with a horse you want to feel close.\n\nBehind you, in the hall, they have left the fire burning: after supper the children go back to it, and Vigdis with them."},"38":{"t":"Bersi stays where he is, at the end of the bench, with his palm's width of empty place on one side and on the other. Around him the children shove each other and are still laughing about the cow; he keeps his hands in his sleeves. His feet do not reach the ground, and they stay together, without swinging.\n\nOnly, at a certain point, he lifts his eyes from the fire and brings them to you, on the threshold. In between is the whole hall: the backs of the children, the smoke that hangs under the beams, the knees of the old people in a row on the benches. He looks at you seriously, from his place, with the face of someone who has thought it over well. He makes no sign to you and does not turn around. Then he goes back to watching the flames.\n\nGunna, though, gets up. She fishes Kisa out from under the bench, tucks her under her shawl with her head sticking out and goes to sit beside Bersi, in the empty place, so close that their shoulders touch. To settle herself she pulls up her feet, straightens her shawl and plants an elbow in his side, twice. He does not move away. The cat stretches a paw toward the fire, and an ice cleat gives off a small flash.\n\nThe dark has come down from the roof to the shoulders of the old people, and from the door their faces can no longer be told apart. The fire has burned low. Somebody throws a log on it, and the sparks rise to the beams. They are bright, from birch wood, and carry all the way to the door the sweet smell of burning bark. Vigdis follows them with her eyes until they go out, then slaps her palms on her knees, as she does when she has another one ready."},"41":{"t":"In the afternoon the council hall is as full as on feast evenings, but nobody has come to feast. People sit on the benches, packed tight, and those who find no place stand along the log walls, their breath steaming under the beams. The fire is small: wood is counted here too. Those who come late knock the snow off their boots on the threshold, and at every bang of the door a blade of cold passes over the benches as far as the table.\n\nThorvald gets up from his place and lays a chain on the table. It makes a long noise, falling, link on link, and then it stays there, black, coiled like a sleeping snake. The boards of the table groan under the weight.\n\n“Three winters with no summer,” he says. “The gods want a thing that is ours, and that costs us. This is the chain of the offering.” He says it without raising his voice, in the tone he uses to give the count of the sheep and of the dead.\n\nArnbjorn digs an elbow into you. “Show them, this lot,” he says, in a voice loud enough for everyone to hear. “How long is it?”\n\nYou take one end of the chain. You measure a single link, between your thumb and your little finger, and you say, “Twelve arm's lengths.”\n\nThorvald stretches it out on the floor and measures it with his arms, counting aloud. The links drag on the ground at every arm's length, and at the ninth he stops to catch his breath. There are twelve. Somebody laughs, somebody nods, and Arnbjorn swells all over, chest out and beard up, as if he had measured it himself. Thorvald gathers the chain coil on coil and sets it back on the table.\n\nThe names begin, and nobody laughs anymore.\n\n“The troll of the forge,” says one of the old women at the back. “From them he comes. To them he's given back.”\n\nYou do not speak. Your hand goes to the ring, under your shirt, and stays there.\n\n“Or the weaver's son,” says another. “Five winters, and he never cries. Not even when he fell through the ice of the fjord. The trolls swapped that one in the cradle, everybody knows it.”\n\nBersi is there, beside his mother, with the hood too big for him and his hands in his sleeves. He looks at the chain on the table, without fear, as he would look at a goat or a bucket. The weaver keeps a hand on his shoulder, and the hand trembles; he does not.\n\nThorvald waits for someone to speak. In the hall you can hear the fire, and the wind on the turf of the roof.\n\nAnyone with a quick tongue knows that a council that laughs can no longer vote. If you know chains, weighing that link between your fingers you felt that it is too wide for what they say they want to bind with it.\n\nBersi is three paces from you. The chain is two.","dec":1,"img":3},"44":{"t":"You do not answer.\n\nThe old man waits. The embers make their low sound, the snow comes in gusts through the open door and melts on the warm stones, and the horse, outside, shakes his mane. The old man goes on waiting, with the same patience with which he waited for the iron to heat.\n\nYou stand still too. You have the coin in your fist, and its worn rim presses into your palm. From the door the cold takes you by the ankles; behind, the heat of the forge reaches up to the nape of your neck. In the workshop the smell of burnt horn has not gone yet; it mixes with the birch charcoal and the wet wool of his cloak.\n\nOn the block Gunna turns in her sleep and mumbles the cat's name.\n\nThen the old man stops waiting. You see it in his shoulders, which drop by a finger, like those of a man taking off his apron at the end of the day.\n\nHe turns his back on you. On the threshold he stops. The wind drives the snow under the brim of his hat, against his face and into his beard, and he does not lift a hand to shield himself: he stays there, with the snow under his hat, looking at the dark of the plowed field. You do not move.\n\n“Keep it,” he says at last, and does not say what.\n\nYou understand when he has already gone. On the bench lies The Gray Horse's Old Shoe, the one from the third leg, with the two crooked nails in it. You pick it up. On the upper face a pale film of horn is left, where it touched the hoof. It is cold, and it weighs what a shoe ought to weigh.\n\nKisa, in the shawl of the sleeping Gunna, opens one eye on the open door, and closes it again.","it":"The Gray Horse's Old Shoe"},"45":{"t":"The ice cleat can wait. You push it with the tongs to the edge of the small anvil, where it will go gray by itself, and Gunna understands before you open your mouth: she pulls up her knees and hugs Kisa against her chest.\n\nYou stop the bellows and put down the big hammer: horses are afraid of the roar of the fire and of iron on the anvil. In the smithy what is left is the low breath of the embers, and the snow that comes in gusts through the door and melts on the stones.\n\nOutside, the halter tied to the ring in the wall is stiff with ice, and the knot gives at the second pull. The horse comes in bending his neck under the beam, and by himself he fills half the workshop. To fit, he stands crosswise, between the bench and the forge, and the snow slides off his rump in slabs. You run your hand along his shoulder, then down the leg, the third in front on the left, and he lifts it before you ask. You take it on your thigh. Under the hoof there is a sole of packed snow, and you pop it out with your thumb. The old shoe is holding on by two nails only. You pull it with the pincers and trim the hoof with the curved knife: it is hard and smooth, more than any you have trimmed in your life.\n\nFrom the row hanging on the wall you take the biggest shoe there is, and you put it in the embers without blowing on them. That way it takes longer. While it goes from black to dark red, one of Arnbjorn's sayings comes back to you, the one he used to repeat when you were little and pulled the iron out too soon: “As long as it's in the fire, the iron is fire.” You leave it there until the red is the right one.\n\nGunna cannot hold out any longer. She puts her head out of the shawl. “Does he have a name?” she asks. “The horse.”\n\n“He has,” says the old man.\n\nGunna waits to hear which. The old man does not say it, and stays on the threshold watching your hands.\n\nYou set the hot shoe against the hoof to seat it, and up comes a smoke of burnt horn that the horse sniffs without stirring. Then the nails, with the small hammer, one after another; the points bent over, the rasp on the rim. In your mouth stays the taste of iron from the ones you held between your lips. The horse sets his hoof on the stones and leans on it with all his weight, twice, to try it. The new shoe rings full, and on the threshold the old man moves his cloak aside from his hip."},"46":{"t":"The hammer comes down one last time and finds only snow: the wolves are already out of its reach.\n\nThe last wolf stops at the edge of the trees, with a strip of your sleeve still between its teeth, and looks at you. It turns and goes off into the wood at a walk, behind the other two. Snow falls from the branches as they pass, in blocks, with a thud. Inside the pen the bleating dies down one sheep after another, and what is left is the rub of wool against the stones.\n\nYour arm is shaking as it does after a day at the anvil. You sit down on the wall of the sheepfold and wait for it to stop. The stones are icy under your thighs, and through the tear in your sleeve the cold climbs up to your elbow. On the trampled snow the wolves' tracks are left, wide, and a tuft of gray fur caught on a post.\n\nFrom the direction of the houses comes a yellow light that swings at every step. Thorvald arrives with a lantern and a pitchfork, in his shirt, with his boots unlaced. His beard is flattened by sleep on one side only, and the lantern stinks of tallow. He raises it toward the trees, then toward the posts, and leans the pitchfork against the wall. He goes into the pen without a question and begins to count the sheep, touching them one by one on the back, moving his lips. His hand sinks into the wool up to the knuckles. The sheep let themselves be touched, pressed close, their breath steaming in puffs.\n\nHe counts them twice. They are all there.\n\n“All of them,” he says, and he says it to you, though he does not raise his eyes. He goes to straighten the post that was giving way, and you help him plant it in the snow again, with your hands still shaking. You hold it with both hands; he stamps the snow around its foot, in layers, with the heel of his unlaced boot, until the wood stops moving in its hole.\n\nWhen the post stands by itself, the sky above the village has lost its stars, and from one turf roof the first smoke is rising, straight."},"55":{"t":"For half a day the runners of the sled follow the shore, and Aud drives with one hand only. When the little horse stops, the light is already low on the water.\n\nAud's farm is the last house before the sea: a long house, low, with a turf roof that comes down almost to the snow, and below it, sheer, the black fjord. At the edges the water has made a thin, cloudy ice; on the stones of the shore the seaweed is frozen hard and crunches under your boots. You can hear the surf beating under the house, always, even when there is no wind.\n\nInside, the people of the house sit packed around the hearth and watch you come in without getting up. The hearth is long, in the middle of the room, between two rows of benches. The fire makes smoke and gives no warmth. You sit down in front of it: the wood burns, and the heat does not arrive. And yet it is a well-made fire, with the wood split thin and crossed, and air passing underneath. The seal-fat lamps stink, and the whole house smells of sodden wool and fish.\n\nAud sits down across from you and speaks looking at the fire.\n\n“My husband and the two oarsmen went out for the nets in the middle of autumn. The sea took all three of them.” Her voice does not shake. “At the feast for them, the first evening, the door opened, and they came in. Drenched. They sat down here, at the fire, and did not say a word. Since then they come back every evening.” On the bench a man of the house draws his feet up under him.\n\nAud brings out from under her cloak the hand she was keeping hidden. It is white with frost to the wrist, like wax, and the fingers do not bend well. The nails are gray. This close to the flame, it takes no color.\n\n“And on the other side of the fire, alone, sits the stranger. She came from the sea at the start of autumn, on a merchants' boat, and the fever took her in four days. She had asked one thing only of me, before she went: that I burn her cloak, the blue one, the embroidered one. It was too beautiful for the fire. I kept it.” She clasps the white hand in the other. “And in the kitchen, every night, a seal's head comes up through the floor. It looks at the fire. I don't go in there anymore.”\n\nAnyone who knows how to bind a burn also knows that a hand taken by frost is not rubbed with snow, as the old women say: it is warmed a little at a time, and then wrapped.\n\nOutside the fjord grows dark. Soon it will be night, and the kitchen is at the far end of the house, behind a hide curtain. The curtain hangs straight, with a line of dark under its hem. On the benches no one turns that way.","dec":1},"57":{"t":"“The ice cleats first,” you say. “I promised her.”\n\nThe old man does not object. He stays on the threshold, with the snow settling on his hat and his shoulders, and does not come in. Behind him the gray horse snorts and scrapes at the snow with a hoof.\n\nYou put the third cleat back in the embers, and the bellows bring it to red again in a few breaths: two short and one long. You bend it on the horn of the small anvil and open its two holes with the finest punch you have. The fourth you draw out of a scrap that has been waiting on the bench for days. Both hiss short in the quenching cauldron, one after the other, and the steam wets your wrist. When you set them in a row they are as small as fingernails. Gunna holds out Kisa's paws to you one by one, and you tie the cleats on with a thin leather thread, just tight enough that the cat will not tear them off with her teeth. Kisa flattens her ears every time your cold fingers touch one of her pads.\n\n“You shoe the cats too, in this village?” asks the old man.\n\n“She slides off the roof,” says Gunna.\n\nThe old man laughs, once. Kisa takes two steps on the stones, tick, tick, then sits down and looks at her paws with great disgust.\n\nNow the horse. You stop the bellows and put down the big hammer: horses are afraid of the roar of the fire and of iron on the anvil. The gray horse comes through the door lowering his head, and there is no room left in the workshop for anything. Gunna pulls her feet up onto the block: the animal's flank passes a span from her knees, and the stones of the floor ring under all those hooves. The old shoe comes away with two wrenches of the pincers; the hoof under it is as smooth as a river stone.\n\nThe new shoe heats slowly, in the embers with no wind on them. Arnbjorn says it to the farmers who huff in front of the forge because their animal is cold: “As long as it's in the fire, the iron is fire.” You wait until the red is the right one. You seat it on the hoof, in the smoke of horn, and nail it on with the small hammer, with quick, light blows, until the third leg in front on the left has nothing loose on it anymore."},"60":{"t":"You do not speak. You stand up.\n\nThe bench screeches on the floor, and the whole hall turns. You cross the room in four strides and put yourself between the table and Bersi, with the chain in front of you and the child behind, and you stay there. You plant your feet wide, at the distance you keep in front of the big anvil when the piece is heavy.\n\nYou are a head taller than any man in Holt, and now they all see it. The beams brush your hair and leave a little of their soot in it. From up here the hall is a row of wool caps, shawls and partings. Your shadow, with the fire behind you, covers the table and half the chain, and reaches as far as Thorvald's hands. You feel the heat of the fire on your calves through your breeches; on your chest you have the cold that comes in under the door.\n\nNo one moves. The old woman who pointed at the weaver's son pulls her shawl up under her chin, and the words she had ready stay inside. Thorvald has to tip his head back to look you in the face, and it takes him a while.\n\nBehind you Bersi does not shift. He does not take your hand and he does not hide. You know because the weaver, beside him, is breathing hard, and he is not. The smell of his hood reaches you, wool and the smoke of home.\n\nOn the table the chain gives off a red gleam, link by link, and no one puts out a hand to touch it. You stay like that until Thorvald brings his eyes back to the chain. The fire cracks. Near the door a woman coughs softly into her sleeve, and then nothing more.\n\nYour hands hang open. You do not close them. Arnbjorn, from his place, clears his throat, and for once he has no saying ready.\n\n*Note on your sheet, in the DEEDS column: “YOU DEFENDED THE CHILD”.*","f":"YOU DEFENDED THE CHILD"},"66":{"t":"You say nothing. Your hand on the ring, under your shirt, and your mouth shut.\n\nThorvald has his palms on the table, one on each side of the chain, and turns his head from one bench to the next. On the front benches two or three have turned toward you: they look at your shoulders and your hands, not your face.\n\nThe silence in the hall does not last long. Arnbjorn stands up, and when he stands up the benches all creak.\n\n“The troll of the forge,” he says, with his beard laughing. “The troll of the forge lifts the big anvil by himself, the one that two of you can't budge. He shoes the horses that kick for me. He keeps my fire when I sleep. Three winters with no summer, and you want to give him to the gods? Then let the gods take your broken hoes too, because I can't manage them on my own.”\n\nSomeone laughs, a little. At the back the old women do not laugh: they sit straight on the bench, with their shawls closed. Arnbjorn goes on talking: about nails, about plowshares, about the locks of the barns, about the hoops of the barrels that the frost bursts and that somebody has to make again. At each thing he names he beats the back of one hand into the palm of the other, and his voice is the one he uses to be heard over the bellows: it carries to the door. He talks about you the whole time. About Bersi, nothing.\n\nBersi is still beside the weaver. No one looks at him anymore, except his mother, who keeps her eyes on him and her hand on his shoulder. He looks at the chain.\n\nYou look at your hands, broad, still on your knees. From the small fire, at this distance, only the light arrives.\n\nWhen Arnbjorn sits down again, he is red to the ears and breathing in gulps, and he gives you a slap on the back that makes you cough."},"67":{"t":"“Ragnhild,” you say.\n\nIt came into your mouth by itself. It is Ragna's name lengthened by a piece, a bar drawn out hot until it comes to the measure, and as soon as you have said it you seem to hear her, Ragna, turning over in bed beyond the log wall. The bed creaks, then nothing.\n\nThe old man repeats it: “Ragnhild.” He turns it over in his mouth like a bread he has just tasted, and does not say whether it tastes good.\n\nThen he goes to the threshold. There he stops, with his back to you, and does not turn around. The blue cloak falls straight to the snow, and of the hat you see only the wide brim, with the flakes settling on it one on top of another. He stays there so long that you think he is about to say something else, or to ask again. Behind you the embers settle, with a rustle of ash. Outside the gray horse snorts, and his breath makes a white cloud in the light of the door. The old man does not ask.\n\n“Keep it,” he says, still with his back turned, with a wave of his hand toward the bench.\n\nOn the bench lies The Gray Horse's Old Shoe, where you put it down when you took it off the third leg. It still has the two crooked nails driven into it, and one edge worn almost to a blade. You run your thumb along it: it cuts little, but it cuts. The face that touched the ground is polished by the road, smooth under your fingers where the other is still rough from the hammer. When you look again, the threshold is empty and the snow is already filling the tracks.\n\nOn the block Gunna opens her eyes, full of sleep, with her cheek marked by the wool of her shawl. She pulls herself up against the logs of the wall, and Kisa turns over in her lap.\n\n“Who is Ragnhild?” she asks.\n\nYou do not know either.","it":"The Gray Horse's Old Shoe"},"71":{"t":"“I don't know,” you say.\n\nIt is the truth, all of it that you have. There is nothing else to put around it.\n\nThe old man nods, once, like someone who has had the answer he was waiting for. Then he turns toward the night.\n\nOn the threshold he stops. He rests his hand on the doorpost, a broad hand, with big knuckles and fingers marked by the cold, and keeps it there. His cloak swells with wind; the snow comes in, settles on the back of his hand and does not melt. He stays like that, with his face toward the dark and his hand on the wood of your door, for the time it takes an iron to go from red to black. Then the hand comes away from the doorpost.\n\n“Keep it,” he says, barely turning his head, and points at the bench with his chin.\n\nOn the bench lies The Gray Horse's Old Shoe, the one you took off the third leg, with the two crooked nails still in it. It is as big as your open palm, and worn more on one side than on the other: the horse that wore it always pulls to the same side. You weigh it in your hand. It is good iron, denser than the iron that reaches Holt, and the edge has gone thin from so much road. Struck with a knuckle it gives a low note, which lasts.\n\nWhen you look at the door again, the old man and the horse are already out of the light. In the frame of the door there is only the snow falling, red for one pace where the glow of the embers reaches, and gray beyond. You hear them go off over the snow. You count the hoofbeats until you cannot hear them anymore: you do it out of habit, with every horse that leaves the workshop. For four legs there are too many.","it":"The Gray Horse's Old Shoe"},"73":{"t":"You do not pull him in by the halter. You go out yourself, into the snow, hands low, and before touching him you talk to him: the things you say to every horse in the valley, that it's late, that it's cold, that it will all be put right now. The snow gives under your boots up to the ankles. The gray horse turns one ear toward your voice, then the other. He stays where he is and lets you come, with his head high and his legs planted in the white. When you lay your hand on his neck, the coat under the snow is dry and warm.\n\nYou lead him in with one hand only. You stop the bellows and put down the big hammer: horses are afraid of the roar of the fire and of iron on the anvil. In the workshop there is only the sound of the embers, and of the horse blowing steam from his nostrils. Where he sets his hooves, wet prints are left on the warm stones, and they dry before your eyes.\n\nYou lean your shoulder against his shoulder, as you do with big animals, and he gives you the third leg without your asking twice. The old shoe is holding on by two nails. You take it off and trim the hoof. The curved knife goes in with effort: the horn is dense, and comes away in thin curls. While you are bent over, the gray horse lowers his head and rests it on your shoulder. It weighs as much as a sack of wet barley, and he breathes on your neck, warm.\n\n“He doesn't usually let himself be touched,” says the old man.\n\nThe new shoe heats in the embers with no wind on them. “As long as it's in the fire, the iron is fire.” Arnbjorn has been repeating it to you since you barely came up to the rim of the anvil, and you seem to hear him even now, snoring in the next room. You take the shoe out when the red is the right one, seat it on the hoof in the smoke of horn and nail it on with the small hammer. Seven nails. The horse does not move his head from your shoulder even when you bend the points over.\n\nGunna, on the block, is no longer thinking about the ice cleats. She watches the horse with her mouth open, and Kisa, in the shawl, does the same."},"76":{"t":"Bersi gets up from the bench.\n\nHe takes his time. He comes down first with one foot and then with the other, because the bench is high for him, and he keeps his hands in his sleeves. One of the old women, on the bench opposite, draws in her feet to let him by. He crosses the hall with his serious face, passes among the children sitting on the floor without treading on anyone's hands, goes around the fire and comes to the door. There he stands a moment, as if to measure the place, and sits down on the threshold, beside your boots, with his back against the doorpost and his shoulder against your knee. Through the wool of your breeches you feel it, narrow, and the warmth he has brought with him from the fire.\n\nHe says nothing. He does not even look at you: he looks at the hall, from where you look at it. You do not move your knee.\n\nIt takes Gunna a moment to understand. She bends under the bench, fishes Kisa out by the scruff, stuffs her under her shawl and comes after Bersi. The cat kicks, slides down and follows her on her own: the ice cleats go tick tick on the stones, all the way to the threshold. Gunna sits down on the other side of Bersi, with her knees under her chin. Kisa crouches in front of the three of you and licks a paw, working her tongue around the cleat. Through the gap under the door comes a thread of cold that takes all three of you by the ankles.\n\nVigdis looks at you, one after another, from her place beside the fire. Half the hall has turned toward the door, and she waits for the heads to come back her way. She smooths her skirt over her knees and draws breath, as she does when she has another one ready."},"78":{"t":"In the evening, at the fire in the hall, the children crowd around Vigdis like sheep around the shepherd when it snows. You stand at the door, in your usual place, with your shoulder against the doorpost. The heat of the fire, this far off, reaches only your face.\n\nThe hall smells of smoke, of lamp grease and of damp furs hung to dry on the beams. The light goes as far as the flames go: the children's faces are red on one side only, and behind them, on the benches, the grown-ups are dark shapes. The fire is the small one of the afternoon, and the logs go on it one at a time: the old people follow them with their eyes, and count them.\n\nVigdis tells a short one, for the littlest, the one everybody knows. Baldr's mother, who made every thing swear not to harm him. The shoot of mistletoe, which she let be because it was too young to swear. She tells it in four sentences, with her hands, and ends with her finger raised:\n\n“And remember it: the youngest thing does not swear.”\n\n“And did I swear?” asks Gunna.\n\n“You swear every day that it wasn't you,” says Vigdis, and the children laugh.\n\nShe narrows her eyes, as she does when she has something hard in store. She leans forward on the bench, with her elbows on her knees, and the littlest lean with her.\n\n“Four hang, four walk, two point the way, two keep the dogs off, and one always dangles behind. What is it?”\n\n“A loom!” shouts Gunna, before she has even finished. Kisa shoots out of her shawl and runs under the bench, and the ice cleats go tick tick on the stones of the hearth.\n\n“A cart!” shouts another, from the back, and stands up to say it.\n\nVigdis shakes her head at both of them and counts on her fingers, for those who have not understood: the teats that hang, the legs that walk, the eyes that point the way, the horns that keep the dogs off. Her fingers are thin and crooked, and she folds them one at a time against her palm. When she comes to the last finger, she wiggles her backside on the bench, and Gunna shrieks with laughter.\n\n“And the tail,” she says. “It's a milk cow. The kind we had before these winters.”\n\nThey all laugh, even the old people, even those who have known it for sixty years.\n\nBersi is sitting at the end of the bench. On one side and on the other a palm's width of empty place is left, as around a thing that burns. He looks at the fire.\n\nIn the afternoon, at the council, he was like this beside his mother too: still, with his hands in his sleeves."},"80":{"t":"The leather knot gives at the first tug. You pull the forge hammer out of your pack and weigh it in your hand. It is yours, with the handle that has taken the shape of your fingers. The striking face is bright, and the rest of the iron is dark.\n\nYou stand over the seal's head with your legs wide, and Arnbjorn's saying comes back into your mouth:\n\n“Three blows: one to find it, one to bend it, one to send it home.”\n\nThe first blow you give right in the middle of the head, without force, to feel where it sits. The iron lands and stays: underneath there is something hard and solid, that doesn't slip and doesn't get away. The seal stops. The boards stop creaking. The second you give at a slant, and it lowers its muzzle toward the boards. The whiskers touch the wood, and a short snort comes out of its nose, like an animal disturbed in its sleep. The third you give from above, with your whole arm. The handle doesn't shiver in your palm.\n\nThe head goes back into the floor like a nail into a beam. It goes back in. The boards close over it with the sound of a door shut softly, and lie flat again, so flat you could set a full bowl on them. You run your sole over them: not so much as a step.\n\nOn the wood there is a little seawater left, and one long white whisker. It is stiff, thicker than a bristle, and it pricks your fingertip. You pick it up and put it in your pocket, because Gunna won't believe it.\n\nThe fire, in the hearth, is still smoking, and gives no heat."},"82":{"t":"The old man opens the purse he wears at his belt, under his cloak. Pieces of metal clink inside, and his hand comes out with just one between its fingers.\n\nThe coin is silver, thin, worn at the rim. The old man sets it in your palm, and your cold palm doesn't hold it: it slips, falls, rolls over the stones to the foot of the anvil, where it hums a little on its side and stops. You have never seen a coin like it. On one side there is a ship; on the other a face in a helmet, worn smooth by all the hands that have touched it. The metal is soft: two fingers would be enough to bend it, and no smith in the valley could make another.\n\nYou bend down to pick it up. The ring slips out of your shirt and swings on its thong, in front of the embers, turning slowly on itself. You take it and put it back inside, against your skin, where it always is.\n\nGunna has fallen asleep on the chopping block, with her head resting against the logs of the wall and Kisa in her shawl. The heat of the forge has reddened her cheeks. The horse waits outside, tied to the ring in the wall, with the snow settling on his back. In the workshop there is only the sound of Gunna's breathing, long and calm, and the turf of the roof creaking under the weight of the snow. Now and then a flake drifts down from above, and melts before it reaches the ash. The old man already has his hat pulled down over his forehead, ready to go. Instead he stays.\n\n“And your mother, what was her name?”\n\nHe asks it unhurriedly, in the same voice he used to ask about the iron.\n\nNo one has ever asked you. At Holt everyone knows about the bark basket beside the cauldron, and Arnbjorn tells it to anyone who comes in, laughing until he coughs; of who put you in it, no one ever speaks. It has never occurred to you that it was a thing to be asked out loud, in the doorway, in the dead of night, by someone you don't know.\n\nOutside a beam cracks in the frost. The smoke of the forge, with no bellows to push it, rises lazily toward the hole in the roof and gets caught there.\n\nThe embers are graying at the edges. The old man is on the threshold, with the dark at his back, and he waits. The truth is short, and takes few words. Any name at all would send him away content. Or the question can stay where it is, in the doorway, along with the snow.","dec":1},"84":{"t":"You push the hide curtain aside with your shoulder. It is heavy, greasy with smoke, and beyond it the air is colder.\n\nThe kitchen is a low room at the back of the house, with a plank floor and the hearth built into the corner. Aud doesn't go in. You go in, with the people of the house behind you: they have brought the lamps, and they line up along the wall, tight, one against the other. There are four of them, two men and two women, and no one takes off their cloak.\n\nYou all wait. The fire makes its smoke, which stays low, under the beams, and stings the throat. The boards are wide, with the nail heads polished by footsteps. Under the house the surf beats and draws back, beats and draws back, and somewhere water drips into a bowl, with a small tap now and then. You count the drops to pass the time, then you stop counting. At every bigger wave the floor shivers under your boots. The lamps give off a black smoke that stinks of rancid fish, and in that light the faces along the wall all look yellow and tired.\n\nDeep in the night the boards begin to swell.\n\nYou hear it before you see it: the wood creaks like a wet plank set to warm near the forge. Then, in the middle of the kitchen, two boards hump up, part, and out of the gap comes a seal's head. It is as big as a calf's, glossy, black with water, with wet whiskers. The fur is short, thick, combed all one way by the water, and it fills the gap from one board to the other. The nostrils open and close, two narrow slits, and at every breath the whiskers lift. It has round dark eyes, and it keeps them on the fire. It doesn't look at you, or at those along the wall. It looks at the fire, and that is all.\n\nBehind you someone is praying under their breath. One of the women puts her hands over her mouth.\n\nWithin reach you have what there is in a kitchen. Beside the woodpile is the wood axe, with its long handle and its blade nicked in two places. Leaning against the hearthstones is the stick used for shifting the logs, black at the tip. In your pack, at your feet, is your forge hammer, wrapped in a piece of leather. And along the wall there are four people of the house, lamps in hand, who could help you, if they found the courage.\n\nThree paces from it, the boards you are standing on rise a finger's breadth and drop back. From the seal's head comes a long breath that smells of the sea bottom, and the flames of the lamps all bend the same way.","dec":1,"img":4},"86":{"t":"You don't move. The straw mattress is warm, the blanket smells of birch charcoal, and outside the frost is splitting stones. You tell yourself that the sheepfold has a high fence, and that wolves in winter circle and go away.\n\nThe bleating comes through the log wall in waves, and between one wave and the next the howl returns, each time from a different place. You get up only to take the hammer from the anvil, and you sit down beside the forge holding it across your knees. The handle is smooth where you grip it every day, and it sits in your palm the right way round. You don't sleep anymore.\n\nFrom the sheepfold, the bleating goes on for a long time. There is one bleat shriller than the others, short. Then they stop. What is left is the wind, and the beams cracking in the frost, and Arnbjorn snoring peacefully in the next room. You stay seated until the dark between the boards of the door turns gray.\n\nAt dawn Thorvald counts the sheep, touching them one by one on the back. He counts them twice. One lamb is missing, the one born late, that always stayed between its mother's legs. In the pen, where it slept, the straw is flattened and cold. On the side toward the wood two posts hang crooked: you can see them all the way from the smithy, dark against the snow. The mother bleats alone, now and then, and her voice comes up the road between the houses; the others are silent.\n\nThorvald marks it on his tally, as he marks everything: the sheep, the cows, the winter's dead. When he straightens up, he sees you in the smithy doorway. You still have the hammer in your hand, and your fingers have been closed on the handle since the night.\n\n“One,” he says, and goes to close the pen."}},"links":{"1":[{"l":"Shoe the horse at once","v":45,"t":"l"},{"l":"Finish the cat's ice cleats first","v":57,"t":"l"},{"l":"🧠 If you have Horseshoeing","v":73,"t":"l"}],"4":[{"l" // Motore delle demo giocabili dei librigiochi di Peter Palmer.
// fai_demo.js lo copia dentro ogni pagina, dopo «var BOOK = {...};». Niente onclick nel codice HTML: la politica di
// sicurezza della pagina lascia girare solo questo script, quindi i pulsanti hanno data-az e un solo ascoltatore.
(function () {
  'use strict';
  var B = BOOK, U = B.ui, P = B.par, K = B.links, MAX = B.max;
  var KEY = 'demo_' + B.slug + '_' + B.lang;
  var app = document.getElementById('app');
  var ST = null, NOTE = [], occupato = false;

  // ---------- utilità ----------
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function md(s) {
    return esc(s).replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[\s(«"“])\*([^*\n]+)\*(?=$|[\s).,;:!?»"”])/gm, '$1<i>$2</i>');
  }
  function paras(s) {
    return String(s || '').split(/\n+/).map(function (x) { return x.trim(); }).filter(Boolean)
      .map(function (x) { return '<p>' + md(x) + '</p>'; }).join('');
  }
  function t(k, o) { var s = U[k] || k; if (o) for (var x in o) s = s.split('{' + x + '}').join(o[x]); return s; }
  function d6() {
    try { var a = new Uint8Array(1); do { crypto.getRandomValues(a); } while (a[0] >= 252); return 1 + a[0] % 6; }
    catch (e) { return 1 + Math.floor(Math.random() * 6); }
  }
  function norm(s) { return String(s || '').replace(/✓/g, '').replace(/\s+/g, ' ').trim().toLowerCase(); }
  function re(k) { return new RegExp(B.re[k], 'iu'); }
  var RE = { ab: re('ab'), itPos: re('itPos'), itNeg: re('itNeg'), fgPos: re('fgPos'), fgNeg: re('fgNeg'), fgPre: re('fgPre'), vinci: re('vinci') };
  var lento = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  // ---------- dadi disegnati ----------
  var PUNTI = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
  function dado(v, cls) {
    var h = '<span class="dado' + (cls ? ' ' + cls : '') + '" aria-label="' + v + '">';
    for (var i = 1; i <= 9; i++) h += '<i' + (PUNTI[v].indexOf(i) >= 0 ? ' class="p"' : '') + '></i>';
    return h + '</span>';
  }
  function dadi(arr, cls) { return arr.map(function (v) { return dado(v, cls); }).join(''); }
  // fa rotolare i dadi dentro el, poi chiama fine()
  function rotola(el, n, fine) {
    if (!lento || !el) { fine(); return; }
    var k = 0;
    var iv = setInterval(function () {
      var a = []; for (var i = 0; i < n; i++) a.push(d6());
      el.innerHTML = dadi(a, 'gira');
      if (++k > 7) { clearInterval(iv); fine(); }
    }, 70);
  }

  // ---------- stato ----------
  function tira(v) { var r = { d: [], v: 0 }; if (typeof v === 'number') { r.v = v; return r; } for (var i = 0; i < v[0]; i++) r.d.push(d6()); r.v = v[1] + r.d.reduce(function (a, b) { return a + b; }, 0); return r; }
  function nuovo(ab) {
    var s = { cur: 1, n: 0, ab: ab || [], persi: [], inv: (B.zaino || []).slice(), fg: [], fatti: {}, combat: null, pend: null, fine: 0, anc: 0, tiri: {} };
    var V = B.valori;
    var f = tira(V.fz); s.fz = f.v; s.tiri.fz = f;
    var r = tira(V.hp); s.hp = s.hpMax = r.v; s.tiri.hp = r;
    if (V.agi) { var a = tira(V.agi); s.agi = a.v; s.tiri.agi = a; }
    return s;
  }
  function salva() { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} }
  function carica() { try { var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.cur && P[s.cur] && !s.fine) return s; } catch (e) {} return null; }
  function cancella() { try { localStorage.removeItem(KEY); } catch (e) {} }

  function haDote(n) { n = norm(n); return ST.ab.some(function (a) { return norm(a) === n; }); }
  function persa(n) { n = norm(n); return ST.persi.some(function (a) { return norm(a) === n; }); }
  function ruolo(r) { return !!(B.ruoli && B.ruoli[r] && haDote(B.ruoli[r])); }
  // oggetti: si confrontano senza articolo, e l'etichetta può continuare dopo il nome («Hai La corda spezzata: gliela leghi...»)
  function senzaArt(s) { return norm(s).replace(/^(?:(?:un|una|uno|il|lo|la|i|gli|le|a|an|the) |l['’])/, ''); }
  function haOgg(n) {
    n = senzaArt(n);
    return ST.inv.some(function (x) { x = senzaArt(x); return x === n || x.indexOf(n) === 0 || n.indexOf(x) === 0; });
  }
  function cura(n) { n = norm(n); for (var i = 0; i < B.cure.length; i++) if (n.indexOf(B.cure[i][0]) >= 0) return B.cure[i][1]; return 0; }
  // «il libro ricorda»: come nel giocabile del Tool Creator
  function fNorm(s) { return norm(s).replace(RE.fgPre, ''); }
  var NOTI = null;
  function noti() { if (!NOTI) { NOTI = {}; for (var k in P) if (P[k].f) NOTI[fNorm(P[k].f)] = 1; } return NOTI; }
  function cancello(lab) {
    var m = lab.match(RE.fgNeg);
    if (m) { var pos = fNorm(B.re.non + ' ' + m[1]); if (noti()[pos] && !noti()[fNorm(m[1])]) return { neg: false, f: pos }; return { neg: true, f: fNorm(m[1]) }; }
    m = lab.match(RE.fgPos);
    return m ? { neg: false, f: fNorm(m[1]) } : null;
  }
  function haFg(f) { return ST.fg.some(function (x) { var y = fNorm(x); return y === f || y.indexOf(f) >= 0 || f.indexOf(y) >= 0; }); }

  // ---------- schermate ----------
  function mostra(h, giu) { app.innerHTML = h; if (!giu) window.scrollTo(0, 0); }

  function copertina() {
    var sv = carica();
    var h = '<main class="copertina">' +
      '<h1 class="vh">' + esc(B.title) + '</h1>' +
      '<img class="cop" src="' + B.cover + '" alt="' + esc(t('copAlt', { t: B.title })) + '">' +

  var TIRI_REGOLE = null;
  function regole() {

    };

    h += '</div>';
    h += '<h3>' + esc(B.dotiTit) + '</h3><p class="nota">' + esc(U.dotiNota) + '</p><div class="doti">';
    B.doti.forEach(function (d, i) {
      h += '<label class="dote"><input type="checkbox" value="' + i + '"><span><b>' + esc(d.n) + '</b>' +

    });
    h += '</div><div class="barra-doti"><span id="conta">' + esc(t('dotiConta', { n: 0 })) + '</span>' +
      '<button class="btn" data-az="caso">' + esc(U.caso) + '</button>' +
