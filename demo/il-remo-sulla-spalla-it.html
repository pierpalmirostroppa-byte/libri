o, oltre le dune, si vede la riga nera di un fiume. Ti chini a prendere il remo e te lo metti in spalla. Hai avuto la tua domanda, e in mano ti resta una risposta che non apre nessuna porta."},"251":{"t":"Ti stendi accanto a lui un pezzo per volta, prima le ginocchia e poi i gomiti, attento a non toccare l'acqua. Il remo te lo tieni lungo il fianco, una mano sopra, con la pala dalla parte delle dune. La sabbia del bordo è soda sotto i gomiti e non ha odore, né di sale né di alga. Tra la tua spalla e quella di Narciso resta un palmo; lui non si scosta e non si stringe. Con il mento arrivi a una spanna dall'acqua. Guardi giù.\n\nIl viso nella pozza non sembra il tuo. È pallido, di un pallore che non hai mai avuto nemmeno d'inverno, e ha il sale tra le ciglia. I capelli gli ondeggiano intorno alla fronte, lenti, come alghe in una corrente, mossi da un'acqua che nella pozza non c'è.\n\nChiudi gli occhi. Li riapri. Guardi meglio.\n\nÈ il tuo viso. I tuoi capelli bagnati, incollati alla fronte, fermi. La barba rada di tre giorni di mare. La bocca di tua madre, come dicono tutti a Same. Una notte di tempesta, pensi, lascia la faccia così.\n\nAccanto a te Narciso sorride al suo ragazzo e muove appena le labbra, forse per dirgli il suo nome. Non ha mai alzato gli occhi. Sull'avambraccio ha dei grani di sabbia, uno accanto all'altro, e non li scuote. Sulla pozza, tra il suo viso e il tuo, non c'è una piega.\n\nAlle vostre spalle il cane abbaia una volta sola, secco. Il latrato corre lungo la riva; laggiù, tra le schiene lucide, una foca alza il muso e lo rimette giù.","img":8},"268":{"t":"Caronte spinge la barca nel fiume, e la riva di qua si allontana con quelli che aspettano. L'acqua è nera e lenta, e i remi ci entrano senza schiuma e ne escono senza una goccia. Intorno alla barca la nebbia si stende bassa, all'altezza del bordo, e chi è seduto sul fondo ci sparisce dentro fino alle spalle. Dalle canne arriva un odore di palude, e ogni tanto un tonfo, come di una pietra caduta in acqua; nessuno si volta a vedere.\n\nA metà traversata il vecchio parla, a tutti e a nessuno, con la voce di chi ripete la stessa cosa da mille anni: «Più giù quest'acqua si mescola con lo Stige. Chi giura su di lei resta legato, dèi compresi.» Poi sputa nel fiume.\n\nLa barca urta uno scoglio piatto. Sullo scoglio c'è un cane con tre teste, ognuna grande quanto quella di un vitello, con il pelo nero e ruvido e un collare di bronzo verde per ogni collo. Le teste si abbassano sui passeggeri che scendono, uno alla volta, e annusano. Da vicino sanno di osso e di cenere.\n\n«Cerbero» brontola Caronte. «Il cane fa festa a chi entra. È all'uscita che morde.»\n\nLa testa di mezzo si abbassa sul cane fulvo, naso contro naso. Poi annusa te. La coda, grossa come una gomena, batte due volte sulla pietra.\n\nOltre lo scoglio comincia una riva di sabbia nera, e sulla sabbia ti aspetta una bestia: una vecchia scrofa grigia, enorme, con le setole dritte sulla schiena e le zanne gialle, che grufola e soffia.\n\n«La scrofa di Crommio» dice Caronte, e sputa di nuovo. «Teseo l'ammazzò sulla strada dell'Istmo. È scesa intera, e da allora ce l'ha con chiunque sbarchi.»\n\nLa scrofa abbassa la testa e carica.\n\nLe sue botte arrivano come quelle di chiunque, e come ti ha detto Elpenore non lasciano lividi: ogni colpo che ti prende si porta via una cosa piccola, il nome di una via di Same, il colore di una vela. È vecchia e lenta, e un marinaio con un remo in mano le può tenere testa.","e":"La vecchia scrofa","ec":5,"ee":6,"img":9},"270":{"t":"Alzi la testa e cerchi le stelle: è la prima cosa che fa un marinaio quando si sveglia in un posto che non conosce.\n\nNon ce n'è nessuna. Né l'Orsa, l'unica che non si bagna mai nel mare, né le Pleiadi, né la stella della sera. Giri su te stesso, un quarto alla volta, e la sabbia ti cede sotto i talloni. La volta è liscia e scura da un orizzonte all'altro, senza una crepa: il fondo di una ciotola rovesciata.\n\nAllora fai la seconda cosa che fa un marinaio: ti bagni un dito e lo alzi. Il filo d'aria c'è, sottile, ma non viene né da terra né dal mare; ti gira intorno e non sceglie una parte, e le foglie dei pioppi, sulla duna, non se ne accorgono. Non porta nessun odore: né di terra, né di alghe, né del fumo dei villaggi che un marinaio sente dal largo prima ancora di vedere la costa. Non porta nemmeno un suono: non una capra, non un'ascia.\n\nCerchi la luce. È bassa, rossiccia, la luce di quando il sole è appena sceso. Ma non c'è un punto del cielo dove sia più forte: viene da ogni lato allo stesso modo, come se il sole fosse tramontato dappertutto, e da tanto tempo. Sull'acqua non accende nessuna scia.\n\nIl sole tramonta a occidente, e questo lo sa anche un mozzo. Se qui è tramontato tutto, sei più a occidente di ogni tramonto. Sull'orlo del mondo, dove finiscono tutte le rotte e comincia la corrente di Oceano, quella che nei racconti dei vecchi gira intorno alla terra. Verso il largo il mare è grigio e piatto, senza una vela, senza un gabbiano, e non finisce contro una linea: sfuma, come un discorso lasciato a metà.\n\nAbbassi gli occhi. Il cane è qualche passo più avanti sulla riva, fermo, con la testa voltata verso di te. Non si muove finché non ti muovi tu."},"291":{"t":"«La strada?» Eumeo ti guarda. «Per dove?»\n\n«Per casa.»\n\nEumeo fissa il fuoco. Per un po' non dice niente. Un ciocco si sfalda e manda su poche scintille, che si spengono prima di toccare le frasche del tetto. Alla fine si alza, fruga in una cesta appesa alla trave e torna con un fagotto avvolto in una foglia di fico: una focaccia piatta e dura, con un buco in mezzo, che odora di orzo e di cenere.\n\n«Intanto prendi questa. È la focaccia per il cane della porta. Quella che si mette in mano a chi fa un viaggio lungo, per il cane grosso che sta di guardia. Non si sa mai.»\n\nAspetta che tu la leghi alla cintura. Quando l'hai legata, esce con te: un passo, un colpo di bastone sulla terra battuta, un altro passo. Fuori l'aria è ferma e sa di asfodeli, quell'odore amaro e dolciastro insieme che quaggiù copre ogni cosa. Dalla soglia della capanna la piana si vede tutta: i fiori bianchi fino all'orizzonte, un fiume lontano che non luccica, le mandrie nere, macchie d'inchiostro sulla tela, e più giù, in una conca, un gruppo di case basse di pietra. Cerchi l'approdo, ed è lì: in tutto quel bianco, il solo posto con dei tetti.\n\n«Per adesso, la strada è quella» dice, e punta il bastone. La punta è nera di brace. «Laggiù ci sono le donne di Itaca, e con loro c'è la padrona vecchia, tua nonna. Tieni il fumo alle spalle e scendi dritto. Quando senti un telaio, sei arrivato.»\n\nTi metti il remo in spalla e scendi. Gli steli ti frusciano contro le gambe. Eumeo resta sulla porta, appoggiato al bastone, finché non sei in fondo al sentiero. Quando ti volti l'ultima volta, di lui si vede solo il filo di fumo, dritto sopra la capanna.","it":"Focaccia per il cane della porta"},"293":{"t":"La pista dei carri è la strada più dritta verso il fiume, e la più battuta. La terra è segnata da solchi profondi, duri, larghi un palmo: cammini sul colmo tra l'uno e l'altro. A ogni passo si alza una polvere grigia e fine che non torna a posarsi: resta sospesa all'altezza delle ginocchia, e non ti vedi più i piedi. Ai lati stanno carri da guerra senza cavalli, a decine, con le ruote storte e le stanghe a terra: una battaglia che nessuno ha sgomberato. Le casse di giunco intrecciato sono sfondate, le redini si sono indurite e si spezzano a toccarle, e tutto manda un odore di cuoio vecchio e di stalla vuota.\n\nPassano dei morti, a gruppi, tutti nella stessa direzione. Una fila di marinai scalzi cammina in silenzio, senza un capo, con le mani vuote, mezze chiuse sulla misura di un remo che non c'è. Hanno le tuniche corte da voga e vanno allo stesso passo: i piedi nudi fanno nella polvere un fruscio solo.\n\nPiù avanti la pista si chiude. In piedi tra due carri ci sono otto uomini con le lance e gli scudi di cuoio, tondi, e sotto gli elmi, di cuoio anche quelli, i capelli lunghi legati sulla nuca alla maniera dei Traci. Sono larghi più che alti, e stanno stretti, ogni scudo a coprire il fianco del vicino, e nessuno l'ha ordinato. Hanno le braccia segnate da tatuaggi azzurri, linee e punti, e gli scudi pieni di colpi. Uno porta all'orecchio un pendente di bronzo a forma di grappolo; un altro tiene la lancia come si tiene una zappa. Il più vecchio, barba bianca e lancia corta, sta all'ultimo posto della fila.\n\n«Da dove vieni?» chiede uno, in un greco pesante.\n\n«Da Same» rispondi. «Cresciuto a Itaca.»\n\n«Itaca» ripete lui, e gli altri abbassano le lance verso di te: punte di bronzo scuro, tutte all'altezza del tuo petto. «Siamo i Ciconi di Ismaro. Quelli di Itaca ci hanno bruciato le case al loro primo sbarco. Da allora aspettiamo.»\n\nIl cane ti si mette davanti, basso sulle zampe. Tu hai già il remo di punta, la pala verso di loro.\n\nLe lance sono otto e il remo è uno; ma tra i due carri non passano più di due uomini per volta, e il remo arriva più lontano di una lancia. Tra i carri rovesciati ci sono passaggi stretti, dove un uomo solo può infilarsi. La fila dei marinai passa lì accanto senza voltarsi: se sai parlare a un equipaggio, un ordine dato con la voce giusta te li metterebbe intorno. E c'è un nome che questi uomini temono più di ogni altro; in famiglia, la furbizia per usarlo non è mai mancata a nessuno.","dec":1,"img":10},"298":{"t":"«Come si torna?»\n\nIl vecchio tace, come un pilota che sonda il fondo prima di calare l'ancora. Chiude gli occhi, e sotto le palpebre, sottili, continuano a muoversi, di qua e di là, svelti. Intorno a voi le foche smettono di sbuffare tutte insieme, e dalla barba del vecchio cade una goccia alla volta, lenta, a tempo, come da un remo alzato: le senti toccare la sabbia, una per una. Quando riapre gli occhi hanno il verde dell'acqua sotto la chiglia, e parla in fretta, con la voce di chi recita una cosa imparata da tanto:\n\n«Alla fonte fredda, a chi ti chiede chi sei, di' chi sono tua madre e tuo padre: la Terra e il Cielo stellato.»\n\n«Ti ho chiesto come si torna a casa.»\n\n«E io ti ho risposto.»\n\nSi scrolla di dosso quello che lo tratteneva e si tuffa. L'acqua lo prende senza uno spruzzo. Le foche gli vanno dietro, e la riva resta vuota, rigata dalle loro pance, solco accanto a solco. Restano le lische e i gusci rotti.\n\nTua madre si chiama Ctimene. Tuo padre, Euriloco. Eppure quelle parole le hai già sentite: sono quasi quelle della cantilena che tua madre ti ha fatto ripetere l'ultima sera, mentre ti ricuciva il mantello alla luce della lucerna. Ti pare di sentire ancora lo schiocco del filo tagliato con i denti. Non capisci che cosa c'entri una fonte con la strada di casa. Alcione ha detto che chi tiene il vecchio fino in fondo ha diritto a una domanda; non ha detto che la risposta si capisce.\n\nRaccogli il remo dalla sabbia e te lo rimetti in spalla. Verso l'interno, oltre le dune, si vede la riga nera di un fiume.\n\n*Annota sulla scheda: «sai qual è la fonte fredda».*","f":"sai qual è la fonte fredda"},"302":{"t":"Non molli la criniera, ed è la criniera che se ne va: ti si ritira dalle dita, e il caldo con lei. Il leone si allunga, si assottiglia, perde le zampe. Adesso reggi un serpente grosso quanto una gomena d'ormeggio, freddo e asciutto, che ti si avvolge intorno al braccio in tre giri e comincia a stringere. È lungo quattro braccia buone, e la coda batte per terra da qualche parte dietro di te. Le squame sono piccole e dure, borchie di bronzo sotto i polpastrelli, e sulla sabbia frusciano. La testa si solleva davanti ai tuoi occhi: è piatta, larga quanto la tua mano, e ha due occhi senza palpebre. La lingua nera entra ed esce, e ti arriva in faccia un fiato di cantina, di terra chiusa e di vino andato a male.\n\nLo tieni dove puoi: una mano sotto la testa, l'altra a metà del corpo, e tutto il resto non lo tiene nessuno. I tre anelli sul braccio si serrano adagio, un dito alla volta.\n\nNon sai se ha il veleno. Sai che a Itaca i vecchi dicono di non tenere mai un serpente che non conosci. Dall'acqua, le foche mugolano basse: vacche in una stalla.\n\nLe spire ti scorrono addosso come una cima che si svolge dall'argano, e a ogni giro capisci un po' meno che cosa stai tenendo, e da quale parte. Sulla sabbia, intorno a voi, restano i solchi dei vostri giri, larghi, dai bordi tondi: la scia di una barca tirata in secca.\n\nLa mano sotto la sua testa è ancora chiusa. Sono dita tue: si aprono quando vuoi.","dec":1},"309":{"t":"Vai da lui, tra gli ultimi che si alzano dalla ghiaia e si scansano quel tanto che basta. Tersite smette di ridere, sorpreso.\n\n«Perché lo dici?» gli chiedi.\n\nTi guarda dal basso, con la testa di traverso. Da vicino ha la pelle segnata da vecchie cicatrici, bianche e sottili, e la tunica gli sa di accampamento: fumo, cuoio, fango di fossato. Ha lo sguardo svelto, che non ti sta in faccia: ti corre alle mani, al remo, a chi hai alle spalle. Ride di nuovo, ma a bocca stretta, solo per te.\n\n«Perché fa ridere. E tanto nessuno mi ascolta.» Si gratta la testa a punta. «Tu sì, però. Guarda un po'. Il nipote del re che ascolta Tersite.»\n\nSenza che tu glielo chieda, ti racconta di quando sotto Troia si alzò in assemblea, davanti a tutti, e disse al re che la guerra la pagavano lui e gli altri poveri in fondo alla fila, mentre i re si tenevano il bottino. Tuo zio gli diede una bastonata con lo scettro, davanti all'esercito, e tutti risero. Lo racconta a gesti, facendo la parte di tutti: il re sul suo seggio, tuo zio che si alza, il colpo che cala, e lui piccolo piccolo, con le braccia sulla testa. Ha le dita nodose, e non le tiene ferme un momento. Tra una parte e l'altra si tocca la schiena in un punto preciso, tra le scapole, senza cercarlo: la mano ci va da sola.\n\n«Ridevano anche quelli in fondo alla fila» dice. «Loro più di tutti.» Scrolla le spalle storte. «Paga sempre quello in fondo alla fila. E chi lo dice prende le bastonate.»\n\nSul fiume la nebbia si è abbassata, e le canne ci stanno dentro fino a metà, come gente che guada. Davanti all'acqua la folla si è stretta, e vi volta la schiena. Tersite guarda la barca che si avvicina. «Vai, vai, che il vecchio non aspetta nessuno. Io prendo la prossima: qui c'è ancora qualcuno da prendere in giro.»\n\n*Annota sulla scheda: «hai dato ascolto a Tersite».*","f":"hai dato ascolto a Tersite"},"317":{"t":"Posi il remo sulla sabbia e fai gli ultimi tre passi in punta di piedi, tra le pelli stese e una foca che non alza la testa.\n\nGli salti addosso mentre dorme e gli chiudi le braccia intorno al petto, alla maniera di Menelao. La pelle è liscia e fredda, pelle di pesce appena tirato su, e sa di alga. Sotto ci sono costole strette, da vecchio: ti afferri un polso con l'altra mano e serri.\n\nNon fa in tempo a svegliarsi del tutto. Sotto le tue mani la pelle diventa pelo ruvido; il petto si gonfia e ti allarga le braccia finché il polso ti sfugge, e affondi le dita a pugni chiusi in una criniera; e quello che stringi è un leone. Si alza sulle quattro zampe e ti tira su con sé: pianti i piedi nella sabbia, e la sua schiena ti arriva al petto. Il freddo di pesce non c'è più: il collo, sotto i tuoi pugni, scotta. La criniera ti riempie gli occhi e odora di polvere calda. Il ruggito ti rimbomba nel petto come un tuono nella stiva. La bestia punta le zampe nella sabbia, che schizza via in due ventagli grigi, si torce e volta la testa verso di te: la gola rossa, i denti gialli, davanti alla tua faccia, e dalla bocca un fiato di carne vecchia. Le zampe davanti sono larghe quanto la pala del tuo remo, e dove raspano lasciano solchi fondi un dito. A ogni strattone i tuoi talloni arano la sabbia, un poco più vicino al mare.\n\nLe foche si buttano in acqua tutte insieme, e il mare se le prende senza un tonfo; le ultime si fermano sugli scogli bassi, con il collo girato, a guardare. Le quattro sagome sotto le pelli non si muovono.\n\nUn leone è un leone. Nessuno, a Same, ti darebbe torto se aprissi le braccia adesso.","dec":1,"img":11},"332":{"t":"Ti butti di lato, tra due carri rovesciati, e corri.\n\nIl cimitero dei carri è un labirinto: ruote alte quanto un uomo, stanghe incrociate, casse sfondate, timoni puntati verso l'alto come alberi di nave. Qui dentro l'aria è ferma e puzza di giunco marcio e di grasso di ruota. Ti infili dove passa uno solo, scavalchi, strisci sotto un pianale con il remo stretto al petto. Il remo è lungo due volte te: s'incastra tra i raggi, batte in un mozzo, e ogni volta devi fare un passo indietro per sfilarlo. Dietro, i Ciconi gridano nella loro lingua e si chiamano da un carro all'altro.\n\nNon ti vengono dietro in fila: si dividono. Tra i raggi di una ruota vedi passare due scudi tondi, e una punta di bronzo scivola sopra una sponda, tre carri più in là. Le loro lance sono più corte del tuo remo, e qui dentro non s'incastrano.\n\nSe trovi il varco giusto, li perdi nel labirinto e sbuchi dall'altra parte, verso il fiume. Se sbagli, ti ritrovi chiuso tra le ruote, con le lance davanti e dietro."},"341":{"t":"Alla cintura hai il sacchetto di cuoio che ogni marinaio di Same si porta dietro, per il pesce e per le partenze. Il laccio si è gonfiato d'acqua e lo sciogli con i denti: il cuoio ti lascia sulla lingua un amaro di concia. Dentro, il sale si è fatto grumi grigi e umidi, e odora di salina, di pietra bagnata; ma è sale lo stesso. Ne sbricioli un pizzico tra le dita e glielo lasci cadere sulla spalla, tra le piume, come fanno le madri sul molo quando la nave sta per staccarsi.\n\nAlcione resta immobile. I grani le restano sulle piume, bianchi sull'azzurro, e non si sciolgono. Si porta le dita alla spalla, dove è caduto il sale, e le posa lì senza premere, attenta a non farne cadere nemmeno uno.\n\n«Nessuno me lo faceva più» dice. «Da quando il mare mi ha presa, nessuno.»\n\nPer un poco restate così, lei sullo scoglio e tu in piedi sulla sabbia, e davanti a voi il mare si stende, un lenzuolo tirato.\n\nSi stacca dalla spalla una piuma e te la porge, tenendola per la punta, tra due dita. È azzurra, lunga quanto il tuo palmo, e asciutta: l'unica cosa asciutta che hai visto da quando hai aperto gli occhi. Quando la prendi non pesa: sai di averla in mano perché la vedi. E tra le dita ti arriva un odore che quaggiù non c'è: aria aperta, vento pulito sopra un mare calmo.\n\n«La Piuma di Alcione. Dentro c'è un poco della mia bonaccia, quella che non è venuta per la tua nave. Tienila per quando dovrai uscire in fretta da un posto chiuso, e il mare non vorrà lasciarti andare. È in prestito.»\n\nInfili la piuma sotto la cintura, accanto al sacchetto, dove non la perderai.\n\nAlcione ha già ritrovato il suo punto sull'orizzonte. Più avanti il ragazzo della pozza non ha alzato la testa. Oltre, sulla riva delle foche, le schiene lucide non si muovono.","it":"Piuma di Alcione","dec":1},"348":{"t":"Eumeo smette di attizzare il fuoco. La punta del bastone resta tra le braci, e il legno comincia a fumare.\n\n«Euriloco.» Lo dice come si dice il nome di un vento. La fiamma lo prende da sotto e gli fa due solchi ai lati della bocca. «Veniva al podere a chiedere tua madre, prima della guerra, e stava sulla porta con il berretto in mano. Non entrava finché Laerte non glielo diceva due volte. Aveva due mani larghe così, con le nocche grosse e le unghie nere di pece, e le teneva dietro la schiena come se se ne vergognasse. Era uno che contava: le pecore, le olive, i giorni di mare. Se diceva che il vento girava, il vento girava.»\n\nPer dire la misura ha aperto la mano libera davanti al fuoco, con le dita larghe. La richiude, e tace un poco. Fuori, tra gli asfodeli, non si muove niente. «Aveva quasi sempre ragione. Una volta sola no.»\n\nNon gli chiedi quale. A Same lo sanno anche i bambini, quale.\n\n«Al porto dicono che la nostra famiglia pagherà per sempre» dici.\n\nEumeo alza le spalle. Toglie il bastone dal fuoco e soffia sulla punta che fuma: la brace in cima si fa rossa, e torna nera. «Io ho pagato per una serva che scappava con i Fenici e mi portò con sé. Ero figlio di re, e mi comprò tuo nonno per farmi guardare i porci. Non me ne importa più.»\n\nSi alza, fruga in una cesta appesa alla trave e torna con un fagotto avvolto in una foglia di fico secca, che gli fruscia tra le dita: una focaccia piatta e dura, con un buco in mezzo e la crosta bruciacchiata ai bordi.\n\n«Prendi. È la focaccia per il cane della porta. Quella che si mette in mano a chi fa un viaggio lungo, per il cane grosso che sta di guardia. Non si sa mai.» Te la mette in mano. Dove il fagotto si apre, ti resta il nero sui polpastrelli. Aspetta che tu la leghi alla cintura. La leghi. «Tua nonna sta più giù, con le donne di Itaca. Passa da lei.»","it":"Focaccia per il cane della porta"},"357":{"t":"«No» dici. «Questa storia non la racconto.»\n\nVolti le spalle alla radura e ti rimetti in cammino. Ma le vecchie si alzano e ti vengono dietro tra i tronchi, più svelte di quanto ti aspettassi, con le vesti di lana che strusciano sulle cortecce, mentre i mozzi saltano tra le radici intorno a voi.\n\n«Dai. Una volta sola.»\n\n«Solo i nomi.»\n\n«Se non li dici tu, li diciamo noi, e poi sono affari tuoi.»\n\nIl bosco si fa fitto. Le radici escono dalla terra, costole di una barca, e per scavalcarle tieni il remo a metà, di traverso, a bilanciarti. I rami dei salici ti si impigliano nel mantello e ci lasciano un odore di foglia marcia. Un mozzo ti passa sotto il braccio e ti corre davanti all'indietro, per guardarti la bocca. Da qualche parte in fondo si sente scorrere un fiume.\n\nDevi staccarle prima che perdano la pazienza. Se ti stanno ancora alle calcagna quando smettono di chiedere, i nomi li diranno loro. E le due di quella storia, lo sai da bambino, nessuno le ha mai mandate via a bastonate."},"358":{"t":"Prendi posto sulla radice libera, con il remo dritto contro la spalla, e racconti. È la storia che ti diceva Euriclea quando non volevi dormire, e ti accorgi che la sai ancora tutta, parola per parola, con le sue pause e con la voce che lei abbassava nei punti giusti: le due vecchie della notte, quella che fa rumore di passi e quella che non fa rumore affatto. Ti torna l'odore che lei si portava dietro dal palazzo, di pane e di cera. I mozzi si stringono ginocchio contro ginocchio, e quello della cima se la avvolge due volte intorno al polso. Le nutrici muovono le labbra insieme a te, senza voce, mezza parola avanti. Quando arrivi al punto in cui i nomi si dicono, li dici.\n\n«Mormo. Gello.»\n\nI mozzi strillano di piacere. Le nutrici annuiscono, come quando una cosa è stata fatta bene, e una batte le mani sulle ginocchia, due volte. Due mozzi si mettono a fare le vecchie, curvi, con le dita a uncino, e gli altri scappano ridendo tra le radici.\n\nIl bosco tace tutto insieme. I due che facevano le vecchie si raddrizzano senza finire il gioco. Tra i pioppi, a venti passi, il buio si fa più fitto in due punti. Non sono sagome, non ancora: sono due macchie dove la luce non arriva, alte quanto una donna curva, e da quella parte l'aria sa di stoppino appena spento. Il chiaro che scende tra i rami cade dentro le macchie e non tocca terra. Stanno lì. Aspettano. Il cane ha il pelo dritto sulla schiena e non abbaia.\n\n«Adesso basta» dice la nutrice più vecchia, e non sorride più. Ha tolto le mani dal grembo e si tiene alla radice. «Adesso zitto.»\n\nUn mozzo ti bisbiglia all'orecchio, eccitato: «Chiamale un'altra volta e digli di andare via! Sulla mia nave si faceva così!»\n\nLe due macchie non si muovono. Il remo ce l'hai in mano, ma là non si vede niente che un remo possa toccare. E le gambe, per correre, ce le hai.","dec":1},"367":{"t":"Apri le mani.\n\nQuello che tenevi, qualunque forma avesse, ti scivola via, e ti ritrovi seduto sulla sabbia. Lo rivedi com'era all'inizio: un vecchio con la barba di schiuma, in piedi sull'orlo dell'acqua, che ti guarda senza rancore e senza interesse. Per lui sei uno dei tanti che ci hanno provato. Si rassetta la barba con due dita e si tuffa, di testa, in un'acqua che non coprirebbe una caviglia. L'acqua gli si chiude sopra liscia, e non resta nemmeno un cerchio. Dove l'hai tenuto resta una pozzetta salata, che la sabbia beve un sorso alla volta, finché non c'è più.\n\nLe ultime foche gli vanno dietro in fila, ondeggiando fino all'acqua. Anche le quattro sagome sotto le pelli non ci sono più. Dove stavano restano le conche nella sabbia, lisce: letti lasciati di fretta.\n\nLa riva è vuota. Finiti gli sbuffi delle bestie, la spiaggia tace, e il mare non ci mette niente di suo. Ti accorgi di avere ancora le braccia chiuse a cerchio intorno al niente, e le lasci cadere. Sui palmi non ti è rimasto un pelo. Non hai perso niente, e non hai avuto niente. Resta l'odore delle bestie, che si sfilaccia e si perde, e le loro tracce larghe e morbide, che vanno tutte verso il mare e nessuna torna indietro.\n\nTi rialzi e ti scuoti la sabbia dal mantello. Il remo è dove l'hai posato, mezzo coperto da quella che avete smosso. Verso l'interno, oltre le dune, si vede la riga nera di un fiume, tra le canne. Ti metti il remo in spalla."},"371":{"t":"«Scappate finché siete in tempo!» gridi, e ti volti verso la pista alle tue spalle, fingendo di vederci arrivare qualcuno. «Odisseo è dietro di me con i suoi uomini. Quello di Ismaro. Arriva adesso!»\n\nIl nome passa tra i Ciconi, vento su un campo di grano. Qualcuno guarda la pista, qualcuno te; poi scappano tutti tra i carri, e la polvere che sollevano resta in aria dietro di loro.\n\nTutti tranne uno. Il più vecchio si è fermato a metà strada e si è voltato: un guerriero che ti studia, come un cambiavalute una moneta che suona male. Sull'asta della lancia il legno è nero dove la tiene.\n\n«Parla come lui» dice a mezza voce. «Questa l'ho già sentita, sotto le mura di Ismaro.» Torna indietro e ti sbarra la pista, da solo. Mette i piedi in due solchi, alza lo scudo fin sotto il mento e tiene la lancia bassa, contro il fianco.\n\nIl vecchio guerriero è lento, ma non si sposterà. Le sue botte arrivano lo stesso, e ognuna si porta via una cosa piccola: una parola di una canzone, la faccia di un amico.\n\n*Annota sulla scheda: «il sangue di Odisseo è stato riconosciuto».*","e":"Il vecchio guerriero","ec":6,"ee":6,"f":"il sangue di Odisseo è stato riconosciuto"},"374":{"t":"Strappi un ciuffo di asfodeli dal bordo della strada e lo agiti davanti al muso dell'asina, dall'altra parte del pino. I gambi rotti ti lasciano sulle dita un succo che appiccica. I fiori bianchi mandano il loro odore amaro, e l'asina alza le orecchie e allarga le froge. Il crocchiare dei giunchi si interrompe. Ocno, che non si è accorto di niente, continua a intrecciare, e la fune a cadere dietro di lui.\n\nAdesso serve un momento solo: che l'asina guardi i fiori abbastanza a lungo, e che tu faccia in tempo ad allungare la mano e a tirare via la fune prima che lei torni a masticare. Tra la tua mano e la fune c'è un braccio. Tra la fune e i suoi denti non c'è niente: ce l'ha in bocca, bagnata, e la tiene.\n\nL'asina guarda i fiori. Guarda la fune. Di nuovo i fiori. Se sceglie la fune, se la mangerà davanti ai tuoi occhi fino all'ultimo giunco, e tu resterai con un ciuffo di fiori in mano."},"383":{"t":"Non dici più niente. Stringi il remo e corri.\n\nDietro di te le vecchie gridano, poi tacciono. Il passo dei mozzi si ferma. Un altro, più pesante, continua: batte una volta ogni tre dei tuoi, e non resta indietro. Non ti volti. Tra i pioppi neri tutto si somiglia: un tronco, un altro, un salice, un altro tronco, e per terra solo muschio, che non fa rumore e non tiene le impronte. Una radice ti prende il piede; ti raddrizzi con una mano su una corteccia bagnata e vai avanti.\n\nLe due macchie di buio ti vengono dietro, di albero in albero, sempre a venti passi. Lo sai senza guardare: l'aria di stoppino spento ti resta sulla nuca, né più forte né più debole, per quanto allunghi la corsa. Senza nessuno che le chiami di nuovo, forse si stancheranno e si scioglieranno nel bosco come il fumo. O forse ti arriveranno addosso prima che tu trovi il fiume."},"385":{"t":"«Ho paura» dici. «Di quell'acqua, e di tutto il resto.»\n\nMenete smette di sputare. Piega la testa di lato e ti studia, con la faccia di un bovaro che ha visto alzarsi da solo un vitello nato storto. «Paura.» Annuisce, due volte. «Bene. Gli eroi non ce l'hanno, ed è per questo che fanno danni. Vieni. Metti i piedi dove li metto io.»\n\nTi porta lungo la riva, tra le vacche nere che si scostano senza un muggito. Cammina con il fianco tirato in su, e prima di ogni passo tasta la terra con la punta del bastone; tu metti i piedi nelle sue orme. Le vacche hanno il pelo opaco, impolverato, e ognuna porta al collo un campanaccio di legno che non suona: passando vedi il battaglio dondolare dentro, a vuoto. Qui gli asfodeli sono calpestati, e dagli steli rotti sale un odore più forte, quasi di miele guasto. Nessun uccello, nessun insetto: solo il fruscio dei vostri passi tra gli steli.\n\nDove l'acqua si allarga, Menete punta il bastone sul sentiero.\n\nSulla terra battuta, tra le orme a zoccolo spaccato, ci sono gocce lucenti, rapprese e dure, grosse quanto lenticchie. Ne tocchi una con la punta del dito: è liscia, e non si stacca. Bronzo. Sembra piombo colato e lasciato raffreddare. In fila con le gocce ci sono orme di piede, calcate più a fondo di quelle delle vacche.\n\n«Di qui passa uno tutto di bronzo» dice Menete. «Fa il giro della piana grande, di là dal fiume, come lo faceva intorno alla sua isola. E perde. Guarda dove cadono le gocce: sempre accanto al calcagno, mai dalla parte delle dita.» Sputa. «Una bestia che zoppica perde da una zampa sola. Me l'ha insegnato il mestiere.»\n\nEntra nel guado per primo, fino alle ginocchia, appoggiandosi al bastone. L'acqua gli si apre intorno senza un gorgoglio, nera, e dietro di lui si richiude. Si volta ad aspettarti. Sulla riva le vacche hanno alzato il muso tutte insieme, verso la stessa parte della piana. «Ti porto di là. Poi te la sbrighi da solo: più avanti passa la caccia, e le mie bestie la sentono.»\n\n*Annota sulla scheda: «hai visto le gocce di bronzo».*","f":"hai visto le gocce di bronzo"},"390":{"t":"«Sono Anfialo, figlio di Euriloco» dici. «Mio zio è Odisseo, il re di Itaca.»\n\nLo dici a voce piena, con il remo dritto accanto: è così che ci si annuncia entrando in un porto straniero.\n\nMenete non dice niente. Stacca il bastone da terra e se lo mette in spalla, da uomo che ha finito di ascoltare. Una vacca, dietro di lui, alza la testa dagli asfodeli e resta così, con un ciuffo bianco che le pende dalla bocca. Menete sorride, e non è un bel sorriso: gli si alza un angolo solo della bocca, e gli occhi restano dov'erano.\n\n«Il nipote del re. Ma certo.» Si toglie il bastone dalla spalla e lo punta verso un sentiero largo e battuto, che si allontana dal guado tra gli asfodeli pestati. «Di là, nipote del re. È la strada per quelli come voi: larga, comoda. Ci passano tutti gli eroi.»\n\nTorna alle sue vacche senza aspettare che tu lo ringrazi, e le spinge verso l'acqua con piccoli colpi di bastone sulle groppe. Il legno suona secco sulle ossa, e nessuna muggisce.\n\nÈ davvero largo, il sentiero: ci passerebbero due carri affiancati. Gli asfodeli ai lati sono spezzati e schiacciati, come se ci fosse passato sopra un branco intero, di corsa, più di una volta, e l'aria sopra il sentiero sa di linfa e di polvere. La terra è dura sotto i piedi, e qui non scricchiola più niente. Ci restano impronte di ogni forma, zoccoli, artigli, e in mezzo orme di piedi nudi, lunghe il doppio delle tue e affondate un dito più delle altre. Da lontano arriva un rumore che va e viene: un corno, forse, o un latrato.\n\nPoco più avanti, sul bordo del sentiero, c'è un carro senza buoi, con le stanghe appoggiate a terra. Accanto dormono due ragazzi, uno con la testa sulla spalla dell'altro e le mani abbandonate in grembo. Hanno la stessa faccia, a due età vicine: fratelli. Sono così tranquilli che, passando, rallenti il passo per non svegliarli."},"392":{"t":"«Non ti prometto niente» dici. «Non prometto quello che non so se potrò fare.»\n\nGlielo dici in faccia, senza scendere dalla barca e senza salirci del tutto.\n\nElpenore tace. Quelli che la barca non ha preso guardano l'acqua, là dove la schiuma giallastra orla la ghiaia. Lui annuisce una volta sola, per quanto glielo lascia fare la mano sotto la mascella: il cenno che a bordo si fa a una manovra riuscita.\n\n«Onesto» dice. «Come tuo padre.»\n\nNon sai che cosa rispondere. In tutta la tua vita nessuno ti ha mai detto che somigli a tuo padre per dirti una cosa buona. A Same, quando lo dicevano, abbassavano la voce.\n\nElpenore si piega sulle ginocchia e raccoglie dalla ghiaia un sasso piatto, di quelli che a Itaca i ragazzi fanno saltare sull'acqua. È nero di fango da una parte e lavato dall'altra. Se lo rigira tra le dita senza lanciarlo; il tremito glielo fa ballare sul palmo, e non gli cade. Quest'acqua è troppo nera per giocarci.\n\n«Euriloco non prometteva mai niente» dice, e parla al sasso, non a te. «Diceva le cose come stavano, anche a tuo zio, anche davanti a tutti, anche quando era meglio stare zitti. Sulla nave, per questo, qualcuno lo odiava. Io no.» Posa il sasso dove l'ha preso, con cura, nella sua impronta, con il fango di sotto. Si rimette la mano sotto la mascella e alza la faccia. «Va'. Il vecchio non aspetta.»\n\nDietro di te Caronte batte il remo sul bordo una seconda volta. Il colpo rimbalza sull'acqua nera e si perde tra le canne. Sotto il piede che hai a bordo le assi si muovono: il vecchio ha già sfilato la pertica dal fango."}},"links":{"1":[{"l":"Segui il cane","v":173,"t":"l"},{"l":"🧠 Se hai Stelle","v":270,"t":"l"}],"10":[{"l":"Tiri dritto verso la barca","v":202,"t":"l"},{"l":"Ti fermi ad ascoltarlo","v":309,"t":"l"}],"31":[{"l":"Ti affacci accanto a lui","v":251,"t":"l"},{"l":"Prosegui verso la riva delle foche","v":209,"t":"l"}],"42":[{"l   function t(k, o) { var s = U[k] || k; if (o) for (var x in o) s = s.split('{' + x + '}').join(o[x]); return s; }

  function re(k) { return new RegExp(B.re[k], 'iu'); }
  var RE = { ab: re('ab'), itPos: re('itPos'), itNeg: re('itNeg'), fgPos: re('fgPos'), fgNeg: re('fgNeg'), fgPre: re('fgPre'), vinci: re('vinci') };
  var lento = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  // ---------- dadi disegnati ----------
  var PUNTI = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };

  // fa rotolare i dadi dentro el, poi chiama fine()

  // ---------- stato ----------

  function nuovo(ab) {

  function salva() { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} }

  function haDote(n) { n = norm(n); return ST.ab.some(function (a) { return norm(a) === n; }); }

  function ruolo(r) { return !!(B.ruoli && B.ruoli[r] && haDote(B.ruoli[r])); }
  // oggetti: si confrontano senza articolo, e l'etichetta può continuare dopo il nome («Hai La corda spezzata: gliela leghi...»)

  // ---------- schermate ----------
  function mostra(h, giu) { app.innerHTML = h; if (!giu) window.scrollTo(0, 0); }

  function copertina() {

  // arrivo in un paragrafo: zaino, annotazioni, Resistenza (una volta per partita)
  function entra(id, pre) {

  function azioni(id, o) {

    if (ST.hp <= 0 && !ST.combat) {

    var h = '';
    if (agi.length >= 2) h += '<button class="btn prova" data-az="prova" data-v="agi">🤸 ' + esc(U.agiProva) + ' · ' + esc(U.tira) + '</button>';
    else if (fort.length >= 2) h += '<button class="btn prova" data-az="prova" data-v="fort">🎲 ' + esc(U.fortProva) + ' · ' + esc(U.tira) + '</button>';

    // oggetti: «🎒 Hai X» e «🎒 Non ce l'hai»

    var haAlmenoUno = serve.some(haOgg);

    resto.forEach(function (l) {
      var lab = l.l, i = (K[id] || []).indexOf(l), m;

      }
      if ((m = lab.match(RE.itPos))) { if (!haOgg(m[1])) { if (serve.length && resto.some(function (x) { return RE.itNeg.test(x.l); })) return; h += chiusa(lab, U.serveOgg); return; } }

  function chiusa(lab, perche) { return '<button class="btn scelta chiusa" disabled>🔒 ' + esc(lab) + ' <small>' + esc(perche) + '</small></button>'; }

  // ---------- prove di agilità e colpi di fortuna ----------
  function rami(id, ico) {

    return ls.map(function (l) { return { v: l.v, lo: parseInt((l.l.match(/(\d+)/) || [0, '0'])[1], 10) || 0 }; })
      .sort(function (a, b) { return a.lo - b.lo; });
  }
  function prova(tipo) {

    var a = [d6(), d6()], s = a[0] + a[1], ok, dett;

  // ---------- scontri ----------
  function scontro(id, o, ls) {

    var c = ST.combat;

      barraVita(o.e + ' · ' + U.fAbbr + ' ' + o.ec, c.hp, c.max, 'lui') +
      '<div class="dadi-grandi due" id="rot">' + (c.ultimo ? '<div class="tiro"><span class="chi">' + esc(U.tu) + '</span>' + dadi(c.ultimo[0]) + '</div><div class="tiro"><span class="chi">' + esc(o.e) + '</span>' + dadi(c.ultimo[1]) + '</div>' : '') + '</div>';
    if (c.log.length) h += '<div class="registro">' + c.log.slice(-4).map(function (l) { return '<p>' + esc(l) + '</p>'; }).join('') + '</div>';
    if (!c.fine) {

      h += '<button class="btn primo" data-az="round">' + esc(U.attacca) + '</button>';
      ST.inv.forEach(function (x, i) { var v = cura(x); if (v && ST.hp < ST.hpMax) h += '<button class="btn" data-az="usa" data-v="' + i + '">' + esc(t('usaOgg', { x: x, n: v })) + '</button>'; });
    } else {
      var w = ls.filter(function (l) { return /^⚔/.test(l.l); });
      var vin = w.filter(function (l) { return RE.vinci.test(l.l); })[0] || w[0];
      var per = w.filter(function (l) { return l !== vin; })[0];
      if (c.fine === 1) h += '<p class="esito ok">' + esc(U.vinto) + '</p><button class="btn primo" data-az="esitoScontro" data-v="' + (vin ? vin.v : 0) + '">' + esc(t('vaiA', { n: vin ? vin.v : '' })) + '</button>';
      else if (per && per !== vin && per.v && P[per.v]) h += '<p class="esito ko">' + esc(U.perso) + '</p><button class="btn primo" data-az="esitoScontro" data-v="' + per.v + '">' + esc(t('vaiA', { n: per.v })) + '</button>';
      else { ST.fine = 2; cancella(); return h + '</div>' + morte(true); }
    }
    return h + '</div>';
  }
  function barraVita(nome, v, m, cls) {
    var pc = Math.max(0, Math.round(v / m * 100));
    return '<div class="vita"><span>' + esc(nome) + ' · ' + esc(U.rAbbr) + ' ' + Math.max(0, v) + '/' + m + '</span><div class="traccia"><div class="riemp ' + cls + ' w' + Math.round(pc / 5) * 5 + '"></div></div></div>';
  }
  function round() {
    var c = ST.combat; if (!c || c.fine || occupato) return;
    occupato = true;
    var o = P[c.id];
    var a = [d6(), d6()], b = [d6(), d6()], pr = a[0] + a[1], er = b[0] + b[1];
    if (B.lama && haDote(B.lama) && !c.lama && pr !== 12) {

      if (a[lo] <= 2) { var vec = a[lo]; a[lo] = d6(); c.lama = 1; pr = a[0] + a[1]; c.log.push(t('lamaRiga', { x: vec, y: a[lo] })); }
    }
    var pa = pr + ST.fz + (ruolo('forza') ? 1 : 0), ea = er + o.ec - (ruolo('armatura') ? 1 : 0);
    var res = pr === 12 ? 'p' : pr === 2 ? 'e' : pa > ea ? 'p' : ea > pa ? 'e' : 't';
    if (res === 'p') c.hp -= 2; else if (res === 'e') ST.hp -= 2;
    var dopo = res === 'p' ? (pr === 12 ? U.dodici : U.colpisci) : res === 'e' ? (pr === 2 ? U.due : U.colpito) : U.pari;
    c.log.push(t('roundRiga', { a: pa, b: ea, n: o.e }) + ' ' + dopo); c.ultimo = [a, b];
    if (c.hp <= 0) c.fine = 1; else if (ST.hp <= 0) c.fine = 2;
    salva();
    var box = document.getElementById('rot'), io = ST;
    var dopo = function () { occupato = false; if (ST !== io || ST.combat !== c) return; var az = app.querySelector('.azioni'); if (az) az.innerHTML = azioni(ST.cur, P[ST.cur]); aggiornaBarra(); };
    if (box) rotola(box, 4, dopo); else dopo();
  }
  function aggiornaBarra() { var b = app.querySelector('.barra'); if (b) b.outerHTML = barra(); }

  // ---------- morte e fine della demo ----------
  function morte(perResistenza) {
    var tit = B.defeat || U.morteTit;
    return '<div class="riquadro morte"><p class="titolo-r">' + esc(tit) + '</p>' +
      (perResistenza ? '<p>' + esc(U.morteRes) + '</p>' : '') +
      '<p class="nota">' + esc(U.morteNota) + '</p>' +
      '<button class="btn primo" data-az="ricomincia">' + esc(U.ricomincia) + '</button></div>';
  }
  function pannello(fuori) {
    var h = '<div class="fine"><img class="cop-piccola" src="' + B.cover + '" alt="">' +
      '<p class="fine-sopra">' + esc(fuori ? U.fineFuori : U.fineSei) + '</p>' +
      '<h2>' + esc(U.fineTit) + '</h2><p>' + esc(B.fineTesto) + '</p><div class="compra">';
    B.negozi.forEach(function (n) {
      h += '<a class="btn primo" href="' + esc(n.url) + '" target="_top" rel="noopener">' + esc(n.f === 'ebook' ? U.ebook : n.f === 'scopri' ? U.scopri : U.cartaceo) +
        (n.dove ? ' <small>' + esc(n.dove) + '</small>' : '') + '</a>';
    });
    h += '</div><p class="sito"><a href="' + esc(B.sito) + '" target="_top">' + esc(U.sito) + '</a></p>' +
      '<button class="btn mini chiaro" data-az="rigioca">' + esc(U.rigioca) + '</button></div>';
    return h;
  }
  function fuori() {
    ST.fine = 1; cancella();
    mostra(barra() + '<main class="foglio par">' + pannello(true) + '</main>');
  }

  // ---------- scheda ----------
  function scheda() {
    var vecchia = document.getElementById('scheda'); if (vecchia) { vecchia.remove(); return; }
    var h = '<div class="scheda-dentro"><h3>' + esc(U.scheda) + '</h3>' +
      '<p><b>' + esc(U.forza) + '</b> ' + ST.fz + ' · <b>' + esc(U.resistenza) + '</b> ' + Math.max(0, ST.hp) + '/' + ST.hpMax +
      (ST.agi ? ' · <b>' + esc(U.agilita) + '</b> ' + ST.agi : '') + '</p>' +
      '<p class="nota">' + esc(t('scelteTit', { n: ST.n, m: MAX })) + '</p>' +
      '<h4>' + esc(U.doti) + '</h4><ul>' + ST.ab.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul>' +
      '<h4>' + esc(U.zaino) + '</h4>';
    h += ST.inv.length ? '<ul>' + ST.inv.map(function (x, i) {
      var v = cura(x);
      return '<li>' + esc(x) + (v && ST.hp < ST.hpMax ? ' <button class="btn mini" data-az="usa" data-v="' + i + '">' + esc(t('usa', { n: v })) + '</button>' : '') + '</li>';
    }).join('') + '</ul>' : '<p class="nota">' + esc(U.vuoto) + '</p>';
    if (ST.fg.length) h += '<h4>' + esc(U.ricorda) + '</h4><ul>' + ST.fg.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>';
    h += '<div class="pulsanti"><button class="btn primo" data-az="scheda">' + esc(U.chiudi) + '</button>' +
      '<button class="btn mini" data-az="rigioca">' + esc(U.daCapo) + '</button></div></div>';
    var d = document.createElement('aside'); d.id = 'scheda'; d.className = 'scheda'; d.setAttribute('role', 'dialog'); d.innerHTML = h;
    app.appendChild(d);
  }
  function usa(i) {
    var x = ST.inv[i], v = cura(x); if (!v) return;
    var pr = ST.hp; ST.hp = Math.min(ST.hpMax, ST.hp + v); ST.inv.splice(i, 1);
    if (ST.combat) ST.combat.log.push(t('usato', { x: x, n: ST.hp - pr }));
    salva();
    var s = document.getElementById('scheda'); if (s) s.remove();
    ST._giu = true; paragrafo();
  }

  // ---------- comandi ----------
  app.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-az]') : null;
    if (!b || b.disabled) return;
    var az = b.getAttribute('data-az'), v = b.getAttribute('data-v');
    if (az === 'regole') { TIRI_REGOLE = null; regole(); }
    else if (az === 'riprendi') { ST = carica(); NOTE = []; if (ST) paragrafo(); else copertina(); }
    else if (az === 'caso') {
      var cb = [].slice.call(app.querySelectorAll('.dote input'));
      cb.forEach(function (c) { c.checked = false; c.disabled = false; });
      var idx = cb.map(function (c, i) { return i; });
      for (var i = idx.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = idx[i]; idx[i] = idx[j]; idx[j] = x; }
      idx.slice(0, 5).forEach(function (k) { cb[k].checked = true; });
      contaDoti();
    }
    else if (az === 'comincia') {
      var sc = [].slice.call(app.querySelectorAll('.dote input:checked')).map(function (c) { return B.doti[+c.value].n; });
      if (sc.length !== 5) return;
      ST = TIRI_REGOLE; ST.ab = sc.concat(B.fissa ? [B.fissa] : []); vai(1);
    }
    else if (az === 'vai') {
      var l = (K[ST.cur] || [])[+v]; if (!l) return;
      if (P[ST.cur].dec) ST.n++;
      if (/^⚓/.test(l.l)) ST.anc = 1;
      var pre = [];
      if (l.p) { for (var q = 0; q < ST.inv.length; q++) if (norm(ST.inv[q]) === norm(l.p)) { ST.inv.splice(q, 1); pre.push(['ogg', t('notaUsa', { x: l.p })]); break; } }
      if (!l.v || !P[l.v]) { fuori(); return; }
      vai(l.v, pre);
    }
    else if (az === 'prova') prova(v);
    else if (az === 'esito') { var p = ST.pend; if (!p) return; if (!p.v || !P[p.v]) { fuori(); return; } vai(p.v); }
    else if (az === 'zero') { var z = +v; ST.hp = Math.max(ST.hp, 0); if (P[z]) vai(z); else fuori(); }
    else if (az === 'round') round();
    else if (az === 'esitoScontro') { var d = +v; if (!d || !P[d]) { fuori(); return; } vai(d); }
    else if (az === 'usa') usa(+v);
    else if (az === 'scheda') scheda();
    else if (az === 'ricomincia') { var ab = ST ? ST.ab.concat(ST.persi) : []; ST = nuovo(ab); vai(1); }
    else if (az === 'rigioca') { cancella(); ST = null; var s2 = document.getElementById('scheda'); if (s2) s2.remove(); copertina(); }
  });
  app.addEventListener('change', function (e) { if (e.target.matches && e.target.matches('.dote input')) contaDoti(); });

  copertina();
})();
</script>
</body>
</html>
