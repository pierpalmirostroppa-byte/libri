// Motore delle demo giocabili dei librigiochi di Peter Palmer.
// fai_demo.js lo copia dentro ogni pagina, dopo «var BOOK = {...};». Niente onclick nel codice HTML: la politica di
// sicurezza della pagina lascia girare solo questo script, quindi i pulsanti hanno data-az e un solo ascoltatore.
(function () {
  'use strict';
  var B = BOOK, U = B.ui, P = B.par, K = B.links, MAX = B.max;
  var KEY = 'demo_' + B.slug + '_' + B.lang;
  var app = document.getElementById('app');
  var ST = null, NOTE = [], occupato = false;

  // ---------- utilità ----------
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function md(s) {
    return esc(s).replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[\s(«"“])\*([^*\n]+)\*(?=$|[\s).,;:!?»"”])/gm, '$1<i>$2</i>');
  }
  function paras(s) {
    return String(s || '').split(/\n+/).map(function (x) { return x.trim(); }).filter(Boolean)
      .map(function (x) { return '<p>' + md(x) + '</p>'; }).join('');
  }
  function t(k, o) { var s = U[k] || k; if (o) for (var x in o) s = s.split('{' + x + '}').join(o[x]); return s; }
  function d6() {
    try { var a = new Uint8Array(1); do { crypto.getRandomValues(a); } while (a[0] >= 252); return 1 + a[0] % 6; }
    catch (e) { return 1 + Math.floor(Math.random() * 6); }
  }
  function norm(s) { return String(s || '').replace(/✓/g, '').replace(/\s+/g, ' ').trim().toLowerCase(); }
  function re(k) { return new RegExp(B.re[k], 'iu'); }
  var RE = { ab: re('ab'), itPos: re('itPos'), itNeg: re('itNeg'), fgPos: re('fgPos'), fgNeg: re('fgNeg'), fgPre: re('fgPre'), vinci: re('vinci') };
  var lento = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  // ---------- dadi disegnati ----------
  var PUNTI = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
  function dado(v, cls) {
    var h = '<span class="dado' + (cls ? ' ' + cls : '') + '" aria-label="' + v + '">';
    for (var i = 1; i <= 9; i++) h += '<i' + (PUNTI[v].indexOf(i) >= 0 ? ' class="p"' : '') + '></i>';
    return h + '</span>';
  }
  function dadi(arr, cls) { return arr.map(function (v) { return dado(v, cls); }).join(''); }
  // fa rotolare i dadi dentro el, poi chiama fine()
  function rotola(el, n, fine) {
    if (!lento || !el) { fine(); return; }
    var k = 0;
    var iv = setInterval(function () {
      var a = []; for (var i = 0; i < n; i++) a.push(d6());
      el.innerHTML = dadi(a, 'gira');
      if (++k > 7) { clearInterval(iv); fine(); }
    }, 70);
  }

  // ---------- stato ----------
  function tira(v) { var r = { d: [], v: 0 }; if (typeof v === 'number') { r.v = v; return r; } for (var i = 0; i < v[0]; i++) r.d.push(d6()); r.v = v[1] + r.d.reduce(function (a, b) { return a + b; }, 0); return r; }
  function nuovo(ab) {
    var s = { cur: 1, n: 0, ab: ab || [], persi: [], inv: (B.zaino || []).slice(), fg: [], fatti: {}, combat: null, pend: null, fine: 0, anc: 0, tiri: {} };
    var V = B.valori;
    var f = tira(V.fz); s.fz = f.v; s.tiri.fz = f;
    var r = tira(V.hp); s.hp = s.hpMax = r.v; s.tiri.hp = r;
    if (V.agi) { var a = tira(V.agi); s.agi = a.v; s.tiri.agi = a; }
    return s;
  }
  function salva() { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} }
  function carica() { try { var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.cur && P[s.cur] && !s.fine) return s; } catch (e) {} return null; }
  function cancella() { try { localStorage.removeItem(KEY); } catch (e) {} }

  function haDote(n) { n = norm(n); return ST.ab.some(function (a) { return norm(a) === n; }); }
  function persa(n) { n = norm(n); return ST.persi.some(function (a) { return norm(a) === n; }); }
  function ruolo(r) { return !!(B.ruoli && B.ruoli[r] && haDote(B.ruoli[r])); }
  // oggetti: si confrontano senza articolo, e l'etichetta può continuare dopo il nome («Hai La corda spezzata: gliela leghi...»)
  function senzaArt(s) { return norm(s).replace(/^(?:(?:un|una|uno|il|lo|la|i|gli|le|a|an|the) |l['’])/, ''); }
  function haOgg(n) {
    n = senzaArt(n);
    return ST.inv.some(function (x) { x = senzaArt(x); return x === n || x.indexOf(n) === 0 || n.indexOf(x) === 0; });
  }
  function cura(n) { n = norm(n); for (var i = 0; i < B.cure.length; i++) if (n.indexOf(B.cure[i][0]) >= 0) return B.cure[i][1]; return 0; }
  // «il libro ricorda»: come nel giocabile del Tool Creator
  function fNorm(s) { return norm(s).replace(RE.fgPre, ''); }
  var NOTI = null;
  function noti() { if (!NOTI) { NOTI = {}; for (var k in P) if (P[k].f) NOTI[fNorm(P[k].f)] = 1; } return NOTI; }
  function cancello(lab) {
    var m = lab.match(RE.fgNeg);
    if (m) { var pos = fNorm(B.re.non + ' ' + m[1]); if (noti()[pos] && !noti()[fNorm(m[1])]) return { neg: false, f: pos }; return { neg: true, f: fNorm(m[1]) }; }
    m = lab.match(RE.fgPos);
    return m ? { neg: false, f: fNorm(m[1]) } : null;
  }
  function haFg(f) { return ST.fg.some(function (x) { var y = fNorm(x); return y === f || y.indexOf(f) >= 0 || f.indexOf(y) >= 0; }); }

  // ---------- schermate ----------
  function mostra(h, giu) { app.innerHTML = h; if (!giu) window.scrollTo(0, 0); }

  function copertina() {
    var sv = carica();
    var h = '<main class="copertina">' +
      '<h1 class="vh">' + esc(B.title) + '</h1>' +
      '<img class="cop" src="' + B.cover + '" alt="' + esc(t('copAlt', { t: B.title })) + '">' +
      '<p class="etichetta">' + esc(U.demo) + '</p>' +
      '<p class="sotto">' + esc(U.copTesto) + '</p>' +
      '<div class="pulsanti">';
    if (sv) h += '<button class="btn primo" data-az="riprendi">' + esc(t('riprendi', { n: sv.cur })) + '</button>';
    h += '<button class="btn' + (sv ? '' : ' primo') + '" data-az="regole">' + esc(sv ? U.nuova : U.gioca) + '</button>' +
      '</div><p class="firma">' + esc(B.author) + ' · Intrecci di Carta</p></main>';
    mostra(h);
  }

  var TIRI_REGOLE = null;
  function regole() {
    if (!TIRI_REGOLE) TIRI_REGOLE = nuovo([]);
    var s = TIRI_REGOLE, V = B.valori;
    var h = '<main class="foglio regole"><h2>' + esc(U.regoleTit) + '</h2>' + B.regole.map(function (r) { return '<p>' + md(r) + '</p>'; }).join('');
    h += '<h3>' + esc(U.valoriTit) + '</h3><p class="nota">' + esc(U.valoriNota) + '</p><div class="valori">';
    var riga = function (nome, x, piu) {
      return '<div class="valore"><span class="vnome">' + esc(nome) + '</span><span class="vdadi">' +
        (x.d.length ? dadi(x.d, 'piccolo') + ' <span class="piu">+ ' + piu + ' =</span>' : '') + '</span><b class="vnum">' + x.v + '</b></div>';
    };
    h += riga(U.forza, s.tiri.fz, typeof V.fz === 'number' ? 0 : V.fz[1]);
    h += riga(U.resistenza, s.tiri.hp, typeof V.hp === 'number' ? 0 : V.hp[1]);
    if (V.agi) h += riga(U.agilita, s.tiri.agi, V.agi[1]);
    h += '</div>';
    h += '<h3>' + esc(B.dotiTit) + '</h3><p class="nota">' + esc(U.dotiNota) + '</p><div class="doti">';
    B.doti.forEach(function (d, i) {
      h += '<label class="dote"><input type="checkbox" value="' + i + '"><span><b>' + esc(d.n) + '</b>' +
        (d.b ? ' <span class="bonus">(' + esc(d.b) + ')</span>' : '') + (d.d ? '<br><small>' + esc(d.d) + '</small>' : '') + '</span></label>';
    });
    h += '</div><div class="barra-doti"><span id="conta">' + esc(t('dotiConta', { n: 0 })) + '</span>' +
      '<button class="btn" data-az="caso">' + esc(U.caso) + '</button>' +
      '<button class="btn primo" id="via" data-az="comincia" disabled>' + esc(U.comincia) + '</button></div></main>';
    mostra(h);
  }
  function contaDoti() {
    var cb = [].slice.call(app.querySelectorAll('.dote input'));
    var n = cb.filter(function (c) { return c.checked; }).length;
    cb.forEach(function (c) { if (!c.checked) c.disabled = n >= 5; c.parentNode.classList.toggle('scelta', c.checked); });
    var e = document.getElementById('conta'); if (e) e.textContent = t('dotiConta', { n: n });
    var v = document.getElementById('via'); if (v) v.disabled = n !== 5;
  }

  function barra() {
    var pall = ''; for (var i = 0; i < MAX; i++) pall += '<i class="' + (i < ST.n ? 'usata' : '') + '"></i>';
    var r = ST.hp <= ST.hpMax / 3 ? ' basso' : '';
    return '<header class="barra" role="status"><span title="' + esc(U.forza) + '"><b>' + esc(U.fAbbr) + '</b> ' + ST.fz + '</span>' +
      '<span class="r' + r + '" title="' + esc(U.resistenza) + '"><b>' + esc(U.rAbbr) + '</b> ' + Math.max(0, ST.hp) + '/' + ST.hpMax + '</span>' +
      (ST.agi ? '<span title="' + esc(U.agilita) + '"><b>' + esc(U.aAbbr) + '</b> ' + ST.agi + '</span>' : '') +
      '<span class="palline" title="' + esc(t('scelteTit', { n: ST.n, m: MAX })) + '">' + pall + '</span>' +
      '<button class="btn mini" data-az="scheda">' + esc(U.scheda) + (ST.inv.length ? ' · ' + ST.inv.length : '') + '</button></header>';
  }

  // arrivo in un paragrafo: zaino, annotazioni, Resistenza (una volta per partita)
  function entra(id, pre) {
    ST.cur = id; ST.pend = null; ST.combat = null; NOTE = pre || [];
    var o = P[id] || {};
    if (ST.fatti[id]) return;
    ST.fatti[id] = 1;
    if (o.it && !haOgg(o.it)) { ST.inv.push(o.it); NOTE.push(['ogg', t('notaOgg', { x: o.it })]); }
    if (o.f && ST.fg.indexOf(o.f) < 0) { ST.fg.push(o.f); NOTE.push(['fg', t('notaFg', { x: o.f })]); }
    if (o.hh) { ST.hp = Math.ceil(ST.hpMax / 2); NOTE.push(['hp', t('notaMeta')]); }
    if (o.h) { var pr = ST.hp; ST.hp = Math.min(ST.hpMax, ST.hp + o.h); var dlt = ST.hp - pr; if (dlt || o.h < 0) NOTE.push([o.h < 0 ? 'male' : 'hp', t('notaHp', { n: (o.h < 0 ? '−' + (-o.h) : '+' + dlt) })]); }
    if (o.il) { for (var i = 0; i < ST.inv.length; i++) if (norm(ST.inv[i]) === norm(o.il)) { ST.inv.splice(i, 1); NOTE.push(['male', t('notaPerso', { x: o.il })]); break; } }
    if (o.al && !/^scegli$/i.test(o.al)) {
      for (var j = 0; j < ST.ab.length; j++) if (norm(ST.ab[j]) === norm(o.al)) { ST.persi.push(ST.ab[j]); ST.ab.splice(j, 1); NOTE.push(['male', t('notaDote', { x: o.al })]); break; }
    }
  }
  function vai(id, pre) { entra(id, pre); salva(); paragrafo(); }

  function collegamenti(id) { return (K[id] || []).filter(function (l) { return l.t === 'l'; }); }
  function eMorte(id) { return (K[id] || []).some(function (l) { return l.t === 'm'; }); }

  function paragrafo() {
    var id = ST.cur, o = P[id] || {};
    var h = barra() + '<main class="foglio par"><div class="num">§ ' + id + '</div>';
    if (typeof o.img === 'number') h += '<figure class="ill"><img src="' + B.img[o.img] + '" alt=""></figure>';
    if (o.e && o.ec && o.ee) h += '<p class="nemico">⚔️ ' + esc(o.e) + ' <small>(' + esc(U.forza) + ' ' + o.ec + ' · ' + esc(U.resistenza) + ' ' + o.ee + ')</small></p>';
    h += '<div class="testo">' + paras(o.t) + '</div>';
    if (NOTE.length) h += '<div class="note">' + NOTE.map(function (n) { return '<span class="nota-' + n[0] + '">' + esc(n[1]) + '</span>'; }).join('') + '</div>';
    h += '<div class="azioni">' + azioni(id, o) + '</div></main>';
    mostra(h, ST._giu); ST._giu = false;
  }

  function azioni(id, o) {
    var ls = collegamenti(id);
    if (eMorte(id)) { ST.fine = 2; cancella(); return morte(false); }
    if (ST.hp <= 0 && !ST.combat) {
      if (o.z && P[o.z]) return '<div class="riquadro"><p class="titolo-r">' + esc(U.zeroTit) + '</p><button class="btn primo" data-az="zero" data-v="' + o.z + '">' + esc(t('vaiA', { n: o.z })) + '</button></div>';
      if (B.zeroA && P[B.zeroA] && id !== B.zeroA) return '<div class="riquadro"><p class="titolo-r">' + esc(U.zeroTit) + '</p><button class="btn primo" data-az="zero" data-v="' + B.zeroA + '">' + esc(t('vaiA', { n: B.zeroA })) + '</button></div>';
      ST.fine = 2; cancella(); return morte(true);
    }
    if (ST.n >= MAX) { ST.fine = 1; cancella(); return pannello(false); }
    var vinci = ls.filter(function (l) { return /^⚔/.test(l.l) && l.v; })[0];
    if (o.e && o.ec > 0 && o.ee > 0 && vinci) return scontro(id, o, ls);
    if (ST.pend) return esito();
    var agi = ls.filter(function (l) { return /^🤸/.test(l.l); });
    var fort = ls.filter(function (l) { return /^🎲/.test(l.l); });
    var h = '';
    if (agi.length >= 2) h += '<button class="btn prova" data-az="prova" data-v="agi">🤸 ' + esc(U.agiProva) + ' · ' + esc(U.tira) + '</button>';
    else if (fort.length >= 2) h += '<button class="btn prova" data-az="prova" data-v="fort">🎲 ' + esc(U.fortProva) + ' · ' + esc(U.tira) + '</button>';
    var resto = ls.filter(function (l) { return !(agi.length >= 2 && /^🤸/.test(l.l)) && !(fort.length >= 2 && /^🎲/.test(l.l)); });
    // oggetti: «🎒 Hai X» e «🎒 Non ce l'hai»
    var serve = resto.map(function (l) { var m = l.l.match(RE.itPos); return m ? m[1] : null; }).filter(Boolean);
    var haAlmenoUno = serve.some(haOgg);
    var gemelliNeg = {}; resto.forEach(function (l) { var g = cancello(l.l); if (g && g.neg) gemelliNeg[g.f] = 1; });
    resto.forEach(function (l) {
      var lab = l.l, i = (K[id] || []).indexOf(l), m;
      if ((m = lab.match(RE.ab))) {
        if (persa(m[1])) return;
        if (!haDote(m[1])) { h += chiusa(lab, U.serveDote); return; }
      }
      if ((m = lab.match(RE.itPos))) { if (!haOgg(m[1])) { if (serve.length && resto.some(function (x) { return RE.itNeg.test(x.l); })) return; h += chiusa(lab, U.serveOgg); return; } }
      else if (RE.itNeg.test(lab)) { if (haAlmenoUno) return; }
      var g = cancello(lab);
      if (g && g.neg && haFg(g.f)) return;
      if (g && !g.neg && !haFg(g.f)) { if (gemelliNeg[g.f]) return; h += chiusa(lab, U.serveFg); return; }
      if (/^⚓/.test(lab) && ST.anc) { h += chiusa(lab, U.giaUsata); return; }
      h += '<button class="btn scelta" data-az="vai" data-v="' + i + '">' + esc(lab) + '</button>';
    });
    if (!h) h = '<p class="nota">' + esc(U.vicolo) + '</p>';
    return h;
  }
  function chiusa(lab, perche) { return '<button class="btn scelta chiusa" disabled>🔒 ' + esc(lab) + ' <small>' + esc(perche) + '</small></button>'; }

  // ---------- prove di agilità e colpi di fortuna ----------
  function rami(id, ico) {
    var ls = collegamenti(id).filter(function (l) { return l.l.indexOf(ico) === 0; });
    return ls.map(function (l) { return { v: l.v, lo: parseInt((l.l.match(/(\d+)/) || [0, '0'])[1], 10) || 0 }; })
      .sort(function (a, b) { return a.lo - b.lo; });
  }
  function prova(tipo) {
    var id = ST.cur, ico = tipo === 'agi' ? '🤸' : '🎲', br = rami(id, ico);
    var a = [d6(), d6()], s = a[0] + a[1], ok, dett;
    if (tipo === 'agi') {
      if (B.agilita === 'sotto') {
        var soglia = ST.agi + (ruolo('agilita') ? 1 : 0);
        ok = s === 12 ? true : s === 2 ? false : s <= soglia;
        dett = t('agiSotto', { s: soglia });
      } else { ok = s >= 7; dett = t('agiSopra'); }
    } else {
      var bon = ruolo('fortuna') ? 1 : 0;
      var corsa = !!(B.corsa && B.corsa.par.indexOf(id) >= 0 && haDote(B.corsa.dote));
      ok = s + bon >= (corsa ? 6 : 7); dett = t('fortDett') + (bon ? ' ' + t('fortBonus') : '') + (corsa ? ' ' + t('corsaBonus', { d: B.corsa.dote }) : '');
    }
    ST.pend = { tipo: tipo, d: a, s: s, ok: ok, dett: dett, v: ok ? br[br.length - 1].v : br[0].v };
    salva();
    var box = app.querySelector('.azioni'), io = ST;
    if (box) {
      box.innerHTML = '<div class="riquadro"><div class="dadi-grandi" id="rot"></div></div>';
      rotola(document.getElementById('rot'), 2, function () { if (ST === io && ST.pend && ST.cur === id && box.isConnected) box.innerHTML = esito(); });
    } else paragrafo();
  }
  function esito() {
    var p = ST.pend, agi = p.tipo === 'agi';
    var tit = agi ? '🤸 ' + U.agiProva : '🎲 ' + U.fortProva;
    var esiti = agi ? [U.agiOk, U.agiKo] : [U.fortOk, U.fortKo];
    return '<div class="riquadro"><p class="titolo-r">' + esc(tit) + '</p><p class="nota">' + esc(p.dett) + '</p>' +
      '<div class="dadi-grandi">' + dadi(p.d) + '<span class="somma">= ' + p.s + '</span></div>' +
      '<p class="esito ' + (p.ok ? 'ok' : 'ko') + '">' + esc(p.ok ? esiti[0] : esiti[1]) + '</p>' +
      '<button class="btn primo" data-az="esito">' + esc(t('vaiA', { n: p.v })) + '</button></div>';
  }

  // ---------- scontri ----------
  function scontro(id, o, ls) {
    if (!ST.combat || ST.combat.id !== id) ST.combat = { id: id, hp: o.ee, max: o.ee, log: [], fine: 0, ritiro: 0 };
    var c = ST.combat;
    var pf = ST.fz + (ruolo('forza') ? 1 : 0);
    var h = '<div class="riquadro scontro"><p class="titolo-r">⚔️ ' + esc(o.e) + '</p>' +
      barraVita(U.tu + ' · ' + U.fAbbr + ' ' + pf, ST.hp, ST.hpMax, 'io') +
      barraVita(o.e + ' · ' + U.fAbbr + ' ' + o.ec, c.hp, c.max, 'lui') +
      '<div class="dadi-grandi due" id="rot">' + (c.ultimo ? '<div class="tiro"><span class="chi">' + esc(U.tu) + '</span>' + dadi(c.ultimo[0]) + '</div><div class="tiro"><span class="chi">' + esc(o.e) + '</span>' + dadi(c.ultimo[1]) + '</div>' : '') + '</div>';
    if (c.log.length) h += '<div class="registro">' + c.log.slice(-4).map(function (l) { return '<p>' + esc(l) + '</p>'; }).join('') + '</div>';
    if (!c.fine) {
      if (!c.log.length) ls.forEach(function (l) { var m = l.l.match(RE.itPos); if (m && haOgg(m[1]) && l.v) h += '<button class="btn scelta" data-az="vai" data-v="' + (K[id] || []).indexOf(l) + '">' + esc(l.l) + '</button>'; });
      h += '<button class="btn primo" data-az="round">' + esc(U.attacca) + '</button>';
      ST.inv.forEach(function (x, i) { var v = cura(x); if (v && ST.hp < ST.hpMax) h += '<button class="btn" data-az="usa" data-v="' + i + '">' + esc(t('usaOgg', { x: x, n: v })) + '</button>'; });
    } else {
      var w = ls.filter(function (l) { return /^⚔/.test(l.l); });
      var vin = w.filter(function (l) { return RE.vinci.test(l.l); })[0] || w[0];
      var per = w.filter(function (l) { return l !== vin; })[0];
      if (c.fine === 1) h += '<p class="esito ok">' + esc(U.vinto) + '</p><button class="btn primo" data-az="esitoScontro" data-v="' + (vin ? vin.v : 0) + '">' + esc(t('vaiA', { n: vin ? vin.v : '' })) + '</button>';
      else if (per && per !== vin && per.v && P[per.v]) h += '<p class="esito ko">' + esc(U.perso) + '</p><button class="btn primo" data-az="esitoScontro" data-v="' + per.v + '">' + esc(t('vaiA', { n: per.v })) + '</button>';
      else { ST.fine = 2; cancella(); return h + '</div>' + morte(true); }
    }
    return h + '</div>';
  }
  function barraVita(nome, v, m, cls) {
    var pc = Math.max(0, Math.round(v / m * 100));
    return '<div class="vita"><span>' + esc(nome) + ' · ' + esc(U.rAbbr) + ' ' + Math.max(0, v) + '/' + m + '</span><div class="traccia"><div class="riemp ' + cls + ' w' + Math.round(pc / 5) * 5 + '"></div></div></div>';
  }
  function round() {
    var c = ST.combat; if (!c || c.fine || occupato) return;
    occupato = true;
    var o = P[c.id];
    var a = [d6(), d6()], b = [d6(), d6()], pr = a[0] + a[1], er = b[0] + b[1];
    if (B.lama && haDote(B.lama) && !c.lama && pr !== 12) {
      var lo = a[0] <= a[1] ? 0 : 1;
      if (a[lo] <= 2) { var vec = a[lo]; a[lo] = d6(); c.lama = 1; pr = a[0] + a[1]; c.log.push(t('lamaRiga', { x: vec, y: a[lo] })); }
    }
    var pa = pr + ST.fz + (ruolo('forza') ? 1 : 0), ea = er + o.ec - (ruolo('armatura') ? 1 : 0);
    var res = pr === 12 ? 'p' : pr === 2 ? 'e' : pa > ea ? 'p' : ea > pa ? 'e' : 't';
    if (res === 'p') c.hp -= 2; else if (res === 'e') ST.hp -= 2;
    var dopo = res === 'p' ? (pr === 12 ? U.dodici : U.colpisci) : res === 'e' ? (pr === 2 ? U.due : U.colpito) : U.pari;
    c.log.push(t('roundRiga', { a: pa, b: ea, n: o.e }) + ' ' + dopo); c.ultimo = [a, b];
    if (c.hp <= 0) c.fine = 1; else if (ST.hp <= 0) c.fine = 2;
    salva();
    var box = document.getElementById('rot'), io = ST;
    var dopo = function () { occupato = false; if (ST !== io || ST.combat !== c) return; var az = app.querySelector('.azioni'); if (az) az.innerHTML = azioni(ST.cur, P[ST.cur]); aggiornaBarra(); };
    if (box) rotola(box, 4, dopo); else dopo();
  }
  function aggiornaBarra() { var b = app.querySelector('.barra'); if (b) b.outerHTML = barra(); }

  // ---------- morte e fine della demo ----------
  function morte(perResistenza) {
    var tit = B.defeat || U.morteTit;
    return '<div class="riquadro morte"><p class="titolo-r">' + esc(tit) + '</p>' +
      (perResistenza ? '<p>' + esc(U.morteRes) + '</p>' : '') +
      '<p class="nota">' + esc(U.morteNota) + '</p>' +
      '<button class="btn primo" data-az="ricomincia">' + esc(U.ricomincia) + '</button></div>';
  }
  function pannello(fuori) {
    var h = '<div class="fine"><img class="cop-piccola" src="' + B.cover + '" alt="">' +
      '<p class="fine-sopra">' + esc(fuori ? U.fineFuori : U.fineSei) + '</p>' +
      '<h2>' + esc(U.fineTit) + '</h2><p>' + esc(B.fineTesto) + '</p><div class="compra">';
    B.negozi.forEach(function (n) {
      h += '<a class="btn primo" href="' + esc(n.url) + '" target="_top" rel="noopener">' + esc(n.f === 'ebook' ? U.ebook : n.f === 'scopri' ? U.scopri : U.cartaceo) +
        (n.dove ? ' <small>' + esc(n.dove) + '</small>' : '') + '</a>';
    });
    h += '</div><p class="sito"><a href="' + esc(B.sito) + '" target="_top">' + esc(U.sito) + '</a></p>' +
      '<button class="btn mini chiaro" data-az="rigioca">' + esc(U.rigioca) + '</button></div>';
    return h;
  }
  function fuori() {
    ST.fine = 1; cancella();
    mostra(barra() + '<main class="foglio par">' + pannello(true) + '</main>');
  }

  // ---------- scheda ----------
  function scheda() {
    var vecchia = document.getElementById('scheda'); if (vecchia) { vecchia.remove(); return; }
    var h = '<div class="scheda-dentro"><h3>' + esc(U.scheda) + '</h3>' +
      '<p><b>' + esc(U.forza) + '</b> ' + ST.fz + ' · <b>' + esc(U.resistenza) + '</b> ' + Math.max(0, ST.hp) + '/' + ST.hpMax +
      (ST.agi ? ' · <b>' + esc(U.agilita) + '</b> ' + ST.agi : '') + '</p>' +
      '<p class="nota">' + esc(t('scelteTit', { n: ST.n, m: MAX })) + '</p>' +
      '<h4>' + esc(U.doti) + '</h4><ul>' + ST.ab.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul>' +
      '<h4>' + esc(U.zaino) + '</h4>';
    h += ST.inv.length ? '<ul>' + ST.inv.map(function (x, i) {
      var v = cura(x);
      return '<li>' + esc(x) + (v && ST.hp < ST.hpMax ? ' <button class="btn mini" data-az="usa" data-v="' + i + '">' + esc(t('usa', { n: v })) + '</button>' : '') + '</li>';
    }).join('') + '</ul>' : '<p class="nota">' + esc(U.vuoto) + '</p>';
    if (ST.fg.length) h += '<h4>' + esc(U.ricorda) + '</h4><ul>' + ST.fg.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>';
    h += '<div class="pulsanti"><button class="btn primo" data-az="scheda">' + esc(U.chiudi) + '</button>' +
      '<button class="btn mini" data-az="rigioca">' + esc(U.daCapo) + '</button></div></div>';
    var d = document.createElement('aside'); d.id = 'scheda'; d.className = 'scheda'; d.setAttribute('role', 'dialog'); d.innerHTML = h;
    app.appendChild(d);
  }
  function usa(i) {
    var x = ST.inv[i], v = cura(x); if (!v) return;
    var pr = ST.hp; ST.hp = Math.min(ST.hpMax, ST.hp + v); ST.inv.splice(i, 1);
    if (ST.combat) ST.combat.log.push(t('usato', { x: x, n: ST.hp - pr }));
    salva();
    var s = document.getElementById('scheda'); if (s) s.remove();
    ST._giu = true; paragrafo();
  }

  // ---------- comandi ----------
  app.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-az]') : null;
    if (!b || b.disabled) return;
    var az = b.getAttribute('data-az'), v = b.getAttribute('data-v');
    if (az === 'regole') { TIRI_REGOLE = null; regole(); }
    else if (az === 'riprendi') { ST = carica(); NOTE = []; if (ST) paragrafo(); else copertina(); }
    else if (az === 'caso') {
      var cb = [].slice.call(app.querySelectorAll('.dote input'));
      cb.forEach(function (c) { c.checked = false; c.disabled = false; });
      var idx = cb.map(function (c, i) { return i; });
      for (var i = idx.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = idx[i]; idx[i] = idx[j]; idx[j] = x; }
      idx.slice(0, 5).forEach(function (k) { cb[k].checked = true; });
      contaDoti();
    }
    else if (az === 'comincia') {
      var sc = [].slice.call(app.querySelectorAll('.dote input:checked')).map(function (c) { return B.doti[+c.value].n; });
      if (sc.length !== 5) return;
      ST = TIRI_REGOLE; ST.ab = sc.concat(B.fissa ? [B.fissa] : []); vai(1);
    }
    else if (az === 'vai') {
      var l = (K[ST.cur] || [])[+v]; if (!l) return;
      if (P[ST.cur].dec) ST.n++;
      if (/^⚓/.test(l.l)) ST.anc = 1;
      var pre = [];
      if (l.p) { for (var q = 0; q < ST.inv.length; q++) if (norm(ST.inv[q]) === norm(l.p)) { ST.inv.splice(q, 1); pre.push(['ogg', t('notaUsa', { x: l.p })]); break; } }
      if (!l.v || !P[l.v]) { fuori(); return; }
      vai(l.v, pre);
    }
    else if (az === 'prova') prova(v);
    else if (az === 'esito') { var p = ST.pend; if (!p) return; if (!p.v || !P[p.v]) { fuori(); return; } vai(p.v); }
    else if (az === 'zero') { var z = +v; ST.hp = Math.max(ST.hp, 0); if (P[z]) vai(z); else fuori(); }
    else if (az === 'round') round();
    else if (az === 'esitoScontro') { var d = +v; if (!d || !P[d]) { fuori(); return; } vai(d); }
    else if (az === 'usa') usa(+v);
    else if (az === 'scheda') scheda();
    else if (az === 'ricomincia') { var ab = ST ? ST.ab.concat(ST.persi) : []; ST = nuovo(ab); vai(1); }
    else if (az === 'rigioca') { cancella(); ST = null; var s2 = document.getElementById('scheda'); if (s2) s2.remove(); copertina(); }
  });
  app.addEventListener('change', function (e) { if (e.target.matches && e.target.matches('.dote input')) contaDoti(); });

  copertina();
})();
</script>
</body>
