:root{--suoro:#1f1a10;--fondo:#29241f;--fondo2:#0f0e0d;--carta:#f2ede3;--inchiostro:#1c1a18;--accento:#8c3815;--oro:#e07a35;--rosso:#a3301c;--velo:rgba(140,56,21,.12)}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--inchiostro);
  background: var(--fondo2) linear-gradient(180deg, var(--fondo) 0%, var(--fondo2) 100%) fixed;
  font-family: 'EBG', 'EB Garamond', Garamond, 'Times New Roman', Georgia, serif; font-size: 19px; line-height: 1.6;
}
#app { max-width: 700px; margin: 0 auto; padding: 0 0 48px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; }
a { color: inherit; }
.btn {
  display: block; width: 100%; margin: 9px 0; padding: 11px 16px; border-radius: 6px; cursor: pointer;
  font-size: 18px; line-height: 1.35; text-align: center; text-decoration: none;
  background: transparent; color: var(--inchiostro); border: 1.5px solid var(--accento);
}
.btn:hover, .btn:focus-visible { background: var(--velo); }
.btn:focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; }
.btn.primo { background: var(--accento); color: var(--carta); border-color: var(--accento); font-weight: 600; }
.btn.primo:hover { filter: brightness(1.12); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.scelta { text-align: left; background: #fffdf7; }
.btn.scelta:hover { background: var(--velo); }
.btn.chiusa { opacity: .55; background: transparent; border-style: dashed; }
.btn.chiusa small { display: block; font-size: 15px; font-style: italic; }
.btn.prova { background: var(--oro); border-color: var(--oro); color: var(--suoro); font-weight: 600; }
.btn.mini { display: inline-block; width: auto; margin: 0; padding: 4px 12px; font-size: 16px; }
.btn.chiaro { color: var(--carta); border-color: var(--carta); margin-top: 14px; }
.copertina { text-align: center; padding: 22px 18px 10px; color: var(--carta); }
.cop { display: block; width: 100%; max-width: 420px; margin: 0 auto 14px; border-radius: 3px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.etichetta { margin: 6px 0 0; font-size: 15px; letter-spacing: .22em; text-transform: uppercase; color: var(--oro); font-weight: 600; }
.sotto { max-width: 440px; margin: 8px auto 14px; font-size: 19px; }
.copertina .pulsanti { max-width: 380px; margin: 0 auto; }
.copertina .btn { color: var(--carta); border-color: var(--carta); }
.copertina .btn.primo { background: var(--oro); border-color: var(--oro); color: var(--suoro); }
.firma { margin-top: 18px; font-size: 16px; letter-spacing: .08em; opacity: .9; }
.foglio {
  background: var(--carta); margin: 14px 10px 0; padding: 18px 20px 22px; border-radius: 4px;
  box-shadow: 0 6px 24px rgba(0,0,0,.35);
}
.foglio h2 { margin: 4px 0 10px; text-align: center; font-size: 27px; font-weight: 600; color: var(--accento); }
.foglio h3 { margin: 22px 0 4px; font-size: 21px; font-weight: 600; color: var(--accento); border-top: 1px solid var(--oro); padding-top: 14px; }
.nota { font-size: 16px; font-style: italic; margin: 4px 0 10px; }
.regole p { margin: 0 0 10px; }
.intro p { margin: 0 0 .8em; }
.intro h3 { font-size: 17px; letter-spacing: .12em; text-align: center; border-top: 0; padding-top: 0; margin: 22px 0 8px; }
.intro h3::after { content: ''; display: block; width: 36px; height: 2px; margin: 6px auto 0; background: var(--oro); }
.intro .btn { margin-top: 18px; }
.valori { display: grid; gap: 6px; }
.valore { display: grid; grid-template-columns: 1fr auto 2.2em; align-items: center; gap: 10px; padding: 6px 10px; background: #fffdf7; border-radius: 6px; border: 1px solid var(--velo); }
.vnome { font-weight: 600; }
.vdadi { display: flex; align-items: center; gap: 5px; }
.piu { font-size: 16px; }
.vnum { font-size: 24px; text-align: right; color: var(--accento); }
.doti { display: grid; gap: 6px; }
.dote { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--velo); background: #fffdf7; cursor: pointer; line-height: 1.35; }
.dote input { margin-top: 5px; width: 20px; height: 20px; accent-color: var(--accento); flex: none; }
.dote small { font-size: 15.5px; }
.dote .bonus { font-size: 15.5px; color: var(--accento); }
.dote.scelta { border-color: var(--accento); background: var(--velo); }
.barra-doti { position: sticky; bottom: 0; margin: 12px -20px -22px; padding: 10px 20px 14px; background: var(--carta); border-top: 1px solid var(--oro); display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; align-items: center; }
.barra-doti #conta { grid-column: 1 / -1; text-align: center; font-size: 16px; }
.barra {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 12px; background: var(--fondo2); color: var(--carta); font-size: 17px; border-bottom: 1px solid var(--oro);
}
.barra b { color: var(--oro); font-weight: 600; }
.barra .r.basso { color: #ffb3a6; }
.barra .btn.mini { margin-left: auto; color: var(--carta); border-color: var(--carta); }
.palline { display: inline-flex; gap: 4px; }
.palline i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--oro); }
.palline i.usata { background: var(--oro); }
.num { text-align: center; font-size: 26px; font-weight: 600; color: var(--accento); letter-spacing: .05em; }
.num::after { content: ''; display: block; width: 46px; height: 2px; margin: 6px auto 12px; background: var(--oro); }
.ill { margin: 0 -20px 14px; }
.ill img { display: block; width: 100%; height: auto; }
.testo p { margin: 0 0 .8em; }
.nemico { margin: 0 0 10px; padding: 6px 10px; border-left: 3px solid var(--rosso); background: #fffdf7; font-weight: 600; }
.nemico small { font-weight: 400; }
.note { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.note span { font-size: 16px; padding: 3px 10px; border-radius: 14px; border: 1px solid var(--accento); background: #fffdf7; }
.note .nota-male { border-color: var(--rosso); color: var(--rosso); }
.azioni { margin-top: 14px; border-top: 1px solid var(--oro); padding-top: 8px; }
.riquadro { margin: 10px 0; padding: 12px 14px; border: 1.5px solid var(--accento); border-radius: 8px; background: #fffdf7; }
.titolo-r { margin: 0 0 6px; text-align: center; font-weight: 600; font-size: 20px; color: var(--accento); letter-spacing: .03em; }
.esito { text-align: center; font-weight: 600; font-size: 21px; margin: 6px 0; }
.esito.ok { color: #2f6b3a; }
.esito.ko { color: var(--rosso); }
.dadi-grandi { display: flex; justify-content: center; align-items: center; gap: 8px; min-height: 58px; flex-wrap: wrap; margin: 6px 0; }
.somma { font-size: 24px; font-weight: 600; }
.chi { font-size: 15px; font-style: italic; }
.dadi-grandi.due { gap: 18px; align-items: flex-start; }
.tiro { display: grid; grid-template-columns: auto auto; gap: 4px 6px; justify-items: center; max-width: 46%; }
.tiro .chi { grid-column: 1 / -1; text-align: center; line-height: 1.2; }
.registro { font-size: 16px; border-top: 1px dashed var(--velo); margin-top: 6px; padding-top: 4px; }
.registro p { margin: 2px 0; }
.vita { margin: 6px 0; font-size: 16px; }
.traccia { height: 9px; background: var(--velo); border-radius: 5px; overflow: hidden; }
.riemp { height: 100%; border-radius: 5px; }
.riemp.io { background: var(--accento); }
.riemp.lui { background: var(--rosso); }
.morte { border-color: var(--rosso); text-align: center; }
.morte .titolo-r { color: var(--rosso); letter-spacing: .1em; }
.dado {
  display: inline-grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); width: 46px; height: 46px; padding: 6px;
  background: #fffef9; border: 2px solid var(--inchiostro); border-radius: 9px; box-shadow: 0 2px 0 rgba(0,0,0,.25);
}
.dado i { display: block; margin: auto; width: 8px; height: 8px; border-radius: 50%; }
.dado i.p { background: var(--inchiostro); }
.dado.piccolo { width: 30px; height: 30px; padding: 4px; border-width: 1.5px; border-radius: 6px; }
.dado.piccolo i { width: 5px; height: 5px; }
.dado.gira { transform: rotate(var(--g, 12deg)); }
.dado.gira:nth-child(2n) { --g: -14deg; }
.fine { text-align: center; background: var(--fondo); color: var(--carta); margin: 6px -20px -22px; padding: 22px 20px 24px; border-radius: 0 0 4px 4px; }
.cop-piccola { width: 150px; border-radius: 3px; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
.fine-sopra { margin: 12px 0 0; font-style: italic; }
.fine h2 { color: var(--oro); margin: 6px 0 8px; font-size: 26px; line-height: 1.2; }
.compra { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; max-width: 420px; margin: 10px auto 4px; }
.compra .btn.primo { background: var(--oro); border-color: var(--oro); color: var(--suoro); }
.compra small { display: block; font-size: 14px; font-weight: 400; }
.sito { margin: 10px 0 0; font-size: 18px; }
.sito a { color: var(--oro); }
.scheda { position: fixed; inset: 0; z-index: 20; background: rgba(10,12,16,.55); display: flex; justify-content: flex-end; }
.scheda-dentro { width: min(380px, 92vw); height: 100%; overflow-y: auto; background: var(--carta); padding: 16px 18px 24px; box-shadow: -6px 0 24px rgba(0,0,0,.4); }
.scheda h3 { margin: 0 0 8px; color: var(--accento); font-size: 24px; }
.scheda h4 { margin: 14px 0 4px; color: var(--accento); font-size: 18px; border-bottom: 1px solid var(--oro); }
.scheda ul { margin: 4px 0; padding-left: 20px; }
.scheda li { margin: 3px 0; }
.scheda .pulsanti { margin-top: 18px; display: grid; gap: 8px; }
.scheda .btn.mini { justify-self: center; }
@media (max-width: 420px) {
  body { font-size: 18px; }
  .foglio { margin: 10px 6px 0; padding: 14px 15px 18px; }
  .ill { margin: 0 -15px 12px; }
  .fine { margin: 6px -15px -18px; }
  .barra-doti { margin: 12px -15px -18px; padding: 10px 15px 12px; }
  .barra { gap: 9px; font-size: 16px; }

o la sera prima morde il doppio. E sai quale pietra si spacca e quale regge."},{"n":"Cuoio e finimenti","b":"−1 al tiro del nemico","d":"Cuci finimenti, giachi e scarpe, e i ritagli non li butti mai. Sotto il giaco che ti sei cucito, i colpi arrivano più piano."},{"n":"Neve e sci","b":"","d":"Sai leggere la neve e correrci sopra con due assi sotto i piedi. D'inverno arrivi sempre prima degli altri."},{"n":"Racconti del focolare","b":"+1 ai colpi di fortuna","d":"Sai tutte le storie di Vigdis, e sai quali gesti portano fortuna: mai lanciare una cote attraverso la stanza."},{"n":"Mantice","b":"","d":"Tieni il ritmo del mantice per giornate intere: due corti e uno lungo. Un fuoco risponde a chi gli parla piano."},{"n":"Tempra","b":"","d":"Sai quando immergere il ferro e in quale acqua: dolce, salata, d'olio. Un ferro temprato bene non si piega."},{"n":"Ferratura","b":"","d":"Hai ferrato ogni cavallo della valle, e i cavalli si fidano delle tue mani anche quando il mantice tace."},{"n":"Serrature","b":"","d":"Apri quello che altri hanno chiuso, e chiudi quello che deve restare chiuso. Nessuna serratura è muta per te."},{"n":"Nodi e catene","b":"","d":"Sai legare e sciogliere, e da un anello solo misuri una catena intera."},{"n":"Orecchio del ferro","b":"","d":"Batti un ferro e senti se dentro è crepato. Il ferro ti parla, e tu lo ascolti."},{"n":"Parola pronta","b":"","d":"Hai la risposta prima che l'altro finisca la domanda. Al mercato nessuno ti ha mai fregato."},{"n":"Mani che curano","b":"","d":"Sai fasciare una bruciatura e rimettere a posto un dito. In una fucina serve quanto il martello."}],"negozi":[{"f":"cartaceo","url":"https://www.amazon.it/dp/B0HRR4LH18","dove":"Amazon.it"},{"f":"ebook","url":"https://www.amazon.it/dp/B0HRSGMLQL","dove":"Kindle · Amazon.it"}],"sito":"https://intreccidicarta.com/libri/librigiochi.html#anche-il-ferro-pianse","re":{"ab":"^🧠 Se hai (.+)$","itPos":"^🎒 (?:Se )?hai (.+)$","itNeg":"^🎒 Non ","fgPos":"^🚩 Se (.+)$","fgNeg":"^🚩 Se non ( e.","lamaRiga":"Lama corta: ritiri il {x} e ti esce {y}.","corsaBonus":"(con {d} ti basta 6)","fissa":"{d} (di serie)","notaUsa":"🎒 Usi: {x}","vinto":"Hai vinto lo scontro.","perso":"Hai perso lo scontro.","zeroTit":"❤️ La tua Resistenza è arrivata a zero.","morteTit":"La tua storia finisce qui","morteRes":"La tua Resistenza è arrivata a zero.","morteNota":"Nella demo si ricomincia dal §1, con valori nuovi e le stesse doti.","ricomincia":"Ricomincia dal §1","fineSei":"Hai fatto le tue sei scelte.","fineFuori":"Questa strada porta oltre la demo.","fineTit":"La tua avventura continua nel libro","cartaceo":"Cartaceo","ebook":"Ebook","sito":"Tutti i librigiochi su intreccidicarta.com","rigioca":"Rigioca la demo","noscript":"Per giocare la demo serve JavaScript attivo nel browser.","descr":"Demo giocabile di {t}, librogioco di Peter Palmer: le prime pagine, da giocare nel browser.","titoloPagina":"{t} · Demo giocabile · Peter Palmer","scopri":"Scopri il libro","introTit":"Introduzione","continua":"Continua","vaiUno":"Vai al §1","inBorsa":"In borsa","restaUno":"❤️ Resistenza a zero: resti con 1"},"par":{"1":{"t":"Il colpo alla porta fa tremare la trave, e il chiodo che non sta mai giù scende di un dito.\n\nGunna ferma le gambe, che dondolavano giù dal ceppo. Kisa, nello scialle, alza la testa. Sull'incudine piccola il terzo ferretto è ancora rosso, e ai bordi comincia a farsi scuro.\n\nIl chiodo prima. Arnbjorn non apre mai la porta con un chiodo fuori posto sopra la testa, e tu hai imparato da lui. Sali sullo sgabello con il martello piccolo e lo ribatti come ti ha insegnato: «Tre colpi: uno per trovarlo, uno per piegarlo, uno per mandarlo a casa.» Al terzo il chiodo torna dentro il legno, e la trave smette di tremare.\n\nPoi apri.\n\nEntra prima il freddo, con una manciata di neve che si scioglie sulle pietre calde del pavimento. Sulla soglia, con la neve fino alle caviglie, c'è un vecchio con un cappello a falda larga tirato sulla fronte e un mantello blu scuro carico di neve. Ha un occhio solo; dove c'era l'altro c'è una piega chiusa, vecchia come la barba. La barba è grigia, lunga fino al petto, e i fiocchi ci restano impigliati senza sciogliersi.\n\nDietro di lui, legato all'anello del muro, sbuffa un cavallo grigio, più alto di ogni cavallo della valle, con il fiato che fuma nel buio. Conti le zampe. Poi le conti di nuovo, dal muso alla coda, piano, come si contano i chiodi rimasti in fondo a un sacco. Sono otto.\n\n«Ha un ferro che balla» dice il vecchio. «Davanti, a sinistra. La terza zampa.»\n\nLo dice senza fretta, e senza scusarsi dell'ora.\n\nGunna, sul ceppo, stringe Kisa e smette di respirare.\n\nArnbjorn dorme di là, oltre la parete di tronchi, e lo senti russare anche adesso. Il fuoco l'ha lasciato a te. Il suo detto però lo sai a memoria, perché lo ripete ogni volta che un contadino tira dentro una bestia: «Quando entra un cavallo, il mantice tace.» Un cavallo spaventato, in una fucina, è peggio di un incendio. E questo è il più grande che tu abbia mai visto sulla tua soglia.\n\nIl ferretto sull'incudine si raffredda. Se lo lasci lì, dovrai rimetterlo nel fuoco, e Gunna aspetta da quando è venuto buio. Il vecchio non ha detto che ha fretta. Non ha detto nemmeno che può aspettare.\n\nChi ha ferrato ogni cavallo della valle sa come si va incontro a una bestia così: piano, a mani basse, parlandole prima di toccarla, finché non è lei a decidere di fidarsi.","dec":1,"img":0},"4":{"t":"A tavola, la mattina, c'è quello che c'è. Una striscia di pesce secco a testa. È dura quanto una cinghia, e va tenuta in bocca finché cede. Il pane di Ragna, scuro, con dentro la corteccia di pino macinata che scricchiola sotto i denti. Il latte no: le vacche non ne fanno più da prima delle nevi, e dalla stalla si sentono muggire, per abitudine. Il tavolo sta contro la parete di tronchi, dove passa il tepore della forgia; dalla parte della porta il freddo sale dal pavimento dentro gli stivali.\n\nRagna ti prende la mano per metterci dentro la tua parte di pesce, e si ferma sul segno bianco che hai nel palmo, quello di sempre. «Ti sei preso quel ferro in mano che avevi due inverni. Neanche un lamento.» Poi ti chiude le dita sul pesce e passa a Gunna, che è arrivata all'alba con la neve fino alle ginocchia per far vedere a tutti Kisa con i quattro ferretti nuovi, finiti prima che tu andassi a dormire.\n\nLa gatta salta sul tavolo e cammina tra le scodelle, tic tic tic, come una capra sul selciato. Alza ogni zampa più del bisogno, e la scuote prima di posarla. Gunna ride tanto che le va di traverso il boccone. Ragna solleva Kisa per la collottola e la posa per terra, senza smettere di servire.\n\nArnbjorn ha trovato la moneta d'argento sul banco della bottega e l'ha morsa due volte. «È buona» dice, contento. Allunga la mano verso la ciotola di legno in mezzo al tavolo. «Il sale?»\n\n«Finito» dice Ragna. «Da tre giorni.»\n\nArnbjorn guarda la ciotola vuota, poi la moneta, e se la rimette in tasca brontolando che l'argento non si mangia.\n\nFuori le travi schioccano per il gelo, e il fumo dei tetti sale dritto: non c'è un filo di vento. Contro il muro la neve è arrivata al davanzale. Dalla finestra la luce entra grigia, e pare già stanca. Nel secchio accanto alla porta l'acqua ha fatto il ghiaccio durante la notte, e Ragna lo rompe con il manico del mestolo, due colpi.\n\nQuando ti alzi, Ragna ti mette in mano una cosa piatta e dura, avvolta in un pezzo di tela. È la sua schiacciata d'orzo, quella delle giornate lunghe, con l'orzo contato a manciate. Attraverso la tela senti l'orlo cotto duro, e nel mezzo l'impronta delle sue nocche.\n\n«Per dopo» dice. «Non per adesso.»\n\nArnbjorn è già sulla porta, con il grembiule di cuoio sulla spalla. Vede la tela che hai in mano e la riconosce da lontano. «La schiacciata d'orzo di Ragna» dice. «E a me niente?»\n\nRagna non si volta nemmeno. Lui ride, e fischia due volte per chiamarti, come ogni mattina.","it":"Schiacciata d'orzo di Ragna, reliquia"},"5":{"t":"Prendi l'ascia e la cali di taglio sulla testa, forte, come su un ciocco. Nel colpo metti le spalle e le ginocchia.\n\nLa lama non entra. Scivola sul pelo bagnato senza fare presa, e ti torna indietro nelle mani con uno strattone che ti arriva alle spalle. Sotto il filo non ha ceduto niente, né il pelo né quello che il pelo copre. La testa di foca non fa un verso. Sale.\n\nSale di una spanna, spingendo le assi da sotto, finché non esce anche il collo, grosso e liscio, con la pelle che fa le pieghe come un otre pieno d'acqua. Due chiodi del pavimento saltano via e rotolano fino ai tuoi stivali. Resta lì, alla nuova altezza, e continua a guardare il fuoco. Non te. Il fuoco.\n\nGuardi la lama. Sul filo c'è un'intaccatura nuova, lucida, di quelle che fa una pietra nascosta dentro un ceppo. Dove l'hai colpita, la testa non ha nemmeno un segno: il pelo è liscio, bagnato, intatto. Di tutto il colpo le è rimasta una spanna in più fuori dal pavimento.\n\nLungo la parete la gente di casa si stringe ancora di più. Una lucerna trema, e l'ombra della foca trema con lei sul muro, fino alle travi. Uno degli uomini ha smesso di pregare e tiene la sua alta sopra la testa, con il braccio che non sta fermo. Dalla fessura sale un freddo umido che ti bagna le caviglie attraverso le brache, e un odore di fiordo con la bassa marea. Sotto le assi la risacca batte più forte.\n\nHai ancora l'ascia in mano, e il manico è buono: frassino stagionato, senza una crepa. Potresti colpire di nuovo, più forte, dove il collo si attacca alla testa. Lì il collo è largo due volte la lama, e le pieghe si muovono a ogni suo respiro. Lo zaino è sempre lì, ai tuoi piedi, con il martello dentro, avvolto nel suo cuoio."},"6":{"t":"Le prendi la mano tra le tue, e ti ricordi subito che non serve: sono fredde, lo sono sempre, anche davanti alla forgia. La sua pesa più di una mano, dura e liscia, e le dita restano dove le metti. Allora fai come si fa in bottega con le bruciature. Ti fai dare una ciotola d'acqua dal paiolo e te la tieni contro il petto, sotto la lana, finché non è tiepida, non di più: da quel fuoco non c'è da aspettarsi niente. La provi con il gomito, perché delle tue dita non ti fidi. Ci metti dentro la mano di Aud, e ce la tieni. L'acqua le arriva sopra il polso, dove il bianco finisce.\n\nAll'inizio lei non sente niente. Quando comincia a farle male, stringe i denti; è buon segno, e glielo dici. Una delle donne della casa ti posa accanto un rotolo di lana e torna alla sua panca. Quando la pelle torna rosa ai bordi, gliela asciughi senza strofinare, la ungi con un velo di grasso e la avvolgi in una striscia di lana pulita, dito per dito. Il grasso è quello di foca delle lucerne, e puzza; Aud non ci fa caso. I giri li fai stretti quanto basta e non di più: una fascia troppo stretta fa peggio della bruciatura, te l'ha insegnato Arnbjorn il primo inverno in bottega.\n\nAud si guarda la mano fasciata e, senza che tu le chieda niente, comincia a parlare.\n\n«Il padrone di questa casa si chiamava Hallgrim» dice. «Mio marito. Non ha mai lasciato una rete in mare di notte, tranne quella volta.» Si ferma, e ricomincia. «Il rematore più vecchio era Kolbein. L'altro era Sturla. Aveva diciassette inverni, e cantava mentre remava. Adesso lo sai anche tu.»\n\nRimette la mano in grembo e la copre con l'altra, come si tiene al riparo una cosa che non si vuole perdere.\n\nDal buco del fumo la luce se n'è andata, e in fondo alla stanza la tenda di pelle della cucina è una macchia più scura della parete.\n\n*Scrivi nella colonna NOMI: Hallgrim, Kolbein, Sturla.*"},"9":{"t":"In bottega il fuoco ha già preso colore. Arnbjorn batte la lama di una zappa rotta, e tu stai al mantice: due corti e uno lungo, due corti e uno lungo, finché la brace non passa dal rosso all'arancio, e dall'arancio al giallo. A ogni colpo del martello le scaglie di scoria saltano dall'incudine e si spengono per terra. Il caldo arriva fino a metà della stanza lunga; verso le due porte il gelo tiene ancora bianchi i cardini.\n\nAl terzo colpo lungo la pelle di capra cede. Si apre lungo una vecchia cucitura, da una toppa all'altra, con il rumore di un fiato che scappa, e il fuoco si abbassa. Dallo strappo esce un soffio di cenere calda che ti arriva in faccia, e l'odore della pelle vecchia scaldata, un po' capra e un po' cuoio bruciacchiato.\n\nFai per fermarti. Arnbjorn no. Ha già in mano la lesina e due aghi, e la stringa di cuoio tra i denti. Se la toglie di bocca soltanto per dirti la regola:\n\n«Non fermi il fuoco. Ricuci la pelle mentre il mantice lavora, con il punto del sellaio.»\n\nTu tieni il mantice a colpi corti, con la pelle aperta che soffia mezza aria di fianco, e lui cuce. Due aghi nello stesso buco, uno da una parte e uno dall'altra, e la stringa tirata a ogni punto. Segue il tuo ritmo senza guardarlo, si abbassa quando il mantice scende e si alza quando sale. A ogni punto la pelle tiene un poco di più, e il fuoco torna su. Quando fa il nodo, la brace è di nuovo gialla.\n\n«Il fuoco non aspetta il sellaio» dice Arnbjorn, contento, e ride fino a tossire.\n\nA metà giornata arriva un uomo di una fattoria in cima alla valle, così lontana che da due inverni non scende al villaggio. Ha il ghiaccio nella barba e le brache fasciate di stracci fino al ginocchio, e dalla soglia guarda il fuoco prima di entrare. Sulla slitta ha un pezzo di ferro lungo come un braccio, grigio e bitorzoluto, e ne vuole un vomere.\n\nArnbjorn non lo mette nel fuoco. Lo gira sull'incudine, lo soppesa, poi prende la lima e gliela passa sullo spigolo, una volta sola, piano. La lima stride, un suono aspro che allega i denti. Arnbjorn guarda la limatura che cade, la stringe tra le dita, la annusa.\n\n«Che cos'è davvero questo?» dice, a nessuno.\n\nLa limatura è scura e si sbriciola. «Ferro di palude» dice poi all'uomo. «Pieno di scoria. Se lo batti freddo si apre come una pagnotta. Lo scaldo piano, e ci vuole il doppio.»\n\nL'uomo borbotta. Poi paga il doppio, e resta.\n\nArnbjorn infila il ferro di palude nel fuoco, dalla parte dove la brace è più bassa, e tu torni al mantice. Alla porta la luce ha già cominciato a calare."},"10":{"t":"Ti alzi e vai al tavolo. Prendi la catena per un capo e la sollevi, anello dopo anello, fino a tenerla tutta sospesa davanti alla sala, e la giri alla luce del fuoco. È fredda, unta di grasso vecchio, e ti lascia sulle dita un nero che non viene via. Sotto c'è un odore di stalla, strame e bestia. Dalle panche si sporgono, e chi sta in piedi lungo le pareti allunga il collo sopra le teste.\n\nGli anelli sono larghi e lisci dentro, consumati tutti dalla stessa parte: una bestia pesante l'ha tirata per molti inverni, sempre nello stesso verso. Le giunture sono state saldate a caldo da un fabbro che sapeva il suo mestiere, ma è lavoro vecchio, e il ferro ha preso il colore scuro delle cose che nessuno usa più. Sul primo anello c'è ancora il segno del perno di una mangiatoia.\n\n«Questa è la catena del toro di tuo nonno, Thorvald» dici. «Quello nero, che sfondava i recinti. Guarda come sono consumati.»\n\nThorvald diventa rosso sopra la barba, e non risponde. Lungo la parete un vecchio apre le mani alla larghezza di due corna, e il vicino gliele allarga ancora di una spanna.\n\nTi volti verso Bersi e gli tendi un anello. Lui non ha paura: ci infila la mano, poi il polso, e la tira fuori dall'altra parte senza nemmeno toccare il ferro, serio, come uno che prova una manica.\n\n«Un bambino ci passa attraverso» dici. «Con questa non tenete nemmeno una capra piccola.»\n\nNella sala qualcuno ride, poi smette. Le donne dei telai si guardano. Thorvald prende l'ultimo anello tra le dita e lo rigira, e ci mette un po' a posarlo. Tu lasci scendere il resto sul tavolo, un giro alla volta, senza farlo battere.\n\nArnbjorn, dal suo posto, gonfia il petto e tace, che per lui è moltissimo.\n\n*Annota sulla scheda, nella colonna FATTI: «HAI DIFESO IL BAMBINO».*","f":"HAI DIFESO IL BAMBINO"},"14":{"t":"Thorvald ripete le sue parole, più forte, perché le senta anche chi sta sulla porta: «Una cosa che sia nostra, e che ci costi.»\n\n«Allora dategli il sale» dici. Lo dici da seduto, prima che Thorvald abbia richiuso la bocca.\n\nNella sala si voltano.\n\n«È nostro» dici. «Ci è costato caro. E sono tre giorni che nessuno riesce a trovarlo: almeno gli dèi lo troveranno.»\n\nIl primo a ridere è un ragazzo vicino alla porta. Poi una delle vecchie, con la mano sulla bocca. Ride tutta la sala, a ondate: le donne dei telai, gli uomini con le braccia incrociate, perfino quelli che il sale non l'hanno visto nemmeno prima della fame. La risata passa da una panca all'altra come il calore in un ferro tenuto per un capo, senza che nessuno la spinga. La panca sotto di te trema per le risate dei vicini; qualcuno batte il pugno sul ginocchio, e una lucerna, sul davanzale, oscilla tanto che la fiamma quasi si spegne. Arnbjorn ride fino a tossire e deve sedersi. Thorvald nasconde la bocca nella barba, ma le spalle gli ballano. Qualche risata arriva in ritardo, dal fondo, e si smorza da sola; la fiamma della lucerna torna dritta.\n\nA Holt si dice che chi ride non vota, ed è vero: quando la risata finisce, nessuno ha più voglia di ricominciare con i nomi. La vecchia che aveva tirato in ballo il figlio della tessitrice si guarda intorno, si asciuga gli angoli della bocca con lo scialle, e non ci torna sopra.\n\nBersi non ha riso. Ti guarda da sopra la spalla della tessitrice, serio, con la faccia di chi ha visto fare un gioco che non conosce.\n\nThorvald si ricompone la barba con due dita e prende la catena dal tavolo. Gli anelli gli scivolano tra le mani con un rumore lungo, e nessuno ci bada più.\n\n*Annota sulla scheda, nella colonna FATTI: «HAI DIFESO IL BAMBINO».*","f":"HAI DIFESO IL BAMBINO"},"15":{"t":"«Se ne serve uno» dici. «Vado io.»\n\nLo dici prima di pensarci, e quando l'hai detto non lo puoi più riprendere. La sala si ferma. Una panca smette di scricchiolare a metà. Vicino alla porta a qualcuno cade un guanto di lana, e nessuno si china a raccoglierlo. Bersi stacca gli occhi dalla catena e guarda te.\n\nArnbjorn si alza con un ruggito che fa saltare la cenere nel focolare.\n\n«Il mio apprendista non lo offre nessuno, nemmeno lui.»\n\nHa la faccia del colore di un ferro pronto per il martello, e la barba bruciacchiata che gli trema. Pianta il pugno sul tavolo, accanto alla catena, che salta, e gli anelli ti suonano nei denti.\n\n«Chi vi ferra i cavalli, dopo? Chi vi rimette in piedi le zappe, gli assi dei carri, le catene dei secchi? Io, con queste braccia?» Si batte il petto. «Tre inverni che l'orzo si conta a manciate, e voi volete dare via le mani che ci restano.»\n\nSulle panche gli uomini si guardano gli stivali: più d'uno ha in bottega una zappa che aspetta.\n\nThorvald alza le mani aperte, come chi dice che nessuno ha ancora deciso niente. Arnbjorn non si risiede. Resta in piedi accanto a te, con il petto che va su e giù e il fiato che gli fuma nella barba, e ti stringe la spalla con la sua mano pesante, senza guardarti. Sa di carbone e del cuoio del grembiule. Il palmo è caldo attraverso la camicia, e i calli ti grattano a ogni respiro che prende.\n\nBersi, dietro, è ancora accanto alla tessitrice. Di lui non parla più nessuno. Lei gli ha tirato il cappuccio sulla fronte, fino agli occhi, e lui lo rialza con un dito per vedere.\n\n*Annota sulla scheda, nella colonna FATTI: «HAI DIFESO IL BAMBINO».*","f":"HAI DIFESO IL BAMBINO"},"23":{"t":"Vigdis aspetta che i bambini si calmino, poi ne racconta un'altra, l'ultima della sera, quella dei pescatori.\n\nC'era un pescatore della costa di fuori che la nebbia portò lontano, dove non era mai stato. Trovò un'isola bassa, coperta d'erica, e ci tirò su la barca per passare la notte. Era un'isola strana. Gli uccelli ci giravano sopra e non si posavano mai: facevano un giro largo e tornavano al mare. E il mare intorno saliva e scendeva troppo piano, non come la marea che conosceva lui.\n\n«Non aveva fuoco, quella notte: l'acciarino era bagnato. Dormì al freddo. Al mattino l'isola non c'era più, e lui era nella sua barca.»\n\nVigdis lascia passare un respiro, perché i bambini hanno la bocca aperta. «E sua moglie non gli credette mai» dice.\n\nRidono tutti, e la sala comincia a svuotarsi. Le madri avvolgono i piccoli nei mantelli, i vecchi si alzano tenendosi la schiena, e Gunna se ne va con Kisa infilata sotto lo scialle fino alle orecchie.\n\nFuori la neve è così dura che gli stivali non ci lasciano l'orma. Il cielo è pieno di stelle, e il fiato ti fa la brina sul bavero prima che tu arrivi alla fucina.\n\nIn bottega il ferro della giornata ticchetta ancora, raffreddandosi nel buio. Arnbjorn fa quello che fa ogni sera prima di dormire. Prende la paletta, raccoglie la brace in un mucchio al centro della forgia e la copre di cenere finché non si vede più un filo di rosso.\n\n«La brace si copre, non si accende» dice, e appende la paletta al suo gancio.\n\nRagna ha già spento la lucerna. Ti stendi sul tuo pagliericcio accanto alla forgia, dove il pavimento resta tiepido tutta la notte, e tiri la coperta fino al mento. Sa di carbone di betulla. Dalla stalla una vacca muggisce una volta, e poi tace. Il sonno arriva subito.\n\nA notte fonda ti svegliano le pecore.\n\nBelano tutte insieme, dall'ovile di Thorvald, in fondo al villaggio: un belato fitto, spaventato, che sale e non smette. Poi, sopra i belati, un ululato lungo. E un altro, più vicino, che gli risponde. Un terzo viene dalla parte del bosco, basso, e si interrompe a metà; quando riprende è già più vicino all'ovile.\n\nSotto i belati c'è un colpo sordo che torna, legno contro pietra: i pali del recinto, provati uno dopo l'altro. A Holt i lupi scendono fino alle case soltanto negli inverni in cui il bosco non ha più niente da dare, e allora vengono in branco, magri, e una voce d'uomo non basta a mandarli via.\n\nDi là dalla parete, Arnbjorn russa. Hai ancora la coperta fino al mento, e lungo la schiena il tiepido del pavimento. Il martello è dove l'hai lasciato, appoggiato all'incudine: nel buio ne distingui il manico, a tre passi dal pagliericcio.","dec":1},"25":{"t":"Le gambe non reggono più. Te ne accorgi tardi, quando la neve pestata dell'ovile ti arriva contro la guancia, e il martello ti scivola via dalle dita.\n\nProvi a riprenderlo. Il manico è lì, a una spanna, scuro sulla neve, e la mano non ci arriva.\n\nSenti le pecore contro il muro, il loro belato stretto, tutte insieme. Senti il fiato dei lupi, vicino, caldo nell'aria gelata, e le zampe che ti girano intorno, piano, come giravano intorno al recinto. Sopra i pali che cedono il cielo è grigio, del colore della luce prima dell'alba.\n\nPoi il belato si fa lontano, e lontano anche il fiato. Poi più niente.\n\n*La tua storia finisce qui. Ricomincia dal paragrafo 1.*"},"26":{"t":"«Aiutatemi!» gridi alla gente di casa. «Prendete qualcosa! Un remo, un forcone, quello che c'è!»\n\nPrendono la porta. Il primo a staccarsi dalla parete è quello più vicino alla tenda. Escono dalla cucina uno dietro l'altro, con le lucerne che dondolano e spargono ombre dappertutto, urtano la tenda di pelle, attraversano la casa, e li senti spalancare la porta di fuori e correre nella neve, gridando, verso la stalla. Una delle donne ha posato la sua lucerna sulle assi, e l'ha lasciata lì.\n\nLa testa di foca li guarda andare. È l'unica volta che toglie gli occhi dal fuoco. Mentre loro scappano, lei sale di una spanna e poi di un'altra, finché non escono dal pavimento il collo e il principio delle spalle. Le assi le si aprono intorno con un gemito di chiodi tirati. Il collo viene fuori senza sforzo, con l'acqua che le scola lungo il pelo.\n\nRiporta gli occhi sul fuoco.\n\nDalla porta rimasta aperta entra il vento del fiordo, e porta dentro la neve e le voci, sempre più lontane. Poi non porta più voci. Il fumo del focolare si corica e ti viene in faccia. Resta la tenda di pelle, che dondola ancora per il loro passaggio, sempre meno, finché si ferma.\n\nIn cucina è rimasta una lucerna sola, posata per terra, con la fiamma che si piega. Ci sei tu, e c'è la foca, e la risacca che batte sotto le assi. Il pelo della bestia luccica di un nero umido; i baffi gocciolano, e le gocce, cadendo sul legno, fanno lo stesso colpo piccolo della ciotola di prima. Da vicino la senti respirare: un fiato lento, che ti arriva freddo sulle ginocchia.\n\nDalla stalla non viene più nessun rumore. L'ascia è accanto alla catasta, con la lama che luccica alla lucerna. È un'ascia da legna, con la lama larga una spanna: il collo che hai davanti ne fa tre. Il martello è nello zaino, ai tuoi piedi, e il cuoio che lo avvolge è ancora annodato."},"27":{"t":"Prendi il bastone del focolare, lungo e annerito in punta, e colpisci la testa di foca con tutto il peso delle spalle, come si batte la lana sulla pietra.\n\nIl bastone rimbalza. Il colpo ti torna nei polsi, e la testa sale.\n\nSale di due spanne, tutte in una volta, con un rumore di legno che si piega. Escono dal pavimento il collo e le spalle, lucide e nere, larghe quanto quelle di un uomo, e le assi intorno si alzano a gobba, schiodate, con i chiodi che spuntano storti. Sotto il pelo le spalle lavorano, una e poi l'altra, contro il bordo delle assi. Dalle fessure viene su l'odore del fondo del mare, di alghe marce e di sassi bagnati, e un freddo che ti prende le caviglie attraverso il cuoio degli stivali. Viene su anche l'acqua, nera, a filo delle assi: corre lungo le commessure, lenta, senza rumore, e arriva fino alla soglia, sotto la tenda di pelle, dove si ferma e luccica alla luce delle lucerne. Dove metti il piede, l'asse cede e ne spreme fuori dell'altra. La risacca è salita con lei: adesso batte sotto le tue suole.\n\nLa foca non si volta verso di te. Tiene gli occhi sul fuoco, e il colpo non l'ha fatta nemmeno sbattere le palpebre. Sul pelo, dove il bastone l'ha presa, non c'è un segno; sul legno, invece, c'è una striscia bagnata che puzza di alghe. Nel focolare un ciocco si spacca e cade in avanti, e la foca segue le scintille con gli occhi, e basta.\n\nUna delle donne della casa scappa verso la tenda, mette un piede nell'acqua e lo ritira, poi torna alla parete. Un uomo le prende il polso e non lo lascia più. Le lucerne tremano tutte insieme, e le ombre sulle travi con loro. Hai le mani nere di fuliggine fino ai polsi.\n\nIl bastone ti si è crepato in mano, lungo la venatura, dall'impugnatura fin quasi alla punta: un altro colpo così e si apre in due. Nella crepa, sotto il pollice, ci entra l'unghia. Ma per adesso regge. Il martello è nello zaino, ai tuoi piedi, avvolto nel cuoio, con il manico che conosci a memoria.\n\nVigdis, certe sere d'inverno, racconta di una foca che saliva dal pavimento di una cucina, in una fattoria di annegati. Chi ha ascoltato quella storia fino in fondo sa come va a finire, e il bastone lo poserebbe subito."},"30":{"t":"I belati ti guidano di corsa fino in fondo al villaggio, sulla neve dura della strada, con il martello nel pugno.\n\nL'ovile di Thorvald è un recinto di pietre a secco con un tetto di zolle su un lato, e dalla parte del bosco i pali stanno cedendo. Dentro, le pecore sono ammucchiate contro il muro, una sull'altra, con il fiato che fuma.\n\nFuori, sulla neve pestata, ci sono i lupi dell'ovile. Tre, magri da contargli le costole, grigi come la luce prima dell'alba. Hanno smesso di ululare. Uno si ferma a guardarti; gli altri due girano intorno al recinto, cercando il palo che cede. Tengono la testa più bassa delle spalle, e le unghie raschiano la crosta gelata. Uno dei due appoggia il fianco a un palo, e il palo geme nella sua buca. Il primo non ringhia: guarda il martello, e subito dopo le tue gambe.\n\nIl martello da forgia è fatto per cadere dall'alto, su un ferro che aspetta. Quando vengono, vengono insieme: uno basso, alle gambe, e uno alla manica, e mai dove guardi tu. Stringi il manico e pianti i piedi nella neve.","e":"I lupi dell'ovile","ec":6,"ee":6,"img":1},"31":{"t":"Ti alzi, e la voce ti esce prima delle parole.\n\n«Bersi non è dei troll» dici. È tutto quello che hai pronto. Le altre parole arrivano dopo, una per volta, storte, come chiodi tirati fuori da un sacco al buio. «È un bambino. Guarda le cose. Non è una colpa, guardare. E ha cinque inverni: a cinque inverni non si sceglie niente, nemmeno da chi farsi scambiare.»\n\nParli alla catena, perché le facce sono troppe: le vedi di sbieco, chiare nel poco fuoco, girate tutte dalla tua parte. La voce va a sbattere contro le travi e ti torna addosso più grossa. Lungo le pareti hanno smesso di battere gli stivali per scaldarsi. Nessuno ride. Qualcuno, in fondo, abbassa gli occhi sul pavimento. La vecchia che ha fatto il nome del figlio della tessitrice si stringe lo scialle sul petto e guarda altrove; le dita nodose non trovano l'orlo della lana al primo colpo.\n\nNon sei abituato a parlare davanti a tanta gente. Con il ferro sì: il ferro ti lascia finire, e se hai sbagliato te lo dice con il suono, subito, senza offendersi. Qui, quando smetti, resta la sala zitta, con il fuoco piccolo che schiocca e il fiato di tutti che fuma sotto il tetto, e tu non sai se hai detto troppo o troppo poco. Sotto la camicia la schiena ti si è bagnata, e il freddo della porta la trova subito. Ti rimetti a sedere con le mani tra le ginocchia. La panca è ancora tiepida del posto che hai lasciato.\n\nBersi ti guarda. Non sorride e non fa niente; ha gli stessi occhi con cui guardava la catena, senza paura. La tessitrice gli stringe la spalla. Il cappuccio troppo grande gli scende storto da quella parte, e lui lo lascia stare.\n\nThorvald si liscia la barba e non dice né sì né no. Con l'altra mano tiene ferma la catena sul tavolo, per l'anello di capo.\n\n*Annota sulla scheda, nella colonna FATTI: «HAI DIFESO IL BAMBINO».*","f":"HAI DIFESO IL BAMBINO"},"35":{"t":"All'alba, con il cielo ancora del colore della cenere, una slitta si ferma davanti alla fucina. La tira un cavallino peloso, bianco di brina fino agli occhi. Gli fumano i fianchi, e tiene la testa bassa, da bestia che tira da quando era notte. Ha i ferri consumati sottili, ma ben piantati: li riconosci dalla testa dei chiodi, li ha messi Arnbjorn. Sulla slitta, avvolta in tre mantelli, c'è Aud. I mantelli sono rigidi di gelo fino all'orlo, e quando lei si muove crocchiano.\n\nNon la vedevi da quest'autunno. È grigia di freddo, magra, e scende dalla slitta come si scende da una barca che balla, tenendosi con una mano sola. L'altra la tiene nascosta sotto il mantello. Ha le labbra screpolate dal vento del fiordo, e parla a fatica, con la voce di chi è stata zitta per giorni.\n\n«Cerco il fabbro» dice. «Quello con le braccia forti.»\n\nArnbjorn esce sulla porta con la barba ancora piena di sonno, guarda lei, guarda te. Dalla porta aperta, dietro di lui, esce il fiato caldo della bottega e si perde subito.\n\n«Che ti serve?»\n\n«In casa mia il fuoco non scalda più» dice Aud. «E in cucina c'è una cosa che sale dal pavimento. Ci vogliono braccia.»\n\nNon spiega altro, e nessuno glielo chiede. A Holt si sa che Aud, quest'autunno, ha avuto il mare in casa.\n\nArnbjorn si gratta la barba, poi ti prende per il braccio e ti spinge verso la slitta. Ha la mano calda anche a quest'ora, e molla la presa soltanto quando hai il pattino contro lo stivale.\n\n«Va' tu» dice. «Io ho una garanzia da tenere.»\n\nRagna esce con un fagotto ancora tiepido di forno e ti fa cenno di metterlo sotto il sedile. Il calore passa la tela e ti resta nelle dita per poco. Il cavallino sbuffa, e il fiato gli si gela sui peli del muso. Aud ha già ripreso le redini. Dietro la slitta, i pattini hanno lasciato nella neve della strada due righe lucide e dritte, che tornano verso il fiordo.","img":2},"37":{"t":"Thorvald arrotola la catena sul braccio, un giro dopo l'altro, e la posa sulla panca accanto a sé, dove tutti la possono vedere. Gli anelli si assestano l'uno sull'altro con un ultimo scatto di ferro.\n\n«Tre notti» dice. «Tra tre notti ci ritroviamo qui, e si decide. Chi ha un'idea migliore la porti.»\n\nLa gente comincia a muoversi verso la porta. Le panche si svuotano una fila dopo l'altra, gli stivali strusciano sulle pietre del pavimento, e dalla porta aperta entra un'aria che piega la fiamma delle lucerne. Arnbjorn invece resta in piedi, e alza una mano. La tiene aperta, larga. Chi era già sulla soglia si volta.\n\n«Per il mio troll garantisco io» dice. «Se in tre notti vi manca il mio troll, avete me. Io da Holt non mi muovo.»\n\nParla senza ridere, con la voce che usa per fare il prezzo di un vomere. Thorvald fa di sì con la testa, una volta. Tra loro due una cosa detta così non si ridice.\n\nFuori è già buio. La neve ha smesso, e il cielo è così limpido che il freddo fa male ai denti; sotto gli stivali la neve scricchiola, e nelle case le lucerne si spengono presto, per risparmiare il grasso. La gente del consiglio si sparpaglia tra i tetti di zolle a due, a tre, senza salutarsi, e le voci finiscono una dopo l'altra dietro le porte. Arnbjorn cammina accanto a te fino alla fucina, fischiettando storto, e del consiglio non parla. A metà strada ti dà una spallata, per niente, come si fa con un cavallo che si vuole sentire vicino.\n\nAlle vostre spalle, nella sala, hanno lasciato il fuoco acceso: dopo mangiato i bambini ci tornano, e Vigdis con loro."},"38":{"t":"Bersi resta dov'è, in capo alla panca, con il suo palmo di posto vuoto da una parte e dall'altra. Intorno i bambini si spingono e ridono ancora per la vacca; lui tiene le mani nelle maniche. I piedi non gli arrivano a terra, e stanno uniti, senza dondolare.\n\nSolo, a un certo punto, alza gli occhi dal fuoco e li porta su di te, sulla soglia. In mezzo c'è tutta la sala: le schiene dei bambini, il fumo che ristagna sotto le travi, le ginocchia dei vecchi in fila sulle panche. Ti guarda serio, dal suo posto, con la faccia di chi ci ha pensato bene. Non ti fa cenno e non si volta. Poi torna a guardare le fiamme.\n\nGunna invece si alza. Ripesca Kisa da sotto la panca, se la infila sotto lo scialle con la testa di fuori e va a sedersi accanto a Bersi, nel posto vuoto, così vicina che le spalle si toccano. Per sistemarsi tira su i piedi, si aggiusta lo scialle e gli pianta un gomito nel fianco, due volte. Lui non si sposta. La gatta allunga una zampa verso il fuoco, e un ferretto manda un piccolo lampo.\n\nIl buio è sceso dal tetto fino alle spalle dei vecchi, e dalla porta le loro facce non si distinguono più. Il fuoco si è fatto basso. Qualcuno ci butta dentro un ciocco, e le scintille salgono fino alle travi. Sono chiare, da legno di betulla, e portano fino alla porta l'odore dolce della corteccia che brucia. Vigdis le segue con gli occhi finché non si spengono, poi batte i palmi sulle ginocchia, come quando ne ha un'altra pronta."},"41":{"t":"Nel pomeriggio la sala del consiglio è piena quanto nelle sere di festa, ma nessuno è venuto per far festa. Si sta sulle panche, stretti, e chi non trova posto resta in piedi lungo le pareti di tronchi, con il fiato che fuma sotto le travi. Il fuoco è piccolo: la legna si conta anche qui. Chi arriva tardi si batte la neve dagli stivali sulla soglia, e a ogni colpo della porta una lama di freddo passa sulle panche fino al tavolo.\n\nThorvald si alza dal suo posto e posa sul tavolo una catena. Fa un rumore lungo, cadendo, anello su anello, e poi resta lì, nera, arrotolata come un serpente che dorme. Le assi del tavolo gemono sotto il peso.\n\n«Tre inverni senza estate» dice. «Gli dèi vogliono una cosa che sia nostra, e che ci costi. Questa è la catena dell'offerta.» Lo dice senza alzare la voce, nel tono con cui dà il conto delle pecore e dei morti.\n\nArnbjorn ti dà una gomitata. «Faglielo vedere, a questi» dice, a voce abbastanza alta perché lo sentano tutti. «Quanto è lunga?»\n\nPrendi un capo della catena. Ne misuri un anello solo, tra il pollice e il mignolo, e dici: «Dodici braccia».\n\nThorvald la stende sul pavimento e la misura con le braccia, contando a voce alta. Gli anelli strisciano per terra a ogni bracciata, e alla nona lui si ferma a riprendere fiato. Sono dodici. Qualcuno ride, qualcuno fa di sì con la testa, e Arnbjorn si gonfia tutto, il petto in fuori e la barba in su, che pare l'abbia misurata lui. Thorvald raccoglie la catena giro su giro e la riposa sul tavolo.\n\nCominciano i nomi, e nessuno ride più.\n\n«Il troll della forgia» dice una delle vecchie in fondo. «Da loro viene. A loro si rende.»\n\nTu non parli. La mano ti va all'anello, sotto la camicia, e ci resta.\n\n«O il figlio della tessitrice» dice un'altra. «Cinque inverni, e non piange mai. Nemmeno quando è caduto nel ghiaccio del fiordo. Quello i troll l'hanno scambiato nella culla, lo sanno tutti.»\n\nBersi è lì, accanto a sua madre, con il cappuccio troppo grande e le mani nelle maniche. Guarda la catena sul tavolo, senza paura, come guarderebbe una capra o un secchio. La tessitrice gli tiene una mano sulla spalla, e la mano trema; lui no.\n\nThorvald aspetta che qualcuno parli. Nella sala si sente il fuoco, e il vento sulle zolle del tetto.\n\nChi ha la risposta pronta sa che un consiglio che ride non riesce più a votare. Se sai di catene, pesando quell'anello tra le dita hai sentito che è troppo largo per quello che si dice di volerci legare.\n\nBersi è a tre passi da te. La catena è a due.","dec":1,"img":3},"44":{"t":"Non rispondi.\n\nIl vecchio aspetta. La brace fa il suo rumore basso, la neve entra a folate dalla porta aperta e si scioglie sulle pietre calde, e il cavallo, fuori, scuote la criniera. Il vecchio aspetta ancora, con la stessa pazienza con cui ha aspettato che il ferro scaldasse.\n\nAnche tu stai fermo. Hai la moneta nel pugno, e l'orlo consumato ti preme nel palmo. Dalla porta il freddo ti prende le caviglie; dietro, il caldo della forgia ti arriva fino alla nuca. Nella bottega l'odore del corno bruciato non se n'è ancora andato; si mescola al carbone di betulla e alla lana bagnata del mantello di lui.\n\nSul ceppo Gunna si gira nel sonno e borbotta il nome della gatta.\n\nPoi il vecchio smette di aspettare. Lo vedi dalle spalle, che si abbassano di un dito, come quelle di un uomo che si toglie il grembiule a fine giornata.\n\nTi volta le spalle. Sulla soglia si ferma. Il vento gli spinge la neve sotto la tesa del cappello, contro la faccia e dentro la barba, e lui non alza la mano per ripararsi: resta lì, con la neve sotto il cappello, a guardare il buio del campo arato. Tu non ti muovi.\n\n«Tienilo» dice alla fine, e non dice che cosa.\n\nLo capisci quando se n'è già andato. Sul banco c'è il ferro vecchio del cavallo grigio, quello della terza zampa, con i due chiodi storti dentro. Lo prendi. Sulla faccia di sopra è rimasto un velo chiaro di corno, dove toccava l'unghia. È freddo, e pesa quanto un ferro deve pesare.\n\nKisa, nello scialle di Gunna addormentata, apre un occhio sulla porta aperta, e lo richiude.","it":"Il ferro vecchio del cavallo grigio"},"45":{"t":"Il ferretto può aspettare. Lo spingi con le pinze sull'orlo dell'incudine piccola, dove si farà grigio da solo, e Gunna capisce prima che tu apra bocca: tira su le ginocchia e si stringe Kisa contro il petto.\n\nFermi il mantice e posi il martello grande: i cavalli hanno paura del ruggito del fuoco e del ferro sull'incudine. Nella fucina resta il fiato basso della brace, e la neve che entra dalla porta a folate e si scioglie sulle pietre.\n\nFuori, la cavezza legata all'anello del muro è rigida di gelo, e il nodo cede alla seconda tirata. Il cavallo entra piegando il collo sotto la trave, e da solo riempie mezza bottega. Per starci si mette di traverso, tra il banco e la forgia, e dalla groppa la neve gli scivola giù a lastre. Gli passi la mano lungo la spalla, poi giù per la zampa, la terza davanti a sinistra, e lui la alza prima che tu la chieda. Te la prendi sulla coscia. Sotto lo zoccolo c'è una suola di neve pressata, e la fai saltare con il pollice. Il ferro vecchio tiene su due chiodi soli. Lo levi con le tenaglie e pareggi l'unghia con il coltello curvo: è dura e liscia, più di tutte quelle che hai pareggiato in vita tua.\n\nDalla fila appesa al muro prendi il ferro più grande che c'è, e lo metti nella brace senza soffiarci sopra. Così ci vuole più tempo. Mentre dal nero passa al rosso scuro, ti torna in mente uno dei detti di Arnbjorn, quello che ti ripeteva da piccolo quando tiravi fuori il ferro troppo presto: «Finché è nel fuoco, il ferro è fuoco.» Lo lasci lì finché il rosso è quello giusto.\n\nGunna non resiste più. Mette la testa fuori dallo scialle. «Ha un nome?» chiede. «Il cavallo.»\n\n«Ce l'ha» dice il vecchio.\n\nGunna aspetta di sentire quale. Il vecchio non lo dice, e resta sulla soglia a guardarti le mani.\n\nAppoggi il ferro caldo all'unghia per farlo sedere, e sale un fumo di corno bruciato che il cavallo annusa senza scomporsi. Poi i chiodi, con il martello piccolo, uno dopo l'altro; le punte piegate, la raspa sull'orlo. In bocca ti resta il gusto di ferro di quelli che tenevi tra le labbra. Il cavallo posa lo zoccolo sulle pietre e ci si appoggia sopra con tutto il peso, due volte, per provarlo. Il ferro nuovo suona pieno, e sulla soglia il vecchio scosta il mantello dal fianco."},"46":{"t":"Il martello cala un'ultima volta e trova soltanto neve: i lupi sono già fuori dalla sua portata.\n\nL'ultimo lupo si ferma al limite degli alberi, con un lembo della tua manica ancora tra i denti, e ti guarda. Si volta e se ne va nel bosco al passo, dietro agli altri due. La neve cade dai rami al loro passaggio, a blocchi, con un tonfo. Dentro il recinto i belati si spengono una pecora dopo l'altra, e resta lo struscio della lana contro le pietre.\n\nIl braccio ti trema come dopo una giornata all'incudine. Ti siedi sul muro dell'ovile e aspetti che smetta. Le pietre sono gelate sotto le cosce, e dallo strappo della manica il freddo ti sale fino al gomito. Sulla neve pestata restano le orme dei lupi, larghe, e un ciuffo di pelo grigio impigliato a un palo.\n\nDalla parte delle case viene una luce gialla che dondola a ogni passo. Thorvald arriva con la lanterna e un forcone, in camicia, con gli stivali slacciati. Ha la barba schiacciata dal sonno da una parte sola, e la lanterna puzza di sego. La alza verso gli alberi, poi verso i pali, e appoggia il forcone al muro. Entra nel recinto senza una domanda e comincia a contare le pecore, toccandole una per una sulla schiena, muovendo le labbra. La mano gli affonda nella lana fino alle nocche. Le pecore si lasciano toccare, strette, con il fiato che fuma a sbuffi.\n\nLe conta due volte. Ci sono tutte.\n\n«Tutte» dice, e lo dice a te, anche se non alza gli occhi. Va a rimettere dritto il palo che cedeva, e tu lo aiuti a piantarlo di nuovo nella neve, con le mani che tremano ancora. Tu lo tieni a due mani; lui pesta la neve intorno al piede, a strati, con il tallone dello stivale slacciato, finché il legno smette di muoversi nella sua buca.\n\nQuando il palo sta su da solo, sopra il villaggio il cielo ha perso le stelle, e da un tetto di zolle sale il primo fumo, dritto."},"55":{"t":"Per mezza giornata i pattini della slitta seguono la riva, e Aud guida con una mano sola. Quando il cavallino si ferma, la luce è già bassa sull'acqua.\n\nLa fattoria di Aud è l'ultima casa prima del mare: una casa lunga, bassa, con il tetto di zolle che scende quasi fino alla neve, e sotto, a picco, il fiordo nero. Ai bordi l'acqua ha fatto un ghiaccio sottile e torbido; sui sassi della riva le alghe sono gelate dure e scricchiolano sotto gli stivali. Si sente la risacca battere sotto la casa, sempre, anche quando non tira vento.\n\nDentro, la gente di casa sta stretta intorno al focolare e ti guarda entrare senza alzarsi. Il focolare è lungo, in mezzo alla stanza, tra due file di panche. Il fuoco fa fumo e non scalda. Ti ci siedi davanti: la legna brucia, e il caldo non arriva. Eppure è un fuoco fatto bene, con la legna spaccata sottile e incrociata, e l'aria che passa sotto. Le lucerne di grasso di foca puzzano, e tutta la casa sa di lana fradicia e di pesce.\n\nAud si siede di fronte a te e parla guardando il fuoco.\n\n«Mio marito e i due rematori sono usciti per le reti a metà autunno. Il mare se li è presi tutti e tre.» Non le trema la voce. «Alla festa per loro, la prima sera, la porta si è aperta, e sono entrati. Fradici. Si sono seduti qui, al fuoco, e non hanno detto una parola. Da allora tornano ogni sera.» Sulla panca un uomo della casa tira i piedi sotto di sé.\n\nAud tira fuori da sotto il mantello la mano che teneva nascosta. È bianca di gelo fino al polso, come la cera, e le dita non si piegano bene. Le unghie sono grigie. Così vicina alla fiamma, non prende colore.\n\n«E dall'altra parte del fuoco, sola, si siede la straniera. È venuta dal mare all'inizio dell'autunno, con una barca di mercanti, e la febbre se l'è presa in quattro giorni. Mi aveva chiesto una cosa sola, prima di andarsene: che bruciassi il suo mantello, quello blu, ricamato. Era troppo bello per il fuoco. L'ho tenuto.» Si stringe la mano bianca con l'altra. «E in cucina, ogni notte, dal pavimento sale una testa di foca. Guarda il fuoco. Io là dentro non ci entro più.»\n\nChi sa fasciare una bruciatura sa anche che una mano presa dal gelo non si strofina con la neve, come dicono le vecchie: si scalda un poco alla volta, e poi si avvolge.\n\nFuori il fiordo si fa scuro. Tra poco è notte, e la cucina è in fondo alla casa, dietro una tenda di pelle. La tenda pende dritta, con una riga di buio sotto l'orlo. Sulle panche nessuno si volta da quella parte.","dec":1},"57":{"t":"«Prima i ferretti» dici. «Gliel'ho promesso.»\n\nIl vecchio non protesta. Resta sulla soglia, con la neve che gli si posa sul cappello e sulle spalle, e non entra. Dietro di lui il cavallo grigio sbuffa e gratta la neve con uno zoccolo.\n\nRimetti il terzo ferretto nella brace, e il mantice lo riporta al rosso in pochi soffi: due corti e uno lungo. Lo pieghi sul corno dell'incudine piccola e gli apri i due buchi con il punzone più fine che hai. Il quarto lo tiri fuori da un ritaglio che aspettava sul banco da giorni. Tutti e due fischiano corto nel calderone della tempra, uno dopo l'altro, e il vapore ti bagna il polso. Quando li metti in fila sono piccoli come unghie. Gunna ti porge le zampe di Kisa una per una, e tu leghi i ferretti con un filo di cuoio sottile, stretto quanto basta perché la gatta non se li strappi con i denti. Kisa appiattisce le orecchie ogni volta che le tue dita fredde le toccano un cuscinetto.\n\n«Ferri anche i gatti, in questo villaggio?» chiede il vecchio.\n\n«Scivola dal tetto» dice Gunna.\n\nIl vecchio ride, una volta. Kisa fa due passi sulle pietre, tic, tic, poi si siede e si guarda le zampe con grande disgusto.\n\nAdesso il cavallo. Fermi il mantice e posi il martello grande: i cavalli hanno paura del ruggito del fuoco e del ferro sull'incudine. Il cavallo grigio passa la porta abbassando la testa, e in bottega non c'è più posto per niente. Gunna tira i piedi sul ceppo: il fianco della bestia le passa a una spanna dalle ginocchia, e le pietre del pavimento suonano sotto tutti quegli zoccoli. Il ferro vecchio viene via con due strappi di tenaglia; l'unghia sotto è liscia come una pietra di fiume.\n\nIl ferro nuovo scalda piano, nella brace senza vento. Arnbjorn lo dice ai contadini che sbuffano davanti alla forgia perché la loro bestia ha freddo: «Finché è nel fuoco, il ferro è fuoco.» Aspetti che il rosso sia quello giusto. Lo fai sedere sull'unghia, nel fumo di corno, e lo inchiodi con il martello piccolo, a colpi fitti e leggeri, finché la terza zampa davanti a sinistra non ha più niente che balla."},"60":{"t":"Non parli. Ti alzi.\n\nLa panca stride sul pavimento, e tutta la sala si volta. Attraversi la stanza in quattro passi e ti metti tra il tavolo e Bersi, con la catena davanti e il bambino dietro, e resti lì. Pianti i piedi larghi, alla distanza che tieni davanti all'incudine grande quando il pezzo è pesante.\n\nSei più alto di ogni uomo di Holt di una testa, e adesso lo vedono tutti. Le travi ti sfiorano i capelli e ci lasciano un po' della loro fuliggine. Da quassù la sala è una fila di berretti di lana, di scialli e di scriminature. La tua ombra, con il fuoco alle spalle, copre il tavolo e metà della catena, e arriva fino alle mani di Thorvald. Il caldo del fuoco lo senti sui polpacci attraverso le brache; sul petto hai il freddo che entra da sotto la porta.\n\nNessuno si muove. La vecchia che ha indicato il figlio della tessitrice si tira lo scialle fin sotto il mento, e le parole che aveva pronte restano dentro. Thorvald deve piegare indietro la nuca per guardarti in faccia, e ci mette un po'.\n\nDietro di te Bersi non si sposta. Non ti prende la mano e non si nasconde. Lo sai perché la tessitrice, accanto a lui, respira forte, e lui no. Ti arriva l'odore del suo cappuccio, lana e fumo di casa.\n\nSul tavolo la catena manda un riflesso rosso, anello per anello, e nessuno allunga la mano per toccarla. Rimani così finché Thorvald non riporta lo sguardo sulla catena. Il fuoco schiocca. Vicino alla porta una donna tossisce piano dentro la manica, e poi più niente.\n\nLe mani ti pendono aperte. Non le chiudi. Arnbjorn, dal suo posto, si schiarisce la gola, e per una volta non ha un detto pronto.\n\n*Annota sulla scheda, nella colonna FATTI: «HAI DIFESO IL BAMBINO».*","f":"HAI DIFESO IL BAMBINO"},"66":{"t":"Taci. La mano sull'anello, sotto la camicia, e la bocca chiusa.\n\nThorvald ha i palmi sul tavolo, uno per parte della catena, e gira la testa da una panca all'altra. Dalle panche davanti due o tre si sono voltati verso di te: ti guardano le spalle e le mani, non la faccia.\n\nLa sala zitta dura poco. Arnbjorn si alza, e quando si alza lui le panche scricchiolano tutte.\n\n«Il troll della forgia» dice, con la barba che ride. «Il troll della forgia solleva da solo l'incudine grande, quella che due di voi non smuovono. Mi ferra i cavalli che scalciano. Mi tiene il fuoco quando dormo. Tre inverni senza estate, e voi volete darlo agli dèi? Allora gli dèi si prendano anche le vostre zappe rotte, che io da solo non ce la faccio.»\n\nQualcuno ride, poco. In fondo le vecchie non ridono: stanno dritte sulla panca, con gli scialli chiusi. Arnbjorn parla ancora: dei chiodi, dei vomeri, delle serrature delle stalle, dei cerchi delle botti che il gelo fa saltare e che qualcuno deve pur rifare. A ogni cosa che nomina batte il dorso di una mano nel palmo dell'altra, e la voce è quella che usa per farsi sentire sopra il mantice: arriva fino alla porta. Parla di te per tutto il tempo. Di Bersi, niente.\n\nBersi è sempre accanto alla tessitrice. Nessuno lo guarda più, tranne sua madre, che tiene gli occhi su di lui e la mano sulla sua spalla. Lui guarda la catena.\n\nTu guardi le tue mani, larghe, ferme sulle ginocchia. Dal fuoco piccolo, a questa distanza, arriva solo la luce.\n\nQuando Arnbjorn si risiede, è rosso fino alle orecchie e respira a bocconi, e ti dà una pacca sulla schiena che ti fa tossire."},"67":{"t":"«Ragnhild» dici.\n\nTi è venuto in bocca da solo. È il nome di Ragna allungato di un pezzo, una sbarra tirata a caldo finché non arriva alla misura, e appena l'hai detto ti pare di sentirla, Ragna, che di là dalla parete di tronchi si gira nel letto. Il letto scricchiola, poi niente.\n\nIl vecchio lo ripete: «Ragnhild.» Se lo rigira in bocca come un pane appena assaggiato, e non dice se sa di buono.\n\nPoi va alla soglia. Lì si ferma, di spalle, e non si volta. Il mantello blu gli scende dritto fino alla neve, e del cappello vedi solo la tesa larga, con i fiocchi che ci si fermano sopra uno sull'altro. Resta lì tanto che pensi che stia per dire un'altra cosa, o per chiedere di nuovo. Dietro di te la brace si assesta, con un fruscio di cenere. Fuori il cavallo grigio sbuffa, e il fiato gli fa una nuvola bianca nella luce della porta. Il vecchio non chiede.\n\n«Tienilo» dice, sempre di spalle, con un cenno della mano verso il banco.\n\nSul banco c'è il ferro vecchio del cavallo grigio, dove l'hai posato quando l'hai tolto dalla terza zampa. Ha ancora i due chiodi storti piantati dentro, e un orlo consumato quasi a lama. Ci passi il pollice: taglia poco, ma taglia. La faccia che toccava terra è lucida di strada, liscia sotto le dita dove l'altra è ancora ruvida di martello. Quando torni a guardare, la soglia è vuota e la neve riempie già le orme.\n\nSul ceppo Gunna apre gli occhi, piena di sonno, con la guancia segnata dalla lana dello scialle. Si tira su contro i tronchi della parete, e Kisa le si rigira in grembo.\n\n«Chi è Ragnhild?» chiede.\n\nNon lo sai nemmeno tu.","it":"Il ferro vecchio del cavallo grigio"},"71":{"t":"«Non lo so» dici.\n\nÈ la verità, tutta quella che hai. Non c'è altro da metterci intorno.\n\nIl vecchio annuisce, una volta, come chi ha avuto la risposta che aspettava. Poi si gira verso la notte.\n\nSulla soglia si ferma. Appoggia la mano allo stipite, una mano larga, con le nocche grosse e le dita segnate dal freddo, e la tiene lì. Il mantello gli si gonfia di vento; la neve entra, gli si posa sul dorso della mano e non si scioglie. Resta così, con la faccia verso il buio e la mano sul legno della tua porta, per il tempo che ci vuole a un ferro per passare dal rosso al nero. Poi la mano si stacca dallo stipite.\n\n«Tienilo» dice, girando appena la testa, e indica il banco con il mento.\n\nSul banco c'è il ferro vecchio del cavallo grigio, quello che gli hai tolto dalla terza zampa, con dentro ancora i due chiodi storti. È grande quanto il tuo palmo aperto, e consumato più da una parte che dall'altra: il cavallo che lo portava tira sempre dallo stesso lato. Lo soppesi. È ferro buono, più fitto di quello che arriva a Holt, e l'orlo si è fatto sottile a forza di strada. Battuto con la nocca dà una nota bassa, che dura.\n\nQuando torni a guardare la porta, il vecchio e il cavallo sono già fuori dalla luce. Nel riquadro della porta resta la neve che cade, rossa per un passo dove arriva il chiaro della brace, e più in là grigia. Li senti andare via sulla neve. Conti i colpi degli zoccoli finché non li senti più: lo fai per abitudine, con ogni cavallo che esce dalla bottega. Per quattro zampe sono troppi.","it":"Il ferro vecchio del cavallo grigio"},"73":{"t":"Non lo tiri dentro per la cavezza. Esci tu, nella neve, a mani basse, e prima di toccarlo gli parli: le cose che dici a tutti i cavalli della valle, che è tardi, che fa freddo, che adesso si sistema. La neve ti cede sotto gli stivali fino alle caviglie. Il cavallo grigio gira un orecchio verso la tua voce, poi l'altro. Resta dov'è e ti lascia venire, con la testa alta e le zampe piantate nel bianco. Quando gli posi la mano sul collo, il pelo sotto la neve è asciutto e caldo.\n\nLo porti dentro con una mano sola. Fermi il mantice e posi il martello grande: i cavalli hanno paura del ruggito del fuoco e del ferro sull'incudine. In bottega si sente soltanto la brace, e il cavallo che soffia vapore dalle froge. Dove posa gli zoccoli restano sulle pietre calde impronte bagnate, che si asciugano sotto i tuoi occhi.\n\nTi appoggi con la spalla alla sua, come si fa con le bestie grosse, e lui ti dà la terza zampa senza che tu la chieda due volte. Il ferro vecchio tiene su due chiodi. Lo levi e pareggi l'unghia. Il coltello curvo entra a fatica: il corno è fitto, e viene via a riccioli sottili. Mentre sei chino, il cavallo grigio abbassa la testa e te la posa sulla spalla. Pesa come un sacco d'orzo bagnato, e ti fiata nel collo, caldo.\n\n«Di solito non si lascia toccare» dice il vecchio.\n\nIl ferro nuovo scalda nella brace senza vento. «Finché è nel fuoco, il ferro è fuoco.» Arnbjorn te lo ripete da quando arrivavi appena all'orlo dell'incudine, e ti pare di sentirlo anche adesso, che russa di là. Tiri fuori il ferro quando il rosso è quello giusto, lo fai sedere sull'unghia nel fumo di corno e lo inchiodi con il martello piccolo. Sette chiodi. Il cavallo non sposta la testa dalla tua spalla nemmeno quando pieghi le punte.\n\nGunna, sul ceppo, non pensa più ai ferretti. Guarda il cavallo a bocca aperta, e Kisa, nello scialle, fa lo stesso."},"76":{"t":"Bersi si alza dalla panca.\n\nSi prende il suo tempo. Scende prima con un piede e poi con l'altro, perché la panca è alta per lui, e tiene le mani nelle maniche. Una delle vecchie, sulla panca di fronte, ritira i piedi per lasciargli il passo. Attraversa la sala con la sua faccia seria, passa tra i bambini seduti per terra senza pestare le mani a nessuno, gira intorno al fuoco e arriva alla porta. Lì sta un momento, come per misurare il posto, e si siede sulla soglia, accanto ai tuoi stivali, con la schiena contro lo stipite e la spalla contro il tuo ginocchio. Attraverso la lana delle brache la senti, stretta, e il caldo che si è portato dietro dal fuoco.\n\nNon dice niente. Non ti guarda nemmeno: guarda la sala, da dove la guardi tu. Tu non sposti il ginocchio.\n\nGunna ci mette un attimo a capire. Si china sotto la panca, ripesca Kisa per la collottola, se la ficca sotto lo scialle e viene dietro a Bersi. La gatta scalcia, scivola giù e la segue da sola: i ferretti fanno tic tic sulle pietre, fino alla soglia. Gunna si siede dall'altra parte di Bersi, con le ginocchia sotto il mento. Kisa si accuccia davanti a voi e si lecca una zampa, girando la lingua intorno al ferretto. Dalla fessura sotto la porta entra un filo di freddo che vi prende le caviglie a tutti e tre.\n\nVigdis vi guarda, uno dopo l'altro, dal suo posto accanto al fuoco. Mezza sala si è voltata verso la porta, e lei aspetta che le teste tornino dalla sua parte. Si liscia la gonna sulle ginocchia e prende fiato, come quando ne ha un'altra pronta."},"78":{"t":"La sera, al fuoco della sala, i bambini si stringono intorno a Vigdis come le pecore intorno al pastore quando nevica. Tu stai sulla porta, al tuo solito posto, con la spalla contro lo stipite. Il caldo del fuoco, fin qui, arriva soltanto alla faccia.\n\nLa sala sa di fumo, di grasso di lucerna e di pellicce umide stese ad asciugare sulle travi. La luce va fin dove vanno le fiamme: i bambini hanno la faccia rossa da una parte sola, e dietro di loro, sulle panche, i grandi sono sagome scure. Il fuoco è quello piccolo del pomeriggio, e i ciocchi ci entrano uno per volta: i vecchi li seguono con gli occhi, e li contano.\n\nVigdis ne racconta una corta, per i più piccoli, quella che sanno tutti. La madre di Baldr, che fece giurare a ogni cosa di non fargli male. Il germoglio di vischio, che lei lasciò stare perché era troppo giovane per giurare. La dice in quattro frasi, con le mani, e chiude con il dito alzato:\n\n«E ricordatevelo: la cosa più giovane non giura.»\n\n«E io ho giurato?» chiede Gunna.\n\n«Tu giuri ogni giorno che non sei stata tu» dice Vigdis, e i bambini ridono.\n\nStringe gli occhi, come fa quando ha in serbo una cosa difficile. Si china in avanti sulla panca, con i gomiti sulle ginocchia, e i più piccoli si chinano con lei.\n\n«Quattro pendono, quattro camminano, due indicano la strada, due tengono lontani i cani, e uno ciondola sempre dietro. Che cos'è?»\n\n«Un telaio!» grida Gunna, prima ancora che lei abbia finito. Kisa le schizza fuori dallo scialle e corre sotto la panca, e i ferretti fanno tic tic sulle pietre del focolare.\n\n«Un carro!» grida un altro, dal fondo, e per dirlo si alza in piedi.\n\nVigdis scuote la testa a tutti e due e conta sulle dita, per chi non ha capito: le mammelle che pendono, le zampe che camminano, gli occhi che indicano la strada, le corna che tengono lontani i cani. Ha le dita magre e storte, e le piega una per volta contro il palmo. Arrivata all'ultimo dito, dimena il sedere sulla panca, e Gunna strilla dal ridere.\n\n«E la coda» dice. «È una vacca da latte. Di quelle che avevamo prima di questi inverni.»\n\nRidono tutti, anche i vecchi, anche quelli che la sanno da sessant'anni.\n\nBersi è seduto in capo alla panca. Da una parte e dall'altra gli resta un palmo di posto vuoto, come intorno a una cosa che scotta. Guarda il fuoco.\n\nNel pomeriggio, al consiglio, stava così anche accanto a sua madre: fermo, con le mani nelle maniche."},"80":{"t":"Il nodo del cuoio cede al primo strappo. Tiri fuori il martello da forgia dallo zaino e te lo pesi in mano. È il tuo, con il manico che ha preso la forma delle tue dita. La faccia che batte è lucida, e il resto del ferro è scuro.\n\nTi metti sopra la testa di foca a gambe larghe, e ti torna in bocca il detto di Arnbjorn:\n\n«Tre colpi: uno per trovarla, uno per piegarla, uno per mandarla a casa.»\n\nIl primo colpo lo dai giusto in mezzo alla testa, senza forza, per sentire dove sta. Il ferro si posa e resta: sotto c'è un duro pieno, che non scivola e non scappa. La foca si ferma. Le assi smettono di scricchiolare. Il secondo lo dai di sbieco, e lei china il muso verso le assi. I baffi toccano il legno, e dal naso le esce uno sbuffo corto, da bestia disturbata nel sonno. Il terzo lo dai dall'alto, con tutto il braccio. Il manico non ti vibra nel palmo.\n\nLa testa rientra nel pavimento come un chiodo nella trave. Torna dentro. Le assi le si richiudono sopra con il rumore di una porta chiusa piano, e tornano piane, tanto che ci potresti posare una scodella piena. Ci passi sopra la suola: nemmeno uno scalino.\n\nSul legno resta un po' d'acqua di mare, e un baffo lungo e bianco. È rigido, più grosso di una setola, e punge il polpastrello. Lo raccogli e te lo metti in tasca, perché Gunna non ci crederà.\n\nIl fuoco, nel focolare, fa ancora fumo, e non scalda."},"82":{"t":"Il vecchio apre la borsa che porta alla cintura, sotto il mantello. Dentro tintinnano dei pezzi di metallo, e la mano ne esce con uno solo tra le dita.\n\nLa moneta è d'argento, sottile, consumata sull'orlo. Il vecchio te la posa nel palmo, e il palmo freddo non la trattiene: scivola, cade, rotola sulle pietre fino al piede dell'incudine, dove ronza un poco sul fianco e si ferma. Una moneta così non l'hai mai vista. Da una parte c'è una nave; dall'altra una faccia con un elmo, liscia per tutte le mani che l'hanno toccata. Il metallo è tenero: basterebbero due dita per piegarla, e nessun fabbro della valle la saprebbe rifare.\n\nTi chini a raccoglierla. L'anello ti scivola fuori dalla camicia e dondola alla sua stringa, davanti alla brace, girando piano su sé stesso. Lo prendi e lo rimetti dentro, contro la pelle, dove sta sempre.\n\nGunna si è addormentata sul ceppo, con la testa appoggiata ai tronchi della parete e Kisa nello scialle. Il caldo della forgia le ha fatto rosse le guance. Il cavallo aspetta fuori, legato all'anello del muro, con la neve che gli si posa sulla schiena. Nella bottega si sente solo il respiro di Gunna, lungo e tranquillo, e le zolle del tetto che scricchiolano sotto il peso della neve. Dall'alto scende ogni tanto un fiocco, e si scioglie prima di arrivare alla cenere. Il vecchio ha già il cappello tirato sulla fronte, pronto ad andare. Invece resta.\n\n«E tua madre, come si chiamava?»\n\nLo chiede senza fretta, con la stessa voce con cui ha chiesto del ferro.\n\nNessuno te l'ha mai chiesto. A Holt tutti sanno della cesta di corteccia accanto al calderone, e Arnbjorn la racconta a chiunque entri, ridendo fino a tossire; di chi ti ci abbia messo dentro, nessuno parla mai. Non ti è mai venuto in mente che fosse una cosa da chiedere a voce alta, sulla porta, a notte fonda, da uno che non conosci.\n\nFuori una trave schiocca per il gelo. Il fumo della forgia, senza il mantice a spingerlo, sale pigro verso il buco del tetto e ci resta impigliato.\n\nLa brace ingrigisce ai bordi. Il vecchio è sulla soglia, con il buio alle spalle, e aspetta. La verità è corta, e sta in poche parole. Un nome qualunque lo manderebbe via contento. Oppure la domanda può restare dov'è, sulla porta, insieme alla neve.","dec":1},"84":{"t":"Scosti la tenda di pelle con la spalla. È pesante, unta dal fumo, e di là l'aria è più fredda.\n\nLa cucina è una stanza bassa in fondo alla casa, con il pavimento di assi e il focolare murato nell'angolo. Aud non ci entra. Ci entri tu, con la gente di casa dietro: hanno portato le lucerne, e si mettono in fila lungo la parete, stretti, uno contro l'altro. Sono quattro, due uomini e due donne, e nessuno si toglie il mantello.\n\nAspettate. Il fuoco fa il suo fumo, che resta basso, sotto le travi, e pizzica la gola. Le assi sono larghe, con le teste dei chiodi lucide di passi. Sotto la casa la risacca batte e si ritira, batte e si ritira, e da qualche parte l'acqua gocciola in una ciotola, con un colpo piccolo ogni tanto. Conti le gocce per passare il tempo, poi smetti di contarle. A ogni onda più grossa il pavimento vibra sotto gli stivali. Le lucerne fanno un fumo nero che puzza di pesce rancido, e sotto quella luce le facce alla parete sembrano tutte gialle e stanche.\n\nA notte fonda le assi cominciano a gonfiarsi.\n\nLo senti prima di vederlo: il legno scricchiola come una tavola bagnata messa a scaldare vicino alla forgia. Poi, in mezzo alla cucina, due assi si alzano a gobba, si aprono, e dalla fessura esce una testa di foca. È grossa come quella di un vitello, lucida, nera d'acqua, con i baffi bagnati. Il pelo è corto, fitto, pettinato dall'acqua tutto da una parte, e riempie la fessura da un'asse all'altra. Le narici si aprono e si richiudono, due tagli stretti, e a ogni respiro i baffi si alzano. Ha gli occhi tondi e scuri, e li tiene sul fuoco. Non guarda te, né chi sta alla parete. Guarda il fuoco, e basta.\n\nDietro di te qualcuno prega a mezza voce. Una delle donne si mette le mani sulla bocca.\n\nHai a portata di mano quello che c'è in una cucina. Accanto alla catasta c'è l'ascia della legna, con il manico lungo e la lama intaccata in due punti. Appoggiato ai sassi del focolare c'è il bastone con cui si spostano i ciocchi, nero in punta. Nello zaino, ai tuoi piedi, c'è il tuo martello da forgia, avvolto in un pezzo di cuoio. E lungo la parete ci sono quattro persone della casa, con le lucerne in mano, che potrebbero aiutarti, se trovassero il coraggio.\n\nA tre passi da lei, le assi su cui stai si alzano di un dito e tornano giù. Dalla testa di foca esce un fiato lungo, che sa di fondo di mare, e le fiamme delle lucerne si piegano tutte dalla stessa parte.","dec":1,"img":4},"86":{"t":"Non ti muovi. Il pagliericcio è tiepido, la coperta sa di carbone di betulla, e fuori il gelo spacca le pietre. Ti dici che l'ovile ha il recinto alto, e che i lupi d'inverno girano e se ne vanno.\n\nI belati arrivano attraverso la parete di tronchi a ondate, e tra un'ondata e l'altra torna l'ululato, ogni volta da un punto diverso. Ti alzi soltanto per prendere il martello dall'incudine, e ti siedi accanto alla forgia tenendolo sulle ginocchia. Il manico è liscio dove lo stringi ogni giorno, e ti sta nel palmo dal suo verso. Non dormi più.\n\nDall'ovile, i belati continuano a lungo. Ce n'è uno più acuto degli altri, corto. Poi smettono. Resta il vento, e le travi che schioccano per il gelo, e Arnbjorn che di là russa tranquillo. Rimani seduto finché tra le assi della porta il buio si fa grigio.\n\nAll'alba Thorvald conta le pecore, toccandole una per una sulla schiena. Le conta due volte. Manca un agnello, quello nato tardi, che stava sempre in mezzo alle zampe della madre. Nel recinto, dove dormiva, la paglia è schiacciata e fredda. Dalla parte del bosco due pali pendono storti: si vedono fin dalla fucina, scuri contro la neve. La madre bela da sola, a tratti, e la sua voce risale la strada tra le case; le altre tacciono.\n\nThorvald lo segna sul suo conto, come segna tutto: le pecore, le vacche, i morti dell'inverno. Quando si raddrizza, ti vede sulla porta della fucina. Hai il martello ancora in mano, e le dita chiuse sul manico dalla notte.\n\n«Uno» dice, e va a chiudere il recinto."}},"links":{"1":[{"l":"Ferri subito il cavallo","v":45,"t":"l"},{"l":"Prima finisci i ferretti della gatta","v":57,"t":"l"},{"l":"🧠 Se hai Ferratura","v":73,"t":"l"}],"4":[{"l":"Vai alla fucina con Arnbjorn","v":9,"t":"l"}],"5":[],"6":[{"l":"Aspetti la notte in cucina","v":84,"t":"l"}],"9":[{
