:root{--suoro:#ffffff;--fondo:#2a2c2e;--fondo2:#121314;--carta:#f8f6f1;--inchiostro:#1a1a1a;--accento:#2b2b2b;--oro:#c8432d;--rosso:#a3301f;--velo:rgba(43,43,43,.1)}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--inchiostro);
  background: var(--fondo2) linear-gradient(180deg, var(--fondo) 0%, var(--fondo2) 100%) fixed;
  font-family: 'EBG', 'EB Garamond', Garamond, 'Times New Roman', Georgia, serif; font-size: 19px; line-height: 1.6;
}
#app { max-width: 700px; margin: 0 auto; padding: 0 0 48px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; }
a { color: inherit; }
.btn {
  display: block; width: 100%; margin: 9px 0; padding: 11px 16px; border-radius: 6px; cursor: pointer;
  font-size: 18px; line-height: 1.35; text-align: center; text-decoration: none;
  background: transparent; color: var(--inchiostro); border: 1.5px solid var(--accento);
}
.btn:hover, .btn:focus-visible { background: var(--velo); }
.btn:focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; }
.btn.primo { background: var(--accento); color: var(--carta); border-color: var(--accento); font-weight: 600; }
.btn.primo:hover { filter: brightness(1.12); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.scelta { text-align: left; background: #fffdf7; }
.btn.scelta:hover { background: var(--velo); }
.btn.chiusa { opacity: .55; background: transparent; border-style: dashed; }
.btn.chiusa small { display: block; font-size: 15px; font-style: italic; }
.btn.prova { background: var(--oro); border-color: var(--oro); color: var(--suoro); font-weight: 600; }
.btn.mini { display: inline-block; width: auto; margin: 0; padding: 4px 12px; font-size: 16px; }
.btn.chiaro { color: var(--carta); border-color: var(--carta); margin-top: 14px; }
.copertina { text-align: center; padding: 22px 18px 10px; color: var(--carta); }
.cop { display: block; width: 100%; max-width: 420px; margin: 0 auto 14px; border-radius: 3px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.etichetta { margin: 6px 0 0; font-size: 15px; letter-spacing: .22em; text-transform: uppercase; color: var(--oro); font-weight: 600; }
.sotto { max-width: 440px; margin: 8px auto 14px; font-size: 19px; }
.copertina .pulsanti { max-width: 380px; margin: 0 auto; }
.copertina .btn { color: var(--carta); border-color: var(--carta); }
.copertina .btn.primo { background: var(--oro); border-color: var(--oro); color: var(--suoro); }
.firma { margin-top: 18px; font-size: 16px; letter-spacing: .08em; opacity: .9; }
.foglio {
  background: var(--carta); margin: 14px 10px 0; padding: 18px 20px 22px; border-radius: 4px;
  box-shadow: 0 6px 24px rgba(0,0,0,.35);
}
.foglio h2 { margin: 4px 0 10px; text-align: center; font-size: 27px; font-weight: 600; color: var(--accento); }
.foglio h3 { margin: 22px 0 4px; font-size: 21px; font-weight: 600; color: var(--accento); border-top: 1px solid var(--oro); padding-top: 14px; }
.nota { font-size: 16px; font-style: italic; margin: 4px 0 10px; }
.regole p { margin: 0 0 10px; }
.intro p { margin: 0 0 .8em; }
.intro h3 { font-size: 17px; letter-spacing: .12em; text-align: center; border-top: 0; padding-top: 0; margin: 22px 0 8px; }
.intro h3::after { content: ''; display: block; width: 36px; height: 2px; margin: 6px auto 0; background: var(--oro); }
.intro .btn { margin-top: 18px; }
.valori { display: grid; gap: 6px; }
.valore { display: grid; grid-template-columns: 1fr auto 2.2em; align-items: center; gap: 10px; padding: 6px 10px; background: #fffdf7; border-radius: 6px; border: 1px solid var(--velo); }
.vnome { font-weight: 600; }
.vdadi { display: flex; align-items: center; gap: 5px; }
.piu { font-size: 16px; }
.vnum { font-size: 24px; text-align: right; color: var(--accento); }
.doti { display: grid; gap: 6px; }
.dote { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--velo); background: #fffdf7; cursor: pointer; line-height: 1.35; }
.dote input { margin-top: 5px; width: 20px; height: 20px; accent-color: var(--accento); flex: none; }
.dote small { font-size: 15.5px; }
.dote .bonus { font-size: 15.5px; color: var(--accento); }
.dote.scelta { border-color: var(--accento); background: var(--velo); }
.barra-doti { position: sticky; bottom: 0; margin: 12px -20px -22px; padding: 10px 20px 14px; background: var(--carta); border-top: 1px solid var(--oro); display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; align-items: center; }
.barra-doti #conta { grid-column: 1 / -1; text-align: center; font-size: 16px; }
.barra {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 12px; background: var(--fondo2); color: var(--carta); font-size: 17px; border-bottom: 1px solid var(--oro);
}
.barra b { color: var(--oro); font-weight: 600; }
.barra .r.basso { color: #ffb3a6; }
.barra .btn.mini { margin-left: auto; color: var(--carta); border-color: var(--carta); }
.palline { display: inline-flex; gap: 4px; }
.palline i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--oro); }
.palline i.usata { background: var(--oro); }
.num { text-align: center; font-size: 26px; font-weight: 600; color: var(--accento); letter-spacing: .05em; }
.num::after { content: ''; display: block; width: 46px; height: 2px; margin: 6px auto 12px; background: var(--oro); }
.ill { margin: 0 -20px 14px; }
.ill img { display: block; width: 100%; height: auto; }
.testo p { margin: 0 0 .8em; }
.nemico { margin: 0 0 10px; padding: 6px 10px; border-left: 3px solid var(--rosso); background: #fffdf7; font-weight: 600; }
.nemico small { font-weight: 400; }
.note { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.note span { font-size: 16px; padding: 3px 10px; border-radius: 14px; border: 1px solid var(--accento); background: #fffdf7; }
.note .nota-male { border-color: var(--rosso); color: var(--rosso); }
.azioni { margin-top: 14px; border-top: 1px solid var(--oro); padding-top: 8px; }
.riquadro { margin: 10px 0; padding: 12px 14px; border: 1.5px solid var(--accento); border-radius: 8px; background: #fffdf7; }
.titolo-r { margin: 0 0 6px; text-align: center; font-weight: 600; font-size: 20px; color: var(--accento); letter-spacing: .03em; }
.esito { text-align: center; font-weight: 600; font-size: 21px; margin: 6px 0; }
.esito.ok { color: #2f6b3a; }
.esito.ko { color: var(--rosso); }
.dadi-grandi { display: flex; justify-content: center; align-items: center; gap: 8px; min-height: 58px; flex-wrap: wrap; margin: 6px 0; }
.somma { font-size: 24px; font-weight: 600; }
.chi { font-size: 15px; font-style: italic; }
.dadi-grandi.due { gap: 18px; align-items: flex-start; }
.tiro { display: grid; grid-template-columns: auto auto; gap: 4px 6px; justify-items: center; max-width: 46%; }
.tiro .chi { grid-column: 1 / -1; text-align: center; line-height: 1.2; }
.registro { font-size: 16px; border-top: 1px dashed var(--velo); margin-top: 6px; padding-top: 4px; }
.registro p { margin: 2px 0; }
.vita { margin: 6px 0; font-size: 16px; }
.traccia { height: 9px; background: var(--velo); border-radius: 5px; overflow: hidden; }
.riemp { height: 100%; border-radius: 5px; }
.riemp.io { background: var(--accento); }
.riemp.lui { background: var(--rosso); }
.morte { border-color: var(--rosso); text-align: center; }
.morte .titolo-r { color: var(--rosso); letter-spacing: .1em; }
.dado {
  display: inline-grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); width: 46px; height: 46px; padding: 6px;
  background: #fffef9; border: 2px solid var(--inchiostro); border-radius: 9px; box-shadow: 0 2px 0 rgba(0,0,0,.25);
}
.dado i { display: block; margin: auto; width: 8px; height: 8px; border-radius: 50%; }
.dado i.p { background: var(--inchiostro); }
.dado.piccolo { width: 30px; height: 30px; padding: 4px; border-width: 1.5px; border-radius: 6px; }
.dado.piccolo i { width: 5px; height: 5px; }
.dado.gira { transform: rotate(var(--g, 12deg)); }
.dado.gira:nth-child(2n) { --g: -14deg; }
.fine { text-align: center; background: var(--fondo); color: var(--carta); margin: 6px -20px -22px; padding: 22px 20px 24px; border-radius: 0 0 4px 4px; }
.cop-piccola { width: 150px; border-radius: 3px; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
.fine-sopra { margin: 12px 0 0; font-style: italic; }
.fine h2 { color: var(--oro); margin: 6px 0 8px; font-size: 26px; line-height: 1.2; }
.compra { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; max-width: 420px; margin: 10px auto 4px; }
.compra .btn.primo { background: var(--oro); border-color: var(--oro); color: var(--suoro); }
.compra small { display: block; font-size: 14px; font-weight: 400; }
.sito { margin: 10px 0 0; font-size: 18px; }
.sito a { color: var(--oro); }
.scheda { position: fixed; inset: 0; z-index: 20; background: rgba(10,12,16,.55); display: flex; justify-content: flex-end; }
.scheda-dentro { width: min(380px, 92vw); height: 100%; overflow-y: auto; background: var(--carta); padding: 16px 18px 24px; box-shadow: -6px 0 24px rgba(0,0,0,.4); }
.scheda h3 { margin: 0 0 8px; color: var(--accento); font-size: 24px; }
.scheda h4 { margin: 14px 0 4px; color: var(--accento); font-size: 18px; border-bottom: 1px solid var(--oro); }
.scheda ul { margin: 4px 0; padding-left: 20px; }
.scheda li { margin: 3px 0; }
.scheda .pulsanti { margin-top: 18px; display: grid; gap: 8px; }
.scheda .btn.mini { justify-self: center; }
@media (max-width: 420px) {
  body { font-size: 18px; }
  .foglio { margin: 10px 6px 0; padding: 14px 15px 18px; }
  .ill { margin: 0 -15px 12px; }
  .fine { margin: 6px -15px -18px; }
  .barra-doti { margin: 12px -15px -18px; padding: 10px 15px 12px; }
  .barra { gap: 9px; font-size: 16px; }
  .compra { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .dado.gira { transform: none; } }
.w0{width:0%}.w5{width:5%}.w10{width:10%}.w15{width:15%}.w20{width:20%}.w25{width:25%}.w30{width:30%}.w35{width:35%}.w40{width:40%}.w45{width:45%}.w50{width:50%}.w55{width:55%}.w60{width:60%}.w65{width:65%}.w70{width:70%}.w75{width:75%}.w80{width:80%}.w85{width:85%}.w90{width:90%}.w95{width:95%}.w100{width:100%}</style>

h, your sleep, the courage you have left.","🧠 Skills do not change your numbers: they open a path, or let you pass a test without rolling the dice.","🚩 The words and items the book tells you to note are kept for you: you will find them on your **Sheet**, with what you have in your bag.","Whoever makes a mistake is not hurt: he forgets why he came, and finds himself back on the train. In this demo you have **six choices**; if your story ends sooner, you start again from §1."],"dotiTit":"Choose five skills","fineTesto":"The rest of Padre Marcus's three days and three nights in Caligo awaits you in the book.","doti":[{"n":"Latin and the Ritual","b":"","d":"You read inscriptions, registers and forms in Latin; you know by heart the responses of the Mass and the hours of the breviary."},{"n":"Tongues of the Works","b":"","d":"German, French, half of Italy in dialects. And you can tell when a language is none of these."},{"n":"Eye for Papers","b":"","d":"Handwritings, seals, stamps, cut pages: papers speak to you."},{"n":"Doctor's Hand","b":"","d":"You know how to bandage, take a temperature, give rest to the tired: yourself included."},{"n":"Tunnel Craft","b":"","d":"Dark, cellars, rising water, a lamp that acts up: you spent twenty years in it."},{"n":"Mountain Footing","b":"","d":"Stairs, roofs, slippery piers: your breath fails you, your foot does not."},{"n":"Friend of Beasts","b":"","d":"You know what frightens a dog, a mule, a bird, and why."},{"n":"Pulpit Voice","b":"","d":"When you speak in a full church, they hear you at the back too."},{"n":"Confessor's Ear","b":"","d":"People always tell you one thing more."},{"n":"Patience at the Counter","b":"","d":"You know which form is needed before they tell you."},{"n":"Memory for Voices","b":"","d":"A voice heard once you recognize in the dark, behind a door, inside a choir."},{"n":"Chess by Mail","b":"","d":"Twelve years of games with the doctor: you can see the square no one is looking at."}],"negozi":[{"f":"scopri"," es your way.","fortBonus":"(+1 for your skill)","corsaBonus":"(with {d}, 6 is enough)","agiOk":"You make it.","agiKo":"You do not make it.","fortOk":"It goes your way.","fortKo":"It goes against you.","vaiA":"Turn to §{n}","tu":"You","attacca":"⚔️ Roll the dice","roundRiga":"You {a}, {n} {b}:","colpisci":"you hit, −2 to the enemy.","colpito":"you are hit, −2 to you.","pari":"a tie, nobody is hurt.","dodici":"double six, a sure hit: −2 to the enemy.","due":"double one, a miss: −2 to you.","lamaRiga":"Short Blade: you reroll the {x} and get {y}.","vinto":"You won the fight.","perso":"You lost the fight.","zeroTit":"❤️ Your Vigor has dropped to zero.","morteTit":"Your story ends here","morteRes":"Your Vigor has dropped to zero.","morteNota":"In the demo you start again from §1, with new scores and the same skills.","ricomincia":"Start again from §1","fineSei":"You have made your six choices.","fineFuori":"This path leads beyond the demo.","fineTit":"Your adventure continues in the book","cartaceo":"Paperback","ebook":"Ebook","scopri":"Discover the book","sito":"All the gamebooks at intreccidicarta.com","rigioca":"Play the demo again","noscript":"The demo needs JavaScript turned on in your browser.","descr":"Playable demo of {t}, a gamebook by Peter Palmer: the opening pages, to play in your browser.","titoloPagina":"{t} · Playable demo · Peter Palmer","introTit":"Introduction","continua":"Continue","vaiUno":"Turn to §1","inBorsa":"In your bag","restaUno":"❤️ Vigor at zero: you stay at 1"},"par":{"1":{"t":"The train slows. You feel it in your knees before you hear it: the brakes bite, the third-class car gives a jolt, and your bag slides a hand's breadth along the wooden bench. You stop it with your boot.\n\nSomeone has left the window down by two fingers, and through the gap the fog comes in. You had never seen it board a train. It comes in low, like the smoke of a stove that draws badly, and it brings the smell of the place with it: salt, pitch, wet coal and, deeper down, fish. A port. On your lips it leaves a cold that tastes of iron.\n\n“Caligo! Caligo station!” the conductor shouts in the corridor, in the voice of a man who has been saying it for thirty years and no longer expects anyone to get off.\n\nYou get up. Fifty-nine years get up in two movements: first the back, then the rest. You pass the strap of the bag over your shoulder, and the miner's lamp hanging from it strikes the buckle with its tin knock: in the tunnels, that sound meant the priest was coming. From the luggage net you take down your iron-shod staff. Your round glasses have fogged over, and you wipe them on the hem of your cassock, which is worn thin in exactly that spot.\n\nIt is Wednesday, October 30, 1912, and the station clock says four in the afternoon. At this hour, back in your village, the sun is still on the peaks. Here evening began after lunch, and at dusk you do not see well. On the platform they have already lit a light, only one, white, on top of a cast-iron column. It does not flicker: it is not a flame. It makes a sharp circle on the paving stones, and outside the circle things lose their edges.\n\nIn your pocket, over your chest, you have an envelope. You touch it through the cloth, the way a man touches his wallet in a crowd. You have no need to take it out: you know the address by heart, written in a fine chancery hand.\n\n“To the Reverend Padre Marcus, care of the Venerable Curia of Caligo.”\n\nPadre is what they call a friar, and you are no friar: you are a mountain priest, the son of a stonecutter from the Ossola. Marcus is only the way you sign, ever since the days when, in the tunnel works, it was the one word that Germans, Frenchmen and Piedmontese all read the same. In some office they have taken a signature for a Christian name.\n\nYou are Don Marco. But the envelope got here before you, and here they have already decided.\n\nFor twenty-eight years the dioceses have been sending you to look closely at the things that frighten people: a stable the animals refuse to enter, a woman who no longer knows her own children, an old man who talks with his dead wife and reports her answers. You look, you touch, you sniff, you count the paces from one door to the next. Then you write a line, always the same one, and the line says to call the doctor. The Ritual, in your bag, has the pages of the rite at the back. You know them by heart, and you have never pronounced them. Not even once.\n\nYou step down. The footboard is high and wet, and your left knee lets you know it. Under the station canopy the white is thinner. There are twenty or so people, standing still, their bundles at their feet, pressed close to one another: people who already know the cold. They are not there for the train. When it stopped, not one of them raised a head. From the roof a drop falls now and then, and you hear it strike the wood.\n\nAt the end of the platform, inside the circle of the light, is the exit, and beside the exit a railway cap leaning on a cart: a porter.\n\nThe locomotive lets out its steam and falls silent. You have a heavy bag, a staff, and a city of which you know only the wrong name it has given you. You have to start looking somewhere.","dec":1},"2":{"t":"One. You say it with your lips and nothing more, and your foot does the rest.\n\nYou count under your breath, as in the tunnels, where a number spoken aloud made the whole crew turn around. The stone is wet and the nails bite into it well; in the middle each step holds a finger of water, which splashes your ankles. Along the right-hand wall runs an iron handrail. You take hold of it at the twelfth step and let go at once: it is freezing, and it sticks to your fingers.\n\nTwenty. Thirty. The white opens in front of Larìn and closes again behind you, and of the whole stairway only the six steps the two of you are standing on exist. He climbs with the two bags and never changes his pace. You miss the tin knock of the lamp against the buckle, which has always kept time for you on a climb: tonight he is the one carrying it.\n\nSixty. Your left knee had its say long ago. Eighty. Your breath comes out with a whistle you know, the one from the long flights, and in your mouth there is a taste of iron. Ninety.\n\nAt the hundredth you stop. It is not you who decide: your legs decide, and you find yourself with one hand on the wall, which is cold and sweating. Three steps higher Larìn has stopped climbing too. He has set down one bag and is bent over a shoe, retying a knot that was already tied: he has good shoes, the shoes of a cobbler's son, and the laces pulled tight. When you straighten up, he straightens up.\n\nA hundred and one.\n\nOn the last steps the light changes. The fog stays down below, all of a piece, at its own level, and you come out of it first with your head and then with your shoulders. The air up here is dry and smells of stone. The last step is wider than the others.\n\n“A hundred and thirty-two. In the tunnels you would already have died of old age,” you think, and you feel like laughing to yourself, with no breath to do it.\n\nBefore you lies an empty forecourt, and at the far end the cathedral: black, without a single light, tall against a sky that still holds a remnant of day. Beside it rises the bell tower, with the face of its clock. You stand looking at it until your chest quiets, and in all that time not one stroke comes down from up there.\n\n*Note on your sheet: 132 STEPS.*","f":"132 STEPS","img":0},"3":{"t":"The climb begins right after the station square, without warning, and pulls straight up between two walls. The paving is humpbacked, with a gutter down the middle where a thread of water runs. Here the fog does not come from the sea: it comes down. It descends from the top of the street, to meet whoever is going up, and with every breath you swallow a mouthful of it that tastes of salt.\n\nTen paces ahead of you there is a sound of hooves, slow, and a small flame swinging three meters off the ground.\n\nIt is an old man in a cape, with a ladder on his shoulder and a long pole in his hand, which carries a lit wick at its tip. Beside him walks a gray mule, with two kerosene lanterns hanging at her flanks. When she comes under a street lamp the mule stops, on her own, without a word and without a tug. The lamplighter raises the pole, feels for the burner inside the glass, and the gas catches with a small pop, like a cork: a yellow flame, fan-shaped, that hisses. Around it the fog turns to gold for a hand's breadth. The mule sets off again, and he follows.\n\nYou catch up with them at the next street lamp: not because you ever catch up with anyone on a climb, but because they have to wait for the gas. Up close the animal smells of wet hide and warm kerosene, and her back is steaming. Larìn says good evening without stopping. The old man turns, and before he looks you in the face he looks at your boots: the nails, the sole, the mud of another place. From there he climbs to your glasses, and he seems satisfied with the order in which he has done things.\n\n“She knows her trade,” you say, nodding at the mule.\n\n“The mule has more sense than the Town Hall,” says the lamplighter. “She stops where there is a light. The Town Hall doesn't.”\n\nHe sets off again, and the two of you with him: the pace of a man who lights lamps is exactly yours. In the band of his hat, above his ear, he keeps a card tucked, the size of a holy card. When he passes under the new flame you see that it is covered with lines, and that at the end of the lines there is the round mark of a stamp. More than that, with your eyesight, cannot be read from here.\n\nYou could ask him. Or keep quiet and save your breath for the street, which wants plenty.","dec":1,"img":1},"4":{"t":"You untie the string, which has a postal-parcel knot, and spread the files in a fan on the table, like a hand of cards. You open none of them. You study them from the outside, which is the way to begin: the cardboard is rough, new, and gives off the smell of the bindery's glue. You pinch one: there is not much inside, one sheet, perhaps two.\n\nOn each cover, at the top right, there is a large number in ink, and in the middle a place, in the fine chancery hand. You read them in order, moving your lips.\n\nOne: San Rocco, the Three Stairs tenement. Two: the Hill, the cathedral bell tower. Three: the Darsena, the pier and the lighthouse. Four: the Darsena, the Calata. Six: Borgo Nuovo, Via dei Mille. Eight: the Cartiere, the Bricchi farmhouse. Ten: the Cordai, the cisterns.\n\nThe names tell you little: the cathedral, at least, you know where it is. You go back with your finger, from four to six, from six to eight.\n\nThe chancellor has followed your finger.\n\n“Protocol numbers. Five, seven and nine were filed away by the three who came before you.”\n\n“Three priests?”\n\n“Three opinions.” He wets his nib. “They have a number and a shelf.”\n\nAnd he starts writing again: the point scratches, falls silent, scratches. Beyond the door someone coughs, and a chair scrapes.\n\nThe covers are printed, all alike. At the top, above the number, runs a line in printer's type:\n\n“To the eight parishes of the city, for information.”\n\nAt the bottom, near the edge, there is a box with a double border, and inside it two words in Latin, small. With your eyesight and this lampshade, to read them you would have to bend until your nose brushed the cardboard.\n\nYou raise your head to rest your eyes. Behind the chancellor, at the limit of the oil lamp's glow, a map of the city hangs on the wall, as wide as a door, in color: from here you can make out the patches of the tints and the blue of the sea at the bottom, and not the names. You would have to get up and stand under it.\n\nMeanwhile he has opened a drawer and is searching in it, methodically, one sheet at a time. You can also put everything back in your bag, close it and let him search: in a Curia, whoever waits sitting down is already halfway there.","dec":1,"img":2},"5":{"t":"You take three steps toward them, and the smell reaches you before the faces do: wet wool, wood smoke caught in their clothes, shoe tallow. It is the smell of your valleys in November, and you find it again here, by the sea.\n\nThey are people from the Apennines. The iron-shod clogs say so, the bundles tied with a double knot, the way of standing of those who grew up on a slope. They stand in a row along the wall under the canopy, the men on the side of the track and the women against the bricks, with the children in between, where the wind does not get in. A mother blows on a little girl's fingers, one finger at a time.\n\nOn their shoulders they all have the same blanket, gray, new: it still has its fold marks and smells of a warehouse. To one corner of each, with two stitches of thick thread, is sewn a seal of sealing wax the size of a button.\n\n“Where are you from?” you ask the first, a broad man with a sleeping little girl in his arms.\n\nHe names a village you do not know, and with his chin he points to the mountain, behind the station, where there is only white.\n\n“We're waiting for the wagon to the Darsena,” he says. He keeps his voice low, because of the little one. “The steamer sails on Saturday.”\n\n“And until Saturday?”\n\n“There are three hundred of us, in the sheds on the pier, Father. The blankets they gave us. The cold they didn't, that we brought ourselves.”\n\nBehind him someone laughs through his nose.\n\nYou count the blankets, which is your way of looking: twenty. The people are twenty-one. At the end of the row, where the circle of the lamp does not reach, there is a stooped old man who has no blanket. He wears a priest's overcoat that is too long, covering his ankles, and he holds his hat in his hand. No bundle at his feet. From his belt hangs a key ring, a big one, the kind for a street door, without a single key: when he moves it does not jingle. He speaks to no one, and he does not have the look of someone who is leaving. He stands there the way you stand under an arcade when it rains, because people are there already.\n\nYou look at him a little too long. He turns toward the wall, and shows you his back.\n\nBeside the exit the railway cap is still leaning on its cart.\n\n*Note on your sheet: THE SHEDS.*","f":"THE SHEDS","img":3},"6":{"t":"The arches belong to a low arcade, vaulted in stone, as long as a nave. Under it, footsteps change their voice: the nails of your boots, which were knocking on the paving, here boom, and it feels as if there were three of you. A street lamp spreads its yellow fan against a pillar and leaves the corners in the dark.\n\nBeside the street lamp there is a wooden notice board: the one for the Town Hall's notices, a small plate says. It is empty. In the middle of the boards a nail and a little glue are left, and the glue is old: you try it with your fingernail and it comes away in flakes, yellow, dry. For a long time, up there, no one has had anything to make known.\n\nAt the corner, where the arcade turns, a man is standing. He has a leather apron that reaches his shins, shiny on the thighs, and he holds his hat by the brim, in front of him. He does not hold it out and he does not move it: he holds it. He smells of leather and cobbler's wax even at three paces. A woman passes with a basket, a man passes with a sack, and he asks nothing of either. At the sound of your nails he tilts his head slightly: he is counting the blows of a hammer that is not his own. He goes back to watching the street.\n\nThe boy walks past him without looking at him and without slowing down. He does it with care, holding his head straight.\n\n“My father waits. It's his job, now,” says Larìn, when you are past.\n\nAnd he lengthens his stride.\n\nAt the end of the arcade the stairway begins. It is straight, narrow between two high walls, with stone steps hollowed in the middle by those who climbed before you. You can see twenty of them, wet, each with its glistening edge. After the twentieth there is no more stair: there is the fog, which closes it like a door.\n\nIn the tunnels every stair was counted, to know how much rope was needed, and this one you would gladly count, from the first step to the last. But behind you, lower down, Caligo has begun to light its windows, and anyone who climbed turning around now and then would see a little more of it at every halt. The two things together, with your breath, cannot be done.","dec":1,"img":4},"7":{"t":"You stop, with one hand on the banister, and motion for him to speak.\n\nHe was not expecting it. He stays a moment with his cap in midair; then he clamps it under his arm, draws breath all the way down, twice, and stands up straight. Up close he is older than he seemed on the stairs: his mustache is yellow with tobacco and, on the front of his jacket, just where he keeps his fingers, the cloth is shiny, worn in the shape of a palm. He smells of mothballs and of stairs taken in a hurry.\n\nHe says it all. Slowly, spacing the words, with his eyes on a point above your shoulder: it is not the voice of a man asking a question, it is the voice of a child reciting his poem before the bishop, afraid of losing the thread if he is interrupted.\n\n“Excuse me, do you know the parish priest of San Biagio in Sottoriva? I have something for him, from the time of the old bishop.”\n\nThe sentence finished, he shuts his mouth and waits, and in the stairwell the only sound is the gas.\n\nYou search. You do it in earnest, out of respect: but of Caligo you know one platform, one climb and one stairway, and the name of that parish was not on any of the papers they sent you.\n\n“I don't know him,” you say. “I came in on the four o'clock train.”\n\nHe nods, not at all disappointed. What he is carrying, he does not say. You do not ask. In a Curia other people's papers are left where they are.\n\n“Thank you, Father,” he says. “You are the first, in weeks, to let me finish.”\n\nHe says it with no reproach for anyone. He presses his cap back on his head, gives you a bow that comes from his back more than from his neck, and starts down again, quickly, making the steps sing one after another. At the landing below you hear him slow down: someone is coming up.\n\nUpstairs the little bell gives three more strokes, and you still have two flights to go.\n\n*Note on your sheet: THE PARISH PRIEST OF SAN BIAGIO.*","f":"THE PARISH PRIEST OF SAN BIAGIO"},"8":{"t":"The porter already has his eye on you. He pushes off from the cart, lifts two fingers to his visor and comes to meet you: twenty years old, red ears, a railway cap cut for a head bigger than his.\n\n“Give it here, Father.”\n\nHe slips the strap off your shoulder without waiting for an answer. He weighs the bag in his hand and guesses, pleased: “Books. And some iron.” He sets it on the bed of the cart with care. Not the staff: that he leaves to you.\n\nFrom behind the column pops a little boy with no stockings, and he stretches his fingers toward the side of the cart, just to touch.\n\n“Hands off the cart, or you'll get delated!” the porter shouts, laughing.\n\nThe last word is one you have never heard. The little one has: he laughs in turn, and runs off down the platform with his clogs clattering on the shiny paving stones.\n\nNow you are right under the white light. It comes from a glass globe on top of the cast-iron column, and it buzzes: a bluebottle shut in a drinking glass. It has no smell. Around it there is the smell of coal and of the steam the locomotive is losing, but the lamp adds none of its own, and your nose, which has always recognized lights before your eyes did, is left without work. Under that glow the porter's face has lost its color: his ears, from red, have turned gray.\n\nHalfway up, on the cast iron, a brass plaque is screwed. It has been freshly polished: in the grooves of the letters the white of the paste is left. You run your thumb over it, and the metal is freezing.\n\n“This electric light is the gift of Comm. Leandro Bonfante to the City of Caligo. MCMVII.”\n\n“Since this has been here, there's no more stealing at the station,” says the porter, and he gives the column a friendly slap.\n\n“There was stealing before?”\n\n“Before, it was dark.” For him it is the same thing.\n\nHe takes the shafts and pushes. One wheel squeaks at every turn, always at the same point, and you follow him toward the exit, with that squeak ahead of you. Beyond the canopy there is a square, and there the evening begins again.\n\nIf you have Tongues of the Works: You know ten and a half dialects, and that word belongs to none of them."},"9":{"t":"He receives you standing, the chancellor, behind a table longer than an altar. He is a man with the age of offices, with pince-nez and his right hand resting on a bone-handled stamp, the way others rest theirs on a walking stick. A kerosene lamp with a green shade draws the room into a circle: papers in squared piles, an inkwell, a stick of sealing wax beside a little light. Inside the circle the air smells of ink; outside, the shelves climb up to the roof tiles, and their top cannot be seen.\n\nHe looks at the note, then at you.\n\n“Does the summons have a number, Reverend?”\n\nYou take the envelope out of your breast pocket. The number is there: in a corner, small, in red ink, where you had never noticed it. You read it to him. He looks for it in a register, line by line, finds it, and something happens to his shoulders: they drop by a finger. His grip on the stamp loosens.\n\n“Then you exist,” he says, not joking. “Do sit down.”\n\nHe remains standing. From under the table he lifts a bundle and sets it in front of you, flat, careful of the corners. They are files of gray cardboard, tied together with a red string passed crosswise. You count them by their spines: seven. Each is closed along its edge by a red seal, as wide as a five-lire coin. You bring your glasses close to the first: a miter at the top and under it a boat with a sail, inside a ring of Latin letters. The wax has not a crack.\n\n“Seven times, in three weeks, someone has written to the Curia that the devil is in Caligo,” says the chancellor. He pronounces the word without changing his voice, like a protocol number. “Seven letters, seven places. Monsignor the Bishop does not trouble himself for one letter. For seven, the Curia wants an opinion first.”\n\n“Mine.”\n\n“Yours has already cost a third-class ticket.” He adjusts his pince-nez. “I am not asking you to believe. I am asking you to write. One line per file, and your seal beneath it.”\n\nHe pushes the bundle two fingers' width toward you. It weighs less than it promises: there is not much paper in there. You do not touch the seals again. Wax like that is broken on the spot, and you have always worked in this order: first the place, then the paper.\n\n*Note on your sheet: THE SEVEN FILES.*","it":"THE SEVEN FILES"},"10":{"t":"“What's that?” you ask, and with your staff you point at the hat.\n\nThe lamplighter does not answer at once. He waits until the mule has chosen her spot, lights the burner with its small pop, leans the pole against the wall, and only then takes off his hat: his head steams a little in the damp. He slips the card out of the band and puts it under your nose, without letting go of it. He holds it by one corner, his thumb, black with soot, serving as a paperweight.\n\nYou read it by the glow of one of the animal's lanterns, which gives an orange flame and a thread of greasy smoke. The card is limp, swollen with water at the edges, but the ink has held. At the top is the coat of arms of the Town Hall, and under it a printed line: gas lighting service, evening rounds. Then come the lines, numbered in pen. Each has seven boxes, one for every evening of the week, and in every box a little cross; at the end of each line is the round stamp of the office.\n\nYou count the stamped ones. There are seven.\n\nUnder the seventh there is another. It is not in pen: it is in pencil, drawn freehand, with no number. It has its boxes drawn crooked and its little crosses, one for each evening, the same as those above. The stamp is missing, and the space has stayed blank.\n\n“And this one?” You put your finger on it. The pencil is greasy, and it stays on your fingertip.\n\nHe takes the card back, tucks it into the band at the same spot as before, and puts his hat back on. He presses it down well, to his ears.\n\n“The Town Hall pays me for seven. The eighth I do out of habit.”\n\nA man who works more than he is paid for. In the works you knew two of them, in twenty years, and you remember both by name.\n\nHe takes up the pole again. The gas, above you, caught long ago and is hissing in its glass; the mule knows it, and has set off without waiting for anyone.\n\n“Father, the Ave Maria,” says Larìn, four paces higher up, and he knocks one foot against the other. The street still climbs, and at the top, where the walls end, you can make out an open space.\n\n*Note on your sheet: EIGHT ROUNDS.*","f":"EIGHT ROUNDS"},"11":{"t":"The drawer shuts with a bang, and the flame of the oil lamp jumps. The chancellor has found what he was looking for: a stiff card, printed on one side only, and a long, narrow register, which he opens at a page already ruled.\n\nHe hands you the card holding it by the edges. It has the coat of arms of the diocese at the top and a single rule in the middle, in large type, made for a priest with tired eyes:\n\n“Let no priest pronounce the rite over the possessed without the written license of the Bishop, in a secluded place and with few witnesses.”\n\nHe turns the register toward you, dips the pen and offers it to you the right way around.\n\n“Sign here. It is a formality, but formalities are what is left when people go away.”\n\nYou sign the way you always sign, Marcus sac., and the chancery pen, which is better than yours, leaves not even a blot. He dries it with the blotter and checks that the signature sits inside the line.\n\n“With this you also have the faculties for confessions,” he says. “As long as you remain in the diocese.”\n\nThe card must be kept where it will not get lost, and you have only one such place. You take out the Ritual. The leather of the cover is soft, dark where the fingers hold it, and gives off its smell of cold incense and carbide. It opens by itself where it has always opened, at the back, at the pages of the rite. Just before them the book prints its rules, in a dense Latin, with the margins worn by your thumb. The first six you know by heart, in the Italian in which you have always repeated them to yourself. You read them all the same.\n\n“Do not believe too readily that the devil is there.” “First of all, the doctor.” “The signs are three: speaking a language never learned, revealing hidden things, having a strength beyond one's years.” “No questions out of curiosity.” “Do not insult the enemy and do not argue with him.” “Be wary when it seems to be leaving.”\n\nThe seventh is the one you have just signed, and in every diocese it says the same thing in other words: “No rite without the bishop's permission.”\n\nThe eighth is not printed anywhere. It is on the back of the cover, alone, handwritten, in an ink that has turned the color of rust, and the handwriting is already the one you have now. Under it there is a year: 1884.\n\n“What you hear in confession does not exist.”\n\nYou slip the card in there, against that line, and close the book.\n\n*Read now, all the way through, the page of rules beside the sheet.*"},"12":{"t":"The last flight ends under the roof. The Curia of Caligo is in the attic: one long room, with the roof tiles showing between the rafters and certain beams so low that the clerks, going by, duck their heads from memory. You walk straight through: for once, being short is useful. The warmth of the whole house gathers up here, and your glasses mist over. While you wipe them you listen: a stamp striking two blows, one on the pad and one on the paper, the shuffle of a line of people moving up one place, a pen. A smell of paper, of tallow candle, of sealing wax kept warm.\n\nWith your glasses back on, there is this. On the left a row of counters, each with its grille and its small plate, a candle for each. At the far end some small round windows, full of white. On the right a door twice as high as the others, left ajar: through the gap comes a blade of light, stronger than all the candle stubs together, that cuts the floor as far as the middle of the room. In front of it, sitting sideways on a straw-bottomed chair, is a doorkeeper with a rabbit-fur collar on his jacket. He is filing a fingernail.\n\nA gentleman with a paper approaches him. The other does not raise his eyes from his nail file.\n\n“Not now.”\n\nHe says it kindly, and the man turns back.\n\nAgainst the wall, facing the tall door, there is a bench polished by use. On it sits a very old priest, all nose and ears, with an empty basket on his knees and an umbrella between his feet. He sees you there with your bag, and without your asking anything he slides sideways, pulls the handle toward him and pats the wood with his palm.\n\n“Make yourself comfortable. I have been here since 1903.” He says it the way another man would say since this morning, and meanwhile he looks at the doorkeeper with affection, content. “He has never told me no.”\n\nYou do the sum, nine years, and you sit down. The bench is warm.\n\nAt the nearest counter the line is four people long, and the last is a stooped old man, in a priest's overcoat that sweeps his shoes. At his belt, at every step, an empty key ring knocks against his hip without a sound. When no one is left between him and the grille, a woman comes in with a sheet of paper: he takes a step to the side, gives her his place and gets back in behind her, unhurried.\n\nA small door, beside the counters, opens.\n\n“The Reverend Padre Marcus,” a voice calls. “With his note.”","img":5},"13":{"t":"On the forecourt, when your breathing is once more that of a Christian, Larìn gives you back your bag. He puts it on your shoulder himself, and points to a low door in the side of the cathedral, with a stone coat of arms above the lintel: the Curia. He settles his leather bag on his hip, and he has already turned the corner. All that is left of him is the sound of his shoes down the stairway, which the fog takes at once.\n\nBefore going in you turn around. Below you the white makes a floor, and under the floor Caligo is lighting up: a yellow glow, scattered, that trembles everywhere like embers under ash, and lower down, to the left, a white patch that does not tremble at all.\n\nInside, the stairs are of wood. They climb in short flights around a narrow well, and at every flight a gas burner gives more smell than light. Under that sweetish smell there is the other one, which you would recognize with your eyes shut in any diocese: old paper, glue, dust, sealing wax. The steps creak each with its own note. On the landings there are doors with the number painted in black on an enamel oval, and the numbers go their own way: 3 next to 11, and a 9 all alone, on a landing that has no other doors. You look for a rule, and find none.\n\nOn the second landing someone is coming down in a hurry. He is a sturdy man, about sixty, in a dark uniform worn at the elbows, with metal buttons and a cap with a badge: the dress of the runners, the same in all the Curias. He keeps one hand open on his chest, and coming down he does not take it away. Ahead of him a young priest is climbing with a sheaf of forms, and the man bars his way politely, taking off his cap.\n\n“Excuse me, do you know the parish priest…”\n\nThe wood of the stairs carries off the rest. The priest spreads his arms, forms and all, and goes straight on up without ceasing to smile.\n\nThe runner takes no offense. He puts his cap back on, sees you, takes it off again, and starts over from the beginning, with the same courtesy: “Excuse me…”\n\nAbove your heads a little bell rings, three quick strokes. You know it, because every Curia has one: it means the chancery closes in half an hour.","dec":1},"14":{"t":"On the square someone is running: soles on the wet, and at every step the slap of something leather against a hip. And the fog delivers him to you all at once inside the glow of the lamp: a slim boy, about seventeen, in a short oilcloth cape, the kind fishermen wear, which under the electric light glistens like the back of a sardine. Slung across him he carries a leather bag too big for him: it knocks against his knee.\n\nHe stops a pace from you, and he is not even breathing hard.\n\n“The Reverend Padre Marcus?”\n\nHe does not wait for the yes. He lifts the flap, rummages among the envelopes with two fingers, chooses one and holds it out to you with both hands, elbows tight. It is a note folded in two, with the chancery's letterhead printed at the top. The paper is thick, damp at the edges, and it smells of oilcloth too. Inside, two lines in an office hand, round and without a smudge: the chancellor expects you today, before the Ave Maria. It does not say “if you please.”\n\n“Who gives them to you, to deliver?” you ask, just to say something, as you fold it again.\n\n“They were already in the bag.”\n\nHe says it quickly, while he closes up: it is an answer he has ready. He raises his head.\n\n“Larìn,” he says. “With the accent at the end. I'll carry it up.”\n\nHe takes your bag off the cart before the porter has opened his mouth, and slings it over his other shoulder. Now he has one on each side, and in the middle there is not much boy. He does not bend by a finger.\n\n“The cart stops at the arcade, and after that there are the steps,” he says to the porter.\n\nThe porter looks at the empty bed of the cart. You give him a coin for those ten meters, and he touches his visor twice.\n\nLarìn is already ahead. Outside the white circle the cape stops glistening and becomes a darker patch going up: the street, from here, goes only upward. You grip your staff and follow him. Before the Ave Maria means before night, and in Caligo the dark already has one foot inside the door."},"15":{"t":"At the top the street levels out all at once, and your legs, which had grown used to the slope, take a step into nothing. There is an open space, a wall with ivy, and against the wall the last street lamp of the row: an iron arm, a glass cage, the same as the others.\n\nThe mule goes under it and stops. Her master lifts the pole, slips the lit wick into the cage and feels for the burner. He finds it: you hear iron touch iron, a small tap. You wait for the pop, which you know by now.\n\nIt does not come.\n\nThe little flame of the pole stays in there, small, licking the burner. Nothing catches. The glass, all around, remains black.\n\nHe lowers the pole, examines the wick, cleans it between two fingers, and the smell of burnt oil reaches as far as you. He raises it again. This time he holds it up for a long while, his arm trembling slightly with the weight, and moves the tip this way and that, the way you search for a keyhole without a candle. Iron against iron, twice. No hiss.\n\nThe mule shifts her hooves by a step. The lanterns swing at her flanks, and on the wall your three shadows lengthen and shorten.\n\nNo one opens his mouth. Larìn, who is always in a hurry, stands there too, with the two bags. All three of you are under that unlit glass, heads tilted back, and the fog passes between you: you feel it on your face, wet, and you see it walking only where it crosses the glow of the lanterns. You turn around. Behind you the climb runs straight down, and the lights that are lit are all in their places, one below the other, each with its yellow halo, smaller and smaller down to the white dot of the station. Only this one is missing.\n\n“The burner is broken,” says the lamplighter. “Tomorrow I'll tell the Town Hall. Tonight I'm telling you, since you look to me like a man who listens.”\n\nHe shifts the ladder to his other shoulder. He clicks his tongue, and the mule comes away from the wall and turns into an alley, toward other street lamps. He touches his hat and follows her, without looking back.\n\nLarìn shakes himself. Ahead, twenty paces on, there are arches."},"16":{"t":"The chair creaks when you leave it. You go and stand under the map, on the pretext of stretching your legs.\n\nIt is a handsome map, mounted on canvas, with two black rods at top and bottom and a yellowed varnish cracked like an old painting. In a scroll, between two dolphins, is the date: 1890. It smells of dust and gum arabic. Whoever drew it loved his work: every stairway has its little strokes, the sea has its waves all alike, and the cathedral, at the top, is a black cross the size of a fingernail.\n\nThe districts are tinted in watercolor, each in its own color, with the name in the middle in capital letters. You get your nose within a hand's breadth of it, because the oil lamp is behind you and you stand in your own light. The Hill, straw yellow. To the left San Rocco, pink, and below it, on the sea, the Darsena, pale blue. On the flat, on the other side, Borgo Nuovo, light green; farther on the Cartiere, along the blue line of a stream. At the far end, on the flank of the mountain, the Cordai, brick red. Outside a gate, in a rectangle dotted with little crosses, the Cemetery.\n\nYou count them with your finger, touching each name. You count them again from the other side, the way survey stakes are counted twice.\n\n“Seven. The parishes, according to the heading, are eight. A city can have more parishes than districts,” you think. “It happens.”\n\nYou have seen hamlets of four houses with two parish priests who did not greet each other.\n\nBehind you the drawer has stopped sliding. You turn around. The chancellor has a sheet of paper in midair, and is observing you over his pince-nez. He says nothing. He puts his eyes back in the drawer.\n\nYou go back to the map. Your finger, moving down, stops under the Cordai. Between the brick-red houses and the edge of the sea the paper changes: it is lighter, a chalky white, and under your fingertip it has the raised nap of a sheet scraped with a penknife and gone over with a brush. There are no waves there, and no little strokes either. Old maps are full of second thoughts: a pier that was never built, a street the draftsman got wrong. They get scraped and painted over.\n\nOn the table the files wait in their fan, with their boxes at the bottom, which you have not read. And the bag is there, with its mouth open.\n\n*Note on your sheet: SEVEN DISTRICTS.*","f":"SEVEN DISTRICTS","dec":1},"17":{"t":"Behind you the chancery door closes, and the key turns twice. In the long room the candles at the counters go out one after another, blown out by someone in a hurry to have supper. You go down one flight, to the landing of the 9, the one that has no other doors: there is a gas burner hissing, a small round window full of black, and a windowsill as wide as a lectern. No one comes by.\n\nYou set the bag on the sill to settle the load: the files flat, against the back, the Ritual on top. Your hand goes down to make room and at the bottom, between the folded stole and the little sack of flour, finds a thing it knows better than the breviary. Boxwood, round, polished by your palm. You take it out.\n\nIt is your stamp. Beside it, in its tin box, is the ink pad, and when you lift the lid the greasy ink gives off the smell of all the offices where you have closed a case. You turn the stamp toward the flame. The rubber letters are backward, but you have been reading them the right way around for twenty-eight years:\n\n“IT IS NOT THE DEVIL. CALL THE DOCTOR. Marcus sac.”\n\nThe windowsill is enough. One stamp per cover, at the top, above the number, without breaking a single seal: the wax would stay whole, the bundle would be back in the anteroom before the doorkeeper had finished buttoning up, and at ten past eight there is a train, you read it on the board as you got off yours. Tomorrow morning you would see the sun on the peaks. And it would not be a lie: you would be right six times out of seven, as always. It is your average, and no doctor has a better one.\n\nOr else the stamp goes back where it was, under the stole. The chancellor, as he dismissed you, told you where you sleep: at the rectory of San Rocco, under the arcade and then two alleys to the right, downhill. There is a priest's housekeeper who has been told. It means doing the stairway the other way, in the dark that has risen meanwhile, and from tomorrow knocking on doors, one district after another.\n\nYou hold the stamp poised above the pad. It weighs little.\n\n“Do not believe too readily. That goes for the stamp too,” you think.\n\nFrom the stairwell a voice rises. You recognize it by its courtesy: it is the runner, who has stopped someone on the lowest landing and has begun his question over from the beginning, with the usual words. Footsteps go around him and away. You hear him going down, slowly, toward the next one.","dec":1},"18":{"t":"You bend over the first file of the fan, fists on the edge of the table, until your nose brushes the cardboard. At that distance your glasses are finally of use.\n\nThe box sits in the bottom corner, shut in its double border. It is the place where every office in the world writes who brought the denunciation: first name, surname, parish. Here there are only two words.\n\n“Delator: ignotus.”\n\nYou read them with your eyes, without moving your lips. You do what you would do with a doubtful coin: you run your fingernail over it. The place, in the middle of the cover, is written in pen, and the ink has stayed raised, shiny. Not these two words. They have gone into the cardboard, black and dull, and on the reverse your fingertip feels their bite. Lead, not a nib.\n\nYou pick up the second file. The sixth. The tenth. The box is the same on all seven, at the same height, with the same border; even the g has the same little tail, that of a slightly tired piece of type, left in the form for the whole print run. After the second word there is no line, there is not a dot: no one has left the space to write a name in.\n\nA short laugh escapes you, and you smother it in your sleeve so as not to disturb the man who is writing. In twenty-eight years you have seen forms for everything: for the candles at Candlemas, for the rental of pews, for the marriages of the deaf. A form that knows the answer in advance you had never met. Here the Curia has foreseen at the printer's that the one who denounces does not sign, and has had a few hundred of them printed, to judge by the type.\n\nThe chancellor raises his head at the noise, sees what you are studying, and lowers it again: a box.\n\nYou put the files one on top of another, in order of number, pass the red string crosswise again and lower the bundle into your bag. The cardboard, between your fingers, is as cold as when they gave it to you: none of those papers has been in anyone's hand long enough to grow warm.\n\nIf you have Latin and the Ritual: Delator: one who carries a name to someone's ear. The Latin of the Curia is kinder than Italian.\n\n*Note on your sheet: DELATOR.*","f":"DELATOR"},"57":{"t":"You see it from the last steps of the stairway: under the arcade, where an hour ago there were a nail and a crust of glue, there is now a white rectangle.\n\nGoing down is worse than going up. The bag, with the seven files in it, pulls your shoulder forward at every step, and one knee takes the weight before the other. The handrail, soaked, freezes your palm. The staff goes down first and feels for the stone, because at this hour your glasses are of little use: of the descent you see the three steps under your feet, and the rest you feel with its tip. The fog caught you again halfway down and will not let go: the air is wet, it carries the coal smoke of the port, and it settles on your cheeks.\n\nThe street lamp beside the notice board hisses in its blackened glass and gives a short yellow glow that reaches the sheet and little farther. The sweetish smell of gas clings to your palate. In that glow the paper is still swollen with damp. You touch a corner of it: the glue is cold, it gives, and leaves on your fingertip a paste that smells of flour.\n\nYou read with your head tilted back, through the good part of your lenses.\n\n“The citizens are invited to keep a light in the window on the nights of All Saints and of the Dead, as is the ancient custom.”\n\nBelow, the signature: “The Municipal Secretary.” And the round stamp of the Town Hall.\n\nTwo women stop behind you. They are carrying a basket between them, a handle each. The nearer one reads under her breath, down to the last word.\n\n“That's right,” she says to the other. “For All Saints and for the Dead there has always been a light in the window. My mother put one there, and my mother's mother.”\n\n“And they always paid for the oil themselves,” says the other, and pulls the basket her way.\n\nThey go off toward the east, arguing about what a quarter liter costs. At the corner where in the afternoon the man in the cobbler's apron was standing, there is no one anymore.\n\nThe rectory is that way: two alleys to the west, gently downhill. You wipe your finger on the hem of your cassock, shift the strap to the other shoulder and leave the street lamp behind you. In the first alley its glow ends after three doors; the washing hung out drips from one balcony to the next, and a drop hits you square on the neck."},"72":{"t":"Seven blows of the stamp, one per cover. The boxwood strikes the cardboard, short, an office sound, and no sealing wax is broken. You leave the files in the anteroom, tied with their red string.\n\nThe ten past eight train is half empty, and the wooden bench jolts your back at every joint in the rails. Through the glass you can see the slope up from the station, with its row of lit burners and, at the top, the last one dark. You fall asleep with the Ritual on your knees.\n\nYou have written the usual line on seven files you did not open.\n\nYou no longer remember why you came. Then you forget even that you have forgotten.\n\nThe train slows. From the window you see the fog climbing up from the sea and swallowing the street lamps, one by one. In your pocket you have an envelope, and on it is written a name that is not quite yours.\n\n*Start again from section 1.*"}},"links":{"1":[{"l":"Stop to look at the people under the canopy","v":5,"t":"l"},{"l":"Look for the exit and the porter","v":8,"t":"l"}],"2":[{"l":"Go on","v":13,"t":"l"}],"3":[{"l":"Ask him what the card is","v":10,"t":"l"},{"l":"Walk beside him without questions","v":15,"t":"l"}],"4":[{"l":"Look at the map","v":16,"t":"l"},{"l":"Read the box","v":18,"t":"l"},{"l":"Close your bag and wait","v":11,"t":"l"}],"5":[{"l":"Go on","v":8,"t":"l"}],"6":[{"l":"Count the steps as you climb","v":2,"t":"l"},{"l":"Climb watching the city light up","v":13,"t":"l"}],"7":[{"l":"Go on","v":12,"t":"l"}],"8":[{"l":"Go on","v":14,"t":"l"}],"9":[{"l":"Go on","v":4,"t":"l"}],"10":[{"l":"Go on","v":15,"t":"l"}],"11":[{"l":"Go on","v":17,"t":"l"}],"12":[{"l":"Go on","v":9,"t":"l"}],"13":[{"l":"Stop and let him finish","v":7,"t":"l"},{"l":"Give him a kindly nod and go up","v":12,"t":"l"}],"14":[{"l":"Go on","v":3,"t":"l"}],"15":[{"l":"Go on","v":6,"t":"l"}],"16":[{"l":"Read the box","v":18,"t":"l"},{"l":"Close your bag and wait","v":11,"t":"l"}],"17":[{"l":"Stamp all seven and go down to the station","v":72,"t":"l"},{"l":"Put the stamp back at the bottom of the bag and go down toward the rectory","v":57,"t":"l"}],"18":[{"l":"Go on","v":11,"t":"l"}],"57":[],"72":[{"l":"","v":0,"t":"m"}]},"img":["data:image/webp;base64,UklGRlydAQBXRUJQVlA4IFCdAQAQMgSdASpYAoQDPr1KmkunJCIlNZ65MOAXiWlu7uEWmBhl7m71mP095q/LLEdz+/bP4T/Ve3Z9p/Vffj9R/ov2z9RP6B+gvT37//+X5t/3Heb+r/1foC/pX+Y/+fo//q9iZu3/K9AX4QwCfsH1H/Uv9F7AP9K/x3
