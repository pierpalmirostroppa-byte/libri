:root{--suoro:#ffffff;--fondo:#2a2c2e;--fondo2:#121314;--carta:#f8f6f1;--inchiostro:#1a1a1a;--accento:#2b2b2b;--oro:#c8432d;--rosso:#a3301f;--velo:rgba(43,43,43,.1)}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--inchiostro);
  background: var(--fondo2) linear-gradient(180deg, var(--fondo) 0%, var(--fondo2) 100%) fixed;
  font-family: 'EBG', 'EB Garamond', Garamond, 'Times New Roman', Georgia, serif; font-size: 19px; line-height: 1.6;
}
#app { max-width: 700px; margin: 0 auto; padding: 0 0 48px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; }
a { color: inherit; }
.btn {
  display: block; width: 100%; margin: 9px 0; padding: 11px 16px; border-radius: 6px; cursor: pointer;
  font-size: 18px; line-height: 1.35; text-align: center; text-decoration: none;
  background: transparent; color: var(--inchiostro); border: 1.5px solid var(--accento);
}
.btn:hover, .btn:focus-visible { background: var(--velo); }
.btn:focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; }
.btn.primo { background: var(--accento); color: var(--carta); border-color: var(--accento); font-weight: 600; }
.btn.primo:hover { filter: brightness(1.12); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.scelta { text-align: left; background: #fffdf7; }
.btn.scelta:hover { background: var(--velo); }
.btn.chiusa { opacity: .55; background: transparent; border-style: dashed; }
.btn.chiusa small { display: block; font-size: 15px; font-style: italic; }
.btn.prova { background: var(--oro); border-color: var(--oro); color: var(--suoro); font-weight: 600; }
.btn.mini { display: inline-block; width: auto; margin: 0; padding: 4px 12px; font-size: 16px; }
.btn.chiaro { color: var(--carta); border-color: var(--carta); margin-top: 14px; }
.copertina { text-align: center; padding: 22px 18px 10px; color: var(--carta); }
.cop { display: block; width: 100%; max-width: 420px; margin: 0 auto 14px; border-radius: 3px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.etichetta { margin: 6px 0 0; font-size: 15px; letter-spacing: .22em; text-transform: uppercase; color: var(--oro); font-weight: 600; }
.sotto { max-width: 440px; margin: 8px auto 14px; font-size: 19px; }
.copertina .pulsanti { max-width: 380px; margin: 0 auto; }
.copertina .btn { color: var(--carta); border-color: var(--carta); }
.copertina .btn.primo { background: var(--oro); border-color: var(--oro); color: var(--suoro); }
.firma { margin-top: 18px; font-size: 16px; letter-spacing: .08em; opacity: .9; }
.foglio {
  background: var(--carta); margin: 14px 10px 0; padding: 18px 20px 22px; border-radius: 4px;
  box-shadow: 0 6px 24px rgba(0,0,0,.35);
}
.foglio h2 { margin: 4px 0 10px; text-align: center; font-size: 27px; font-weight: 600; color: var(--accento); }
.foglio h3 { margin: 22px 0 4px; font-size: 21px; font-weight: 600; color: var(--accento); border-top: 1px solid var(--oro); padding-top: 14px; }
.nota { font-size: 16px; font-style: italic; margin: 4px 0 10px; }
.regole p { margin: 0 0 10px; }
.intro p { margin: 0 0 .8em; }
.intro h3 { font-size: 17px; letter-spacing: .12em; text-align: center; border-top: 0; padding-top: 0; margin: 22px 0 8px; }
.intro h3::after { content: ''; display: block; width: 36px; height: 2px; margin: 6px auto 0; background: var(--oro); }
.intro .btn { margin-top: 18px; }
.valori { display: grid; gap: 6px; }
.valore { display: grid; grid-template-columns: 1fr auto 2.2em; align-items: center; gap: 10px; padding: 6px 10px; background: #fffdf7; border-radius: 6px; border: 1px solid var(--velo); }
.vnome { font-weight: 600; }
.vdadi { display: flex; align-items: center; gap: 5px; }
.piu { font-size: 16px; }
.vnum { font-size: 24px; text-align: right; color: var(--accento); }
.doti { display: grid; gap: 6px; }
.dote { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--velo); background: #fffdf7; cursor: pointer; line-height: 1.35; }
.dote input { margin-top: 5px; width: 20px; height: 20px; accent-color: var(--accento); flex: none; }
.dote small { font-size: 15.5px; }
.dote .bonus { font-size: 15.5px; color: var(--accento); }
.dote.scelta { border-color: var(--accento); background: var(--velo); }
.barra-doti { position: sticky; bottom: 0; margin: 12px -20px -22px; padding: 10px 20px 14px; background: var(--carta); border-top: 1px solid var(--oro); display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; align-items: center; }
.barra-doti #conta { grid-column: 1 / -1; text-align: center; font-size: 16px; }
.barra {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 12px; background: var(--fondo2); color: var(--carta); font-size: 17px; border-bottom: 1px solid var(--oro);
}
.barra b { color: var(--oro); font-weight: 600; }
.barra .r.basso { color: #ffb3a6; }
.barra .btn.mini { margin-left: auto; color: var(--carta); border-color: var(--carta); }
.palline { display: inline-flex; gap: 4px; }
.palline i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--oro); }
.palline i.usata { background: var(--oro); }
.num { text-align: center; font-size: 26px; font-weight: 600; color: var(--accento); letter-spacing: .05em; }
.num::after { content: ''; display: block; width: 46px; height: 2px; margin: 6px auto 12px; background: var(--oro); }
.ill { margin: 0 -20px 14px; }
.ill img { display: block; width: 100%; height: auto; }
.testo p { margin: 0 0 .8em; }
.nemico { margin: 0 0 10px; padding: 6px 10px; border-left: 3px solid var(--rosso); background: #fffdf7; font-weight: 600; }
.nemico small { font-weight: 400; }
.note { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.note span { font-size: 16px; padding: 3px 10px; border-radius: 14px; border: 1px solid var(--accento); background: #fffdf7; }
.note .nota-male { border-color: var(--rosso); color: var(--rosso); }
.azioni { margin-top: 14px; border-top: 1px solid var(--oro); padding-top: 8px; }
.riquadro { margin: 10px 0; padding: 12px 14px; border: 1.5px solid var(--accento); border-radius: 8px; background: #fffdf7; }
.titolo-r { margin: 0 0 6px; text-align: center; font-weight: 600; font-size: 20px; color: var(--accento); letter-spacing: .03em; }
.esito { text-align: center; font-weight: 600; font-size: 21px; margin: 6px 0; }
.esito.ok { color: #2f6b3a; }
.esito.ko { color: var(--rosso); }
.dadi-grandi { display: flex; justify-content: center; align-items: center; gap: 8px; min-height: 58px; flex-wrap: wrap; margin: 6px 0; }
.somma { font-size: 24px; font-weight: 600; }
.chi { font-size: 15px; font-style: italic; }
.dadi-grandi.due { gap: 18px; align-items: flex-start; }
.tiro { display: grid; grid-template-columns: auto auto; gap: 4px 6px; justify-items: center; max-width: 46%; }
.tiro .chi { grid-column: 1 / -1; text-align: center; line-height: 1.2; }
.registro { font-size: 16px; border-top: 1px dashed var(--velo); margin-top: 6px; padding-top: 4px; }
.registro p { margin: 2px 0; }
.vita { margin: 6px 0; font-size: 16px; }
.traccia { height: 9px; background: var(--velo); border-radius: 5px; overflow: hidden; }
.riemp { height: 100%; border-radius: 5px; }
.riemp.io { background: var(--accento); }
.riemp.lui { background: var(--rosso); }
.morte { border-color: var(--rosso); text-align: center; }
.morte .titolo-r { color: var(--rosso); letter-spacing: .1em; }
.dado {
  display: inline-grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); width: 46px; height: 46px; padding: 6px;
  background: #fffef9; border: 2px solid var(--inchiostro); border-radius: 9px; box-shadow: 0 2px 0 rgba(0,0,0,.25);
}
.dado i { display: block; margin: auto; width: 8px; height: 8px; border-radius: 50%; }
.dado i.p { background: var(--inchiostro); }
.dado.piccolo { width: 30px; height: 30px; padding: 4px; border-width: 1.5px; border-radius: 6px; }
.dado.piccolo i { width: 5px; height: 5px; }
.dado.gira { transform: rotate(var(--g, 12deg)); }
.dado.gira:nth-child(2n) { --g: -14deg; }
.fine { text-align: center; background: var(--fondo); color: var(--carta); margin: 6px -20px -22px; padding: 22px 20px 24px; border-radius: 0 0 4px 4px; }
.cop-piccola { width: 150px; border-radius: 3px; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
.fine-sopra { margin: 12px 0 0; font-style: italic; }
.fine h2 { color: var(--oro); margin: 6px 0 8px; font-size: 26px; line-height: 1.2; }
.compra { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; max-width: 420px; margin: 10px auto 4px; }
.compra .btn.primo { background: var(--oro); border-color: var(--oro); color: var(--suoro); }
.compra small { display: block; font-size: 14px; font-weight: 400; }
.sito { margin: 10px 0 0; font-size: 18px; }
.sito a { color: var(--oro); }
.scheda { position: fixed; inset: 0; z-index: 20; background: rgba(10,12,16,.55); display: flex; justify-content: flex-end; }
.scheda-dentro { width: min(380px, 92vw); height: 100%; overflow-y: auto; background: var(--carta); padding: 16px 18px 24px; box-shadow: -6px 0 24px rgba(0,0,0,.4); }
.scheda h3 { margin: 0 0 8px; color: var(--accento); font-size: 24px; }
.scheda h4 { margin: 14px 0 4px; color: var(--accento); font-size: 18px; border-bottom: 1px solid var(--oro); }

Leggi ogni paragrafo e scegli che cosa fare: ogni scelta ti porta a un altro paragrafo.","I dadi li tira il computer. La tua **Forza** è 6, 7 con il bastone ferrato, e serve solo negli scontri. L'**Agilità** è 6, per le scale a pioli e i moli bagnati. La **Resistenza** è 20: è il fiato, il sonno, il coraggio che ti resta.","🧠 Le doti non cambiano i numeri: ti aprono una strada, o ti fanno passare una prova senza tirare i dadi.","🚩 Le parole e gli oggetti che il libro ti fa annotare si segnano da soli: li trovi nella **Scheda**, con quello che hai in borsa.","Chi sbaglia non si fa male: dimentica perché era venuto, e si ritrova sul treno. In questa demo hai **sei scelte**; se la storia finisce prima, ricominci dal §1."],"dotiTit":"Scegli cinque doti","fineTesto":"Il resto dei tre giorni e tre notti di Padre Marcus a Caligo ti aspetta nel libro.","doti":[{"n":"Latino e Rituale","b":"","d":"Leggi iscrizioni, registri e moduli in latino; sai a memoria le risposte della Messa e le ore del breviario."},{"n":"Lingue del cantiere","b":"","d":"Tedesco, francese, mezza Italia di dialetti. E capisci quando una lingua non è nessuna di queste."},{"n":"Occhio per le carte","b":"","d":"Calligrafie, sigilli, timbri, pagine tagliate: le carte ti parlano."},{"n":"Mano di medico","b":"","d":"Sai fasciare, misurare la febbre, far riposare chi è stanco: anche te."},{"n":"Mestiere di galleria","b":"","d":"Buio, cantine, acqua che sale, la lampada che fa le bizze: ci hai passato vent'anni."},{"n":"Piede di montanaro","b":"","d":"Scale, tetti, moli scivolosi: il fiato ti manca, il piede no."},{"n":"Amico delle bestie","b":"","d":"Sai che cosa spaventa un cane, una mula, un uccello, e perché."},{"n":"Voce da pulpito","b":"","d":"Quando parli in una chiesa piena, ti sentono anche in fondo."},{"n":"Orecchio da confessore","b":"","d":"La gente, a te, dice sempre una cosa in più."},{"n":"Pazienza degli sportelli","b":"","d":"Sai quale modulo serve prima che te lo dicano."},{"n":"Memoria delle voci","b":"","d":"Una voce sentita una volta la riconosci al buio, dietro una porta, dentro un coro."},{"n":"Scacchi per lettera","b":"","d":"Dodici anni di partite con il dottore: sai vedere la casella che nessuno guarda."}],"negozi":[{"f":"scopri","url":"https://intreccidicarta.com/libri/librigiochi.html#l-ottavo-sigillo","dove":"intreccidicarta.com"}],"sito":"https://intreccidicarta.com/libri/librigiochi.html#l-ottavo-sigillo","re":{"ab":"^🧠 Se hai (.+)$","itPos":"^🎒 (?:Se )?hai (.+)$","itNeg":"^🎒 Non ","fgPos":"^🚩 Se (.+)$","fgNeg":"^🚩 Se non (.+)$","fgPre":"^hai annotato ","vinci":"vinci","non":"non"},"ui":{"demo":"Demo giocabile","copAlt":"Copertina di {t}","copTesto":"Le prime pagine del librogioco, da giocare qui: leggi, scegli la strada, tira i dadi. Hai sei scelte.","gioca":"Gioca la demo","nuova":"Nuova partita","riprendi":"Riprendi dal §{n}","regoleTit":"Come si gioca","valoriTit":"I tuoi valori","valoriNota":"Li ha tirati il computer, come faresti tu con i dadi del libro.","forza":"Forza","resistenza":"Resistenza","agilita":"Agilità","fAbbr":"F","rAbbr":"R","aAbbr":"A","dotiNota":"Le strade segnate con 🧠 si aprono solo a chi ha quella dote.","dotiConta":"Doti scelte: {n} di 5","caso":"Scegli per me","comincia":"Comincia dal §1","scheda":"Scheda","doti":"Doti","zaino":"Oggetti annotati","vuoto":"vuoto","ricorda":"Parole annotate","chiudi":"Chiudi","daCapo":"Ricomincia la demo da capo","scelteTit":"Scelte fatte: {n} di {m}","usa":"usa (+{n})","usaOgg":"Usa {x} (+{n})","usato":"Usi {x}: +{n} Resistenza.","notaOgg":"🎒 Annota sulla scheda: {x}","notaFg":"🚩 Annota sulla scheda: {x}","notaHp":"❤️ {n} Resistenza","notaMeta":"❤️ Resistenza a metà","notaPerso":"🎒 Perdi: {x}","notaDote":"🧠 Perdi la dote: {x}","serveDote":"non hai questa dote","serveOgg":"non ce l'hai","serveFg":"non ti è successo","giaUsata":"l'hai già usata","vicolo":"Nessuna strada da qui.","tira":"tira i dadi","agiProva":"Prova di Agilità","fortProva":"Colpo di fortuna","agiSotto":"Due dadi: ce la fai con {s} o meno. Il 12 riesce sempre, il 2 fallisce sempre.","agiSopra":"Due dadi: ce la fai con 7 o più.","fortDett":"Due dadi: con 7 o più ti va bene.","fortBonus":"(+1 per la tua dote)","agiOk":"Ce la fai.","agiKo":"Non ce la fai.","fortOk":"Ti va bene.","fortKo":"Ti va male.","vaiA":"Vai al §{n}","tu":"Tu","attacca":"⚔️ Tira i dadi","roundRiga":"Tu {a}, {n} {b}:","colpisci":"colpisci, −2 al nemico.","colpito":"ti colpisce, −2 a te.","pari":"pari, nessuno si fa male.","dodici":"doppio sei, colpo a segno: −2 al nemico.","due":"doppio uno, colpo a vuoto: −2 a te.","lamaRiga":"Lama corta: ritiri il {x} e ti esce {y}.","corsaBonus":"(con {d} ti basta 6)","fissa":"{d} (di serie)","notaUsa":"🎒 Usi: {x}","vinto":"Hai vinto lo scontro.","perso":"Hai perso lo scontro.","zeroTit":"❤️ La tua Resistenza è arrivata a zero.","morteTit":"La tua storia finisce qui","morteRes":"La tua Resistenza è arrivata a zero.","morteNota":"Nella demo si ricomincia dal §1, con valori nuovi e le stesse doti.","ricomincia":"Ricomincia dal §1","fineSei":"Hai fatto le tue sei scelte.","fineFuori":"Questa strada porta oltre la demo.","fineTit":"La tua avventura continua nel libro","cartaceo":"Cartaceo","ebook":"Ebook","sito":"Tutti i librigiochi su intreccidicarta.com","rigioca":"Rigioca la demo","noscript":"Per giocare la demo serve JavaScript attivo nel browser.","descr":"Demo giocabile di {t}, librogioco di Peter Palmer: le prime pagine, da giocare nel browser.","titoloPagina":"{t} · Demo giocabile · Peter Palmer","scopri":"Scopri il libro","introTit":"Introduzione","continua":"Continua","vaiUno":"Vai al §1","inBorsa":"In borsa","restaUno":"❤️ Resistenza a zero: resti con 1"},"par":{"1":{"t":"Il treno rallenta. Lo senti nelle ginocchia prima che nelle orecchie: i freni mordono, il vagone di terza classe dà uno strattone, e la borsa ti scivola di un palmo sulla panca di legno. La fermi con lo scarpone.\n\nQualcuno ha lasciato il finestrino abbassato di due dita, e da lì entra la nebbia. Non l'avevi mai vista salire su un treno. Viene dentro bassa, come il fumo di una stufa che tira male, e si porta dietro l'odore del posto: sale, pece, carbone bagnato e, più in fondo, pesce. Un porto. Sulle labbra ti lascia un freddo che sa di ferro.\n\n«Caligo! Stazione di Caligo!» grida il conduttore nel corridoio, con la voce di chi lo ripete da trent'anni e non si aspetta più che scenda qualcuno.\n\nTi alzi. Cinquantanove anni si alzano in due tempi: prima la schiena, poi il resto. Ti passi sulla spalla la cinghia della borsa, e la lampada da minatore che ci sta appesa batte contro la fibbia con il suo colpo di latta: in galleria, quel rumore voleva dire che arrivava il prete. Dalla reticella tiri giù il bastone ferrato. Gli occhiali tondi si sono appannati, e li asciughi con l'orlo della tonaca, che è lisa proprio in quel punto.\n\nÈ mercoledì 30 ottobre 1912, e l'orologio della stazione fa le quattro del pomeriggio. A quest'ora, al tuo paese, c'è ancora il sole sulle cime. Qui la sera è cominciata dopo pranzo, e tu all'imbrunire ci vedi poco. Sul marciapiede hanno già acceso una luce, una sola, bianca, in cima a una colonna di ghisa. Non trema: non è una fiamma. Fa un cerchio netto sul selciato, e fuori dal cerchio le cose perdono i bordi.\n\nIn tasca, sul petto, hai una busta. La tocchi attraverso la stoffa, come si tocca il portafoglio in mezzo alla folla. Non ti serve tirarla fuori: l'indirizzo lo sai a memoria, scritto in bella mano di cancelleria.\n\n«Al Reverendo Padre Marcus, presso la Venerabile Curia di Caligo.»\n\nPadre si dice ai frati, e tu frate non sei: sei un prete di montagna, figlio di uno scalpellino dell'Ossola. Marcus è soltanto il modo in cui firmi, da quando nei cantieri dei trafori era l'unica parola che tedeschi, francesi e piemontesi leggevano uguale. In qualche ufficio hanno preso una firma per un nome di battesimo.\n\nSei don Marco. Ma la busta è arrivata prima di te, e qui hanno già deciso.\n\nDa ventotto anni le diocesi ti mandano a guardare da vicino le cose che fanno paura alla gente: una stalla dove le bestie non vogliono entrare, una donna che non riconosce più i suoi figli, un vecchio che parla con la moglie morta e ne riferisce le risposte. Tu guardi, tocchi, annusi, conti i passi da una porta all'altra. Poi scrivi una riga, sempre la stessa, e la riga dice di chiamare il medico. Il Rituale, nella borsa, ha in fondo le pagine del rito. Le sai a memoria, e non le hai mai pronunciate. Nemmeno una volta.\n\nScendi. Il predellino è alto e bagnato, e il ginocchio sinistro te lo fa sapere. Sotto la pensilina il bianco è più rado. Ci sono una ventina di persone, ferme, con i fagotti ai piedi, strette l'una all'altra: gente che il freddo lo conosce già. Non sono lì per il treno. Quando si è fermato, nessuna ha alzato la testa. Dalla tettoia cade una goccia ogni tanto, e la senti battere sul legno.\n\nIn fondo al marciapiede, dentro il cerchio della luce, c'è l'uscita, e accanto all'uscita un berretto della ferrovia appoggiato a un carretto: un facchino.\n\nLa locomotiva sfiata e tace. Hai una borsa che pesa, un bastone, e una città di cui sai soltanto il nome sbagliato che ti ha dato. Da qualche parte bisogna cominciare a guardare.","dec":1},"2":{"t":"Uno. Lo dici con le labbra e basta, e il piede fa il resto.\n\nConti a voce bassa, come in galleria, dove un numero detto forte faceva voltare tutta la squadra. La pietra è bagnata e i chiodi ci mordono bene; nel mezzo ogni gradino tiene un dito d'acqua, che ti schizza le caviglie. Lungo il muro di destra corre un mancorrente di ferro. Lo prendi al dodicesimo scalino e lo lasci subito: è gelato, e attacca alle dita.\n\nVenti. Trenta. Il bianco si apre davanti a Larìn e si richiude dietro di te, e di tutta la scalinata esistono soltanto i sei gradini dove state voi. Lui sale con le due borse e non cambia passo. Ti manca il colpo di latta della lampada contro la fibbia, che in salita ti ha sempre tenuto il tempo: stasera la porta lui.\n\nSessanta. Il ginocchio sinistro ha detto la sua da un pezzo. Ottanta. Il respiro ti esce con un fischio che conosci, quello delle rampe lunghe, e in bocca hai un sapore di ferro. Novanta.\n\nAl centesimo ti fermi. Non lo decidi tu: lo decidono le gambe, e ti trovi con una mano sul muro, che è freddo e sudato. Tre gradini più su Larìn ha smesso di salire anche lui. Ha posato una borsa e sta chino su una scarpa, a rifare un nodo che era già fatto: ha scarpe buone, da figlio di calzolaio, e le stringhe tirate. Quando ti raddrizzi, si raddrizza.\n\nCentouno.\n\nAgli ultimi scalini il chiaro cambia. La nebbia resta giù, tutta insieme, al suo livello, e tu ne esci prima con la testa e poi con le spalle. L'aria qui sopra è asciutta e sa di pietra. L'ultimo gradino è più largo degli altri.\n\n«Centotrentadue. In galleria saresti già morto di vecchiaia» pensi, e ti viene da ridere da solo, senza fiato per farlo.\n\nDavanti hai un sagrato vuoto, e in fondo il duomo: nero, senza un lume, alto contro un cielo che ha un resto di giorno. Di fianco gli sale il campanile, con il quadrante dell'orologio. Stai a guardarlo finché il petto si calma, e in tutto quel tempo da lassù non scende un tocco.\n\n*Annota sulla scheda: GRADINI 132.*","f":"GRADINI 132","img":0},"3":{"t":"La salita comincia subito dopo il piazzale, senza preavviso, e tira su dritta tra due muri. Il selciato è a schiena d'asino, con una canaletta nel mezzo dove corre un filo d'acqua. La nebbia qui non viene dal mare: scende. Cala dall'alto della strada, incontro a chi va su, e a ogni respiro ne mandi giù un sorso che ha il gusto del sale.\n\nDieci passi avanti a voi c'è un rumore di zoccoli, lento, e una fiammella che dondola a tre metri da terra.\n\nÈ un vecchio in mantella, con una scala a pioli sulla spalla e in mano una pertica lunga, che in cima porta lo stoppino acceso. Accanto gli cammina una mula grigia, con due lanterne a petrolio appese ai fianchi. Arrivata sotto un lampione la mula si ferma, da sola, senza una voce e senza uno strattone. Il lampionaio alza la pertica, cerca il becco dentro il vetro, e il gas prende con un piccolo scoppio, come un tappo: una fiamma gialla, a ventaglio, che sibila. Intorno la nebbia diventa d'oro per un palmo. La mula riparte, e lui dietro.\n\nLi raggiungete al lampione dopo: non perché tu in salita raggiunga qualcuno, ma perché loro devono aspettare il gas. Da vicino la bestia odora di pelo bagnato e di petrolio caldo, e fuma dal dorso. Larìn dice buonasera senza fermarsi. Il vecchio si volta, e prima di guardarti in faccia ti guarda gli scarponi: i chiodi, la suola, il fango di un altro paese. Di lì sale agli occhiali, e pare soddisfatto dell'ordine in cui ha fatto le cose.\n\n«Sa il mestiere» dici, accennando alla mula.\n\n«La mula ha più giudizio del Municipio» dice il lampionaio. «Lei si ferma dove c'è un lume. Il Municipio no.»\n\nSi rimette in cammino, e voi con lui: il passo di chi accende è proprio il tuo. Nel nastro del cappello, sopra l'orecchio, tiene infilato un cartoncino grande quanto un santino. Quando passa sotto la fiamma nuova vedi che è coperto di righe, e che in fondo alle righe c'è il tondo di un timbro. Di più, con la tua vista, da qui non si legge.\n\nPotresti chiederglielo. Oppure stare zitto e tenerti il respiro per la strada, che ne vuole.","dec":1,"img":1},"4":{"t":"Sciogli lo spago, che ha un nodo da pacco postale, e stendi i fascicoli a ventaglio sul tavolo, come una mano di carte. Non ne apri nessuno. Li studi da fuori, che è il modo di cominciare: il cartone è ruvido, nuovo, e manda la colla della legatoria. Ne pizzichi uno: dentro c'è poca roba, un foglio, forse due.\n\nSu ogni copertina, in alto a destra, c'è un numero grande a inchiostro, e in mezzo un luogo, nella bella mano della cancelleria. Li leggi in fila, muovendo le labbra.\n\nUno: San Rocco, casamento delle Tre Scale. Due: il Colle, campanile del duomo. Tre: la Darsena, il molo e il faro. Quattro: la Darsena, la Calata. Sei: Borgo Nuovo, via dei Mille. Otto: le Cartiere, cascina dei Bricchi. Dieci: i Cordai, le cisterne.\n\nSono nomi che ti dicono poco: il duomo, almeno, sai dov'è. Torni indietro con il dito, dal quattro al sei, dal sei all'otto.\n\nIl cancelliere ha seguito il tuo dito.\n\n«Numeri di protocollo. Il cinque, il sette e il nove li hanno archiviati i tre che sono venuti prima di lei.»\n\n«Tre preti?»\n\n«Tre pareri.» Bagna il pennino. «Hanno un numero e uno scaffale.»\n\nE ricomincia a scrivere: la punta gratta, tace, gratta. Di là dalla porta qualcuno tossisce, e una seggiola striscia.\n\nLe copertine sono stampate, tutte uguali. In cima, sopra il numero, corre una riga in caratteri di tipografia:\n\n«Alle otto parrocchie della città, per conoscenza.»\n\nIn fondo, vicino all'orlo, c'è una casella con il bordo doppio, e dentro due parole in latino, piccole. Con la tua vista e questo paralume, per leggerle bisogna chinarsi fino a sfiorare il cartone con il naso.\n\nAlzi la testa per riposare gli occhi. Dietro il cancelliere, al limite del chiaro della lucerna, è appesa al muro una pianta della città, larga quanto una porta, a colori: da qui distingui le macchie delle tinte e l'azzurro del mare in basso, e non i nomi. Bisognerebbe alzarsi e andarci sotto.\n\nLui intanto ha aperto un cassetto e ci cerca dentro, con metodo, un foglio alla volta. Puoi anche rimettere tutto nella borsa, chiuderla e lasciarlo cercare: in una Curia chi aspetta seduto è già a metà dell'opera.","dec":1,"img":2},"5":{"t":"Fai tre passi verso di loro, e l'odore ti arriva prima delle facce: lana bagnata, fumo di legna rimasto nei panni, sego da scarpe. È quello delle tue valli a novembre, e lo ritrovi qui, in riva al mare.\n\nÈ gente d'Appennino. Lo dicono gli zoccoli ferrati, i fagotti chiusi con il nodo doppio, il modo di stare in piedi di chi è cresciuto in salita. Stanno in fila lungo il muro della pensilina, gli uomini dalla parte del binario e le donne contro i mattoni, con i bambini in mezzo, dove il vento non entra. Una madre soffia sulle dita di una bimba, un dito per volta.\n\nSulle spalle hanno tutti la stessa coperta, grigia, nuova: ha i segni della piegatura e sa di magazzino. A un angolo di ognuna è cucito, con due punti di filo grosso, un sigillo di ceralacca grande quanto un bottone.\n\n«Da dove venite?» chiedi al primo, un uomo largo, con una bambina addormentata in collo.\n\nLui nomina un paese che non conosci, e con il mento indica il monte, dietro la stazione, dove c'è soltanto bianco.\n\n«Aspettiamo il carro per la Darsena» dice. Tiene la voce bassa, per via della piccola. «Il piroscafo parte sabato.»\n\n«E fino a sabato?»\n\n«Siamo trecento, nelle baracche del molo, padre. Le coperte ce le hanno date. Il freddo no, quello ce lo siamo portato.»\n\nDietro di lui qualcuno ride con il naso.\n\nConti le coperte, che è il tuo modo di guardare: venti. Le persone sono ventuno. In fondo alla fila, dove il cerchio della lampada non arriva, c'è un vecchio curvo che di coperta non ne ha. Porta un cappotto da prete troppo lungo, che gli copre le caviglie, e ha il cappello in mano. Niente fagotto ai piedi. Alla cintura gli pende un anello da chiavi, grosso, da portone, senza nemmeno una chiave: quando si muove non tintinna. Non parla con nessuno, e non ha l'aria di chi parte. Sta lì come ci si mette sotto un portico quando piove, perché c'è già gente.\n\nLo guardi un po' troppo. Lui si gira verso il muro, e ti lascia la schiena.\n\nAccanto all'uscita il berretto della ferrovia è ancora appoggiato al suo carretto.\n\n*Annota sulla scheda: LE BARACCHE.*","f":"LE BARACCHE","img":3},"6":{"t":"Gli archi sono quelli di un portico basso, a volte di pietra, lungo quanto una navata. Sotto, i passi cambiano voce: i chiodi dei tuoi scarponi, che sul selciato battevano, qui rimbombano, e ti pare di essere in tre. Un lampione fa il suo ventaglio giallo contro un pilastro e lascia al buio gli angoli.\n\nAccanto al lampione c'è una bacheca di legno: quella degli avvisi del Municipio, dice una targhetta. È vuota. In mezzo all'assito sono rimasti un chiodo e un po' di colla, e la colla è vecchia: la provi con l'unghia e viene via a scaglie, gialla, secca. Da un pezzo, lì sopra, nessuno ha niente da far sapere.\n\nAll'angolo, dove il portico gira, c'è un uomo in piedi. Ha un grembiule di cuoio che gli arriva agli stinchi, lucido sulle cosce, e regge il cappello per la tesa, davanti a sé. Non lo tende e non lo muove: lo tiene. Sa di cuoio e di cera da spago anche a tre passi. Passa una donna con una cesta, passa un uomo con un sacco, e lui non chiede niente a nessuno dei due. Al rumore dei tuoi chiodi piega appena la testa: conta i colpi di un martello che non è il suo. Torna a guardare la strada.\n\nIl ragazzo gli passa davanti senza guardarlo e senza rallentare. Lo fa con cura, tenendo la testa dritta.\n\n«Mio padre aspetta. È il suo lavoro, adesso» dice Larìn, quando siete oltre.\n\nE allunga il passo.\n\nIn fondo al portico comincia la scalinata. È dritta, stretta tra due muri alti, con i gradini di pietra scavati nel mezzo da quelli che sono saliti prima di te. Ne vedi venti, bagnati, ognuno con il suo orlo che luccica. Dopo il ventesimo non c'è più scala: c'è la nebbia, che la chiude come una porta.\n\nIn galleria ogni scala si contava, per sapere quanta corda serviva, e questa la conteresti volentieri, dal primo gradino all'ultimo. Ma dietro di te, più in basso, Caligo ha cominciato ad accendere le sue finestre, e chi salisse voltandosi ogni tanto ne vedrebbe un pezzo di più a ogni sosta. Le due cose insieme, con il tuo fiato, non si fanno.","dec":1,"img":4},"7":{"t":"Ti fermi, con una mano sulla ringhiera, e gli fai segno di dire.\n\nLui non se l'aspettava. Resta un momento con il berretto a mezz'aria; poi lo stringe sotto il braccio, tira il fiato fino in fondo, due volte, e si mette dritto. Da vicino è più anziano di quanto pareva sulle scale: ha i baffi gialli di tabacco e, sul davanti della giubba, proprio dove tiene le dita, il panno è lucido, consumato nella forma di un palmo. Odora di naftalina e di scale fatte in fretta.\n\nLa dice tutta. Adagio, staccando le parole, con gli occhi a un punto sopra la tua spalla: non è la voce di uno che domanda, è quella di un bambino che recita la poesia davanti al vescovo, e ha paura di perdere il filo se si interrompe.\n\n«Scusi, lei conosce il parroco di San Biagio in Sottoriva? Ho una cosa per lui, da quando c'era il vescovo vecchio.»\n\nFinita la frase chiude la bocca e aspetta, e nella scala si sente soltanto il gas.\n\nCerchi. Lo fai sul serio, per rispetto: ma di Caligo conosci un marciapiede, una salita e una scalinata, e il nome di quella parrocchia non stava su nessuna delle carte che ti hanno mandato.\n\n«Non lo conosco» dici. «Sono arrivato con il treno delle quattro.»\n\nAnnuisce, per niente deluso. Che cosa porti, non lo dice. Tu non lo chiedi. In una Curia le carte degli altri si lasciano dove stanno.\n\n«Grazie, padre» dice. «È il primo, da settimane, che mi lascia finire.»\n\nLo dice senza rimprovero per nessuno. Si ricalca il berretto in testa, ti fa un inchino che gli viene dalla schiena più che dal collo, e riprende a scendere, svelto, facendo cantare i gradini uno dopo l'altro. Al pianerottolo di sotto lo senti rallentare: sta salendo qualcuno.\n\nDi sopra la campanella dà altri tre colpi, e tu hai ancora due rampe.\n\n*Annota sulla scheda: IL PARROCO DI SAN BIAGIO.*","f":"IL PARROCO DI SAN BIAGIO"},"8":{"t":"Il facchino ti ha già messo gli occhi addosso. Si stacca dal carretto, porta due dita alla visiera e ti viene incontro: vent'anni, le orecchie rosse, un berretto della ferrovia tagliato per una testa più larga della sua.\n\n«Dia qua, padre.»\n\nTi sfila la cinghia dalla spalla senza attendere la risposta. Soppesa la borsa e indovina, contento: «Libri. E del ferro.» La posa sul pianale con riguardo. Il bastone no: quello te lo lascia.\n\nDa dietro la colonna spunta un ragazzino senza calze, e allunga le dita verso la sponda del carretto, tanto per toccare.\n\n«Giù le mani dal carretto, che ti delo!» grida il facchino, ridendo.\n\nL'ultima parola non l'hai mai sentita. Il piccolo sì: ride a sua volta, e scappa lungo il marciapiede con gli zoccoli che battono sul selciato lucido.\n\nAdesso siete proprio sotto la luce bianca. Viene da un globo di vetro in cima alla colonna di ghisa, e ronza: un moscone chiuso in un bicchiere. Non ha odore. Intorno c'è quello del carbone e del vapore che la locomotiva perde, ma la lampada non ne aggiunge uno suo, e il tuo naso, che i lumi li ha sempre riconosciuti prima degli occhi, resta senza lavoro. Sotto quel chiarore la faccia del facchino ha perso il colore: le orecchie, da rosse, si sono fatte grigie.\n\nA mezza altezza, sulla ghisa, è avvitata una targa d'ottone. L'hanno lucidata di fresco: nei solchi delle lettere è rimasto il bianco della pasta. Ci passi sopra il pollice, e il metallo è gelato.\n\n«Questa luce elettrica è dono del comm. Leandro Bonfante alla Città di Caligo. MCMVII.»\n\n«Da quando c'è questa, alla stazione non rubano più» dice il facchino, e dà alla colonna una manata da amico.\n\n«Prima rubavano?»\n\n«Prima era buio.» Per lui è la stessa cosa.\n\nPrende le stanghe e spinge. Una ruota cigola a ogni giro, sempre nello stesso punto, e tu gli vai dietro verso l'uscita, con quel cigolio davanti. Oltre la pensilina c'è un piazzale, e lì la sera ricomincia.\n\nSe hai Lingue del cantiere: Conosci dieci dialetti e mezzo, e quella parola non è di nessuno."},"9":{"t":"Ti riceve in piedi, il cancelliere, dietro un tavolo più lungo di un altare. È un uomo che ha l'età degli uffici, con gli occhiali a stringinaso e la destra posata su un timbro dal manico d'osso, come altri la tengono su un bastone. Una lucerna a petrolio con il paralume verde stringe la stanza in un cerchio: carte in pile squadrate, un calamaio, un bastoncino di ceralacca accanto a un lumino. Dentro il cerchio l'aria sa d'inchiostro; fuori, gli scaffali salgono fino ai coppi, e non se ne vede la cima.\n\nGuarda il biglietto, poi te.\n\n«La convocazione ha un numero, reverendo?»\n\nTiri fuori la busta dal petto. Il numero c'è: in un angolo, piccolo, in inchiostro rosso, dove non avevi mai badato. Glielo leggi. Lui lo cerca su un registro, riga per riga, lo trova, e gli succede una cosa alle spalle: scendono di un dito. La presa sul timbro si allenta.\n\n«Allora lei esiste» dice, senza scherzare. «Segga pure.»\n\nLui resta in piedi. Da sotto il tavolo solleva un pacco e lo posa davanti a te, piatto, attento agli spigoli. Sono fascicoli di cartone grigio, legati insieme con uno spago rosso passato in croce. Li conti dal dorso: sette. Ognuno è chiuso sul taglio da un sigillo rosso, largo quanto una moneta da cinque lire. Avvicini gli occhiali al primo: una mitra in alto e sotto una barca con la vela, dentro un giro di lettere latine. La cera non ha una crepa.\n\n«Sette volte, in tre settimane, qualcuno ha scritto alla Curia che a Caligo c'è il demonio» dice il cancelliere. La parola la pronuncia senza cambiare voce, da numero di protocollo. «Sette lettere, sette luoghi. Monsignor Vescovo non si disturba per una lettera. Per sette, la Curia vuole prima un parere.»\n\n«Il mio.»\n\n«Il suo è già costato un biglietto di terza classe.» Si aggiusta lo stringinaso. «Non le chiedo di credere. Le chiedo di scrivere. Una riga per fascicolo, e il suo sigillo sotto.»\n\nSpinge il pacco verso di te di due dita. Pesa meno di quanto promette: non c'è molta carta, là dentro. I sigilli non li tocchi più. Una cera così si rompe sul posto, e tu hai sempre lavorato in quest'ordine: prima il luogo, poi la carta.\n\n*Annota sulla scheda: I SETTE FASCICOLI.*","it":"I SETTE FASCICOLI"},"10":{"t":"«Quello che cos'è?» chiedi, e con il bastone indichi il cappello.\n\nIl lampionaio non risponde subito. Aspetta che la mula abbia scelto il suo posto, accende il becco con il suo piccolo scoppio, appoggia la pertica al muro, e solo allora si scopre: la testa gli fuma un poco nell'umido. Sfila il cartoncino dal nastro e te lo mette sotto il naso, senza lasciarlo. Lo tiene per un angolo, con il pollice nero di fuliggine a far da fermacarte.\n\nLo leggi al chiaro di una delle lanterne della bestia, che fa una fiamma arancio e un filo di fumo grasso. Il cartone è molle, gonfio d'acqua agli orli, ma l'inchiostro ha tenuto. In alto c'è lo stemma del Municipio, e sotto una riga a stampa: servizio dell'illuminazione a gas, giri serali. Vengono poi le righe, numerate a penna. Ognuna ha sette caselle, una per sera della settimana, e in ogni casella una crocetta; in fondo a ciascuna c'è il timbro tondo dell'ufficio.\n\nConti quelle timbrate. Sono sette.\n\nSotto la settima ce n'è un'altra. Non è a penna: è a matita, tirata a mano libera, senza numero. Ha le sue caselle disegnate storte e le sue crocette, una per sera, uguali a quelle di sopra. Il timbro manca, e lo spazio è rimasto bianco.\n\n«E questa?» Ci posi il dito. La matita è grassa, e ti resta sul polpastrello.\n\nLui ritira il cartoncino, lo infila nel nastro al punto di prima, e si rimette il cappello. Lo calca bene, fino alle orecchie.\n\n«Il Municipio me ne paga sette. L'ottavo lo faccio per abitudine.»\n\nUn uomo che lavora più di quanto lo pagano. Nei cantieri ne hai conosciuti due, in vent'anni, e li ricordi tutti e due per nome.\n\nRiprende la pertica. Il gas, sopra di voi, ha preso da un pezzo e sibila nel suo vetro; la mula lo sa, e si è avviata senza aspettare nessuno.\n\n«Padre, l'Ave Maria» dice Larìn, quattro passi più su, e batte un piede contro l'altro. La strada sale ancora, e in cima, dove i muri finiscono, si indovina uno slargo.\n\n*Annota sulla scheda: OTTO GIRI.*","f":"OTTO GIRI"},"11":{"t":"Il cassetto si richiude con un colpo, e la fiamma della lucerna fa un salto. Il cancelliere ha trovato quello che cercava: un cartoncino rigido, stampato su una faccia sola, e un registro lungo e stretto, che apre a una pagina già rigata.\n\nTi porge il cartoncino tenendolo per gli orli. Ha lo stemma della diocesi in alto e una norma sola in mezzo, in caratteri grandi, fatti per un prete con la vista stanca:\n\n«Nessun sacerdote pronunci il rito sugli ossessi senza licenza scritta del Vescovo, in luogo appartato e con pochi testimoni.»\n\nGira il registro verso di te, intinge la penna e te la offre dalla parte giusta.\n\n«Firmi qui. È una formalità, ma le formalità sono quello che resta quando le persone se ne vanno.»\n\nFirmi come firmi sempre, Marcus sac., e la penna della cancelleria, che è migliore della tua, non lascia nemmeno una macchia. Lui asciuga con il tampone e controlla che la firma stia dentro la riga.\n\n«Con questo ha anche le facoltà per le confessioni» dice. «Finché resta in diocesi.»\n\nIl cartoncino va tenuto dove non si perde, e tu un posto così ne hai uno solo. Tiri fuori il Rituale. La pelle della copertina è molle, scura dove la prendono le dita, e manda il suo odore di incenso freddo e di carburo. Si apre da solo dove si è sempre aperto, in fondo, alle pagine del rito. Lì davanti il libro stampa le sue norme, in un latino fitto, con i margini consumati dal tuo pollice. Le prime sei le sai a memoria, nell'italiano in cui te le sei sempre ripetute. Le leggi lo stesso.\n\n«Non credere facilmente che ci sia il demonio.» «Prima di tutto, il medico.» «I segni sono tre: parlare una lingua mai imparata, rivelare cose nascoste, avere una forza sopra l'età.» «Nessuna domanda per curiosità.» «Non insultare e non discutere con il nemico.» «Diffida di quando sembra che se ne vada.»\n\nLa settima è quella che hai appena firmato, e in ogni diocesi dice la stessa cosa con altre parole: «Nessun rito senza il permesso del vescovo.»\n\nL'ottava non è stampata da nessuna parte. Sta sul retro della copertina, da sola, scritta a mano, in un inchiostro che è diventato color ruggine, e la scrittura è già la tua di adesso. Sotto c'è un anno: 1884.\n\n«Ciò che senti in confessione non esiste.»\n\nInfili il cartoncino lì, contro quella riga, e chiudi.\n\n*Leggi adesso, per intero, la pagina delle regole che sta accanto alla scheda.*"},"12":{"t":"L'ultima rampa finisce sotto il tetto. La Curia di Caligo sta in soffitta: uno stanzone lungo, con i coppi a vista tra i travicelli e certe travi così basse che gli impiegati, passando, chinano la testa a memoria. Tu passi dritto: per una volta, essere corto serve. Il tepore di tutta la casa si raccoglie quassù, e gli occhiali ti si velano. Mentre li asciughi ascolti: un timbro che batte due colpi, uno sul tampone e uno sulla carta, lo scalpiccio di una coda che avanza di un posto, una penna. Odore di carta, di candela di sego, di ceralacca tenuta calda.\n\nRimessi gli occhiali, c'è questo. A sinistra una fila di sportelli con la grata e la targhetta, una candela per ciascuno. In fondo dei finestrini tondi, pieni di bianco. A destra una porta alta il doppio delle altre, accostata: dallo spiraglio esce una lama di luce, più forte di tutti i moccoli insieme, che taglia l'impiantito fino a metà stanza. Davanti, seduto di traverso su una seggiola impagliata, c'è un usciere con un bavero di coniglio sulla giubba. Si lima un'unghia.\n\nUn signore con una carta gli si avvicina. L'altro non alza gli occhi dalla lima.\n\n«Non ora.»\n\nLo dice con gentilezza, e quello torna indietro.\n\nContro il muro, di fronte alla porta alta, c'è una panca lucida per l'uso. Ci siede un prete vecchissimo, tutto naso e orecchie, con un paniere vuoto sulle ginocchia e un ombrello tra i piedi. Ti vede lì con la borsa, e senza che tu chieda niente scivola di lato, tira a sé il manico e batte il palmo sul legno.\n\n«Si accomodi. Io sono qui dal 1903.» Lo dice come un altro direbbe da stamattina, e intanto guarda l'usciere con affetto, contento. «Non mi ha mai detto di no.»\n\nFai il conto, nove anni, e ti siedi. La panca è tiepida.\n\nAllo sportello più vicino la coda è di quattro persone, e l'ultimo è un vecchio curvo, con un cappotto da prete che gli spazza le scarpe. Alla cintura, a ogni passo, un anello da chiavi vuoto gli batte sul fianco senza un suono. Quando tra lui e la grata non resta nessuno, una donna entra con un foglio: lui fa un passo di fianco, le cede il posto e si rimette dietro di lei, senza fretta.\n\nUna porta piccola, accanto agli sportelli, si apre.\n\n«Il reverendo Padre Marcus» chiama una voce. «Con il suo biglietto.»","img":5},"13":{"t":"Sul sagrato, quando il tuo respiro è tornato quello di un cristiano, Larìn ti rende la borsa. Te la rimette sulla spalla lui, e indica una porta bassa nel fianco del duomo, con uno stemma di pietra sopra l'architrave: la Curia. Si aggiusta la borsa di cuoio sul fianco, e ha già voltato l'angolo. Di lui resta il rumore delle scarpe giù per la scalinata, che la nebbia si prende subito.\n\nPrima di entrare ti volti. Sotto di te il bianco fa un pavimento, e sotto il pavimento Caligo si sta accendendo: un chiarore giallo, sparso, che trema dappertutto come brace sotto la cenere, e più in basso, a sinistra, una macchia bianca che non trema affatto.\n\nDentro, la scala è di legno. Sale a rampe corte intorno a un pozzo stretto, e a ogni rampa un becco a gas dà più odore che chiaro. Sotto quel dolciastro c'è l'altro, che riconosceresti a occhi chiusi in qualunque diocesi: carta vecchia, colla, polvere, ceralacca. I gradini scricchiolano ognuno con la sua nota. Sui pianerottoli si aprono porte con il numero dipinto in nero su un ovale di smalto, e i numeri vanno per conto loro: il 3 accanto all'11, e un 9 tutto solo, su un ripiano che non ha altri usci. Cerchi una regola, e non la trovi.\n\nSul secondo pianerottolo qualcuno scende di fretta. È un uomo robusto, sui sessant'anni, con un'uniforme scura lisa ai gomiti, i bottoni di metallo e un berretto con il fregio: la tenuta dei cursori, uguale in tutte le Curie. Tiene una mano aperta sul petto, e scendendo non la stacca. Davanti a lui sale un prete giovane con un fascio di moduli, e l'uomo gli sbarra il passo con garbo, togliendosi il berretto.\n\n«Scusi, lei conosce il parroco...»\n\nIl resto se lo porta via il legno della scala. Il prete allarga le braccia, moduli compresi, e tira dritto verso l'alto senza smettere di sorridere.\n\nIl cursore non se la prende. Si rimette il berretto, vede te, se lo toglie di nuovo, e ricomincia da capo, con la stessa cortesia: «Scusi...»\n\nSopra le vostre teste suona una campanella, tre colpi svelti. La conosci, perché ogni Curia ne ha una: vuol dire che la cancelleria chiude tra mezz'ora.","dec":1},"14":{"t":"Sul piazzale qualcuno corre: suole sul bagnato, e a ogni passo lo schiaffo di una cosa di cuoio contro un fianco. E la nebbia te lo consegna tutto insieme dentro il chiaro della lampada: un ragazzo sottile, sui diciassette anni, con una mantellina di tela cerata, di quelle dei pescatori, che sotto la luce elettrica luccica come il dorso di una sardina. A tracolla porta una borsa di cuoio troppo grande per lui: gli batte sul ginocchio.\n\nSi ferma a un passo da te, e non ha nemmeno il respiro grosso.\n\n«Il reverendo Padre Marcus?»\n\nNon aspetta il sì. Alza la patta, fruga tra le buste con due dita, ne sceglie una e te la porge con tutte e due le mani, i gomiti stretti. È un biglietto piegato in due, con l'intestazione della cancelleria stampata in alto. La carta è spessa, umida sugli orli, e sa di tela cerata anche lei. Dentro, due righe in una calligrafia d'ufficio, tonda e senza sbavature: il cancelliere ti aspetta oggi, prima dell'Ave Maria. Non c'è scritto «se crede».\n\n«Chi te le dà, da portare?» chiedi, tanto per dire una cosa, mentre lo ripieghi.\n\n«Erano già nella borsa.»\n\nLo dice in fretta, intanto che richiude: è una risposta che ha già pronta. Alza la testa.\n\n«Larìn» dice. «Con l'accento in fondo. La porto su io.»\n\nToglie la tua borsa dal carretto prima che il facchino abbia aperto bocca, e se la passa sull'altra spalla. Adesso ne ha una per parte, e in mezzo c'è poco ragazzo. Non si piega di un dito.\n\n«Il carretto si ferma al portico, e dopo ci sono i gradini» dice al facchino.\n\nIl facchino guarda il pianale vuoto. Gli dai una moneta per quei dieci metri, e lui si tocca la visiera due volte.\n\nLarìn è già avanti. Fuori dal cerchio bianco la mantellina smette di luccicare e diventa una macchia più scura che sale: la strada, da qui, va solo in su. Stringi il bastone e gli vai dietro. Prima dell'Ave Maria vuol dire prima di notte, e a Caligo il buio ha già un piede dentro la porta."},"15":{"t":"In cima la strada spiana di colpo, e le gambe, che si erano fatte al pendio, danno un passo a vuoto. C'è uno slargo, un muro con l'edera, e contro il muro l'ultimo lampione della fila: un braccio di ferro, una gabbia di vetro, uguale agli altri.\n\nLa mula ci va sotto e si ferma. Il suo padrone solleva la pertica, infila lo stoppino acceso nella gabbia e cerca il becco. Lo trova: senti il ferro toccare il ferro, un colpetto. Aspetti lo scoppio, che ormai conosci.\n\nNon viene.\n\nLa fiammella della pertica resta lì dentro, piccola, a leccare il becco. Non prende niente. Il vetro, intorno, rimane nero.\n\nLui abbassa la pertica, esamina lo stoppino, lo pulisce tra due dita, e l'odore d'olio bruciato arriva fino a te. La rialza. Questa volta la tiene su a lungo, con il braccio che gli trema appena per il peso, e muove la punta di qua e di là, come si cerca una serratura senza candela. Ferro contro ferro, due volte. Nessun sibilo.\n\nLa mula sposta gli zoccoli di un passo. Le lanterne le dondolano ai fianchi, e sul muro le vostre tre ombre si allungano e si accorciano.\n\nNessuno apre bocca. Larìn, che ha sempre fretta, sta lì anche lui, con le due borse. Siete tutti e tre sotto quel vetro spento, a testa in su, e la nebbia vi passa in mezzo: la senti sulla faccia, bagnata, e la vedi camminare solo dove attraversa il chiaro delle lanterne. Ti volti. Dietro di voi la salita scende diritta, e i lumi accesi sono tutti al loro posto, uno sotto l'altro, ognuno con il suo alone giallo, sempre più piccoli fino al punto bianco della stazione. Manca soltanto questo.\n\n«Il becco è guasto» dice il lampionaio. «Domani lo dico al Municipio. Stasera lo dico a lei, che mi pare uno che ascolta.»\n\nCambia spalla alla scala. Fa schioccare la lingua, e la mula si stacca dal muro e imbocca un vicolo, verso altri lampioni. Lui si tocca il cappello e la segue, senza voltarsi.\n\nLarìn si scuote. Avanti, a venti passi, ci sono degli archi."},"16":{"t":"La seggiola scricchiola quando la lasci. Vai sotto la pianta, con la scusa di sgranchirti le gambe.\n\nÈ una bella carta, montata su tela, con due bacchette nere in alto e in basso e la vernice ingiallita che fa le crepe dei quadri. In un cartiglio, tra due delfini, c'è la data: 1890. Sa di polvere e di gomma arabica. Chi l'ha disegnata amava il suo lavoro: ogni scala ha i suoi trattini, il mare ha le sue onde tutte uguali, e il duomo, in cima, è una croce nera grande quanto un'unghia.\n\nI quartieri sono tinti all'acquerello, ognuno del suo colore, con il nome in mezzo in stampatello. Ci arrivi con il naso a un palmo, perché la lucerna è alle tue spalle e ti fai ombra da solo. Il Colle, giallo paglia. A sinistra San Rocco, rosa, e sotto, sul mare, la Darsena, azzurrina. In piano, dall'altra parte, Borgo Nuovo, verde chiaro; più in là le Cartiere, lungo la riga blu di un torrente. All'estremo, sul fianco del monte, i Cordai, color mattone. Fuori da una porta, in un rettangolo punteggiato di crocette, il Camposanto.\n\nLi conti con il dito, toccando ogni nome. Li riconti dall'altra parte, come si ricontano i picchetti.\n\n«Sette. Le parrocchie, secondo l'intestazione, sono otto. Una città può avere più parrocchie che quartieri» pensi. «Succede.»\n\nHai visto borghi di quattro case con due parroci che non si salutavano.\n\nDietro di te il cassetto ha smesso di scorrere. Ti volti. Il cancelliere ha un foglio a mezz'aria, e ti osserva da sopra lo stringinaso. Non dice niente. Rimette gli occhi nel cassetto.\n\nTorni alla pianta. Il dito, scendendo, si ferma sotto i Cordai. Tra le case color mattone e l'orlo del mare la carta cambia: è più chiara, di un bianco gessoso, e sotto il polpastrello ha il pelo alzato di un foglio raschiato con il temperino e ripassato a pennello. Onde non ce ne sono, lì, e nemmeno trattini. Le carte vecchie sono piene di pentimenti: un molo che non si è fatto, una strada sbagliata dal disegnatore. Si gratta e si ridipinge.\n\nSul tavolo i fascicoli aspettano a ventaglio, con le loro caselle in fondo, che non hai letto. E la borsa è lì, con la bocca aperta.\n\n*Annota sulla scheda: SETTE QUARTIERI.*","f":"SETTE QUARTIERI","dec":1},"17":{"t":"Dietro di te la porta della cancelleria si chiude, e la chiave fa due giri. Nello stanzone le candele degli sportelli si spengono una dopo l'altra, soffiate da qualcuno che ha fretta di cenare. Scendi una rampa, fino al pianerottolo del 9, quello che non ha altre porte: c'è un becco a gas che sibila, un finestrino tondo pieno di nero, e un davanzale largo quanto un leggio. Non passa nessuno.\n\nPosi la borsa sul davanzale per sistemare il carico: i fascicoli di piatto, contro la schiena, il Rituale sopra. La mano scende a far posto e in fondo, tra la stola piegata e il sacchetto della farina, trova una cosa che conosce meglio del breviario. Legno di bosso, tondo, lucidato dal palmo. La tiri fuori.\n\nÈ il tuo timbro. Accanto, nella sua scatola di latta, c'è il tampone, e quando alzi il coperchio l'inchiostro grasso manda l'odore di tutti gli uffici dove hai chiuso una pratica. Giri il timbro verso la fiamma. Le lettere di gomma sono a rovescio, ma tu le leggi dritte da ventotto anni:\n\n«NON È IL DEMONIO. CHIAMATE IL MEDICO. Marcus sac.»\n\nIl davanzale basta. Una timbrata per copertina, in alto, sopra il numero, senza rompere nemmeno un sigillo: la cera resterebbe intera, il pacco tornerebbe in anticamera prima che l'usciere abbia finito di abbottonarsi, e alle otto e dieci c'è un treno, l'hai letto sul tabellone scendendo dal tuo. Domani mattina vedresti il sole sulle cime. E non sarebbe una menzogna: avresti ragione sei volte su sette, come sempre. È la tua media, e nessun medico ne ha una migliore.\n\nOppure il timbro torna dov'era, sotto la stola. Il cancelliere, congedandoti, ti ha detto dove si dorme: alla canonica di San Rocco, sotto il portico e poi due vicoli a destra, in discesa. C'è una perpetua che è stata avvisata. Vuol dire rifare la scalinata al contrario, nel buio che intanto è salito, e da domani bussare, un quartiere dopo l'altro.\n\nTieni il timbro sospeso sopra il tampone. Pesa poco.\n\n«Non credere facilmente. Vale anche per il timbro» pensi.\n\nDal pozzo della scala sale una voce. La riconosci dalla cortesia: è il cursore, che ha fermato qualcuno sul pianerottolo più basso e ha ricominciato la sua domanda da capo, con le parole di sempre. Dei passi gli girano intorno e vanno via. Lo senti scendere, adagio, verso il prossimo.","dec":1},"18":{"t":"Ti chini sul primo fascicolo del ventaglio, i pugni sul bordo del tavolo, finché il naso sfiora il cartone. A quella distanza gli occhiali finalmente servono.\n\nLa casella sta nell'angolo in fondo, chiusa nel suo bordo doppio. È il posto dove ogni ufficio del mondo scrive chi ha portato la denuncia: nome, cognome, parrocchia. Qui ci sono due parole sole.\n\n«Delator: ignotus.»\n\nLe leggi con gli occhi, senza muovere le labbra. Fai quello che faresti con una moneta dubbia: ci passi sopra l'unghia. Il luogo, in mezzo alla copertina, è scritto a penna, e l'inchiostro è rimasto in rilievo, lucido. Queste due parole no. Sono entrate nel cartone, nere e opache, e sul rovescio il polpastrello ne sente il morso. Piombo, non pennino.\n\nPrendi il secondo fascicolo. Il sesto. Il decimo. La casella è la stessa su tutti e sette, alla stessa altezza, con lo stesso bordo; perfino la g ha lo stesso baffo, quello di un carattere un po' stanco, rimasto nella forma per tutta la tiratura. Dopo la seconda parola non c'è una riga, non c'è un puntino: nessuno ha lasciato lo spazio per scriverci un nome.\n\nTi scappa una risata corta, e la soffochi nella manica per non disturbare chi scrive. In ventotto anni hai visto moduli per ogni cosa: per i ceri della Candelora, per i banchi in affitto, per i matrimoni dei sordi. Un modulo che conosce in anticipo la risposta non l'avevi mai incontrato. Qui la Curia ha previsto in tipografia che chi denuncia non firma, e ne ha fatti stampare, a giudicare dal carattere, qualche centinaio.\n\nIl cancelliere alza la testa al rumore, vede che cosa stai studiando, e la riabbassa: una casella.\n\nRimetti i fascicoli uno sull'altro, in ordine di numero, ripassi lo spago rosso in croce e cali il pacco nella borsa. Il cartone, tra le dita, è freddo come quando te l'hanno dato: nessuna di quelle carte è stata in mano a qualcuno abbastanza a lungo da scaldarsi.\n\nSe hai Latino e Rituale: Delator: chi porta un nome all'orecchio di qualcuno. Il latino della Curia è più gentile dell'italiano.\n\n*Annota sulla scheda: DELATOR.*","f":"DELATOR"},"57":{"t":"Lo vedi dagli ultimi gradini della scalinata: sotto il portico, dove un'ora fa c'erano un chiodo e una crosta di colla, adesso c'è un rettangolo bianco.\n\nScendere è peggio che salire. La borsa, con i sette fascicoli dentro, ti tira la spalla in avanti a ogni scalino, e un ginocchio riceve il peso prima dell'altro. Il mancorrente, fradicio, ti gela il palmo. Il bastone va giù per primo e cerca la pietra, perché a quest'ora gli occhiali ti servono a poco: della discesa vedi i tre gradini che hai sotto i piedi, e il resto lo senti con la sua punta. La nebbia ti ha ripreso a metà discesa e non ti molla: l'aria è bagnata, porta il fumo di carbone del porto, e ti si posa sulle guance.\n\nIl lampione accanto alla bacheca sibila nel suo vetro annerito e manda un giallo corto, che arriva al foglio e poco più in là. L'odore dolciastro del gas ti si attacca al palato. In quel chiaro la carta è ancora gonfia di umido. La tocchi in un angolo: la colla è fredda, cede, e ti lascia sul polpastrello una pasta che sa di farina.\n\nLeggi con la testa all'indietro, attraverso la parte buona delle lenti.\n\n«Si invita la cittadinanza a tenere un lume alla finestra nelle notti dei Santi e dei Morti, come è antico costume.»\n\nSotto, la firma: «Il Segretario comunale». E il timbro tondo del Municipio.\n\nDue donne si fermano alle tue spalle. Portano una cesta in due, un manico per una. Quella più vicina legge a mezza voce, fino all'ultima parola.\n\n«È giusto» dice all'altra. «Per i Santi e per i Morti il lume si è sempre messo. Lo metteva mia madre, e la madre di mia madre.»\n\n«E l'olio se lo sono sempre pagato» dice l'altra, e tira la cesta dalla sua parte.\n\nSe ne vanno verso levante, discutendo di quanto costa un quartino. All'angolo dove nel pomeriggio stava in piedi l'uomo con il grembiule da calzolaio non c'è più nessuno.\n\nLa canonica è di là: due vicoli a ponente, in leggera discesa. Ti pulisci il dito sull'orlo della tonaca, passi la cinghia sull'altra spalla e lasci il lampione dietro di te. Nel primo vicolo il suo chiaro finisce dopo tre porte; i panni stesi gocciolano da un ballatoio all'altro, e una goccia ti centra il collo."},"72":{"t":"Sette colpi di timbro, uno per copertina. Il bosso batte sul cartone, corto, da ufficio, e nessuna ceralacca si rompe. Lasci i fascicoli in anticamera, legati con il loro spago rosso.\n\nIl treno delle otto e dieci è mezzo vuoto, e la panca di legno ti scuote la schiena a ogni giunto. Dal vetro si vede la salita della stazione, con la fila dei becchi accesi e, in cima, l'ultimo spento. Ti addormenti con il Rituale sulle ginocchia.\n\nHai scritto la riga di sempre su sette fascicoli che non hai aperto.\n\nNon ricordi più perché eri venuto. Poi dimentichi anche di aver dimenticato.\n\nIl treno rallenta. Dal finestrino vedi la nebbia che sale dal mare e si mangia i lampioni, uno per uno. In tasca hai una busta, e sopra c'è scritto un nome che non è proprio il tuo.\n\n*Ricomincia dal paragrafo 1.*"}},"links":{"1":[{"l":"Ti fermi a guardare la gente sotto la pensilina","v":5,"t":"l"},{"l":"Cerchi l'uscita e il facchino","v":8,"t":"l"}],"2":[{"l":"Prosegui","v":13,"t":"l"}],"3":[{"l":"Gli chiedi che cos'è il cartoncino","v":10,"t":"l"},{"l":"Gli cammini accanto senza domande","v":15,"t":"l"}],"4":[{"l":"Guardi la pianta","v":16,"t":"l"},{"l":"Leggi la casella","v":18,"t":"l"},{"l":"Chiudi la borsa e aspetti","v":11,"t":"l"}],"5":[{"l":"Prosegui","v":8,"t":"l"}],"6":[{"l":"Conti i gradini mentre sali","v":2,"t":"l"},{"l":"Sali guardando la città che si accende","v":13,"t":"l"}],"7":[{"l":"Prosegui","v":12,"t":"l"}],"8":[{"l":"Prosegui","v":14,"t":"l"}],"9":[{"l":"Prosegui","v":4,"t":"l"}],"10":[{"l":"Prosegui","v":15,"t":"l"}],"11":[{"l":"Prosegui","v":17,"t":"l"}],"12":[{"l":"Prosegui","v":9,"t":"l"}],"13":[{"l":"Ti fermi e lo lasci finire","v":7,"t":"l"},{"l":"Gli fai un cenno gentile e sali","v":12,"t":"l"}],"14":[{"l":"Prosegui","v":3,"t":"l"}],"15":[{"l":"Prosegui","v":6,"t":"l"}],"16":[{"l":"Leggi la casella","v":18,"t":"l"},{"l":"Chiudi la borsa e aspetti","v":11,"t":"l"}],"17":[{"l":"Timbri tutti e sette e scendi alla stazione","v":72,"t":"l"},{"l":"Rimetti il timbro in fondo alla borsa e scendi verso la canonica","v":57,"t":"l"}],"18":[{"l":"Prosegui","v":11,"t":"l"}],"57":[],"72":[{"l":"","v":0,"t":"m"}]},"img":["data:image/webp;base64,UklGRlydAQBXRUJQVlA4IFCdAQAQMgSdASpYAoQDPr1KmkunJCIlNZ65MOAXiWlu7uEWmBhl7m71mP095q/LLEdz+/bP4T/Ve3Z9p/Vffj9R/ov2z9RP6B+gvT37//+X5t/3Heb+r/1foC/pX+Y/+fo//q9iZu3/K9AX4QwCfsH1H/Uv9F7AP9K/x3oH/x/A++4/8b90fgC/qf+q/cf3b/9v//eVn9h/6X/+/6nwFftn//P+J7gH7//8/4cfvx////X8Qqs0Dg3qwLn8H5x826kBeqDerAufwfnHzbqQF6oN6sC5/B+cApkm8HFytFD785rHRF93FzvD+L57SabwYr+7oreNbPv7gb1YFz+D84+bdSAvVBvVgXPFaAhdqpYmkpAi/5kroUwwZGvHHnC1F+1KTxJ7CosJ8HJzYip1iCjHViE8p+nGNs1u+jU7r5YFz+D84+bdSAvVBvVYiBs9EZKJPtSPHwD9LJjxs1k1WD7xpoCmXQXTlVrmqzLOdVYDkIkzpiY0XLDWPdn6mNyfo9SoOlqSAtXbC+xRg+fbD4io2u3UgL1Qb1YFz0sNhiEFPzyleRJ/4O4lF0GvpvE20mMVlmLNYY3HkcrroyAmaDoJPjroNJbAQJ56dnD1C1T1ug3FkYQ  basso."]},{"h":"IL CALIGO","p":["Poi viene sera, e dal largo arriva la nebbia.","Non scende dal cielo come nelle pianure. Viene su dall'acqua, bianca e bassa: prima copre le banchine, poi imbocca le salite e si prende la città una rampa alla volta. Bagna la lana dei cappotti e fa gocciolare le ringhiere. Sulle labbra lascia un sapore di sale. I rumori si accorciano: un passo lo senti quando è già a tre metri, una voce non sai più da quale finestra venga. I marinai la chiamano caligo, e la città porta il suo nome senza vergognarsene. A Caligo dicono che il caligo tiene caldo, e che chi ha la coscienza a posto ci cammina dentro come in casa sua."]},{"h":"L'AUTUNNO DEL 1912","p":["Quest'anno, però, Caligo ha paura, e non del buio.","Da qualche settimana c'è chi la mattina trova una lettera sotto la porta. Non è firmata. È scritta con la calligrafia di un vicino, uguale fino all'ultimo ricciolo. Sulle scale la gente ha smesso di salutarsi. Si parla di una camera che una famiglia tiene chiusa a chiave, di un'ombra grande come una chiesa che passa sopra il porto, di un ragazzo di pescatori che appena dorme cammina verso l'acqua. E sette volte, in tre settimane, qualcuno ha preso la penna e ha scritto alla Curia la stessa cosa: a Caligo c'è il demonio."]},{"h":"CHI SEI","p":["Ti chiami don Marco Brusa. Hai cinquantanove anni e vieni dall'Ossola, dove tuo padre faceva lo scalpellino e le montagne chiudono il cielo da tre parti.","Sei basso e largo, con i capelli bianchi tagliati a spazzola e gli occhiali tondi, che l'umido ti appanna appena esci da una porta. La tonaca è lisa ai gomiti. Sotto porti scarponi chiodati da montagna, e sul selciato si sentono arrivare prima di te.","E da ventotto anni le diocesi ti chiamano per l'altro lavoro: guardare da vicino le cose che spaventano la gente. Hai dormito in case dove di notte battevano i muri, ed era una grondaia staccata. Hai ascoltato una serva che parlava latino senza averlo mai studiato, e lo aveva imparato a forza di sentirlo in chiesa ogni mattina. Ogni volta, in fondo al foglio, hai scritto la stessa riga: non è il demonio, chiamate il medico.","A casa ti chiamano don Marco. Qui avrai un altro nome, per via di una busta scritta male; e una busta, in una città di uffici, conta più di un battesimo."]},{"h":"QUELLO CHE VUOI","p":["Vuoi fare il tuo lavoro per bene e riprendere il treno. Vuoi sette righe scritte con la coscienza tranquilla, un piatto caldo la sera, un letto senza spifferi. Vuoi rispondere a una mossa di scacchi che aspetta da troppo.","E c'è una domanda che non ti fai mai ad alta voce: se in ventotto anni hai avuto sempre ragione, o soltanto sempre la stessa risposta."]}],"prologo":[{"h":"L'ULTIMA GALLERIA","p":["Mercoledì 30 ottobre 1912. Il treno della costa entra nell'ultima galleria, e lo scompartimento diventa nero: il lumino del soffitto è spento, perché di giorno le ferrovie risparmiano.","Restano il battere delle ruote, più forte, e un'aria fredda che sa di pietra bagnata, di fumo e di ferro. Tu quell'odore lo conosci: per vent'anni è stato casa tua. Tieni la borsa sulle ginocchia e il bastone tra gli scarponi, e lì sotto, senza che nessuno ti veda, ti viene quasi da sorridere.","Poi la roccia finisce, e la luce che torna è grigia."]}],"lama":"","corsa":null};
// Motore delle demo giocabili dei librigiochi di Peter Palmer.
// fai_demo.js lo copia dentro ogni pagina, dopo «var BOOK = {...};». Niente onclick nel codice HTML: la politica di

(function () {

  var ST = null, NOTE = [], occupato = false;

  // ---------- utilità ----------
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  function paras(s) {

      .map(function (x) { return '<p>' + md(x) + '</p>'; }).join('');
  }
  function t(k, o) { var s = U[k] || k; if (o) for (var x in o) s = s.split('{' + x + '}').join(o[x]); return s; }
  function d6() {
    try { var a = new Uint8Array(1); do { crypto.getRandomValues(a); } while (a[0] >= 252); return 1 + a[0] % 6; }
    catch (e) { return 1 + Math.floor(Math.random() * 6); }
  }
  function norm(s) { return String(s || '').replace(/✓/g, '').replace(/\s+/g, ' ').trim().toLowerCase(); }
  function re(k) { return new RegExp(B.re[k], 'iu'); }
  var RE = { ab: re('ab'), itPos: re('itPos'), itNeg: re('itNeg'), fgPos: re('fgPos'), fgNeg: re('fgNeg'), fgPre: re('fgPre'), vinci: re('vinci') };
  var lento = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  // ---------- dadi disegnati ----------
  var PUNTI = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
  function dado(v, cls) {
    var h = '<span class="dado' + (cls ? ' ' + cls : '') + '" aria-label="' + v + '">';
    for (var i = 1; i <= 9; i++) h += '<i' + (PUNTI[v].indexOf(i) >= 0 ? ' class="p"' : '') + '></i>';
    return h + '</span>';
  }
  function dadi(arr, cls) { return arr.map(function (v) { return dado(v, cls); }).join(''); }
  // fa rotolare i dadi dentro el, poi chiama fine()

    var k = 0;

      var a = []; for (var i = 0; i < n; i++) a.push(d6());
      el.innerHTML = dadi(a, 'gira');
      if (++k > 7) { clearInterval(iv); fine(); }
    }, 70);
  }

  // ---------- stato ----------
  function tira(v) { var r = { d: [], v: 0 }; if (typeof v === 'number') { r.v = v; return r; } for (var i = 0; i < v[0]; i++) r.d.push(d6()); r.v = v[1] + r.d.reduce(function (a, b) { return a + b; }, 0); return r; }
  function nuovo(ab) {
    var s = { cur: 1, n: 0, ab: ab || [], persi: [], inv: (B.zaino || []).slice(), fg: [], fatti: {}, combat: null, pend: null, fine: 0, anc: 0, tiri: {} };
    var V = B.valori;
    var f = tira(V.fz); s.fz = f.v; s.tiri.fz = f;
    var r = tira(V.hp); s.hp = s.hpMax = r.v; s.tiri.hp = r;
    if (V.agi) { var a = tira(V.agi); s.agi = a.v; s.tiri.agi = a; }
    return s;
  }
  function salva() { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} }
  function carica() { try { var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.cur && P[s.cur] && !s.fine) return s; } catch (e) {} return null; }
  function cancella() { try { localStorage.removeItem(KEY); } catch (e) {} }

  function haDote(n) { n = norm(n); return ST.ab.some(function (a) { return norm(a) === n; }); }
  function persa(n) { n = norm(n); return ST.persi.some(function (a) { return norm(a) === n; }); }
  function ruolo(r) { return !!(B.ruoli && B.ruoli[r] && haDote(B.ruoli[r])); }
  // oggetti: si confrontano senza articolo, e l'etichetta può continuare dopo il nome («Hai La corda spezzata: gliela leghi...»)
  function senzaArt(s) { return norm(s).replace(/^(?:(?:un|una|uno|il|lo|la|i|gli|le|a|an|the) |l['’])/, ''); }
  function haOgg(n) {
    n = senzaArt(n);
    return ST.inv.some(function (x) { x = senzaArt(x); return x === n || x.indexOf(n) === 0 || n.indexOf(x) === 0; });
  }
  function cura(n) { n = norm(n); for (var i = 0; i < B.cure.length; i++) if (n.indexOf(B.cure[i][0]) >= 0) return B.cure[i][1]; return 0; }
  // «il libro ricorda»: come nel giocabile del Tool Creator
  function fNorm(s) { return norm(s).replace(RE.fgPre, ''); }
  var NOTI = null;
  function noti() { if (!NOTI) { NOTI = {}; for (var k in P) if (P[k].f) NOTI[fNorm(P[k].f)] = 1; } return NOTI; }
  function cancello(lab) {
    var m = lab.match(RE.fgNeg);

    m = lab.match(RE.fgPos);
    return m ? { neg: false, f: fNorm(m[1]) } : null;
  }
  function haFg(f) { return ST.fg.some(function (x) { var y = fNorm(x); return y === f || y.indexOf(f) >= 0 || f.indexOf(y) >= 0; }); }

  // ---------- schermate ----------
  function mostra(h, giu) { app.innerHTML = h; if (!giu) window.scrollTo(0, 0); }

  function copertina() {
